{{- /* Krateo blueprint addition (issue #312): the password of the exporter user that openstack-monitoring's standalone
       mysqld-exporter logs in as, read by the mariadb-exporter-user Job alone (job-exporter-user.yaml). With
       endpoints.oslo_db.auth.exporter.passwordFrom (the umbrella's root oslo-db-exporter) an ExternalSecret; without,
       the Secret from values. Same name in both modes.

       NOT exporter-secrets-etc.yaml, on purpose: the StatefulSet hashes that file (secrets-etc-exporter-hash), so
       rendering it would restart the database. Nothing about mariadb-server reads this one, and
       hack/validate-openstack-monitoring.py asserts the StatefulSet renders identically with krateo.exporterUser on. */ -}}
{{- if .Values.krateo.exporterUser }}
{{- $user := .Values.endpoints.oslo_db.auth.exporter.username | toString }}
---
{{- if include "mariadb.user_from" (list . "exporter") }}
{{ tuple "mariadb-exporter-user" (dict "EXPORTER_USER" $user "EXPORTER_PASSWORD" "{{ .password }}") . "exporter" | include "mariadb.user_externalsecret" }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-exporter-user
type: Opaque
data:
  EXPORTER_USER: {{ $user | b64enc }}
  EXPORTER_PASSWORD: {{ .Values.endpoints.oslo_db.auth.exporter.password | toString | b64enc }}
{{- end }}
{{- end }}
