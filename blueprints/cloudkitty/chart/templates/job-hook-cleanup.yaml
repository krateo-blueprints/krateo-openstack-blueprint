{{/*
Krateo blueprint addition (#206): at uninstall, delete this release's completed install/upgrade hook Jobs, which Helm
never deletes (helm-toolkit.manifests.job_hook_cleanup). Its image is one this chart's own Jobs already run, for python.
*/}}
{{- $job := dict "envAll" . "serviceName" "cloudkitty" "image" .Values.images.tags.ks_user -}}
{{- if .Values.pod.tolerations.cloudkitty.enabled -}}
{{- $_ := set $job "tolerationsEnabled" true -}}
{{- end -}}
{{ $job | include "helm-toolkit.manifests.job_hook_cleanup" }}
