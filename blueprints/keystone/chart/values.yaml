  mpm_event: "<IfModule mpm_event_module>\n  ServerLimit         1024\n  StartServers        32\n  MinSpareThreads     32\n  MaxSpareThreads     256\n  ThreadsPerChild     25\n  MaxRequestsPerChild 128\n  ThreadLimit         720\n</IfModule>\n"
  wsgi_script: "import threading\n\nfrom keystone.server import wsgi\n\napplication = None\nlock = threading.Lock()\nwith lock:\n    if application is None:\n        application = wsgi.initialize_public_application()\n"
  wsgi_keystone: "{{- $portInt := tuple \"identity\" \"service\" \"api\" $ | include \"helm-toolkit.endpoints.endpoint_port_lookup\" }}\nListen 0.0.0.0:{{ $portInt }}\n\nLogFormat \"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" combined\nLogFormat \"%{X-Forwarded-For}i %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" proxy\n\nSetEnvIf X-Forwarded-For \"^.*\\..*\\..*\\..*\" forwarded\nCustomLog /dev/stdout combined env=!forwarded\nCustomLog /dev/stdout proxy env=forwarded\nErrorLogFormat \"%{cu}t %M\"\nErrorLog /dev/stdout\n\n<VirtualHost *:{{ $portInt }}>\n    WSGIDaemonProcess keystone-public processes=1 threads=1 user=keystone group=keystone display-name=%{GROUP}\n    WSGIProcessGroup keystone-public\n    WSGIScriptAlias / /var/www/cgi-bin/keystone/wsgi.py\n    WSGIApplicationGroup %{GLOBAL}\n    WSGIPassAuthorization On\n    ErrorLogFormat \"%{cu}t %M\"\n    ErrorLog /dev/stdout\n\n    SetEnvIf X-Forwarded-For \"^.*\\..*\\..*\\..*\" forwarded\n    CustomLog /dev/stdout combined env=!forwarded\n    CustomLog /dev/stdout proxy env=forwarded\n</VirtualHost>\n"
  sso_callback_template: "<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n  <head>\n    <title>Keystone WebSSO redirect</title>\n  </head>\n  <body>\n     <form id=\"sso\" name=\"sso\" action=\"$host\" method=\"post\">\n       Please wait...\n       <br/>\n       <input type=\"hidden\" name=\"token\" id=\"token\" value=\"$token\"/>\n       <noscript>\n         <input type=\"submit\" name=\"submit_no_javascript\" id=\"submit_no_javascript\"\n            value=\"If your JavaScript is disabled, please click to continue\"/>\n       </noscript>\n     </form>\n     <script type=\"text/javascript\">\n       window.onload = function() {\n         document.forms['sso'].submit();\n       }\n     </script>\n  </body>\n</html>\n"
  logging:
    loggers:
      keys:
      - root
      - keystone
    handlers:
      keys:
      - stdout
      - stderr
      - 'null'
    formatters:
      keys:
      - context
      - default
    logger_root:
      level: WARNING
      handlers:
      - stdout
    logger_keystone:
      level: INFO
      handlers:
      - stdout
      qualname: keystone
      propagate: 0
    logger_amqp:
      level: WARNING
      handlers: stderr
      qualname: amqp
    logger_amqplib:
      level: WARNING
      handlers: stderr
      qualname: amqplib
    logger_eventletwsgi:
      level: WARNING
      handlers: stderr
      qualname: eventlet.wsgi.server
    logger_sqlalchemy:
      level: WARNING
      handlers: stderr
      qualname: sqlalchemy
    logger_boto:
      level: WARNING
      handlers: stderr
      qualname: boto
    handler_null:
      class: logging.NullHandler
      formatter: default
      args: ()
    handler_stdout:
      class: StreamHandler
      args: (sys.stdout,)
      formatter: context
    handler_stderr:
      class: StreamHandler
      args: (sys.stderr,)
      formatter: context
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: '%Y-%m-%d %H:%M:%S'
    formatter_default:
      format: '%(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'
