# Vendored from opendev.org/openstack/openstack-helm at 2026.2.0,
# with this repo's policy overrides re-applied. Image pins come from upstream.
labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  identity_controller:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  test:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
release_group: null
images:
  tags:
    bootstrap: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    test: docker.io/xrally/xrally-openstack:2.0.0
    db_init: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    keystone_db_sync: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    db_drop: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_user: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    rabbit_init: docker.io/rabbitmq:4.3.5-management
    keystone_fernet_setup: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    keystone_fernet_rotate: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    keystone_credential_setup: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    keystone_credential_rotate: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    keystone_credential_cleanup: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    keystone_api: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    keystone_domain_manage: quay.io/airshipit/keystone:2026.2-ubuntu_resolute
    identity_controller: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    image_repo_sync: docker.io/docker:17.07.0
  pull_policy: IfNotPresent
  local_registry:
    active: false
    exclude:
    - dep_check
    - image_repo_sync
bootstrap:
  enabled: true
  ks_user: admin
  script: "# admin needs the admin role for the default domain\nopenstack role add \\\n      --user=\"${OS_USERNAME}\" \\\n      --domain=\"${OS_DEFAULT_DOMAIN}\" \\\n      \"admin\"\n"
network:
  api:
    target_port: null
    external_policy_local: false
    node_port:
      enabled: false
      port: 30500
  admin:
    node_port:
      enabled: false
      port: 30357
dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
        - keystone-image-repo-sync
        services:
        - endpoint: node
          service: local_image_registry
    rabbit_init:
      services:
      - service: oslo_messaging
        endpoint: internal
  static:
    api:
      jobs:
      - keystone-db-sync
      - keystone-credential-setup
      - keystone-fernet-setup
      services:
      - endpoint: internal
        service: oslo_cache
      - endpoint: internal
        service: oslo_db
    bootstrap:
      jobs:
      - keystone-domain-manage
      services:
      - endpoint: internal
        service: identity
    credential_rotate:
      jobs:
      - keystone-credential-setup
    credential_setup: null
    credential_cleanup:
      services:
      - endpoint: internal
        service: oslo_db
    db_drop:
      services:
      - endpoint: internal
        service: oslo_db
    db_init:
      services:
      - endpoint: internal
        service: oslo_db
    db_sync:
      jobs:
      - keystone-db-init
      - keystone-credential-setup
      - keystone-fernet-setup
      services:
      - endpoint: internal
        service: oslo_db
    domain_manage:
      services:
      - endpoint: internal
        service: identity
    identity_controller:
      services:
      - endpoint: internal
        service: identity
    fernet_rotate:
      jobs:
      - keystone-fernet-setup
    fernet_setup: null
    tests:
      services:
      - endpoint: internal
        service: identity
    image_repo_sync:
      services:
      - endpoint: internal
        service: local_image_registry
