      rabbit_stream_fanout: true
    oslo_middleware:
      enable_proxy_headers_parsing: true
    oslo_policy:
      policy_file: /etc/keystone/policy.yaml
    oslo_concurrency:
      lock_path: /var/lock
    security_compliance:
      lockout_failure_attempts: 5
      lockout_duration: 1800
  policy: {}
  access_rules: {}
  rabbitmq:
    policies:
    - vhost: keystone
