{{- if .Values.manifests.secret_fernet_keys }}
{{- $envAll := . }}
{{- if eq .Values.conf.keystone.token.provider "fernet" }}
{{/*
lookup-preserve, EMPTY-SAFE. The keystone-fernet-setup Job owns key CREATION; this
template only PRESERVES already-populated keys across CDC re-renders so a reconcile
never wipes them. Critically it emits the Secret ONLY when a POPULATED one exists.

Bug it fixes: previously this always emitted the Secret, with EMPTY data on a fresh
install (no existing keys yet). The one-shot setup Job then saw the Secret already
present and skipped populating -> keystone-fernet-keys stayed empty -> Keystone
`KeysNotFound` (HTTP 500). By not emitting an empty Secret, the setup Job creates +
populates it; subsequent renders find it populated and re-emit (preserve) it.
resource-policy:keep additionally guards it against pruning.
*/}}
{{- $existing := (lookup "v1" "Secret" $envAll.Release.Namespace "keystone-fernet-keys") }}
{{- if and $existing $existing.data (gt (len (keys $existing.data)) 0) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keystone-fernet-keys
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{ toYaml $existing.data | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
