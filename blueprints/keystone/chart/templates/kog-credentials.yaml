{{/*
Krateo blueprint addition (#303): credentials for Krateo KOG operators, from this install's own generated admin root.
Nothing is copied by hand (#228), and there is one source of truth: the identity-admin root.

  - openstack-kog-clouds: a clouds.yaml for the auth proxies of keystone-, neutron- and glance-kog, rendered by an
    ExternalSecret from the admin root (auth_url = keystone's internal endpoint, interface internal).
  - openstack-kog-token: an admin token for nova-kog (apiKey auth, no proxy). Keystone tokens here last
    conf.keystone.token.expiration (43200 s, 12 h), so a CronJob re-mints it on kog_credentials.schedule (every 6 h),
    and a post-install,post-upgrade hook Job mints it when keystone installs or upgrades, so it exists before any KOG
    starts. Each run tries at most 4 times (keystone locks a user after 5 failures; the bootstrap admin is exempt, the
    cap holds anyway). The admin password reaches only the mint step, an init container; the container that writes the
    Secret holds only the token, and may patch that one Secret and nothing else.

Off unless kog_credentials.enabled (the umbrella's kogCredentials.enabled). Objects for KOGs in another namespace
(kog_credentials.namespace) go there; the Jobs run here, beside the admin root.
*/}}
{{- if .Values.kog_credentials.enabled }}
{{- $envAll := . }}
{{- $from := .Values.endpoints.identity.auth.admin.passwordFrom | default dict }}
{{- range $field := list "store" "secret" "key" }}
{{- if not (index $from $field) }}
{{- fail (printf "kog_credentials.enabled needs endpoints.identity.auth.admin.passwordFrom.%s: KOG credentials come from the install's generated admin root, never a password in values (#228, #303)" $field) }}
{{- end }}
{{- end }}
{{- $ns := .Values.kog_credentials.namespace | default .Release.Namespace }}
{{- $local := eq $ns .Release.Namespace }}
{{- $store := $from.store }}
{{- if not $local }}{{- $store = "openstack-kog-credentials" }}{{- end }}
{{- $admin := .Values.endpoints.identity.auth.admin }}
{{- $authURL := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" }}
{{- $clouds := dict "clouds" (dict .Values.kog_credentials.cloud_name (dict
      "auth" (dict "auth_url" $authURL "username" $admin.username "password" "PASSWORD_PLACEHOLDER"
                   "project_name" $admin.project_name "user_domain_name" $admin.user_domain_name
                   "project_domain_name" $admin.project_domain_name)
      "region_name" $admin.region_name "interface" "internal" "identity_api_version" 3)) }}
{{- if not $local }}
---
# The KOGs' namespace reads the admin root through a store of its own, which may read that one root Secret only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openstack-kog-credentials-reader
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstack-kog-credentials-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ $from.secret }}
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstack-kog-credentials-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openstack-kog-credentials-reader
subjects:
  - kind: ServiceAccount
    name: openstack-kog-credentials-reader
    namespace: {{ $ns }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store }}
  namespace: {{ $ns }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: openstack-kog-credentials-reader
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openstack-kog-clouds
  namespace: {{ $ns }}
  annotations:
    # Deleted by helm WITH the release, after the pre-delete hooks (#254).
    krateo.io/teardown: with-release
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $store | quote }}
  target:
    name: openstack-kog-clouds
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        clouds.yaml: {{ toYaml $clouds | replace "PASSWORD_PLACEHOLDER" "{{ .password | toJson }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $from.secret | quote }}
        property: {{ $from.key | quote }}
---
# nova-kog's token. Its data is the live token, read back on every render: the render never resets what the minter
# wrote, and nothing else ever writes it.
{{- $live := lookup "v1" "Secret" $ns "openstack-kog-token" }}
apiVersion: v1
kind: Secret
metadata:
  name: openstack-kog-token
  namespace: {{ $ns }}
type: Opaque
data:
  token: {{ ((($live).data | default dict).token) | default "" | quote }}
---
# The writer may read and patch openstack-kog-token, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keystone-kog-token-writer
  namespace: {{ $ns }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - openstack-kog-token
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keystone-kog-token-writer
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keystone-kog-token-writer
subjects:
  - kind: ServiceAccount
    name: keystone-kog-token
    namespace: {{ .Release.Namespace }}
{{- /* The pods' ServiceAccount, with the Role kubernetes-entrypoint needs to wait for keystone-api (helm-toolkit). */}}
{{ tuple $envAll "kog_token" "keystone-kog-token" | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keystone-kog-token
  labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
  annotations:
{{ tuple "kog-token" $envAll | include "helm-toolkit.snippets.job_upgrade_hook" | indent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
    spec:
{{ include "keystone.kog_token_pod" (tuple $envAll $ns) | indent 6 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keystone-kog-token
  labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  schedule: {{ .Values.kog_credentials.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 12 }}
        spec:
{{ include "keystone.kog_token_pod" (tuple $envAll $ns) | indent 10 }}
{{- end }}

{{- define "keystone.kog_token_pod" -}}
{{- $envAll := index . 0 -}}{{- $ns := index . 1 -}}
serviceAccountName: keystone-kog-token
restartPolicy: Never
{{- if $envAll.Values.pod.tolerations.keystone.enabled }}
{{ tuple $envAll "keystone" | include "helm-toolkit.snippets.kubernetes_tolerations" }}
{{- end }}
nodeSelector:
  {{ $envAll.Values.labels.job.node_selector_key }}: {{ $envAll.Values.labels.job.node_selector_value }}
initContainers:
{{ tuple $envAll "kog_token" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" }}
# The mint step: the only container that holds the admin password (the admin openrc, from the generated root). It
# tries at most 4 times and writes only the token, to a shared emptyDir.
- name: mint
{{ tuple $envAll "ks_user" | include "helm-toolkit.snippets.image" | indent 2 }}
  env:
{{- with $env := dict "ksUserSecret" $envAll.Values.secrets.identity.admin "useCA" (and $envAll.Values.manifests.certificates $envAll.Values.secrets.tls.identity.api.internal) }}
{{- include "helm-toolkit.snippets.keystone_openrc_env_vars" $env | indent 4 }}
{{- end }}
  command:
    - /bin/bash
    - -c
    - |
      set -u
      umask 077
      for attempt in 1 2 3 4; do
        if openstack token issue -f value -c id > /run/kog/token.tmp; then
          mv /run/kog/token.tmp /run/kog/token
          echo "minted a token on attempt ${attempt}"
          exit 0
        fi
        echo "attempt ${attempt} of 4 failed" >&2
        sleep 15
      done
      echo "no token after 4 attempts: stopping before keystone's lockout (5 failures)" >&2
      exit 1
  volumeMounts:
    - name: kog-run
      mountPath: /run/kog
containers:
# The writer: holds the token only, and may patch openstack-kog-token only.
- name: write
{{ tuple $envAll "ks_user" | include "helm-toolkit.snippets.image" | indent 2 }}
  env:
    - name: KOG_NAMESPACE
      value: {{ $ns | quote }}
  command:
    - python3
    - -c
    - |
      import base64, json, os, ssl, urllib.request
      sa = "/var/run/secrets/kubernetes.io/serviceaccount"
      token = open("/run/kog/token").read().strip()
      body = json.dumps({"data": {"token": base64.b64encode(token.encode()).decode()}}).encode()
      url = "https://%s:%s/api/v1/namespaces/%s/secrets/openstack-kog-token" % (
          os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"], os.environ["KOG_NAMESPACE"])
      req = urllib.request.Request(url, data=body, method="PATCH", headers={
          "Authorization": "Bearer " + open(sa + "/token").read().strip(),
          "Content-Type": "application/merge-patch+json"})
      urllib.request.urlopen(req, context=ssl.create_default_context(cafile=sa + "/ca.crt")).read()
      print("openstack-kog-token updated in %s" % os.environ["KOG_NAMESPACE"])
  volumeMounts:
    - name: kog-run
      mountPath: /run/kog
      readOnly: true
volumes:
- name: kog-run
  emptyDir:
    medium: Memory
{{- end -}}
