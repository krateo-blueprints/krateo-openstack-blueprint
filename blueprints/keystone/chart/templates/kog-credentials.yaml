{{/*
Krateo blueprint addition (#303): what Krateo KOG operators need to drive this OpenStack, from this install's own
generated admin root. Nothing is copied by hand (#228), and there is one source of truth: the identity-admin root.

  - openstack-kog-clouds (Secret): a clouds.yaml for the auth proxies of keystone-, neutron- and glance-kog, rendered by
    an ExternalSecret from the admin root (auth_url = keystone's internal endpoint, interface internal).
  - openstack-kog-token (Secret): an admin token for nova-kog (apiKey auth, no proxy).
  - openstack-kog-endpoints (ConfigMap, no secret): nova_url (nova's internal endpoint from keystone's catalog, with the
    admin project id from the token response), keystone_url (keystone's internal endpoint, from the same catalog) and
    region_name. nova-kog takes nova_url as its nova.url.

The token and the endpoints are written by one program: a post-install,post-upgrade hook Job when keystone installs or
upgrades, and a CronJob on kog_credentials.schedule (every 6 h; tokens last conf.keystone.token.expiration, 12 h). Each
run tries at most 4 times (keystone locks a user after 5 failures; the bootstrap admin is exempt, the cap holds anyway),
and the hook failing fails keystone's release: loudly, on purpose. The admin password reaches only the mint step, an init
container; the container that writes holds the token and the endpoints only, and may patch openstack-kog-token and
openstack-kog-endpoints and nothing else. Both objects are read back from the live cluster on every render, so a render
never resets what the program wrote.

Everything is in the release's namespace: the KOGs that read these are installed there (cross-namespace is not
supported yet). Off unless kog_credentials.enabled (the umbrella's kogCredentials.enabled).
*/}}
{{- if .Values.kog_credentials.enabled }}
{{- $envAll := . }}
{{- $from := .Values.endpoints.identity.auth.admin.passwordFrom | default dict }}
{{- range $field := list "store" "secret" "key" }}
{{- if not (index $from $field) }}
{{- fail (printf "kog_credentials.enabled needs endpoints.identity.auth.admin.passwordFrom.%s: KOG credentials come from the install's generated admin root, never a password in values (#228, #303)" $field) }}
{{- end }}
{{- end }}
{{- $admin := .Values.endpoints.identity.auth.admin }}
{{- $authURL := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" }}
{{- $clouds := dict "clouds" (dict .Values.kog_credentials.cloud_name (dict
      "auth" (dict "auth_url" $authURL "username" $admin.username "password" "PASSWORD_PLACEHOLDER"
                   "project_name" $admin.project_name "user_domain_name" $admin.user_domain_name
                   "project_domain_name" $admin.project_domain_name)
      "region_name" $admin.region_name "interface" "internal" "identity_api_version" 3)) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openstack-kog-clouds
  annotations:
    # Deleted by helm WITH the release, after the pre-delete hooks (#254).
    krateo.io/teardown: with-release
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $from.store | quote }}
  target:
    name: openstack-kog-clouds
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        clouds.yaml: {{ toYaml $clouds | replace "PASSWORD_PLACEHOLDER" "{{ .password | toJson }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $from.secret | quote }}
        property: {{ $from.key | quote }}
---
# nova-kog's token. Its data is the live token, read back on every render: the render never resets what the program
# wrote, and nothing else ever writes it.
{{- $liveToken := lookup "v1" "Secret" .Release.Namespace "openstack-kog-token" }}
apiVersion: v1
kind: Secret
metadata:
  name: openstack-kog-token
type: Opaque
data:
  token: {{ ((($liveToken).data | default dict).token) | default "" | quote }}
---
# The endpoints a KOG is configured with, resolved by keystone, never assembled here. No secret: the token stays in
# openstack-kog-token. Read back from the live object on every render, like the token.
{{- $liveEndpoints := (lookup "v1" "ConfigMap" .Release.Namespace "openstack-kog-endpoints").data | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-kog-endpoints
data:
  nova_url: {{ $liveEndpoints.nova_url | default "" | quote }}
  keystone_url: {{ $liveEndpoints.keystone_url | default "" | quote }}
  region_name: {{ $liveEndpoints.region_name | default "" | quote }}
---
# The writer may read and patch openstack-kog-token and openstack-kog-endpoints, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keystone-kog-token-writer
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - openstack-kog-token
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - openstack-kog-endpoints
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keystone-kog-token-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keystone-kog-token-writer
subjects:
  - kind: ServiceAccount
    name: keystone-kog-token
    namespace: {{ .Release.Namespace }}
{{- /* The pods' ServiceAccount, with the Role kubernetes-entrypoint needs to wait for keystone-api (helm-toolkit). */}}
{{ tuple $envAll "kog_token" "keystone-kog-token" | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keystone-kog-token
  labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
  annotations:
{{ tuple "kog-token" $envAll | include "helm-toolkit.snippets.job_upgrade_hook" | indent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
    spec:
{{ include "keystone.kog_token_pod" $envAll | indent 6 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keystone-kog-token
  labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  schedule: {{ .Values.kog_credentials.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
{{ tuple $envAll "keystone" "kog-token" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 12 }}
        spec:
{{ include "keystone.kog_token_pod" $envAll | indent 10 }}
{{- end }}

{{- define "keystone.kog_token_pod" -}}
{{- $envAll := . -}}
serviceAccountName: keystone-kog-token
restartPolicy: Never
{{- if $envAll.Values.pod.tolerations.keystone.enabled }}
{{ tuple $envAll "keystone" | include "helm-toolkit.snippets.kubernetes_tolerations" }}
{{- end }}
nodeSelector:
  {{ $envAll.Values.labels.job.node_selector_key }}: {{ $envAll.Values.labels.job.node_selector_value }}
initContainers:
{{ tuple $envAll "kog_token" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" }}
# The mint step: the only container that holds the admin password (the admin openrc, from the generated root). Each
# attempt logs in once; it tries at most 4 times and writes only the token and the endpoints, to a memory emptyDir.
- name: mint
{{ tuple $envAll "ks_user" | include "helm-toolkit.snippets.image" | indent 2 }}
  env:
{{- with $env := dict "ksUserSecret" $envAll.Values.secrets.identity.admin "useCA" (and $envAll.Values.manifests.certificates $envAll.Values.secrets.tls.identity.api.internal) }}
{{- include "helm-toolkit.snippets.keystone_openrc_env_vars" $env | indent 4 }}
{{- end }}
  command:
    - /bin/bash
    - -c
    - |
      set -u
      umask 077
      cat > /run/kog/mint.py <<'PY'
      import json
      import os
      import sys

      import openstack
      from keystoneauth1 import exceptions as ksa_exceptions

      # One login (the admin openrc's OS_* variables); everything else comes from what keystone answered.
      sess = openstack.connect(cloud="envvars").session
      region = os.environ["OS_REGION_NAME"]
      token = sess.get_token()
      project = sess.get_project_id()
      keystone_url = sess.get_endpoint(service_type="identity", interface="internal", region_name=region)
      try:
          compute = sess.get_endpoint(service_type="compute", interface="internal", region_name=region)
      except ksa_exceptions.EndpointNotFound:
          # keystone installs before nova: at keystone's own install the catalog has no compute entry yet.
          compute = None
      if not token or not project or not keystone_url:
          sys.exit("keystone answered without a token, a project id or its own internal endpoint")
      nova_url = ""
      if compute:
          # nova's catalog entry, as keystone resolved it for this token, with the token's project id as its last
          # path segment (nova's /v2.1/<project_id> form, which nova-kog's nova.url takes).
          nova_url = compute.rstrip("/")
          if project not in nova_url.split("/"):
              nova_url = nova_url + "/" + project
          if "%(" in nova_url:
              sys.exit("keystone's compute endpoint holds a template its catalog did not resolve: " + compute)
      else:
          print("compute is not in keystone's catalog yet (nova registers it when it installs): nova_url stays empty "
                "until the next run")
      with open("/run/kog/token", "w") as f:
          f.write(token)
      with open("/run/kog/endpoints.json", "w") as f:
          json.dump({"nova_url": nova_url, "keystone_url": keystone_url, "region_name": region}, f)
      PY
      for attempt in 1 2 3 4; do
        if python3 /run/kog/mint.py; then
          echo "minted a token on attempt ${attempt}"
          exit 0
        fi
        echo "attempt ${attempt} of 4 failed" >&2
        sleep 15
      done
      echo "no token after 4 attempts: stopping before keystone's lockout (5 failures)" >&2
      exit 1
  volumeMounts:
    - name: kog-run
      mountPath: /run/kog
containers:
# The writer: holds the token and the endpoints only, and may patch openstack-kog-token and openstack-kog-endpoints only.
- name: write
{{ tuple $envAll "ks_user" | include "helm-toolkit.snippets.image" | indent 2 }}
  env:
    - name: KOG_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  command:
    - python3
    - -c
    - |
      import base64, json, os, ssl, urllib.request
      sa = "/var/run/secrets/kubernetes.io/serviceaccount"
      api = "https://%s:%s/api/v1/namespaces/%s/" % (
          os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"], os.environ["KOG_NAMESPACE"])
      ctx = ssl.create_default_context(cafile=sa + "/ca.crt")
      bearer = "Bearer " + open(sa + "/token").read().strip()

      def patch(path, data):
          req = urllib.request.Request(api + path, data=json.dumps({"data": data}).encode(), method="PATCH",
                                       headers={"Authorization": bearer, "Content-Type": "application/merge-patch+json"})
          urllib.request.urlopen(req, context=ctx).read()
          print("%s updated" % path)

      token = open("/run/kog/token").read().strip()
      patch("secrets/openstack-kog-token", {"token": base64.b64encode(token.encode()).decode()})
      patch("configmaps/openstack-kog-endpoints", json.load(open("/run/kog/endpoints.json")))
  volumeMounts:
    - name: kog-run
      mountPath: /run/kog
      readOnly: true
volumes:
- name: kog-run
  emptyDir:
    medium: Memory
{{- end -}}
