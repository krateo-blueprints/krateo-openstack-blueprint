{{- define "apiProbeTemplate" }}
httpGet:
  scheme: {{ tuple "identity" "service" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" | upper }}
  path: {{ tuple "identity" "healthcheck" "internal" . | include "helm-toolkit.endpoints.keystone_endpoint_path_lookup" }}
  port: {{ tuple "identity" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- end }}

{{/*
Readiness, unlike liveness, also requires the fernet keys to be present.

/healthcheck is oslo's healthcheck middleware: it confirms the WSGI app is listening and
touches neither fernet nor the database. With an empty keystone-fernet-keys Secret the pod
therefore reports 1/1 Ready -- and so do the Deployment, the Composition and the umbrella --
while every POST /v3/auth/tokens returns 500 with keystone.exception.KeysNotFound. Measured,
not hypothetical: see issue #99. The dependency gate reads that Ready as "safe to build on".

Readiness and NOT liveness, deliberately. Missing keys are not repaired by restarting the
container -- deleting the pod with an empty Secret was measured and the keys did not come
back, because keystone-fernet-setup is a Completed Job and does not re-run (issue #41). A
liveness probe on this condition would convert a visible unready pod into a CrashLoop and
repair nothing. Readiness is the honest signal: do not route to me, do not count me available.

The directory is a Secret volume, so it always holds ..data and a timestamped directory even
when the Secret is empty; the keys themselves appear as entries not starting with a dot.
Filtering on that distinguishes empty-but-mounted from populated.

It ALSO requires the configured database to be reachable, for the same reason one step on.
Measured on a0-openstack-d3: keystone-api 1/1 Running with 0 restarts for 40 hours while
every POST /v3/auth/tokens returned 500 from sqlalchemy's connection pool, because all three
mariadb Services selected a release whose pods no longer existed and had zero endpoints. The
probe above could not see it -- the fernet keys were present and /healthcheck returned 200,
since neither touches the database. 13 contract-emitter CronJob pods failed every minute for
those 40 hours, cloudkitty-processor could not authenticate at all, and 36 pods sat in Init
behind it, with nothing anywhere reporting unhealthy. Issue #154.

The check is a TCP connect, not a query: it needs no credential, writes nothing, and answers
the exact question that was false -- can this process open a socket to its database. The
connection string is read from keystone.conf and from keystone.conf.d/*.conf, with the last
one winning, so an operator-supplied snippet (the documented mariadb-operator case, where
conf.database.connection is null) is honoured rather than ignored. host:port is taken by
regex after the LAST `@` so a password containing `@` or `%` cannot break the parse, which
urllib.parse and configparser both would.

READINESS and not liveness, again deliberately, and for a different reason than above:
restarting keystone cannot repair an unreachable database, so a liveness probe here would
turn one outage into a CrashLoop plus an outage. Unready is the honest signal, and with
periodSeconds 60 / failureThreshold 3 it takes three minutes of sustained unreachability to
act -- a blip does not flap it. The consequence is intended: keystone's Service loses its
endpoints and its dependents fail immediately and visibly instead of collecting 500s for two
days while every layer calls itself healthy.

No connection string found anywhere is a FAILURE, not a skip. A keystone with no database
configured cannot serve either, and a probe that passes when it found nothing to check is
the defect this repo has already shipped.
*/}}
{{- define "apiReadinessProbeTemplate" }}
exec:
  command:
    - python3
    - -c
    - |
      import glob, os, re, socket, sys, urllib.request
      d = "/etc/keystone/fernet-keys"
      try:
          keys = [f for f in os.listdir(d) if not f.startswith(".")]
      except OSError as e:
          sys.exit("fernet key dir %s unreadable: %s" % (d, e))
      if not keys:
          sys.exit("no fernet keys in %s: keystone cannot issue tokens" % d)
      conn = None
      src = None
      for cf in ["/etc/keystone/keystone.conf"] + sorted(
              glob.glob("/etc/keystone/keystone.conf.d/*.conf")):
          try:
              text = open(cf).read()
          except OSError:
              continue
          for m in re.finditer(r"^connection\s*=\s*(\S+)", text, re.M):
              conn, src = m.group(1), cf
      if not conn:
          sys.exit("no [database] connection in keystone.conf or keystone.conf.d: "
                   "keystone cannot reach a database")
      hp = re.search(r"^.*@([^@/]+)/", conn)
      if not hp:
          sys.exit("cannot read host:port from the connection string in %s" % src)
      target = hp.group(1)
      if target.startswith("["):
          host, _, port = target[1:].partition("]:")
      else:
          host, _, port = target.partition(":")
      try:
          socket.create_connection((host, int(port or 3306)), timeout=5).close()
      except OSError as e:
          sys.exit("database %s unreachable from keystone (%s): "
                   "every token request will return 500" % (target, e))
      urllib.request.urlopen(
          "{{ tuple "identity" "service" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" }}://localhost:{{ tuple "identity" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}{{ tuple "identity" "healthcheck" "internal" . | include "helm-toolkit.endpoints.keystone_endpoint_path_lookup" }}",
          timeout=10).read()
{{- end }}

{{- if .Values.manifests.deployment_api }}
{{- $envAll := . }}

{{- $mounts_keystone_api := .Values.pod.mounts.keystone_api.keystone_api }}
{{- $mounts_keystone_api_init := .Values.pod.mounts.keystone_api.init_container }}

{{- $serviceAccountName := "keystone-api" }}
{{ tuple $envAll "api" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}

{{/*
The fernet-ensure init container below reads and repopulates the key Secrets, which the
entrypoint Role does not cover -- it grants get/list on services, endpoints, jobs and pods
only.

Scoped by resourceNames to exactly the two Secrets this pod owns. The fernet_setup Job's own
Role grants get/list/create/update on EVERY Secret in the namespace; that is wider than
anything it needs and not a precedent to copy into a long-lived API pod.

get and update, deliberately NOT create. Kubernetes cannot restrict `create` by resourceName --
the object name is not known at authorization time -- so granting it here would hand the API
pod blanket Secret creation in the namespace to cover a case that cannot arise: the Secret is
templated with helm.sh/resource-policy: keep, so it exists before this pod starts. If someone
deletes it outright, the init container fails loudly and the pod stays in Init, which is the
correct outcome for an identity service with no keys -- and strictly better than the silent
500s this whole issue is about.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $serviceAccountName }}-fernet-ensure
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - keystone-fernet-keys
      - keystone-credential-keys
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $serviceAccountName }}-fernet-ensure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $serviceAccountName }}-fernet-ensure
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ $envAll.Release.Namespace }}

{{- $etcSources := .Values.pod.etcSources.keystone_api }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone-api
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "keystone" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.api }}
  selector:
    matchLabels:
{{ tuple $envAll "keystone" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "keystone" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "keystone_api" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
{{ dict "envAll" $envAll "podName" "keystone-api" "containerNames" (list "keystone-api") | include "helm-toolkit.snippets.kubernetes_mandatory_access_control_annotation" | indent 8 }}
    spec:
{{ dict "envAll" $envAll "application" "keystone" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
{{ tuple "keystone_api" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "keystone_api" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
      affinity:
{{ tuple $envAll "keystone" "api" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.api.node_selector_key }}: {{ .Values.labels.api.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.keystone.enabled }}
{{ tuple $envAll "keystone" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.api.timeout | default "30" }}
      initContainers:
{{ tuple $envAll "api" $mounts_keystone_api_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
{{- if .Values.manifests.job_fernet_setup }}
        # Ensures the fernet keys exist before the API starts, on EVERY pod start.
        #
        # keystone-fernet-setup is a Job: once Completed it never runs again, so an emptied or
        # lost keystone-fernet-keys Secret is never repopulated. Measured: emptying the Secret
        # and deleting this pod left it empty for 180s with the Job showing 1 succeeded, while
        # every POST /v3/auth/tokens returned 500 with KeysNotFound.
        #
        # fernet-manage.py fernet_setup is already idempotent and already handles the empty
        # case -- `if secret.get('data', False)` treats an empty dict as absent, so a populated
        # Secret short-circuits to exit 0 and an empty one is regenerated. No change to the
        # script was needed; the gap was only that nothing ran it again.
        #
        # It writes into its OWN emptyDir, not the Secret mount the main container uses: that
        # mount is read-only, and the script generates keys on disk before uploading them. The
        # main container's Secret volume then picks the keys up on the kubelet's next refresh,
        # so a healed pod can be briefly unready before the readiness probe's key check passes.
        # Unready-then-ready is the intended path, and is what makes the heal observable.
        - name: keystone-fernet-ensure
{{ tuple $envAll "keystone_fernet_setup" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.fernet_setup | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "fernet_setup" "container" "keystone_fernet_setup" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          env:
            - name: KEYSTONE_USER
              value: {{ .Values.jobs.fernet_setup.user | quote }}
            - name: KEYSTONE_GROUP
              value: {{ .Values.jobs.fernet_setup.group | quote }}
            - name: KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: KEYSTONE_KEYS_REPOSITORY
              value: {{ .Values.conf.keystone.fernet_tokens.key_repository | quote }}
          command:
            - python
            - /tmp/fernet-manage.py
            - fernet_setup
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: fernet-ensure-etc
              mountPath: /etc/keystone
            - name: fernet-ensure-keys
              mountPath: {{ .Values.conf.keystone.fernet_tokens.key_repository | quote }}
            - name: keystone-etc
              mountPath: /etc/keystone/keystone.conf
              subPath: keystone.conf
              readOnly: true
            - name: keystone-etc-snippets
              mountPath: /etc/keystone/keystone.conf.d/
              readOnly: true
            {{- if .Values.conf.keystone.DEFAULT.log_config_append }}
            - name: keystone-etc
              mountPath: {{ .Values.conf.keystone.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.keystone.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
            - name: keystone-bin
              mountPath: /tmp/fernet-manage.py
              subPath: fernet-manage.py
              readOnly: true
{{- end }}
      containers:
        - name: keystone-api
{{ tuple $envAll "keystone_api" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.api | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "keystone" "container" "keystone_api" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
{{- if include "keystone.oidc.secretsEnabled" $envAll }}
          env:
{{- if include "keystone.oidc.clientSecretEnabled" $envAll }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef.name | quote }}
                  key: {{ .Values.oidc.clientSecretRef.key | quote }}
{{- end }}
{{- if include "keystone.oidc.cryptoPassphraseEnabled" $envAll }}
            - name: OIDC_CRYPTO_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.cryptoPassphraseRef.name | quote }}
                  key: {{ .Values.oidc.cryptoPassphraseRef.key | quote }}
{{- end }}
{{- end }}
          command:
            - /tmp/keystone-api.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/keystone-api.sh
                  - stop
          ports:
            - name: ks-pub
              containerPort: {{ tuple "identity" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{ dict "envAll" $envAll "component" "api" "container" "api" "type" "readiness" "probeTemplate" (include "apiReadinessProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | trim | indent 10 }}
{{ dict "envAll" $envAll "component" "api" "container" "api" "type" "liveness" "probeTemplate" (include "apiProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | trim | indent 10 }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.keystone.oslo_concurrency.lock_path }}
            - name: etckeystone
              mountPath: /etc/keystone
            - name: logs-apache
              mountPath: /var/log/apache2
            - name: run-apache
              mountPath: /var/run/apache2
            - name: keystone-bin
              mountPath: /var/www/cgi-bin/keystone/wsgi.py
              subPath: wsgi.py
              readOnly: true
            - name: keystone-etc
              mountPath: /etc/keystone/keystone.conf
              subPath: keystone.conf
              readOnly: true
            - name: keystone-etc-snippets
              mountPath: /etc/keystone/keystone.conf.d/
              readOnly: true
            - name: keystone-etc
              mountPath: /etc/apache2/ports.conf
              subPath: ports.conf
              readOnly: true
            {{- if .Values.conf.keystone.DEFAULT.log_config_append }}
            - name: keystone-etc
              mountPath: {{ .Values.conf.keystone.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.keystone.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
            - name: keystone-etc
              mountPath: /etc/keystone/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: keystone-etc
              mountPath: /etc/keystone/access_rules.json
              subPath: access_rules.json
              readOnly: true
            - name: keystone-etc
              mountPath: /etc/keystone/sso_callback_template.html
              subPath: sso_callback_template.html
              readOnly: true
            - name: keystone-etc
              mountPath: {{ .Values.conf.software.apache2.conf_dir }}/wsgi-keystone.conf
              subPath: wsgi-keystone.conf
              readOnly: true
            - name: keystone-etc
              mountPath: {{ .Values.conf.software.apache2.mods_dir }}/mpm_event.conf
              subPath: mpm_event.conf
              readOnly: true
{{- if include "keystone.oidc.secretsEnabled" $envAll }}
            - name: keystone-etc
              mountPath: {{ .Values.conf.software.apache2.conf_dir }}/oidc-secrets.conf
              subPath: oidc-secrets.conf
              readOnly: true
{{- end }}
{{- if .Values.conf.security }}
            - name: keystone-etc
              mountPath: {{ .Values.conf.software.apache2.conf_dir }}/security.conf
              subPath: security.conf
              readOnly: true
{{- end }}
            - name: keystone-bin
              mountPath: /tmp/keystone-api.sh
              subPath: keystone-api.sh
              readOnly: true
{{- if .Values.endpoints.ldap.auth.client.tls.ca }}
            - name: keystone-ldap-tls
              mountPath: /etc/keystone/ldap/tls.ca
              subPath: tls.ca
              readOnly: true
{{- end }}
{{- if eq .Values.conf.keystone.token.provider "fernet" }}
            - name: keystone-fernet-keys
              mountPath: {{ .Values.conf.keystone.fernet_tokens.key_repository }}
{{- end }}
            - name: keystone-credential-keys
              mountPath: {{ .Values.conf.keystone.credential.key_repository }}
{{- dict "enabled" .Values.tls.oslo_db "name" .Values.endpoints.oslo_db.auth.admin.secret.tls.internal "path" "/etc/mysql/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- dict "enabled" .Values.tls.identity "name" .Values.secrets.tls.identity.api.internal "path" "/etc/keystone/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- dict "enabled" $envAll.Values.tls.oslo_messaging "name" $envAll.Values.endpoints.oslo_messaging.auth.admin.secret.tls.internal "path" "/etc/rabbitmq/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}

{{ if $mounts_keystone_api.volumeMounts }}{{ toYaml $mounts_keystone_api.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
{{- if .Values.manifests.job_fernet_setup }}
        # Private to the fernet-ensure init container. It cannot share the main container's
        # etckeystone or its read-only fernet-keys Secret mount: the script writes generated
        # keys to disk before uploading them, and writing into the path the Secret occupies
        # would either fail or shadow the Secret for the rest of the pod.
        - name: fernet-ensure-etc
          emptyDir: {}
        - name: fernet-ensure-keys
          emptyDir: {}
{{- end }}
        - name: oslo-lock-path
          emptyDir: {}
        - name: etckeystone
          emptyDir: {}
        - name: logs-apache
          emptyDir: {}
        - name: run-apache
          emptyDir: {}
        - name: keystone-etc
          secret:
            secretName: keystone-etc
            defaultMode: 0444
        - name: keystone-etc-snippets
{{- if $etcSources }}
          projected:
            sources:
{{ toYaml $etcSources | indent 14 }}
{{- else }}
          emptyDir: {}
{{ end }}
        - name: keystone-bin
          configMap:
            name: keystone-bin
            defaultMode: 0555
{{- if .Values.endpoints.ldap.auth.client.tls.ca }}
        - name: keystone-ldap-tls
          secret:
            secretName: keystone-ldap-tls
{{- end }}
{{- if eq .Values.conf.keystone.token.provider "fernet" }}
        - name: keystone-fernet-keys
          secret:
            secretName: keystone-fernet-keys
{{- end }}
        - name: keystone-credential-keys
          secret:
            secretName: keystone-credential-keys
{{- dict "enabled" .Values.tls.oslo_db "name" .Values.endpoints.oslo_db.auth.admin.secret.tls.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- dict "enabled" .Values.tls.identity "name" .Values.secrets.tls.identity.api.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- dict "enabled" $envAll.Values.tls.oslo_messaging "name" $envAll.Values.endpoints.oslo_messaging.auth.admin.secret.tls.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}

{{ if $mounts_keystone_api.volumes }}{{ toYaml $mounts_keystone_api.volumes | indent 8 }}{{ end }}
{{- end }}
