{{- if .Values.manifests.secret_credential_keys }}
{{- $envAll := . }}
{{/*
lookup-preserve, EMPTY-SAFE (see secret-fernet-keys.yaml). Emit the Secret ONLY when a
POPULATED one exists; on a fresh install emit nothing so the credential-setup Job creates
+ populates it (emitting an empty Secret makes the one-shot Job skip -> empty keys ->
credential decrypt failures). resource-policy:keep guards it from pruning.
*/}}
{{- $existing := (lookup "v1" "Secret" $envAll.Release.Namespace "keystone-credential-keys") }}
{{- if and $existing $existing.data (gt (len (keys $existing.data)) 0) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keystone-credential-keys
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{ toYaml $existing.data | indent 2 }}
{{- end }}
{{- end }}
