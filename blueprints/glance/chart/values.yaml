    bootstrap:
      jobs: null
      services:
      - endpoint: internal
        service: identity
      - endpoint: internal
        service: image
    clean:
      jobs: null
    db_drop:
      services:
      - endpoint: internal
        service: oslo_db
    db_init:
      services:
      - endpoint: internal
        service: oslo_db
    db_sync:
      jobs:
      - glance-db-init
      services:
      - endpoint: internal
        service: oslo_db
    ks_endpoints:
      jobs:
      - glance-ks-service
      services:
      - endpoint: internal
        service: identity
    ks_service:
      services:
      - endpoint: internal
        service: identity
    ks_user:
      services:
      - endpoint: internal
        service: identity
    rabbit_init:
      services:
      - endpoint: internal
        service: oslo_messaging
    storage_init:
      jobs:
      - glance-ks-user
      services: null
    metadefs_load:
      jobs:
      - glance-db-sync
      services: null
    tests:
      services:
      - endpoint: internal
        service: oslo_db
      - endpoint: internal
        service: identity
      - endpoint: internal
        service: image
    image_repo_sync:
      services:
      - endpoint: internal
