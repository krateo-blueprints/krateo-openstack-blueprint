{{/*
Krateo blueprint addition (#308): with a ceph storage.backend and storage.ceph.glanceStore rbd, glance-api's keyring
(secrets.rbd) and ceph.conf (glance-ceph-etc) are projections of the umbrella's copies of the keys Ceph mints. Renders
nothing without krateo.ceph references (helm-toolkit/templates/manifests/_ceph_client.tpl).
*/}}
{{- if eq (include "helm-toolkit.utils.ceph_managed" .) "true" }}
{{- if ne .Values.storage "rbd" }}
{{- fail (printf "\n\nkrateo.ceph references are set and storage is %s: they serve the rbd image store (#308), which the umbrella sets together with them (storage.ceph.glanceStore rbd).\n" .Values.storage) }}
{{- end }}
{{- include "helm-toolkit.utils.ceph_refuse_literals" (tuple . (list "conf.ceph.admin_keyring")) }}
{{- /* An install whose images are on the glance-images claim keeps that claim (keep_pvc) when the store moves to rbd, but
       glance stops mounting it, and every image recorded with a file location becomes unreadable. Refused until the
       operator says the images were migrated (or there were none to keep): storage.ceph.glanceImagesMigrated. */}}
{{- if and (include "glance.images_claim" . | fromJson) (not .Values.krateo.imagesMigratedFromPvc) }}
{{- fail "\n\nglance's store is moving to Ceph (storage.ceph.glanceStore rbd) and this install keeps its images on the claim glance-images (#308).\n\nglance would stop mounting the claim, and every image stored on it would become unreadable. Copy them into the rbd store first (glance image-import <id> --import-method copy-image --stores rbd, for each image, with both stores enabled), or confirm there is nothing to keep; then set storage.ceph.glanceImagesMigrated: true on the Openstack Composition. The claim itself is kept (keep_pvc) until you delete it.\n" }}
{{- end }}
{{- end }}
{{- dict "envAll" . "keyring" .Values.secrets.rbd "etc" "glance-ceph-etc" | include "helm-toolkit.manifests.ceph_projections" }}
