{{/*
Krateo blueprint addition (#308): with a ceph storage.backend and storage.ceph.glanceStore rbd, glance-api's keyring
(secrets.rbd) and ceph.conf (glance-ceph-etc) are projections of the umbrella's copies of the keys Ceph mints. Renders
nothing without krateo.ceph references (helm-toolkit/templates/manifests/_ceph_client.tpl).
*/}}
{{- if eq (include "helm-toolkit.utils.ceph_managed" .) "true" }}
{{- if ne .Values.storage "rbd" }}
{{- fail (printf "\n\nkrateo.ceph references are set and storage is %s: they serve the rbd image store (#308), which the umbrella sets together with them (storage.ceph.glanceStore rbd).\n" .Values.storage) }}
{{- end }}
{{- include "helm-toolkit.utils.ceph_refuse_literals" (tuple . (list "conf.ceph.admin_keyring")) }}
{{- end }}
{{- dict "envAll" . "keyring" .Values.secrets.rbd "etc" "glance-ceph-etc" | include "helm-toolkit.manifests.ceph_projections" }}
