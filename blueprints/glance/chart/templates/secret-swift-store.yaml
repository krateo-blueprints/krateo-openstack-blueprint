{{/*
Krateo blueprint addition (issue #228): swift-store.conf is not an oslo.config file glance reads a conf.d for (it
is named by glance_store's swift_store_config_file), and its `key` is the glance user's password. With
endpoints.identity.auth.glance.passwordFrom the whole file comes from this ExternalSecret: conf.swift_store
rendered exactly as glance-etc would, with the password replaced by the root's value. glance-etc then omits
the file and glance-api mounts it from here.
*/}}
{{- $from := .Values.endpoints.identity.auth.glance.passwordFrom | default dict }}
{{- if and .Values.manifests.configmap_etc $from.secret }}
{{- range $field := list "store" "secret" "key" }}
{{- if not (index $from $field) }}
{{- fail (printf "endpoints.identity.auth.glance.passwordFrom needs %s (store, secret and key)" $field) }}
{{- end }}
{{- end }}
{{- /* render the template with the password set to the ESO placeholder, then put the value back: tpl prints a
       string value literally, so the file carries {{ .password }} where the password was */}}
{{- $auth := .Values.endpoints.identity.auth.glance }}
{{- $saved := $auth.password }}
{{- $_ := set $auth "password" "{{ .password }}" }}
{{- $file := tpl .Values.conf.swift_store . }}
{{- $_ := set $auth "password" $saved }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glance-swift-store
  annotations:
    # Deleted by helm WITH the release, after the pre-delete hooks (#254).
    krateo.io/teardown: with-release
spec:
  # OnChange (#309 C): refreshed only when this ExternalSecret itself changes, never on a timer, so a
  # root edited by hand (which ESO regenerates) reaches no live credential until a rotation.
  refreshPolicy: OnChange
  secretStoreRef:
    kind: SecretStore
    name: {{ $from.store | quote }}
  target:
    name: glance-swift-store
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        swift-store.conf: {{ $file | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $from.secret | quote }}
        property: {{ $from.key | quote }}
{{- end }}
