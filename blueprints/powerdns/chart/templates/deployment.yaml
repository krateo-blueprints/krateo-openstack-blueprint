{{- if (.Values.global).subchart_release_name }}
{{- $_ := set . "deployment_name" .Chart.Name }}
{{- else }}
{{- $_ := set . "deployment_name" .Release.Name }}
{{- end }}

{{- if .Values.manifests.deployment }}
{{- $envAll := . }}
{{- $configMapBinName := "powerdns-bin" }}
{{- $configMapEtcName := "powerdns-etc" }}
{{- $rcControllerName := printf "%s-%s" $envAll.deployment_name "powerdns" }}
{{ tuple $envAll "powerdns" $rcControllerName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-powerdns" $envAll.deployment_name }}
  labels:
{{ tuple $envAll "powerdns" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.powerdns }}
  revisionHistoryLimit: {{ .Values.pod.lifecycle.upgrades.deployments.revision_history }}
  selector:
    matchLabels:
{{ tuple $envAll "powerdns" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "powerdns" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        secret-db-hash: {{ tuple "secret-db.yaml" . | include "helm-toolkit.utils.hash" }}
{{ dict "envAll" $envAll "podName" "powerdns" "containerNames" (list "init" "powerdns") | include "helm-toolkit.snippets.kubernetes_mandatory_access_control_annotation" | indent 8 }}
    spec:
      serviceAccountName: {{ $rcControllerName | quote }}
{{ dict "envAll" $envAll "application" "powerdns" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      affinity:
{{ tuple $envAll "powerdns" "server" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.server.node_selector_key }}: {{ .Values.labels.server.node_selector_value }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.powerdns.timeout | default "30" }}
      initContainers:
{{ tuple $envAll "powerdns" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: powerdns
{{ tuple $envAll "powerdns" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.powerdns | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "powerdns" "container" "powerdns" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          {{- /* args, never command. The image's entrypoint is what renders secrets.j2 before it
                 execs pdns_server; overriding command bypasses it and the server starts with
                 no API key and no database password. */}}
          args:
            - --daemon=no
            - --guardian=no
            - --write-pid=no
          env:
            - name: TEMPLATE_FILES
              value: secrets
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $envAll.Values.secrets.powerdns.api_key }}
                  key: PDNS_API_KEY
            - name: GMYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $envAll.Values.secrets.oslo_db.powerdns }}
                  key: DB_PASSWORD
          {{- $dnsPort := index $envAll.Values.conf.pdns "local-port" }}
          ports:
            - name: dns-udp
              containerPort: {{ $dnsPort }}
              protocol: UDP
            - name: dns-tcp
              containerPort: {{ $dnsPort }}
              protocol: TCP
            - name: api
              containerPort: {{ index $envAll.Values.conf.pdns "webserver-port" }}
              protocol: TCP
          {{- /* Readiness asks the API about one zone name, which goes through gmysql, so it
                 fails when the backend is gone. It asks for one name with dnssec=false because
                 the full zone list costs a DNSSEC lookup per zone on every tick. Liveness asks
                 the webserver only, so it does not add a restart of its own.

                 Neither keeps the server up through a database outage. A secondary's communicator
                 thread reads the database on a timer, and PowerDNS exits with "communicator thread
                 died" when it cannot. Measured once at 121s with the default 60s
                 xfr-cycle-interval, and not at all with `secondary` off. That restarts the
                 container; a restart with the database still down stays up. Each smoke run prints
                 what the process did. It is the server's behaviour and no probe changes it.

                 Both are exec because the API needs the key, which an httpGet header would put
                 in the pod spec, and because the webserver ACL can refuse a kubelet's node
                 address while 127.0.0.1 is always allowed. */}}
{{- if .Values.pod.probes.powerdns.powerdns.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import os, urllib.request
                  url = "http://127.0.0.1:{{ index $envAll.Values.conf.pdns "webserver-port" }}/api/v1/servers/localhost/zones?zone=readiness.invalid.&dnssec=false"
                  req = urllib.request.Request(url, headers={"X-API-Key": os.environ["PDNS_API_KEY"]})
                  urllib.request.urlopen(req, timeout=4)
{{ toYaml .Values.pod.probes.powerdns.powerdns.readiness.params | indent 12 }}
{{- end }}
{{- if .Values.pod.probes.powerdns.powerdns.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request
                  urllib.request.urlopen("http://127.0.0.1:{{ index $envAll.Values.conf.pdns "webserver-port" }}/", timeout=4)
{{ toYaml .Values.pod.probes.powerdns.powerdns.liveness.params | indent 12 }}
{{- end }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: powerdns-etc
              mountPath: /etc/powerdns/pdns.conf
              subPath: pdns.conf
              readOnly: true
            - name: powerdns-etc
              mountPath: /etc/powerdns/templates.d/secrets.j2
              subPath: secrets.j2
              readOnly: true
            {{- /* In memory, so the rendered credentials never reach the node's disk. */}}
            - name: pdns-d
              mountPath: /etc/powerdns/pdns.d
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: pdns-d
          emptyDir:
            medium: Memory
        - name: powerdns-etc
          configMap:
            name: {{ $configMapEtcName }}
            defaultMode: 0444
{{- end }}
