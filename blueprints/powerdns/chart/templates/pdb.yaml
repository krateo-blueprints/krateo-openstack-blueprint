{{/* Added for #286: this workload runs more than one replica by default, so a node drain or upgrade must keep
     one serving. minAvailable is clamped below the replica count (helm-toolkit.utils.pdb_min_available), so an
     override to one replica never blocks a drain. Asserted by hack/validate-api-availability.py. */}}

{{- if .Values.manifests.pdb }}
{{- $envAll := . }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-powerdns" (ternary .Chart.Name .Release.Name (not (empty (.Values.global).subchart_release_name))) }}
spec:
  minAvailable: {{ tuple .Values.pod.lifecycle.disruption_budget.powerdns.min_available .Values.pod.replicas.powerdns | include "helm-toolkit.utils.pdb_min_available" }}
  selector:
    matchLabels:
{{ tuple $envAll "powerdns" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{- end }}
