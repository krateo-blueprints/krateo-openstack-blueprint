{{- if (.Values.global).subchart_release_name }}
{{- $_ := set . "deployment_name" .Chart.Name }}
{{- else }}
{{- $_ := set . "deployment_name" .Release.Name }}
{{- end }}

{{- if .Values.manifests.configmap_etc }}
{{- $envAll := . }}
{{- /* Fixed, like powerdns-bin (#179). A ConfigMap, not a Secret: it carries no credential. */}}
{{- $configMapName := "powerdns-etc" }}

{{- /* The gmysql connection is rendered here from endpoints.oslo_db, so the database the
       server reads is the same one db-init created and db-sync populated. The password is
       deliberately absent: it reaches the server through secrets.j2 below. */}}
{{- $dbHost := tuple "oslo_db" "internal" $envAll | include "helm-toolkit.endpoints.hostname_fqdn_endpoint_lookup" }}
{{- $dbPort := tuple "oslo_db" "internal" "mysql" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- $dbName := $envAll.Values.endpoints.oslo_db.path | trimPrefix "/" }}
{{- $dbUser := $envAll.Values.endpoints.oslo_db.auth.powerdns.username }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
data:
  pdns.conf: |
{{- /* The probes reach the webserver from loopback, so it is always allowed, whatever
       webserver-allow-from is narrowed to. Otherwise following the advice in values.yaml takes
       every pod out of the Service. */}}
{{- range $k, $v := $envAll.Values.conf.pdns }}
    {{ $k }}={{ $v }}{{ if eq $k "webserver-allow-from" }},127.0.0.1{{ end }}
{{- end }}
    gmysql-host={{ $dbHost }}
    gmysql-port={{ $dbPort }}
    gmysql-dbname={{ $dbName }}
    gmysql-user={{ $dbUser }}
  {{- /* A Jinja template, not a Helm one, so the braces are escaped. The image's startup script
         renders it from the environment into pdns.d/secrets.conf (TEMPLATE_FILES=secrets), so
         the template is safe in a ConfigMap and the values never are. Its PDNS_AUTH_API_KEY
         shortcut is not used because that also writes webserver-allow-from=0.0.0.0/0 into
         pdns.d, which is read after pdns.conf and would override conf.pdns silently. */}}
  secrets.j2: |
    api-key={{ "{{ PDNS_API_KEY }}" }}
    gmysql-password={{ "{{ GMYSQL_PASSWORD }}" }}
{{- end }}
