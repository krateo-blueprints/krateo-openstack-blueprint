{{- if (.Values.global).subchart_release_name }}
{{- $_ := set . "deployment_name" .Chart.Name }}
{{- else }}
{{- $_ := set . "deployment_name" .Release.Name }}
{{- end }}

{{- if .Values.manifests.configmap_etc }}
{{- $envAll := . }}
{{- $configMapName := printf "%s-%s" $envAll.deployment_name "powerdns-etc" }}

{{- /* The gmysql connection is rendered here from endpoints.oslo_db, so the database the
       server reads is the same one db-init created and db-sync populated. The PASSWORD is
       deliberately absent: pdns.conf lands in a ConfigMap, and pdns reads
       PDNS_gmysql_password from the environment, which comes from a Secret. */}}
{{- $dbHost := tuple "oslo_db" "internal" $envAll | include "helm-toolkit.endpoints.hostname_fqdn_endpoint_lookup" }}
{{- $dbPort := tuple "oslo_db" "internal" "mysql" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- $dbName := $envAll.Values.endpoints.oslo_db.path | trimPrefix "/" }}
{{- $dbUser := $envAll.Values.endpoints.oslo_db.auth.powerdns.username }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
data:
  pdns.conf: |
{{- range $k, $v := $envAll.Values.conf.pdns }}
    {{ $k }}={{ $v }}
{{- end }}
    gmysql-host={{ $dbHost }}
    gmysql-port={{ $dbPort }}
    gmysql-dbname={{ $dbName }}
    gmysql-user={{ $dbUser }}
{{- end }}
