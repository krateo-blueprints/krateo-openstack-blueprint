{{- if .Values.manifests.statefulset_engine }}
{{- $envAll := . }}

{{- $mounts_mistral_engine := .Values.pod.mounts.mistral_engine.mistral_engine }}
{{- $mounts_mistral_engine_init := .Values.pod.mounts.mistral_engine.init_container }}

{{- $serviceAccountName := "mistral-engine" }}
{{ tuple $envAll "engine" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mistral-engine
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "mistral" "engine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  serviceName: mistral-engine
  replicas: {{ .Values.pod.replicas.engine }}
  selector:
    matchLabels:
{{ tuple $envAll "mistral" "engine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "mistral" "engine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      affinity:
{{ tuple $envAll "mistral" "engine" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
{{- if $envAll.Values.pod.tolerations.mistral.enabled }}
{{ tuple $envAll "mistral" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      nodeSelector:
        {{ .Values.labels.engine.node_selector_key }}: {{ .Values.labels.engine.node_selector_value }}
      initContainers:
{{ tuple $envAll "engine" $mounts_mistral_engine_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: mistral-engine
{{ dict "envAll" $envAll "component" "engine" "container" "default" "args" (list "--process" "mistral-server" "--exchange" "openstack" "--rpc-topic" "mistral_engine" "--rpc-server-opt" "engine.host" "--rpc-server-default" "0.0.0.0") "config" (include "mistral.config_args.server" $envAll | fromYamlArray) | include "helm-toolkit.snippets.worker_readiness_probe" | indent 10 }}
{{ tuple $envAll "mistral_engine" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.engine | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          securityContext:
            runAsUser: {{ .Values.pod.user.mistral.uid }}
          command:
            - /tmp/mistral-engine.sh
          volumeMounts:
            - name: mistral-bin
              mountPath: /tmp/worker-health-probe.py
              subPath: worker-health-probe.py
              readOnly: true
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.mistral.oslo_concurrency.lock_path }}
            - name: pod-etc-mistral
              mountPath: /etc/mistral
            - name: mistral-bin
              mountPath: /tmp/mistral-engine.sh
              subPath: mistral-engine.sh
              readOnly: true
{{- include "helm-toolkit.snippets.memcache_secret_key_mount" (tuple . "mistral") | nindent 12 }}
{{- include "helm-toolkit.snippets.identity_dropin_mount" (tuple . (include "mistral.identity_dropin_entries" . | fromJsonArray) "mistral") | nindent 12 }}
{{- include "helm-toolkit.snippets.db_dropin_mount" (tuple . (include "mistral.db_dropin_entries" . | fromJsonArray) "mistral") | nindent 12 }}
{{- with include "helm-toolkit.snippets.transport_dropin_mount" (tuple . (include "mistral.transport_dropin_entries" . | fromJsonArray) "mistral") }}{{ . | nindent 12 }}{{- end }}
            - name: mistral-etc
              mountPath: /etc/mistral/mistral.conf
              subPath: mistral.conf
              readOnly: true
            {{- if .Values.conf.mistral.DEFAULT.log_config_append }}
            - name: mistral-etc
              mountPath: {{ .Values.conf.mistral.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.mistral.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
{{ if $mounts_mistral_engine.volumeMounts }}{{ toYaml $mounts_mistral_engine.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-mistral
          emptyDir: {}
        - name: mistral-bin
          configMap:
            name: mistral-bin
            defaultMode: 0555
{{- include "helm-toolkit.snippets.memcache_secret_key_volume" (tuple . "mistral") | nindent 8 }}
{{- include "helm-toolkit.snippets.identity_dropin_volume" (tuple . (include "mistral.identity_dropin_entries" . | fromJsonArray) "mistral") | nindent 8 }}
{{- include "helm-toolkit.snippets.db_dropin_volume" (tuple . (include "mistral.db_dropin_entries" . | fromJsonArray) "mistral") | nindent 8 }}
{{- with include "helm-toolkit.snippets.transport_dropin_volume" (tuple . (include "mistral.transport_dropin_entries" . | fromJsonArray) "mistral") }}{{ . | nindent 8 }}{{- end }}
        - name: mistral-etc
          secret:
            secretName: mistral-etc
            defaultMode: 0444
{{ if $mounts_mistral_engine.volumes }}{{ toYaml $mounts_mistral_engine.volumes | indent 8 }}{{ end }}
{{- end }}
