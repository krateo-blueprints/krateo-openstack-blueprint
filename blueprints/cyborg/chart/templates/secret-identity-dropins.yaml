{{/*
Krateo blueprint addition (issue #228): cyborg authenticates to nova and placement as their own users
(`nova`, `placement`), whose passwords are generated per install and shared with the nova and placement
charts. Each arrives as a drop-in in /etc/cyborg/cyborg.conf.d/. Renders nothing without the references.
*/}}
{{- dict "envAll" . "from" (.Values.endpoints.identity.auth.nova.passwordFrom | default dict) "name" "cyborg-identity-nova" "file" "83-identity-nova.conf" "section" "nova" "option" "password" | include "helm-toolkit.manifests.secret_conf_dropin" }}
{{- dict "envAll" . "from" (.Values.endpoints.identity.auth.placement.passwordFrom | default dict) "name" "cyborg-identity-placement" "file" "84-identity-placement.conf" "section" "placement" "option" "password" | include "helm-toolkit.manifests.secret_conf_dropin" }}
