{{- define "cyborg.agent.daemonset" }}
{{- $daemonset := index . 0 }}
{{- $configMapName := index . 1 }}
{{- $serviceAccountName := index . 2 }}
{{- $envAll := index . 3 }}
{{- with $envAll }}

{{- $mounts_cyborg := .Values.pod.mounts.cyborg_agent.cyborg_agent }}
{{- $mounts_cyborg_agent_init := .Values.pod.mounts.cyborg_agent.init_container }}

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cyborg-agent
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll $daemonset | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "cyborg_agent" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
{{- if $envAll.Values.pod.tolerations.cyborg.enabled }}
{{ tuple $envAll "cyborg" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      nodeSelector:
        {{ .Values.labels.agent.node_selector_key }}: {{ .Values.labels.agent.node_selector_value }}
      hostNetwork: true
      hostPID: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
{{ tuple $envAll "agent" $mounts_cyborg_agent_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: cyborg-agent
{{ dict "envAll" $envAll "component" "agent" "container" "default" "args" (list "--process" "cyborg-agent" "--exchange" "cyborg" "--rpc-topic" "cyborg-agent") "config" (include "cyborg.config_args.agent" $envAll | fromYamlArray) | include "helm-toolkit.snippets.worker_readiness_probe" | indent 10 }}
{{ tuple $envAll "cyborg_agent" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.agent | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          securityContext:
            runAsUser: 0
            privileged: true
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
          command:
            - /tmp/cyborg-agent.sh
          volumeMounts:
            - name: cyborg-bin
              mountPath: /tmp/worker-health-probe.py
              subPath: worker-health-probe.py
              readOnly: true
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.cyborg.oslo_concurrency.lock_path }}
            - name: cyborg-bin
              mountPath: /tmp/cyborg-agent.sh
              subPath: cyborg-agent.sh
              readOnly: true
{{- include "helm-toolkit.snippets.memcache_secret_key_mount" (tuple . "cyborg") | nindent 12 }}
{{- include "helm-toolkit.snippets.identity_dropin_mount" (tuple . (include "cyborg.identity_dropin_entries" . | fromJsonArray) "cyborg") | nindent 12 }}
{{- include "helm-toolkit.snippets.db_dropin_mount" (tuple . (include "cyborg.db_dropin_entries" . | fromJsonArray) "cyborg") | nindent 12 }}
{{- with include "helm-toolkit.snippets.transport_dropin_mount" (tuple . (include "cyborg.transport_dropin_entries" . | fromJsonArray) "cyborg") }}{{ . | nindent 12 }}{{- end }}
{{- include "helm-toolkit.snippets.secret_conf_dropin_mount" (dict "from" (.Values.endpoints.identity.auth.nova.passwordFrom | default dict) "name" "cyborg-identity-nova" "file" "83-identity-nova.conf" "dir" "/etc/cyborg/cyborg.conf.d") | nindent 12 }}
{{- include "helm-toolkit.snippets.secret_conf_dropin_mount" (dict "from" (.Values.endpoints.identity.auth.placement.passwordFrom | default dict) "name" "cyborg-identity-placement" "file" "84-identity-placement.conf" "dir" "/etc/cyborg/cyborg.conf.d") | nindent 12 }}
            - name: cyborg-etc
              mountPath: /etc/cyborg/cyborg.conf
              subPath: cyborg.conf
              readOnly: true
            - name: cyborg-etc
              mountPath: /etc/cyborg/logging.conf
              subPath: logging.conf
              readOnly: true
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-shared
          emptyDir: {}
        - name: cyborg-bin
          configMap:
            name: cyborg-bin
            defaultMode: 0555
{{- include "helm-toolkit.snippets.memcache_secret_key_volume" (tuple . "cyborg") | nindent 8 }}
{{- include "helm-toolkit.snippets.identity_dropin_volume" (tuple . (include "cyborg.identity_dropin_entries" . | fromJsonArray) "cyborg") | nindent 8 }}
{{- include "helm-toolkit.snippets.db_dropin_volume" (tuple . (include "cyborg.db_dropin_entries" . | fromJsonArray) "cyborg") | nindent 8 }}
{{- with include "helm-toolkit.snippets.transport_dropin_volume" (tuple . (include "cyborg.transport_dropin_entries" . | fromJsonArray) "cyborg") }}{{ . | nindent 8 }}{{- end }}
{{- include "helm-toolkit.snippets.secret_conf_dropin_volume" (dict "from" (.Values.endpoints.identity.auth.nova.passwordFrom | default dict) "name" "cyborg-identity-nova") | nindent 8 }}
{{- include "helm-toolkit.snippets.secret_conf_dropin_volume" (dict "from" (.Values.endpoints.identity.auth.placement.passwordFrom | default dict) "name" "cyborg-identity-placement") | nindent 8 }}
        - name: cyborg-etc
          secret:
            secretName: cyborg-etc
            defaultMode: 0444
{{- end }}
{{- end }}

{{- if .Values.manifests.daemonset_agent }}
{{- $envAll := . }}
{{- $daemonset := "agent" }}
{{- $configMapName := "cyborg-etc" }}
{{- $serviceAccountName := "cyborg-agent" }}

{{- $dependencyOpts := dict "envAll" $envAll "dependencyMixinParam" $envAll.Values.network.backend "dependencyKey" "agent" -}}
{{- $_ := include "helm-toolkit.utils.dependency_resolver" $dependencyOpts | toString | fromYaml }}

{{ tuple $envAll "pod_dependency" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
{{- $daemonset_yaml := list $daemonset $configMapName $serviceAccountName . | include "cyborg.agent.daemonset" | toString | fromYaml }}
{{- $configmap_yaml := "cyborg.etc" }}
{{- list $daemonset $daemonset_yaml $configmap_yaml $configMapName . | include "helm-toolkit.utils.daemonset_overrides" }}
{{- end }}
