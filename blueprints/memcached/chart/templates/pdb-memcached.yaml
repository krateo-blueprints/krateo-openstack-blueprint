{{- /* Krateo (#309): with more than one replica, a node drain may take one replica at a time. Never minAvailable: on a
       single replica that would block every drain forever, so nothing is rendered there. */}}
{{- if and .Values.manifests.statefulset (gt (int .Values.pod.replicas.server) 1) }}
{{- $envAll := . }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memcached
spec:
  maxUnavailable: {{ .Values.pod.lifecycle.disruption_budget.memcached.max_unavailable }}
  selector:
    matchLabels:
{{ tuple $envAll "memcached" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{- end }}
