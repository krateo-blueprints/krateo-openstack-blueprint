# Full OpenStack-Helm memcached defaults with the blueprint's validated overrides applied
# (2026.1-ubuntu_noble images, single-replica, Krateo-CDC-friendly). A small curated
# subset is overridable per Composition (see values.schema.json).
conf:
  memcached:
    max_connections: 8192
    memory: 1024
    stats_cachedump:
      enabled: true
dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
        - memcached-image-repo-sync
        services:
        - endpoint: node
          service: local_image_registry
  static:
    image_repo_sync:
      services:
      - endpoint: internal
        service: local_image_registry
    memcached:
      jobs: null
endpoints:
  cluster_domain_suffix: cluster.local
  kube_dns:
    host_fqdn_override:
      default: null
    hosts:
      default: kube-dns
    name: kubernetes-dns
    namespace: kube-system
    path:
      default: null
    port:
      dns:
        default: 53
        protocol: UDP
      dns_tcp:
        default: 53
    scheme: http
  local_image_registry:
    host_fqdn_override:
      default: null
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    name: docker-registry
    namespace: docker-registry
    port:
      registry:
        node: 5000
  oci_image_registry:
    auth:
      enabled: false
      memcached:
        password: password
        username: memcached
    host_fqdn_override:
      default: null
    hosts:
      default: localhost
    name: oci-image-registry
    namespace: oci-image-registry
    port:
      registry:
        default: null
  oslo_cache:
    host_fqdn_override:
      default: null
    hosts:
      default: memcached
    namespace: null
    port:
      memcache:
        default: 11211
extraObjects: []
images:
  local_registry:
    active: false
    exclude:
    - dep_check
    - image_repo_sync
  pull_policy: IfNotPresent
  tags:
    dep_check: quay.io/airshipit/kubernetes-entrypoint:c606628c7dc0fcc5654a87e5fe572ae0a456307a-ubuntu_noble
    image_repo_sync: quay.io/airshipit/docker:27.5.0
    memcached: quay.io/airshipit/memcached:1.6.32
labels:
  server:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
manifests:
  configmap_bin: true
  job_image_repo_sync: true
  network_policy: false
  secret_registry: true
  service: true
  statefulset: true
memcached:
  extraContainers: []
  extraServicePorts: []
network:
  memcached: {}
network_policy:
  memcached:
    egress:
    - {}
    ingress:
    - {}
pod:
  affinity:
    anti:
      # Spread over zones too, when nodes carry this label (helm-toolkit, #286).
      zone:
        topologyKey: topology.kubernetes.io/zone
        weight: 5
      topologyKey:
        default: kubernetes.io/hostname
      type:
        default: requiredDuringSchedulingIgnoredDuringExecution
      weight:
        default: 10
  lifecycle:
    termination_grace_period:
      memcached:
        timeout: 30
    upgrades:
      deployments:
        pod_replacement_strategy: RollingUpdate
        revision_history: 3
        rolling_update:
          max_unavailable: 1
  probes:
    memcached:
      memcached:
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
  replicas:
    server: 1
  # Sized (#283): every container requests cpu and memory and has a memory limit, so no pod is BestEffort, a
  # ResourceQuota admits it, and capacity is visible to the scheduler. No CPU limit by default: throttling an API worker
  # shows up as latency and probe timeouts. The figures are OpenStack-Helm's own per-container ones unless named below;
  # no per-container usage has been measured yet (README, "Cluster size"). Override any of them, or set enabled: false,
  # with componentValues.memcached.pod.resources.
  # kubernetes_entrypoint sizes the dependency-wait init container every pod runs (helm-toolkit).
  # server: memcached is started with -m 1024 (MB of items), plus connection buffers.
  resources:
    enabled: true
    jobs:
      image_repo_sync:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
    server:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1536Mi
    kubernetes_entrypoint:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  security_context:
    server:
      container:
        memcached:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      pod:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
  tolerations:
    memcached:
      enabled: false
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
secrets:
  oci_image_registry:
    memcached: memcached-oci-image-registry-key

# Krateo blueprint addition (#297): controls that belong to the blueprint, not to OpenStack-Helm.
krateo:
  # rerunHooksToken: rendered nowhere. The umbrella sets it from rerunHooks.<component>. Changing it changes this
  # component's values, so core-provider runs a real helm upgrade, which runs every hook again (each install hook is an
  # upgrade hook too, hack/validate-rerun-hooks.py). It is the documented way to re-run hooks that were never run
  # (Ready=False/HooksMayNotHaveRun, README).
  rerunHooksToken: ""
