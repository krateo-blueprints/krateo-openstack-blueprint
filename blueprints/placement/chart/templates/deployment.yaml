{{- if .Values.manifests.deployment }}
{{- $envAll := . }}

{{- $mounts_placement := .Values.pod.mounts.placement.placement }}
{{- $mounts_placement_init := .Values.pod.mounts.placement.init_container }}
{{- $etcSources := .Values.pod.etcSources.placement }}
{{- with include "helm-toolkit.snippets.memcache_secret_key_etc_source" (tuple . "placement") }}{{- $etcSources = append $etcSources (fromJson .) }}{{- end }}
{{- if eq .Values.manifests.secret_ks_etc true }}
{{- $etcSources = append $etcSources (dict "secret" (dict "name" "placement-ks-etc")) }}
{{- end }}

{{- $serviceAccountName := "placement-api" }}
{{ tuple $envAll "api" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-api
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "placement" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.api }}
  selector:
    matchLabels:
{{ tuple $envAll "placement" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "placement" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "placement" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
{{ dict "envAll" $envAll "podName" "placement-api" "containerNames" (list "placement-api" "init") | include "helm-toolkit.snippets.kubernetes_mandatory_access_control_annotation" | indent 8 }}
    spec:
{{ tuple "placement" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "placement" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "placement" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      affinity:
{{ tuple $envAll "placement" "api" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.api.node_selector_key }}: {{ .Values.labels.api.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.placement.enabled }}
{{ tuple $envAll "placement" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.api.timeout | default "30" }}
      initContainers:
{{ tuple $envAll "api" $mounts_placement_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        {{- if .Values.conf.placement.DEFAULT.log_dir }}
        - name: placement-api-init-log
{{ tuple $envAll "placement" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "placement" "container" "placement_api" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - chown
            - -R
            - "placement:"
            - {{ .Values.conf.placement.DEFAULT.log_dir }}
          volumeMounts:
            - name: log
              mountPath: {{ .Values.conf.placement.DEFAULT.log_dir }}
        {{- end }}
      containers:
        - name: placement-api
{{ tuple $envAll "placement" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.api | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "placement" "container" "placement_api" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
{{- if or .Values.manifests.certificates .Values.tls.identity }}
          env:
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/placement/certs/ca.crt"
{{- end }}
          command:
            - /tmp/placement-api.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/placement-api.sh
                  - stop
          ports:
            - name: p-api
              containerPort: {{ tuple "placement" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
          readinessProbe:
            httpGet:
              scheme: {{ tuple "placement" "service" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" | upper }}
              path: /
              port: {{ tuple "placement" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- /*
          Liveness reaches the API port, not the uwsgi stats port.

          Upstream's `pod.probes.placement.api.liveness.port` exists to repoint this probe at
          0.0.0.0:1717, which is `stats` with `stats-http = true` in conf.placement_api_uwsgi --
          uwsgi's statistics socket, served by the MASTER process. The master binds the listening
          socket, forks workers and reaps them; it never imports placement and never handles a
          request. So that endpoint answers 200 with a JSON blob whenever the master is alive:
          with the worker wedged, with the worker stopped, and with the application failing to
          import. There is no state of the service in which it says no, which makes liveness
          STRICTLY WEAKER than the readiness probe directly above -- and liveness is the probe
          that restarts things. Measured in quay.io/airshipit/placement:2026.1-ubuntu_noble: with
          the single worker SIGSTOPped, :1717 still answered 200 while :8778 timed out.

          The whole knob only ever selected that port, so it is removed rather than defaulted:
          an override cannot reintroduce what the template no longer reads. See issue #110.

          GET / and not /healthcheck, because placement mounts no healthcheck middleware. It is
          served by placement.handlers.root:home, which assembles the version-discovery document
          from microversion constants and touches neither the database nor keystone; and
          placement.auth.PlacementAuthProtocol.__call__ short-circuits auth_token for
          PATH_INFO in ('/', ''), so no token is needed and keystone is never contacted. A
          worker must nevertheless run the request, which is exactly the property liveness wants.

          Timing is deliberately slack, and much slacker than readiness. conf uwsgi sets
          processes = 1, so a single in-flight request blocks the static document too: during a
          database slowdown a saturated worker can miss a probe without being wedged. Readiness
          stays at 5s/10s so traffic is withdrawn promptly and visibly; liveness restarts only
          after 60s + 6 x 30s = four minutes in which no attempt returned a static document.
          Nothing here reaches a dependency, so a database, keystone or rabbit outage cannot
          turn into a crashloop across every replica.
          */}}
          livenessProbe:
            httpGet:
              scheme: {{ tuple "placement" "service" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" | upper }}
              path: /
              port: {{ tuple "placement" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.placement.oslo_concurrency.lock_path }}
            - name: wsgi-placement
              mountPath: /var/www/cgi-bin/placement
            - name: placement-bin
              mountPath: /tmp/placement-api.sh
              subPath: placement-api.sh
              readOnly: true
            - name: placement-etc
              mountPath: /etc/placement/placement.conf
              subPath: placement.conf
              readOnly: true
            - name: placement-etc-snippets
              mountPath: /etc/placement/placement.conf.d/
              readOnly: true
            - name: placement-etc
              mountPath: /etc/placement/placement-api-uwsgi.ini
              subPath: placement-api-uwsgi.ini
              readOnly: true
            {{- if .Values.conf.placement.DEFAULT.log_config_append }}
            - name: placement-etc
              mountPath: {{ .Values.conf.placement.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.placement.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
            - name: placement-etc
              mountPath: /etc/placement/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: placement-etc
              mountPath: /etc/apache2/conf-enabled/wsgi-placement.conf
              subPath: wsgi-placement.conf
              readOnly: true
            {{- if .Values.conf.placement.DEFAULT.log_dir }}
            - name: log
              mountPath: {{ .Values.conf.placement.DEFAULT.log_dir }}
            {{- end }}
{{- dict "enabled" $envAll.Values.manifests.certificates "name" $envAll.Values.endpoints.oslo_db.auth.admin.secret.tls.internal "path" "/etc/mysql/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- dict "enabled" (or .Values.manifests.certificates .Values.tls.identity) "name" .Values.secrets.tls.placement.api.internal "path" "/etc/placement/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{ if $mounts_placement.volumeMounts }}{{ toYaml $mounts_placement.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: wsgi-placement
          emptyDir: {}
        - name: placement-bin
          configMap:
            name: placement-bin
            defaultMode: 0555
        - name: placement-etc
          secret:
            secretName: placement-etc
            defaultMode: 0444
        - name: placement-etc-snippets
{{- if $etcSources }}
          projected:
            sources:
{{ toYaml $etcSources | indent 14 }}
{{- else }}
          emptyDir: {}
{{ end }}
        {{- if .Values.conf.placement.DEFAULT.log_dir }}
        - name: log
          hostPath:
            path: {{ .Values.conf.placement.DEFAULT.log_dir }}
            type: DirectoryOrCreate
        {{- end }}
{{- dict "enabled" $envAll.Values.manifests.certificates "name" $envAll.Values.endpoints.oslo_db.auth.admin.secret.tls.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- dict "enabled" (or .Values.manifests.certificates .Values.tls.identity) "name" .Values.secrets.tls.placement.api.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{ if $mounts_placement.volumes }}{{ toYaml $mounts_placement.volumes | indent 8 }}{{ end }}
{{- end }}
