conf:
  logging:
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: '%Y-%m-%d %H:%M:%S'
    formatter_default:
      datefmt: '%Y-%m-%d %H:%M:%S'
      format: '%(message)s'
    formatters:
      keys:
      - context
      - default
    handler_null:
      args: ()
      class: logging.NullHandler
      formatter: default
    handler_stderr:
      args: (sys.stderr,)
      class: StreamHandler
      formatter: context
    handler_stdout:
      args: (sys.stdout,)
      class: StreamHandler
      formatter: context
    handlers:
      keys:
      - stdout
      - stderr
      - 'null'
    logger_amqp:
      handlers: stderr
      level: WARNING
      qualname: amqp
    logger_amqplib:
      handlers: stderr
      level: WARNING
      qualname: amqplib
    logger_boto:
      handlers: stderr
      level: WARNING
      qualname: boto
    logger_eventletwsgi:
      handlers: stderr
      level: WARNING
      qualname: eventlet.wsgi.server
    logger_placement:
      handlers:
      - stdout
      level: INFO
      qualname: placement
      propagate: 0
    logger_root:
      handlers: stderr
      level: WARNING
    logger_sqlalchemy:
      handlers: stderr
      level: WARNING
      qualname: sqlalchemy
    loggers:
      keys:
      - root
      - placement
  placement:
    DEFAULT:
      debug: false
      log_config_append: /etc/placement/logging.conf
      use_syslog: false
    keystone_authtoken:
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
      service_token_roles: service
      service_token_roles_required: true
      service_type: placement
    oslo_concurrency:
      lock_path: /var/lock
    placement_database:
      connection: ''
  placement_api_uwsgi:
    uwsgi:
      add-header: 'Connection: close'
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      module: placement.wsgi.api:application
      processes: 1
      procname-prefix-spaced: 'placement-api:'
      route-user-agent: '^kube-probe.* donotlog:'
      stats: 0.0.0.0:1717
      stats-http: true
      thunder-lock: true
      worker-reload-mercy: 80
  policy: {}
dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
        - image-repo-sync
        services:
        - endpoint: node
          service: local_image_registry
  static:
    api:
      jobs:
      - placement-db-sync
      - placement-ks-service
      - placement-ks-user
      - placement-ks-endpoints
    db_drop:
      services:
      - endpoint: internal
        service: oslo_db
    db_init:
      services:
      - endpoint: internal
        service: oslo_db
    db_sync:
      jobs:
      - placement-db-init
      services:
      - endpoint: internal
        service: oslo_db
    ks_endpoints:
      jobs:
      - placement-ks-user
      - placement-ks-service
      services:
      - endpoint: internal
        service: identity
    ks_service:
      services:
      - endpoint: internal
        service: identity
    ks_user:
      services:
      - endpoint: internal
        service: identity
endpoints:
  cluster_domain_suffix: cluster.local
  identity:
    auth:
      admin:
        password: password
        project_domain_name: default
        project_name: admin
        region_name: RegionOne
        user_domain_name: default
        username: admin
      placement:
        password: password
        project_domain_name: service
        project_name: service
        region_name: RegionOne
        role: admin
        user_domain_name: service
        username: placement
    host_fqdn_override:
      default: null
    hosts:
      default: keystone
      internal: keystone-api
    name: keystone
    path:
      default: /v3
    port:
      api:
        default: 80
        internal: 5000
    scheme:
      default: http
  local_image_registry:
    host_fqdn_override:
      default: null
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    name: docker-registry
    namespace: docker-registry
    port:
      registry:
        node: 5000
  oci_image_registry:
    auth:
      enabled: false
      placement:
        password: password
        username: placement
    host_fqdn_override:
      default: null
    hosts:
      default: localhost
    name: oci-image-registry
    namespace: oci-image-registry
    port:
      registry:
        default: null
  oslo_cache:
    auth:
      memcache_secret_key: placememcacheXXsecretXXkeyXXX0000000000000000000000000000000000
    host_fqdn_override:
      default: null
    hosts:
      default: memcached
    port:
      memcache:
        default: 11211
  oslo_db:
    auth:
      admin:
        password: password
        secret:
          tls:
            internal: mariadb-tls-direct
        username: root
      nova_api:
        password: password
        username: nova
      placement:
        password: password
        username: placement
    host_fqdn_override:
      default: null
    hosts:
      default: mariadb
    path: /placement
    port:
      mysql:
        default: 3306
    scheme: mysql+pymysql
  oslo_messaging:
    statefulset:
      name: rabbitmq-rabbitmq
      replicas: 1
  placement:
    host_fqdn_override:
      default: null
    hosts:
      default: placement-api
      public: placement
    name: placement
    path:
      default: /
    port:
      api:
        default: 8778
        public: 80
        service: 8778
    scheme:
      default: http
      service: http
extraObjects: []
identity:
  openrc:
    exclude_vars: []
    extra_vars: []
images:
  local_registry:
    active: false
    exclude:
    - dep_check
    - image_repo_sync
  pull_policy: IfNotPresent
  tags:
    db_drop: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble-20261117
    db_init: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble-20261117
    dep_check: quay.io/airshipit/kubernetes-entrypoint:c606628c7dc0fcc5654a87e5fe572ae0a456307a-ubuntu_noble
    image_repo_sync: docker.io/docker:17.07.0
    ks_endpoints: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble-20261117
    ks_service: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble-20261117
    ks_user: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble-20261117
    placement: quay.io/airshipit/placement:2026.1-ubuntu_noble-20261117
    placement_db_sync: quay.io/airshipit/placement:2026.1-ubuntu_noble-20261117
labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
manifests:
  # The ingress objects are off (#451): no ingress controller is part of this blueprint, so their Services select no pod.
  # publicEndpoints (Gateway API) is how the APIs are exposed. Switched on, they need host_fqdn_override.public as well.
  certificates: false
  configmap_bin: true
  configmap_etc: true
  deployment: true
  ingress: false
  job_db_drop: false
  job_db_init: true
  job_db_sync: true
  job_image_repo_sync: true
  job_ks_endpoints: true
  job_ks_service: true
  job_ks_user: true
  network_policy: false
  pdb: true
  pod_rally_test: false
  secret_db: true
  secret_ingress_tls: false
  secret_keystone: true
  secret_ks_etc: true
  secret_registry: true
  service: true
  service_ingress: false
network:
  api:
    external_policy_local: false
    ingress:
      annotations:
        haproxy.org/path-rewrite: /
        nginx.ingress.kubernetes.io/rewrite-target: /
      classes:
        cluster: ingress-cluster
        namespace: ingress-openstack
      public: true
    node_port:
      enabled: false
      port: 30778
    port: 8778
pod:
  affinity:
    anti:
      # Spread over zones too, when nodes carry this label (helm-toolkit, #286).
      zone:
        topologyKey: topology.kubernetes.io/zone
        weight: 5
      topologyKey:
        default: kubernetes.io/hostname
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
  etcSources:
    placement: []
    placement_db_sync: []
  lifecycle:
    disruption_budget:
      api:
        min_available: 1
    termination_grace_period:
      api:
        timeout: 30
    upgrades:
      deployments:
        pod_replacement_strategy: RollingUpdate
        revision_history: 3
        rolling_update:
          max_surge: 1
          max_unavailable: 0
  mounts:
    placement:
      init_container: null
      placement:
        volumeMounts: null
        volumes: null
    placement_db_sync:
      init_container: null
      placement_db_sync:
        volumeMounts: null
        volumes: null
  # pod.probes is absent deliberately. Upstream's only entry here was
  # placement.api.liveness.port: 1717, the uwsgi stats socket, which answers 200 whenever the
  # uwsgi MASTER is alive and so made liveness unable to fail -- see the comment on the liveness
  # probe in templates/deployment.yaml and issue #110. templates/deployment.yaml no longer reads
  # the key, so there is nothing left for this section to configure.
  replicas:
    api: 2
  # Sized (#283): every container requests cpu and memory and has a memory limit, so no pod is BestEffort, a
  # ResourceQuota admits it, and capacity is visible to the scheduler. No CPU limit by default: throttling an API worker
  # shows up as latency and probe timeouts. The figures are OpenStack-Helm's own per-container ones unless named below;
  # no per-container usage has been measured yet (README, "Cluster size"). Override any of them, or set enabled: false,
  # with componentValues.placement.pod.resources.
  # kubernetes_entrypoint sizes the dependency-wait init container every pod runs (helm-toolkit).
  resources:
    enabled: true
    api:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1024Mi
    jobs:
      # The pre-delete Job that deletes this release's hook Jobs at uninstall (helm-toolkit, #206).
      hook_cleanup:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 1024Mi
      db_drop:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
      db_init:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
      db_sync:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
      ks_endpoints:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
      ks_service:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
      ks_user:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
      image_repo_sync:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1024Mi
    kubernetes_entrypoint:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  security_context:
    placement:
      container:
        placement_api:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      pod:
        runAsUser: 42424
  tolerations:
    placement:
      enabled: false
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
release_group: null
secrets:
  identity:
    admin: placement-keystone-admin
    placement: placement-keystone-user
  oci_image_registry:
    placement: placement-oci-image-registry
  oslo_db:
    admin: placement-db-admin
    placement: placement-db-user
  tls:
    placement:
      api:
        internal: placement-tls-api
        public: placement-tls-public
tls:
  identity: false
  oslo_db: false
  oslo_messaging: false

# Krateo blueprint addition (#297): controls that belong to the blueprint, not to OpenStack-Helm.
krateo:
  # rerunHooksToken: rendered nowhere. The umbrella sets it from rerunHooks.<component>. Changing it changes this
  # component's values, so core-provider runs a real helm upgrade, which runs every hook again (each install hook is an
  # upgrade hook too, hack/validate-rerun-hooks.py). It is the documented way to re-run hooks that were never run
  # (Ready=False/HooksMayNotHaveRun, README).
  rerunHooksToken: ""
