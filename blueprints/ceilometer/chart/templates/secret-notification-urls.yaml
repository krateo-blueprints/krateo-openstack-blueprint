{{/*
Krateo blueprint addition (#281): the notification agent's [notification] messaging_urls, built from the generated
RabbitMQ admin root, as the drop-in 86-notification-urls.conf. Mounted into ceilometer-notification only: no other
ceilometer program reads [notification], and the compute and ipmi agents run on hypervisors, where the admin
password has no business. With no admin passwordFrom this renders nothing and ceilometer.conf carries the URLs.
*/}}
{{- if and .Values.manifests.deployment_notification (include "ceilometer.notification_urls_from_root" .) }}
{{- $from := .Values.endpoints.oslo_messaging.auth.admin.passwordFrom }}
{{- range $field := list "store" "secret" "key" }}
{{- if not (index $from $field) }}
{{- fail (printf "endpoints.oslo_messaging.auth.admin.passwordFrom needs %s (store, secret and key)" $field) }}
{{- end }}
{{- end }}
{{- $urls := include "ceilometer.notification_messaging_urls" (tuple . "{{ .pw_admin | urlquery }}") | fromJsonArray }}
{{- if not $urls }}
{{- fail "conf.notification_vhosts is empty: the notification agent would consume no notifications (#281)" }}
{{- end }}
{{- $lines := list }}{{- range $u := $urls }}{{- $lines = append $lines (printf "messaging_urls = %s" $u) }}{{- end }}
{{- $text := printf "[notification]\n%s\n" (join "\n" $lines) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceilometer-notification-urls
  annotations:
    # Deleted by helm WITH the release, after the pre-delete hooks (#254).
    krateo.io/teardown: with-release
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $from.store | quote }}
  target:
    name: ceilometer-notification-urls
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        {{ include "ceilometer.notification_urls_file" . }}: {{ $text | quote }}
  data:
    - secretKey: pw_admin
      remoteRef:
        key: {{ $from.secret | quote }}
        property: {{ $from.key | quote }}
{{- end }}
