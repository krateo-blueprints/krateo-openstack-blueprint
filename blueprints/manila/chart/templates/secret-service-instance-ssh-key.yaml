{{/*
Krateo blueprint addition (issue #228, 0.3.67): the generic driver's service-instance SSH key pair, read from the
umbrella's SSHKey root (templates/_service_instance_ssh_key.tpl). Renders nothing without
endpoints.sharev2.auth.service_instance_ssh_keyFrom.
*/}}
{{- if include "manila.ssh_key_from" . }}
{{- $from := include "manila.ssh_key_ref" . | fromJson }}
{{- range $field := list "store" "secret" "key" "publicKey" }}
{{- if not (index $from $field) }}
{{- fail (printf "endpoints.sharev2.auth.service_instance_ssh_keyFrom needs %s (store, secret, key and publicKey)" $field) }}
{{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manila-service-instance-ssh-key
  annotations:
    # Deleted by helm WITH the release, after the pre-delete hooks (#254).
    krateo.io/teardown: with-release
spec:
  # OnChange (#309 C): refreshed only when this ExternalSecret itself changes, never on a timer, so a
  # root edited by hand (which ESO regenerates) reaches no live credential until a rotation.
  refreshPolicy: OnChange
  secretStoreRef:
    kind: SecretStore
    name: {{ $from.store | quote }}
  target:
    name: manila-service-instance-ssh-key
    creationPolicy: Owner
  data:
    - secretKey: {{ include "manila.ssh_key_private_file" . }}
      remoteRef:
        key: {{ $from.secret | quote }}
        property: {{ $from.key | quote }}
    - secretKey: {{ include "manila.ssh_key_public_file" . }}
      remoteRef:
        key: {{ $from.secret | quote }}
        property: {{ $from.publicKey | quote }}
{{- end }}
