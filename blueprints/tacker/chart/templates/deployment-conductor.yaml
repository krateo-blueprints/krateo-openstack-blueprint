{{- if .Values.manifests.deployment_conductor }}
{{- $envAll := . }}
{{- $serviceAccountName := "tacker-conductor" }}
{{ tuple $envAll "conductor" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tacker-conductor
  labels:
{{ tuple $envAll "tacker" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "tacker" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  replicas: {{ .Values.pod.replicas.conductor }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "tacker" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "tacker_conductor" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
{{- if $envAll.Values.pod.tolerations.tacker.enabled }}
{{ tuple $envAll "tacker" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      nodeSelector:
        {{ .Values.labels.conductor.node_selector_key }}: {{ .Values.labels.conductor.node_selector_value }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "conductor" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
{{- /* The conductor mounts the same claims as tacker-server. With ReadWriteOnce (the default,
       #201) a volume is usable only on the node it attaches to, so the conductor must follow the
       server there. Only the conductor carries the rule, so the server schedules first and
       nothing waits on the conductor. With ReadWriteMany the pods may spread. */}}
{{- if ne (.Values.storage.accessMode | default "ReadWriteOnce") "ReadWriteMany" }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: application
                operator: In
                values:
                - tacker
              - key: component
                operator: In
                values:
                - server
            topologyKey: kubernetes.io/hostname
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.conductor.timeout | default "30" }}
      containers:
        - name: tacker-conductor
{{ dict "envAll" $envAll "component" "conductor" "container" "default" "args" (list "--process" "tacker-conductor" "--exchange" "tacker" "--rpc-topic" "TACKER_CONDUCTOR") "config" (include "tacker.config_args.conductor" $envAll | fromYamlArray) | include "helm-toolkit.snippets.worker_readiness_probe" | indent 10 }}
          image: {{ .Values.images.tags.tacker_conductor }}
          imagePullPolicy: {{ .Values.images.pull_policy }}
{{ tuple $envAll $envAll.Values.pod.resources.conductor | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - /bin/bash
            - -c
            - /tmp/tacker-conductor.sh
          volumeMounts:
          - name: tacker-conductor-sh
            mountPath: /tmp/worker-health-probe.py
            subPath: worker-health-probe.py
            readOnly: true
          - name: localtime
            mountPath: "/etc/localtime"
            readOnly: yes
          - name: tacker-etc
            mountPath: "/etc/tacker/config.json"
            readOnly: yes
            subPath: config-conductor.json
          - name: tacker-etc
            mountPath: "/etc/tacker/api-paste.ini"
            readOnly: yes
            subPath: api-paste.ini
{{- include "helm-toolkit.snippets.memcache_secret_key_mount" (tuple . "tacker") | nindent 10 }}
{{- include "helm-toolkit.snippets.identity_dropin_mount" (tuple . (include "tacker.identity_dropin_entries" . | fromJsonArray) "tacker") | nindent 10 }}
{{- include "helm-toolkit.snippets.db_dropin_mount" (tuple . (include "tacker.db_dropin_entries" . | fromJsonArray) "tacker") | nindent 10 }}
{{- with include "helm-toolkit.snippets.transport_dropin_mount" (tuple . (include "tacker.transport_dropin_entries" . | fromJsonArray) "tacker") }}{{ . | nindent 10 }}{{- end }}
          - name: tacker-etc
            mountPath: "/etc/tacker/tacker.conf"
            readOnly: yes
            subPath: tacker.conf
          - name: tacker-etc
            mountPath: "/etc/tacker/logging.conf"
            readOnly: yes
            subPath: logging.conf
{{- range $key, $volume := $envAll.Values.storage.volumes }}
          - name: {{ $key | replace "_" "-" }}
            mountPath: {{ $volume.mount_path | quote }}
            readOnly: false
{{- end }}
          - name: tacker-conductor-sh
            mountPath: /tmp/tacker-conductor.sh
            subPath: tacker-conductor.sh
            readOnly: true
          - name: oslo-lock-path
            mountPath: {{ .Values.conf.tacker.oslo_concurrency.lock_path }}
          ports:
          - name: conductor
            containerPort: 5672
      initContainers:
{{ tuple $envAll "server" tuple | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      volumes:
        - name: localtime
          hostPath:
            path: "/etc/localtime"
{{- include "helm-toolkit.snippets.memcache_secret_key_volume" (tuple . "tacker") | nindent 8 }}
{{- include "helm-toolkit.snippets.identity_dropin_volume" (tuple . (include "tacker.identity_dropin_entries" . | fromJsonArray) "tacker") | nindent 8 }}
{{- include "helm-toolkit.snippets.db_dropin_volume" (tuple . (include "tacker.db_dropin_entries" . | fromJsonArray) "tacker") | nindent 8 }}
{{- with include "helm-toolkit.snippets.transport_dropin_volume" (tuple . (include "tacker.transport_dropin_entries" . | fromJsonArray) "tacker") }}{{ . | nindent 8 }}{{- end }}
        - name: tacker-etc
          secret:
            defaultMode: 292
            secretName: tacker-etc
{{- range $key, $volume := $envAll.Values.storage.volumes }}
        - name: {{ $key | replace "_" "-" }}
          persistentVolumeClaim:
            claimName: {{ $volume.name }}
{{- end }}
        - name: tacker-conductor-sh
          configMap:
            name: tacker-bin
            defaultMode: 0555
        - name: oslo-lock-path
          emptyDir: {}
{{- end }}
