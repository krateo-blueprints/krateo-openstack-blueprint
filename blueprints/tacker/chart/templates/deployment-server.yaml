{{/*
tacker-server is the API (#231). GET / is the versions document, which the server answers itself,
with no authentication, database or RabbitMQ (tacker's api-paste.ini maps `/` to tackerversions,
stable/2026.1). A failure there is this process's own and a restart can repair it, so liveness asks
the same question and cannot restart the API because a dependency is down (the #146 shape). The
start script installs packages and downloads a helm binary before it starts the server, so the
startup probe allows ten minutes before liveness applies.
*/}}
{{- define "tackerServerHttpProbeTemplate" }}
httpGet:
  path: /
  port: {{ tuple "nfv_orchestration" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- end }}
{{- if .Values.manifests.deployment_server }}
{{- $envAll := . }}
{{- $serviceAccountName := "tacker-server" }}
{{ tuple $envAll "server" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tacker-server
  labels:
{{ tuple $envAll "tacker" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "tacker" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  replicas: {{ .Values.pod.replicas.server }}
  template:
    metadata:
      labels:
{{ tuple $envAll "tacker" "server" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
{{- if $envAll.Values.pod.tolerations.tacker.enabled }}
{{ tuple $envAll "tacker" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      nodeSelector:
        {{ .Values.labels.server.node_selector_key }}: {{ .Values.labels.server.node_selector_value }}
      serviceAccountName: tacker-server
{{ dict "envAll" $envAll "application" "server" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.server.timeout | default "30" }}
      containers:
        - name: tacker-server
{{ dict "envAll" $envAll "component" "server" "container" "default" "type" "startup" "probeTemplate" (include "tackerServerHttpProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | indent 10 }}
{{ dict "envAll" $envAll "component" "server" "container" "default" "type" "readiness" "probeTemplate" (include "tackerServerHttpProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | indent 10 }}
{{ dict "envAll" $envAll "component" "server" "container" "default" "type" "liveness" "probeTemplate" (include "tackerServerHttpProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | indent 10 }}
          image: {{ .Values.images.tags.tacker_server }}
          imagePullPolicy: {{ .Values.images.pull_policy }}
          command:
            - /bin/bash
            - -c
            - /tmp/tacker-server.sh
          volumeMounts:
          - name: localtime
            mountPath: "/etc/localtime"
            readOnly: yes
          - name: tacker-etc
            mountPath: "/etc/tacker/config.json"
            readOnly: yes
            subPath: config-server.json
          - name: tacker-etc
            mountPath: "/etc/tacker/api-paste.ini"
            readOnly: yes
            subPath: api-paste.ini
{{- include "helm-toolkit.snippets.memcache_secret_key_mount" (tuple . "tacker") | nindent 10 }}
{{- include "helm-toolkit.snippets.identity_dropin_mount" (tuple . (include "tacker.identity_dropin_entries" . | fromJsonArray) "tacker") | nindent 10 }}
{{- include "helm-toolkit.snippets.db_dropin_mount" (tuple . (include "tacker.db_dropin_entries" . | fromJsonArray) "tacker") | nindent 10 }}
{{- with include "helm-toolkit.snippets.transport_dropin_mount" (tuple . (include "tacker.transport_dropin_entries" . | fromJsonArray) "tacker") }}{{ . | nindent 10 }}{{- end }}
          - name: tacker-etc
            mountPath: "/etc/tacker/tacker.conf"
            readOnly: yes
            subPath: tacker.conf
          - name: tacker-etc
            mountPath: "/etc/tacker/logging.conf"
            readOnly: yes
            subPath: logging.conf
{{- range $key, $volume := $envAll.Values.storage.volumes }}
          - name: {{ $key | replace "_" "-" }}
            mountPath: {{ $volume.mount_path | quote }}
            readOnly: false
{{- end }}
          - name: tacker-server-sh
            mountPath: /tmp/tacker-server.sh
            subPath: tacker-server.sh
            readOnly: true
          - name: oslo-lock-path
            mountPath: {{ .Values.conf.tacker.oslo_concurrency.lock_path }}
          ports:
          - name: t-api
            containerPort: 9890
      initContainers:
{{ tuple $envAll "server" tuple | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      volumes:
        - name: localtime
          hostPath:
            path: "/etc/localtime"
{{- include "helm-toolkit.snippets.memcache_secret_key_volume" (tuple . "tacker") | nindent 8 }}
{{- include "helm-toolkit.snippets.identity_dropin_volume" (tuple . (include "tacker.identity_dropin_entries" . | fromJsonArray) "tacker") | nindent 8 }}
{{- include "helm-toolkit.snippets.db_dropin_volume" (tuple . (include "tacker.db_dropin_entries" . | fromJsonArray) "tacker") | nindent 8 }}
{{- with include "helm-toolkit.snippets.transport_dropin_volume" (tuple . (include "tacker.transport_dropin_entries" . | fromJsonArray) "tacker") }}{{ . | nindent 8 }}{{- end }}
        - name: tacker-etc
          secret:
            defaultMode: 292
            secretName: tacker-etc
{{- range $key, $volume := $envAll.Values.storage.volumes }}
        - name: {{ $key | replace "_" "-" }}
          persistentVolumeClaim:
            claimName: {{ $volume.name }}
{{- end }}
        - name: tacker-server-sh
          configMap:
            name: tacker-bin
            defaultMode: 0555
        - name: oslo-lock-path
          emptyDir: {}
{{- end }}
