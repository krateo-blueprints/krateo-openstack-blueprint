{{- if .Values.manifests.deployment_api }}
{{- $envAll := . }}

{{- $mounts_heat_api := .Values.pod.mounts.heat_api.heat_api }}
{{- $mounts_heat_api_init := .Values.pod.mounts.heat_api.init_container }}

{{- $serviceAccountName := "heat-api" }}
{{ tuple $envAll "api" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}

{{- $etcSources := .Values.pod.etcSources.heat_api }}
{{- with include "helm-toolkit.snippets.memcache_secret_key_etc_source" (tuple . "heat") }}{{- $etcSources = append $etcSources (fromJson .) }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heat-api
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "heat" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.api }}
  selector:
    matchLabels:
{{ tuple $envAll "heat" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "heat" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "heat_api" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
{{ dict "envAll" $envAll "podName" "heat-api" "containerNames" (list "heat-api" "init" ) | include "helm-toolkit.snippets.kubernetes_mandatory_access_control_annotation" | indent 8 }}
    spec:
{{ tuple "heat_api" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "heat_api" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "heat" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      affinity:
{{ tuple $envAll "heat" "api" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
{{ if $envAll.Values.pod.tolerations.heat.enabled }}
{{ tuple $envAll "heat" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      nodeSelector:
        {{ .Values.labels.api.node_selector_key }}: {{ .Values.labels.api.node_selector_value }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.api.timeout | default "30" }}
      initContainers:
{{ tuple $envAll "api" $mounts_heat_api_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: heat-api
{{ tuple $envAll "heat_api" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.api | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "heat" "container" "heat_api" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
{{- if or .Values.manifests.certificates .Values.tls.identity }}
          env:
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/heat/certs/ca.crt"
{{- end }}
          command:
            - /tmp/heat-api.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/heat-api.sh
                  - stop
          ports:
            - name: h-api
              containerPort: {{ tuple "orchestration" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
          readinessProbe:
            httpGet:
              scheme: {{ tuple "orchestration" "service" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" | upper }}
              path: /
              port: {{ tuple "orchestration" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            initialDelaySeconds: 30
          {{- /*
          Liveness reaches the API port, not the uwsgi stats port.

          Upstream's `pod.probes.api.heat_api.liveness.port` exists to repoint this probe at
          0.0.0.0:1717, which is `stats` with `stats-http = true` in conf.heat_api_uwsgi --
          uwsgi's statistics socket, served by the MASTER process. The master binds the listening
          socket, forks workers and reaps them; it never imports heat and never handles a request.
          So that endpoint answers 200 with a JSON blob whenever the master is alive: with the
          worker wedged, with the worker stopped, and with the application failing to import.
          There is no state of the service in which it says no, which makes liveness STRICTLY
          WEAKER than the readiness probe directly above -- and liveness is the probe that
          restarts things. Measured in quay.io/airshipit/heat:2026.1-ubuntu_noble: with the
          single worker SIGSTOPped, :1717 still answered 200 while :8004 timed out.

          The whole knob only ever selected that port, so it is removed rather than defaulted:
          an override cannot reintroduce what the template no longer reads. See issue #110.

          GET / returns 300 Multiple Choices with the version-discovery document, and the kubelet
          counts 200-399 as success. It is produced by the `versionnegotiation` filter, which
          sits BEFORE `authtoken` in the heat-api paste pipeline and short-circuits the root path,
          so no token is needed and keystone is never contacted; the document itself is built from
          constants, so neither the database nor rabbit is touched. Measured in the same image
          with mariadb, rabbit and keystone all unresolvable: the app loaded and GET / answered
          300. A worker must nevertheless run the request, which is what liveness wants to know.

          Timing is deliberately slack, and much slacker than readiness. conf uwsgi sets
          processes = 1, so a single in-flight request blocks the static document too: during a
          database or rabbit slowdown a saturated worker can miss a probe without being wedged.
          Readiness stays at 30s initial delay so traffic is withdrawn promptly and visibly;
          liveness restarts only after 60s + 6 x 30s = four minutes in which no attempt returned
          the version document. The app took 35 seconds to import in the measurement above, which
          is why the initial delay is 60s and not upstream's 10s.
          */}}
          livenessProbe:
            httpGet:
              scheme: {{ tuple "orchestration" "service" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" | upper }}
              path: /
              port: {{ tuple "orchestration" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.heat.oslo_concurrency.lock_path }}
            - name: pod-etc-heat
              mountPath: /etc/heat
            - name: heat-bin
              mountPath: /tmp/heat-api.sh
              subPath: heat-api.sh
              readOnly: true
            - name: heat-etc
              mountPath: /etc/heat/heat.conf
              subPath: heat.conf
              readOnly: true
            - name: heat-etc-snippets
              mountPath: /etc/heat/heat.conf.d/
              readOnly: true
            - name: heat-etc
              mountPath: /etc/heat/heat-api-uwsgi.ini
              subPath: heat-api-uwsgi.ini
              readOnly: true
            {{ if .Values.conf.heat.DEFAULT.log_config_append }}
            - name: heat-etc
              mountPath: {{ .Values.conf.heat.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.heat.DEFAULT.log_config_append }}
              readOnly: true
            {{ end }}
            - name: heat-etc
              mountPath: /etc/heat/api-paste.ini
              subPath: api-paste.ini
              readOnly: true
            - name: heat-etc
              mountPath: /etc/heat/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: heat-etc
              mountPath: /etc/heat/api_audit_map.conf
              subPath: api_audit_map.conf
              readOnly: true
            {{- if .Values.manifests.certificates }}
            - name: heat-etc
              mountPath: {{ .Values.conf.software.apache2.site_dir }}/heat-api.conf
              subPath: wsgi-heat.conf
              readOnly: true
            - name: heat-etc
              mountPath: {{ .Values.conf.software.apache2.mods_dir }}/mpm_event.conf
              subPath: mpm_event.conf
              readOnly: true
            {{- end }}
{{- dict "enabled" (or .Values.manifests.certificates .Values.tls.identity) "name" .Values.secrets.tls.orchestration.api.internal "path" "/etc/heat/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- dict "enabled" $envAll.Values.manifests.certificates "name" $envAll.Values.endpoints.oslo_messaging.auth.admin.secret.tls.internal "path" "/etc/rabbitmq/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{ if $mounts_heat_api.volumeMounts }}{{ toYaml $mounts_heat_api.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-heat
          emptyDir: {}
        - name: heat-bin
          configMap:
            name: heat-bin
            defaultMode: 0555
        - name: heat-etc
          secret:
            secretName: heat-etc
            defaultMode: 0444
        - name: heat-etc-snippets
{{- if $etcSources }}
          projected:
            sources:
{{ toYaml $etcSources | indent 14 }}
{{- else }}
          emptyDir: {}
{{ end }}
{{- dict "enabled" (or .Values.manifests.certificates .Values.tls.identity) "name" .Values.secrets.tls.orchestration.api.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- dict "enabled" $envAll.Values.manifests.certificates "name" $envAll.Values.endpoints.oslo_messaging.auth.admin.secret.tls.internal | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{ if $mounts_heat_api.volumes }}{{ toYaml $mounts_heat_api.volumes | indent 8 }}{{ end }}
{{- end }}
