{{/*
metricd had no probe of any kind, and of everything in this repository it is the component whose
failure is hardest to see.

statsd and the API accept measures; metricd is the only thing that aggregates them. gnocchi
4.7.0's gnocchi/cli/metricd.py, MetricProcessBase.run(), is:

    while not self._shutdown.is_set():
        try:
            self._run_job()
        except Exception:
            LOG.error("Unexpected error during %s job", self.name, exc_info=True)
        self._wake_up.wait(...)

Every failure is caught, logged and retried forever. A metricd that cannot reach its indexer,
its measure store or its coordinator therefore runs, stays up, is counted Ready by the
DaemonSet, the Composition and the umbrella, and aggregates nothing -- while measures are still
accepted. There is no user-facing error at any point, ever: a `gnocchi measures show` simply
returns fewer points than it should. Nothing else here fails this quietly.

So the probe has to check what metricd needs rather than whether it is running. All three are
hard requirements of MetricProcessBase._configure(), in order: get_coordinator_and_start()
against coordination_url (itself wrapped in retry_on_exception_and_log, so a missing
coordination backend blocks startup forever without crashing), then storage, incoming and
indexer drivers.

The probe asks gnocchi to load its own configured drivers rather than knowing anything about
which backend is in use, so this keeps working as the chart's indexer and measure store change.

Readiness and NOT liveness, deliberately, and no startupProbe. Restarting metricd does not
repair a database, a measure store or a memcached that is down -- all three live outside this
pod -- so a liveness probe on these conditions converts a visible unready pod into a CrashLoop
and fixes nothing; this is the same reasoning as keystone's fernet keys (#99) and glance's image
store (#110). A startupProbe would be worse still: it suppresses both liveness and readiness
until it passes, which would hide the one signal this exists to produce. There is deliberately
no liveness probe at all: the failure mode a restart would fix -- the daemon's own threads dying
while the process lives -- is already handled by cotyledon respawning its children, and no
honest progress signal exists for "is it actually aggregating", so inventing one that restarts
the container would be worse than the gap.

periodSeconds in values is 60, matching metricd's own default metric_processing_delay, so the
probe costs about one extra backend round trip per processing pass per node.
*/}}
{{- define "metricdReadinessProbeTemplate" }}
exec:
  command:
    - python3
    - /tmp/gnocchi-probe.py
    - --deadline
    - "25"
    - --indexer
    - --storage
    - --coordination
{{- end }}

{{- if .Values.manifests.daemonset_metricd }}
{{- $envAll := . }}

{{- $mounts_gnocchi_metricd := .Values.pod.mounts.gnocchi_metricd.gnocchi_metricd }}
{{- $mounts_gnocchi_metricd_init := .Values.pod.mounts.gnocchi_metricd.init_container }}

{{- $serviceAccountName := "gnocchi-metricd" }}
{{ tuple $envAll "metricd" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gnocchi-metricd
  labels:
{{ tuple $envAll "gnocchi" "metricd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "gnocchi" "metricd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll "metricd" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "gnocchi" "metricd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      nodeSelector:
        {{ .Values.labels.metricd.node_selector_key }}: {{ .Values.labels.metricd.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.gnocchi.enabled }}
{{ tuple $envAll "gnocchi" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      initContainers:
{{ tuple $envAll "metricd" $mounts_gnocchi_metricd_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        - name: ceph-keyring-placement
{{ tuple $envAll "gnocchi_api" | include "helm-toolkit.snippets.image" | indent 10 }}
          command:
            - /tmp/ceph-keyring.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: etcceph
              mountPath: /etc/ceph
            - name: gnocchi-bin
              mountPath: /tmp/ceph-keyring.sh
              subPath: ceph-keyring.sh
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
      containers:
        - name: gnocchi-metricd
{{ tuple $envAll "gnocchi_metricd" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.metricd | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - /tmp/gnocchi-metricd.sh
{{ dict "envAll" $envAll "component" "metricd" "container" "gnocchi-metricd" "type" "readiness" "probeTemplate" (include "metricdReadinessProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | trim | indent 10 }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.gnocchi.oslo_concurrency.lock_path }}
            - name: pod-etc-gnocchi
              mountPath: /etc/gnocchi
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/gnocchi.conf
              subPath: gnocchi.conf
              readOnly: true
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: gnocchi-bin
              mountPath: /tmp/gnocchi-metricd.sh
              subPath: gnocchi-metricd.sh
              readOnly: true
            - name: gnocchi-bin
              mountPath: /tmp/gnocchi-probe.py
              subPath: gnocchi-probe.py
              readOnly: true
            - name: etcceph
              mountPath: /etc/ceph
            - name: ceph-etc
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
{{ if $mounts_gnocchi_metricd.volumeMounts }}{{ toYaml $mounts_gnocchi_metricd.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-gnocchi
          emptyDir: {}
        - name: gnocchi-etc
          secret:
            secretName: gnocchi-etc
            defaultMode: 0444
        - name: gnocchi-bin
          configMap:
            name: gnocchi-bin
            defaultMode: 0555
        - name: etcceph
          emptyDir: {}
        - name: ceph-etc
          configMap:
            name: {{ .Values.ceph_client.configmap }}
        - name: ceph-keyring
          secret:
            secretName: {{ .Values.secrets.rbd | quote }}
{{ if $mounts_gnocchi_metricd.volumes }}{{ toYaml $mounts_gnocchi_metricd.volumes | indent 8 }}{{ end }}
{{- end }}
