{{- if .Values.manifests.configmap_etc }}

{{- if empty .Values.conf.gnocchi.keystone_authtoken.auth_uri -}}
{{- $_ := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" | set .Values.conf.gnocchi.keystone_authtoken "auth_uri" -}}
{{- end -}}

{{- if empty .Values.conf.gnocchi.keystone_authtoken.auth_url -}}
{{- $_ := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" | set .Values.conf.gnocchi.keystone_authtoken "auth_url" -}}
{{- end -}}

{{- if empty .Values.conf.gnocchi.keystone_authtoken.memcached_servers -}}
{{- $_ := tuple "oslo_cache" "internal" "memcache" . | include "helm-toolkit.endpoints.host_and_port_endpoint_uri_lookup" | set .Values.conf.gnocchi.keystone_authtoken "memcached_servers" -}}
{{- end -}}
{{- if empty .Values.conf.gnocchi.keystone_authtoken.memcache_secret_key -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "memcache_secret_key" ( default ( randAlphaNum 64 ) .Values.endpoints.oslo_cache.auth.memcache_secret_key ) -}}
{{- end -}}

{{- if empty .Values.conf.gnocchi.keystone_authtoken.region_name -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "region_name" .Values.endpoints.identity.auth.gnocchi.region_name -}}
{{- end -}}
{{- if empty .Values.conf.gnocchi.keystone_authtoken.project_name -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "project_name" .Values.endpoints.identity.auth.gnocchi.project_name -}}
{{- end -}}
{{- if empty .Values.conf.gnocchi.keystone_authtoken.project_domain_name -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "project_domain_name" .Values.endpoints.identity.auth.gnocchi.project_domain_name -}}
{{- end -}}
{{- if empty .Values.conf.gnocchi.keystone_authtoken.user_domain_name -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "user_domain_name" .Values.endpoints.identity.auth.gnocchi.user_domain_name -}}
{{- end -}}
{{- if empty .Values.conf.gnocchi.keystone_authtoken.username -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "username" .Values.endpoints.identity.auth.gnocchi.username -}}
{{- end -}}
{{- if empty .Values.conf.gnocchi.keystone_authtoken.password -}}
{{- $_ := set .Values.conf.gnocchi.keystone_authtoken "password" .Values.endpoints.identity.auth.gnocchi.password -}}
{{- end -}}

{{/*
Krateo (#309 H2 run 4): the tooz coordination backend. metricd's sack locks must live on ONE backend: locks spread over
memcached shards would let two metricd hold one sack. Upstream derived the URL from the memcache endpoint and took the
tooz DRIVER from endpoints.oslo_cache.hosts.default -- right only while that host is literally `memcached`. With
ha.enabled the umbrella sets it to the headless Service memcached-discovery and a host list, which rendered
`memcached-discovery://h0,h1,h2` ("No 'tooz.backends' driver found") and gnocchi never became Ready.
  - storage.driver redis (this blueprint's default): coordination_url is left unset, so gnocchi coordinates on the
    metric store's redis (gnocchi/service.py prepare_service fills an unset coordination_url from the redis URL; the
    readiness probe models the same fallback). One backend, in every mode.
  - any other storage driver: the memcached driver, named literally, on exactly one memcached host; a memcache host
    list (ha.enabled) is refused, because it cannot be a lock backend. hack/validate-ha-propagation.py checks every
    tooz URL the charts render with the ha spec.
*/}}
{{- if and (empty .Values.conf.gnocchi.DEFAULT.coordination_url) (ne (.Values.conf.gnocchi.storage.driver | toString) "redis") -}}
{{- if (.Values.endpoints.oslo_cache.statefulset | default dict).name -}}
{{- fail "\n\ngnocchi coordination: with a memcached host list (ha.enabled) memcached cannot be gnocchi's tooz lock backend (locks spread over shards). Use storage.driver redis, which gnocchi coordinates on, or set conf.gnocchi.DEFAULT.coordination_url to a single-backend tooz URL.\n" -}}
{{- end -}}
{{- $endpointUrl := tuple "oslo_cache" "internal" "memcache" . | include "helm-toolkit.endpoints.host_and_port_endpoint_uri_lookup" }}
{{- $_ := printf "memcached://%s" $endpointUrl | set .Values.conf.gnocchi.DEFAULT "coordination_url" -}}
{{- end -}}

{{- dict "envAll" . "entries" (include "gnocchi.db_dropin_entries" . | fromJsonArray) "confKey" "gnocchi" | include "helm-toolkit.utils.db_dropin_refuse" }}
{{- if and (not (kindIs "invalid" .Values.conf.gnocchi.database.connection)) (empty .Values.conf.gnocchi.database.connection) -}}
{{- $_ := tuple "oslo_db" "internal" "gnocchi" "mysql" . | include "helm-toolkit.endpoints.authenticated_endpoint_uri_lookup" | set .Values.conf.gnocchi.database "connection" -}}
{{- end -}}

{{/*
The metric store's redis URL, derived from endpoints.metric_store exactly as zaqar's message
store is derived from its own endpoints.message_store (#138) and as the indexer URL below is
derived from endpoints.oslo_db. endpoints.metric_store is then the single value that both this
URL and the kubernetes-entrypoint waits in dependencies.static.{api,db_sync,metricd,statsd}
resolve from, so moving the store moves the wait with it.

One key is all gnocchi's redis storage takes. gnocchi/common/redis.py get_client() parses
`redis_url` and nothing else: hostname and port become the redis-py client's host/port, any
userinfo becomes username/password, and every remaining client argument (db, socket_timeout,
ssl, sentinel, ...) is read from the URL's query string. There is no second option to fill --
verified in quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble, where
gnocchi.common.redis.OPTS is exactly one StrOpt named redis_url.

Upstream's chart ships `storage.driver: ceph` and fills nothing here, so this block is a
deliberate divergence recorded in hack/upstream-divergences.d. Without it `driver: redis`
would silently fall back to gnocchi's own default, `redis://localhost:6379/` -- which resolves
inside the gnocchi pod itself, where no redis is listening, and which no dependency wait could
ever have told you about.

[incoming] is deliberately left unset. gnocchi/opts.py builds the incoming option list by
deep-copying the storage list and setting each option's default to '${storage.<name>}', so an
absent [incoming] section means "incoming is whatever storage is" -- redis here, for both the
driver and the URL. Measured in the same image with this chart's own rendered config:
`conf.incoming.driver` resolves to redis and `conf.incoming.redis_url` to this URL, with
neither key present in the file.
*/}}
{{- if empty .Values.conf.gnocchi.storage.redis_url -}}
{{- $_ := tuple "metric_store" "internal" "redis" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" | set .Values.conf.gnocchi.storage "redis_url" -}}
{{- end -}}

{{- if and (not (kindIs "invalid" .Values.conf.gnocchi.indexer.url)) (empty .Values.conf.gnocchi.indexer.url) -}}
{{ if eq .Values.conf.gnocchi.indexer.driver "postgresql" }}
{{- $_ := tuple "oslo_db_postgresql" "internal" "gnocchi" "postgresql" . | include "helm-toolkit.endpoints.authenticated_endpoint_uri_lookup" | set .Values.conf.gnocchi.indexer "url" -}}
{{ else }}
{{- $_ := tuple "oslo_db" "internal" "gnocchi" "mysql" . | include "helm-toolkit.endpoints.authenticated_endpoint_uri_lookup" | set .Values.conf.gnocchi.indexer "url" -}}
{{ end }}
{{- end -}}

{{- if empty .Values.conf.gnocchi.statsd.resource_id -}}
{{- $_ := uuidv4 | set .Values.conf.gnocchi.statsd "resource_id" -}}
{{- end -}}

{{/*
Upstream filled conf.gnocchi.statsd.user_id and .project_id with uuidv4 here. gnocchi has not
registered either option since 3.x -- gnocchi/opts.py's [statsd] group is host, port,
resource_id, creator, archive_policy_name, flush_delay -- so both were rendered into
gnocchi.conf and read by nobody, while the one key Stats.__init__ and Stats.flush() do read,
`creator`, was never rendered at all. See the note beside conf.gnocchi.statsd.creator in
values.yaml for the measurement.

`creator` gets no generated fallback on purpose. It is a "<user_id>:<project_id>" pair that has
to name a real keystone user and project for gnocchi's default rule:admin_or_creator policies to
match anything; a uuidv4 could never match, so generating one would only make an unconfigured
install look configured. values.yaml pins it, which is also what keeps the etc Secret stable
across reconciles.
*/}}

{{- if empty .Values.conf.gnocchi.api.port -}}
{{- $_ := tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" | set .Values.conf.gnocchi.api "port" -}}
{{- end -}}

{{- if empty .Values.conf.gnocchi.statsd.port -}}
{{- $_ := tuple "metric_statsd" "internal" "statsd" . | include "helm-toolkit.endpoints.endpoint_port_lookup" | set .Values.conf.gnocchi.statsd "port" -}}
{{- end -}}

{{- $envAll := . }}
---
{{- tuple $envAll "gnocchi" | include "helm-toolkit.utils.memcache_secret_key_strip" }}
{{- dict "envAll" $envAll "entries" (include "gnocchi.identity_dropin_entries" $envAll | fromJsonArray) "confKey" "gnocchi" | include "helm-toolkit.utils.identity_dropin_strip" }}
{{- dict "envAll" $envAll "entries" (include "gnocchi.db_dropin_entries" $envAll | fromJsonArray) "confKey" "gnocchi" | include "helm-toolkit.utils.db_dropin_strip" }}
apiVersion: v1
kind: Secret
metadata:
  name: gnocchi-etc
type: Opaque
data:
  gnocchi.conf: {{ include "helm-toolkit.utils.to_oslo_conf" .Values.conf.gnocchi | b64enc }}
  api-paste.ini: {{ include "helm-toolkit.utils.to_ini" .Values.conf.paste | b64enc }}
  policy.yaml: {{ toYaml .Values.conf.policy | b64enc }}
{{- include "helm-toolkit.snippets.values_template_renderer" (dict "envAll" $envAll "template" .Values.conf.apache "key" "wsgi-gnocchi.conf" "format" "Secret" ) | indent 2 }}
{{- end }}
