{{/*
Liveness is the shallow check, and deliberately only that.

/healthcheck is oslo.middleware's healthcheck app, mounted by api-paste.ini outside the pecan
application: it proves a uwsgi WORKER executed Python and answered, and it touches neither the
indexer, the measure store nor the coordinator. That is exactly what a restarting probe should
test here. A wedged or dead worker set IS repaired by restarting the container, and a backend
outage is NOT -- so the backend checks belong in readiness, below, where they cannot CrashLoop
a pod over something that lives in another pod.

It must be an HTTP request and not a tcpSocket, which is what this container had. The API is
served by `uwsgi --http`, and uwsgi's HTTP router is not a worker: the router accepts the TCP
connection itself and only then hands it on. A tcpSocket probe on 8041 therefore succeeds
while every worker is wedged -- the same mistake as pointing liveness at uwsgi's stats port
1717, which reports on the master and answers 200 with every worker stuck.

The port is looked up as "internal", matching what bin/_gnocchi-api.sh.tpl tells uwsgi to bind.
The previous probe looked it up as "service", which resolves to the same number today only
because endpoints.metric.port.api has no "service" key and falls back to default.
*/}}
{{- define "apiLivenessProbeTemplate" }}
httpGet:
  path: {{ tuple "metric" "healthcheck" "internal" . | include "helm-toolkit.endpoints.keystone_endpoint_path_lookup" }}
  scheme: {{ tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup" | upper }}
  port: {{ tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- end }}

{{/*
Readiness, unlike liveness, also requires every backend the API cannot serve a request without.

The API answers /healthcheck from oslo.middleware before pecan is ever reached, so an API whose
indexer, measure store or coordinator is gone still answers it 200 -- while every /v1 request
returns 500. That is the same shape as keystone's KeysNotFound (issue #99) and glance's
unwritable store (issue #110): a Ready that the dependency gate, the Composition and the
umbrella all read as "safe to build on", and that means nothing.

All three are hard dependencies of the gnocchi API, not optional extras. gnocchi/rest/app.py
GnocchiHook.on_route() lazily builds the coordinator, the storage, the indexer and the incoming
driver for EVERY request, with the comment "We don't care about raise error here, if something
fail, this will just raise a 500" -- and the coordinator is built through
metricd.get_coordinator_and_start, which is wrapped in retry_on_exception_and_log and so retries
forever rather than failing. A gnocchi API with no coordination backend does not error; it
hangs.

The --http check stays in readiness as well as liveness: the backend checks run in a separate
process, so without it a readiness pass would say nothing about whether a worker can answer.

--deadline is below the probe's timeoutSeconds in values, so the script fails itself with a
message the kubelet records rather than being killed mid-check.
*/}}
{{- define "apiReadinessProbeTemplate" }}
exec:
  command:
    - python3
    - /tmp/gnocchi-probe.py
    - --deadline
    - "25"
    - --http
    - {{ printf "%s://127.0.0.1:%s%s" (tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_scheme_lookup") (tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup") (tuple "metric" "healthcheck" "internal" . | include "helm-toolkit.endpoints.keystone_endpoint_path_lookup") | quote }}
    - --indexer
    - --storage
    - --coordination
{{- end }}

{{- if .Values.manifests.deployment_api }}
{{- $envAll := . }}

{{- $mounts_gnocchi_api := .Values.pod.mounts.gnocchi_api.gnocchi_api }}
{{- $mounts_gnocchi_api_init := .Values.pod.mounts.gnocchi_api.init_container }}

{{- $serviceAccountName := "gnocchi-api" }}
{{ tuple $envAll "api" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnocchi-api
  labels:
{{ tuple $envAll "gnocchi" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.api }}
  selector:
    matchLabels:
{{ tuple $envAll "gnocchi" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "gnocchi" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      affinity:
{{ tuple $envAll "gnocchi" "api" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.api.node_selector_key }}: {{ .Values.labels.api.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.gnocchi.enabled }}
{{ tuple $envAll "gnocchi" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.api.timeout | default "30" }}
      initContainers:
{{ tuple $envAll "api" $mounts_gnocchi_api_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
{{/*
Ceph-only. This init container writes /etc/ceph/ceph.client.gnocchi.keyring from the
secrets.rbd Secret, which only gnocchi-storage-init creates and which therefore never
exists under any other storage driver. Ungated it is not inert: the pod stays in Init
forever on a missing Secret volume, which is precisely how the API sat behind
ceph-keyring-placement on the GKE install (#115).
*/}}
{{- if eq .Values.conf.gnocchi.storage.driver "ceph" }}
        - name: ceph-keyring-placement
{{ tuple $envAll "gnocchi_api" | include "helm-toolkit.snippets.image" | indent 10 }}
          command:
            - /tmp/ceph-keyring.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: etcceph
              mountPath: /etc/ceph
            - name: gnocchi-bin
              mountPath: /tmp/ceph-keyring.sh
              subPath: ceph-keyring.sh
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
{{- end }}
      containers:
        - name: gnocchi-api
{{ tuple $envAll "gnocchi_api" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.api | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - /tmp/gnocchi-api.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/gnocchi-api.sh
                  - stop
          ports:
            - name: gn-api
              containerPort: {{ tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{ dict "envAll" $envAll "component" "api" "container" "gnocchi-api" "type" "readiness" "probeTemplate" (include "apiReadinessProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | trim | indent 10 }}
{{ dict "envAll" $envAll "component" "api" "container" "gnocchi-api" "type" "liveness" "probeTemplate" (include "apiLivenessProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | trim | indent 10 }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.gnocchi.oslo_concurrency.lock_path }}
            - name: pod-etc-gnocchi
              mountPath: /etc/gnocchi
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/gnocchi.conf
              subPath: gnocchi.conf
              readOnly: true
            {{- if .Values.conf.enable_paste }}
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/api-paste.ini
              subPath: api-paste.ini
              readOnly: true
            {{- end }}
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/policy.yaml
              subPath: policy.yaml
              readOnly: true
{{- if eq .Values.conf.gnocchi.storage.driver "ceph" }}
            - name: etcceph
              mountPath: /etc/ceph
            - name: ceph-etc
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
{{- end }}
            - name: gnocchi-bin
              mountPath: /tmp/gnocchi-api.sh
              subPath: gnocchi-api.sh
              readOnly: true
            - name: gnocchi-bin
              mountPath: /tmp/gnocchi-probe.py
              subPath: gnocchi-probe.py
              readOnly: true
{{ if $mounts_gnocchi_api.volumeMounts }}{{ toYaml $mounts_gnocchi_api.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-gnocchi
          emptyDir: {}
        - name: gnocchi-etc
          secret:
            secretName: gnocchi-etc
            defaultMode: 0444
        - name: gnocchi-bin
          configMap:
            name: gnocchi-bin
            defaultMode: 0555
{{- if eq .Values.conf.gnocchi.storage.driver "ceph" }}
        - name: etcceph
          emptyDir: {}
        - name: ceph-etc
          configMap:
            name: {{ .Values.ceph_client.configmap }}
        - name: ceph-keyring
          secret:
            secretName: {{ .Values.secrets.rbd | quote }}
{{- end }}
{{ if $mounts_gnocchi_api.volumes }}{{ toYaml $mounts_gnocchi_api.volumes | indent 8 }}{{ end }}
{{- end }}
