{{/*
statsd had no probe of any kind either, and it cannot usefully have an HTTP or tcpSocket one:
gnocchi/statsd.py binds a DATAGRAM endpoint (asyncio create_datagram_endpoint, with a
`TODO(jd) Add TCP support` beside it), so there is no TCP listener on 8125 to connect to and no
reply for a sender to inspect.

What can be false while the process is perfectly alive is the write path. gnocchi 4.7.0's
Stats.flush() is:

    for metric_name, measure in itertools.chain(...):
        try:
            ...
            self.incoming.add_measures(metric.id, (measure,))
        except Exception as e:
            LOG.error("Unable to add measure %s: %s", metric_name, e)

Per measure, caught and logged. A statsd whose measure store or indexer has gone keeps
accepting every datagram and discards every one, every flush_delay seconds, forever -- and UDP
gives the sender nothing back, so neither end can tell. The socket stays bound, the process
stays up, the DaemonSet stays Ready.

So the probe checks the two backends statsd actually writes through. Both are used by
Stats.__init__ and Stats.flush(): the incoming/measure store via add_measures, and the indexer
via create_metric and get_archive_policy_for_metric.

Not --coordination: statsd never builds a coordinator (unlike metricd and the API), so making
its readiness depend on one would report a failure it does not have.

Readiness and NOT liveness, and no startupProbe, for the same reason as metricd: an unreachable
database or measure store is not repaired by restarting this container, so a restarting probe
would convert a visible unready pod into a CrashLoop and fix nothing, and a startupProbe
suppresses readiness until it passes.
*/}}
{{- define "statsdReadinessProbeTemplate" }}
exec:
  command:
    - python3
    - /tmp/gnocchi-probe.py
    - --deadline
    - "25"
    - --indexer
    - --storage
{{- end }}

{{/*
The component label is "statsd", not "metricd", in all three places below.

Upstream labels this DaemonSet, its own selector and its pod template with
`tuple $envAll "gnocchi" "metricd"` -- byte for byte what templates/daemonset-metricd.yaml
emits. templates/service-statsd.yaml selects `tuple $envAll "gnocchi" "statsd"`. Those do not
intersect, so the gnocchi-statsd Service matched no pod, had no endpoints, and could not deliver
a datagram no matter what protocol it declared. Found by hack/validate-udp-services.py while
checking that the Service is in front of the daemon it names; verified in the rendered chart,
where the Service selects component=statsd and the DaemonSet's pods carry component=metricd.

It also gave the two DaemonSets in this chart identical matchLabels -- `application: gnocchi`,
`component: metricd`, `release_group: <release>` -- which Kubernetes documents as undefined:
"you should not normally create any Pods whose labels match this selector", and two controllers
selecting the same set is the same hazard one step further out. Each DaemonSet's pods are kept
by its own ControllerRef, so this did not visibly break, which is exactly why it survived.

Only the labels change. The node selector, the resources and the probe already read
.Values.labels.statsd / .Values.pod.resources.statsd / component "statsd", so the chart's own
values have always said "statsd"; these three tuples were the only disagreement.

UPGRADE NOTE. spec.selector on an apps/v1 DaemonSet is immutable -- "Updates to this field are
forbidden" -- so an install that already has a gnocchi-statsd DaemonSet from before this change
will reject the apply with an immutable-field error until the old object is removed:

    kubectl -n <namespace> delete daemonset gnocchi-statsd

It is a DaemonSet of a stateless UDP receiver with no PVC and no leader election, so deleting
and letting it be recreated costs nothing but the datagrams in flight, and this Service has
never delivered one. The alternative -- pointing service-statsd.yaml's selector at
component=metricd to avoid touching the selector -- was rejected: it would leave the statsd
pods labelled as a different component, leave the chart's two DaemonSets selecting the same
label set, and leave anything that selects on component unable to tell them apart.
*/}}
{{- if .Values.manifests.daemonset_statsd }}
{{- $envAll := . }}

{{- $mounts_gnocchi_statsd := .Values.pod.mounts.gnocchi_statsd.gnocchi_statsd }}
{{- $mounts_gnocchi_statsd_init := .Values.pod.mounts.gnocchi_statsd.init_container }}

{{- $serviceAccountName := "gnocchi-statsd" }}
{{ tuple $envAll "statsd" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gnocchi-statsd
  labels:
{{ tuple $envAll "gnocchi" "statsd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "gnocchi" "statsd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "gnocchi" "statsd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      nodeSelector:
        {{ .Values.labels.statsd.node_selector_key }}: {{ .Values.labels.statsd.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.gnocchi.enabled }}
{{ tuple $envAll "gnocchi" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      initContainers:
{{ tuple $envAll "statsd" $mounts_gnocchi_statsd_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
{{/* Ceph-only: see the note in deployment-api.yaml. */}}
{{- if eq .Values.conf.gnocchi.storage.driver "ceph" }}
        - name: ceph-keyring-placement
{{ tuple $envAll "gnocchi_api" | include "helm-toolkit.snippets.image" | indent 10 }}
          command:
            - /tmp/ceph-keyring.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: etcceph
              mountPath: /etc/ceph
            - name: gnocchi-bin
              mountPath: /tmp/ceph-keyring.sh
              subPath: ceph-keyring.sh
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
{{- end }}
      containers:
        - name: gnocchi-statsd
{{ tuple $envAll "gnocchi_statsd" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.statsd | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - /tmp/gnocchi-statsd.sh
{{/*
protocol: UDP here too. A ContainerPort's `protocol` defaults to TCP exactly as a ServicePort's
does, so upstream declared a TCP containerPort in front of the create_datagram_endpoint socket
above -- the same defect as the Service, one layer down. See templates/service-statsd.yaml for
the measured evidence from the Kolla image.

Both halves are needed, and for different reasons. The Service's protocol is what kube-proxy
programs, so it alone decides whether a datagram addressed to gnocchi-statsd:8125 is forwarded.
The containerPort's protocol decides what the port is published as: it is the key a Service's
`targetPort: gn-stats` resolves by (a named targetPort matches on name AND protocol), it is what
`kubectl describe`/`get pod -o wide` reports, and it is what a NetworkPolicy or a sidecar reading
the pod spec sees. Declaring TCP there describes the pod incorrectly even once the Service is
right, and a later named-targetPort refactor would then fail to resolve.
*/}}
          ports:
            - name: gn-stats
              containerPort: {{ tuple "metric_statsd" "internal" "statsd" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
              protocol: UDP
{{ dict "envAll" $envAll "component" "statsd" "container" "gnocchi-statsd" "type" "readiness" "probeTemplate" (include "statsdReadinessProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | trim | indent 10 }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.gnocchi.oslo_concurrency.lock_path }}
            - name: pod-etc-gnocchi
              mountPath: /etc/gnocchi
{{- include "helm-toolkit.snippets.memcache_secret_key_mount" (tuple . "gnocchi") | nindent 12 }}
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/gnocchi.conf
              subPath: gnocchi.conf
              readOnly: true
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/api-paste.ini
              subPath: api-paste.ini
              readOnly: true
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: gnocchi-bin
              mountPath: /tmp/gnocchi-statsd.sh
              subPath: gnocchi-statsd.sh
              readOnly: true
            - name: gnocchi-bin
              mountPath: /tmp/gnocchi-probe.py
              subPath: gnocchi-probe.py
              readOnly: true
{{- if eq .Values.conf.gnocchi.storage.driver "ceph" }}
            - name: etcceph
              mountPath: /etc/ceph
            - name: ceph-etc
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
{{- end }}
{{ if $mounts_gnocchi_statsd.volumeMounts }}{{ toYaml $mounts_gnocchi_statsd.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-gnocchi
          emptyDir: {}
{{- include "helm-toolkit.snippets.memcache_secret_key_volume" (tuple . "gnocchi") | nindent 8 }}
        - name: gnocchi-etc
          secret:
            secretName: gnocchi-etc
            defaultMode: 0444
        - name: gnocchi-bin
          configMap:
            name: gnocchi-bin
            defaultMode: 0555
{{- if eq .Values.conf.gnocchi.storage.driver "ceph" }}
        - name: etcceph
          emptyDir: {}
        - name: ceph-etc
          configMap:
            name: {{ .Values.ceph_client.configmap }}
        - name: ceph-keyring
          secret:
            secretName: {{ .Values.secrets.rbd | quote }}
{{- end }}
{{ if $mounts_gnocchi_statsd.volumes }}{{ toYaml $mounts_gnocchi_statsd.volumes | indent 8 }}{{ end }}
{{- end }}
