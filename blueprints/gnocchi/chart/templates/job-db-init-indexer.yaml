{{/*
Gated on the indexer driver, not only on the manifests flag. This Job exists to create a
database on a *postgresql* server: it waits on dependencies.static.db_init_postgresql
(endpoints.oslo_db_postgresql) and writes [indexer] url. With `indexer.driver: mysql` the
indexer database is the mariadb database that gnocchi-db-init already creates, so this Job
has nothing to do -- and because kubernetes-entrypoint cannot tell "not ready yet" from
"no such Service", rendering it anyway is what made it sit in Init:0/1 on the GKE install
reporting `Service postgresql ... has no ready endpoints` (#115).

configmap-etc.yaml already branches on this same value to choose the indexer URL. Keeping
the manifests and the dependency waits on the same single switch is the point.
*/}}
{{- if and .Values.manifests.job_db_init_indexer (eq .Values.conf.gnocchi.indexer.driver "postgresql") }}
{{- $envAll := . }}

{{- $serviceAccountName := "gnocchi-db-init-indexer" }}
{{ tuple $envAll "db_init_postgresql" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gnocchi-db-init-indexer
  labels:
{{ tuple $envAll "gnocchi" "db-init-indexer" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  template:
    metadata:
      labels:
{{ tuple $envAll "gnocchi" "db-init-indexer" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      restartPolicy: OnFailure
      nodeSelector:
        {{ .Values.labels.job.node_selector_key }}: {{ .Values.labels.job.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.gnocchi.enabled }}
{{ tuple $envAll "gnocchi" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      initContainers:
{{ tuple $envAll "db_init_postgresql" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: gnocchi-db-init-indexer
{{ tuple $envAll "db_init_indexer" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.db_init_indexer | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          env:
            - name: ROOT_DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oslo_db_indexer.admin }}
                  key: DB_CONNECTION_INDEXER
            - name: OPENSTACK_CONFIG_FILE
              value: /etc/gnocchi/gnocchi.conf
            - name: OPENSTACK_CONFIG_DB_SECTION
              value: indexer
            - name: OPENSTACK_CONFIG_DB_KEY
              value: url
          command:
            - /tmp/db-init.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: gnocchi-etc
              mountPath: /etc/gnocchi/gnocchi.conf
              subPath: gnocchi.conf
            - name: pod-etc-gnocchi
              mountPath: /etc/gnocchi
            - name: gnocchi-bin
              mountPath: /tmp/db-init.sh
              subPath: db-init.sh
              readOnly: true
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: gnocchi-etc
          secret:
            secretName: gnocchi-etc
            defaultMode: 0444
        - name: pod-etc-gnocchi
          emptyDir: {}
        - name: gnocchi-bin
          configMap:
            name: gnocchi-bin
            defaultMode: 0555
{{- end }}
