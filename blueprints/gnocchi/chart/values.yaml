# Default values for gnocchi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

---
labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  metricd:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  statsd:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  test:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

release_group: null

images:
  tags:
    dep_check: quay.io/airshipit/kubernetes-entrypoint:c606628c7dc0fcc5654a87e5fe572ae0a456307a-ubuntu_noble
    gnocchi_storage_init: quay.io/airshipit/ceph-config-helper:ubuntu_jammy_20.2.1-1-20260407
    # The postgresql-indexer db-init job, which is the only consumer of this tag, no longer
    # renders: the indexer is mysql (conf.gnocchi.indexer.driver), so gnocchi-db-init on
    # mariadb creates the one database gnocchi uses. The tag is kept so the postgresql path
    # stays renderable, but repointed off docker.io/library/postgres:9.5 -- an unmaintained
    # 2017 image that preflight-refs would keep pulling for nothing. Upstream's comment
    # here said "using non-kolla images until kolla supports postgres as an indexer"; that
    # is no longer true, the Kolla gnocchi-api image has psycopg2 installed (verified in
    # quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble).
    db_init_indexer: quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble
    db_init: quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble
    db_sync: quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble
    ks_user: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_service: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_endpoints: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    gnocchi_api: quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble
    gnocchi_statsd: quay.io/openstack.kolla/gnocchi-statsd:2026.1-ubuntu-noble
    gnocchi_metricd: quay.io/openstack.kolla/gnocchi-metricd:2026.1-ubuntu-noble
    gnocchi_resources_cleaner: quay.io/openstack.kolla/gnocchi-base:2026.1-ubuntu-noble
    image_repo_sync: quay.io/airshipit/docker:27.5.0
  pull_policy: "IfNotPresent"
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

jobs:
  resources_cleaner:
    # daily
    cron: "0 */24 * * *"
    deleted_resources_ttl: '1day'
    history:
      success: 3
      failed: 1

network:
  api:
    ingress:
      public: true
      classes:
        namespace: "ingress-openstack"
        cluster: "ingress-cluster"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        haproxy.org/path-rewrite: /
    external_policy_local: false
    node_port:
      enabled: false
      port: 8041
  statsd:
    node_port:
      enabled: false
      port: 8125

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - gnocchi-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    # kubernetes-entrypoint waits. Every service named here must be one this blueprint
    # actually serves, and every job named here must be one this chart actually renders --
    # kubernetes-entrypoint does not distinguish "not ready yet" from "will never exist",
    # it just blocks. `oslo_db_postgresql` and `gnocchi-storage-init` were both of the
    # second kind (#115): the GKE install showed `Service postgresql ... has no ready
    # endpoints` on db-init-indexer, db-sync, metricd and statsd, forever.
    # hack/validate-component-config-closure.py now asserts both halves of that.
    api:
      jobs:
        - gnocchi-db-sync
        - gnocchi-ks-endpoints
        - gnocchi-ks-service
        - gnocchi-ks-user
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: object_store
    clean:
      services: null
    db_init:
      services:
        - endpoint: internal
          service: oslo_db
    db_init_postgresql:
      jobs: null
      services:
        - endpoint: internal
          service: oslo_db_postgresql
    db_sync:
      jobs:
        - gnocchi-db-init
      services:
        - endpoint: internal
          service: oslo_db
        # gnocchi-upgrade creates the storage layout as well as the indexer schema, so
        # db-sync needs the object store up, not just the database.
        - endpoint: internal
          service: object_store
    ks_endpoints:
      jobs:
        - gnocchi-ks-service
      services:
        - endpoint: internal
          service: identity
    ks_service:
      services:
        - endpoint: internal
          service: identity
    ks_user:
      services:
        - endpoint: internal
          service: identity
    metricd:
      jobs:
        - gnocchi-db-sync
        - gnocchi-ks-user
        - gnocchi-ks-service
        - gnocchi-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: object_store
        - endpoint: internal
          service: metric
    statsd:
      jobs:
        - gnocchi-db-sync
        - gnocchi-ks-user
        - gnocchi-ks-service
        - gnocchi-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: object_store
        - endpoint: internal
          service: metric
    resources_cleaner:
      jobs:
        - gnocchi-db-sync
        - gnocchi-ks-user
        - gnocchi-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: metric
    storage_init:
      services: null
    tests:
      jobs:
        - gnocchi-db-sync
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: metric
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry

pod:
  user:
    gnocchi:
      uid: 1000
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10
  tolerations:
    gnocchi:
      enabled: false
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  mounts:
    gnocchi_api:
      init_container: null
      gnocchi_api:
    gnocchi_statsd:
      init_container: null
      gnocchi_statsd:
    gnocchi_metricd:
      init_container: null
      gnocchi_metricd:
    gnocchi_resources_cleaner:
      init_container: null
      gnocchi_resources_cleaner:
    gnocchi_tests:
      init_container: null
      gnocchi_tests:
  # -- Probe parameters, merged over the probe bodies the templates define.
  ## Every readiness probe here runs bin/_gnocchi-probe.py.tpl, which makes a real round trip
  ## to each backend the container cannot work without. See the comments in
  ## templates/daemonset-metricd.yaml and templates/daemonset-statsd.yaml for why metricd and
  ## statsd need one at all: both swallow every backend error and keep running, so a live
  ## process says nothing about whether measures are being aggregated or stored.
  ##
  ## timeoutSeconds must stay ABOVE the --deadline the templates pass to the script (25s), so
  ## that an unreachable backend fails the probe with a message the kubelet records on the pod
  ## instead of the kubelet killing the check halfway through it. hack/validate-gnocchi-
  ## readiness.py asserts that ordering.
  ##
  ## 25s/30s is deliberately generous, and the asymmetry is why. A budget that is too small
  ## makes a healthy pod permanently unready, which blocks the install; a budget that is too
  ## large only delays detection of a backend that is already down, and metricd's own
  ## processing delay is 60s anyway. The script's steady-state cost is dominated by starting
  ## an interpreter and importing sqlalchemy and tooz, which was measured at ~10s wall inside
  ## quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble -- but under amd64 EMULATION on
  ## an arm64 host, where a bare `python3 -c pass` in the same container took 5-23s, and where
  ## the first run after container start, with a cold page cache, took 30s. None of those
  ## numbers transfers to a real amd64 node; they only bound the budget from above.
  ##
  ## Only the API has a liveness probe, and it is the shallow /healthcheck: a wedged uwsgi
  ## worker set is repaired by a restart, while a database or ceph pool in another pod is not.
  probes:
    api:
      gnocchi-api:
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 30
            # 60 and not 30, so that a probe which uses its whole 25s budget is not immediately
            # followed by the next one. Slower endpoint removal costs little here: the backends
            # are shared, so a broken one breaks every replica equally and dropping one from
            # the Service achieves nothing. The per-pod failure a restart DOES fix -- wedged
            # uwsgi workers -- is caught by the liveness probe above every 30s, and by the
            # --http part of this one within HTTP_TIMEOUT rather than the full deadline.
            periodSeconds: 60
            timeoutSeconds: 30
    metricd:
      gnocchi-metricd:
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 30
            # metricd's own metric_processing_delay default, so the probe adds roughly one
            # backend round trip per processing pass per node.
            periodSeconds: 60
            timeoutSeconds: 30
    statsd:
      gnocchi-statsd:
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
  replicas:
    api: 1
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
      daemonsets:
        pod_replacement_strategy: RollingUpdate
        metricd:
          enabled: false
          min_ready_seconds: 0
          max_unavailable: 1
        statsd:
          enabled: false
          min_ready_seconds: 0
          max_unavailable: 1
    disruption_budget:
      api:
        min_available: 0
    termination_grace_period:
      api:
        timeout: 30
  resources:
    enabled: false
    api:
      requests:
        memory: "124Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    statsd:
      requests:
        memory: "124Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    metricd:
      requests:
        memory: "124Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    jobs:
      clean:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_init:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_sync:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_endpoints:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_service:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_user:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      resources_cleaner:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      tests:
        requests:
          memory: "124Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      image_repo_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"

conf:
  apache: |
    Listen 0.0.0.0:{{ tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}

    SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
    CustomLog /dev/stdout combined env=!forwarded
    CustomLog /dev/stdout proxy env=forwarded

    <VirtualHost *:{{ tuple "metric" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}>
        WSGIDaemonProcess gnocchi processes=1 threads=2 user=gnocchi group=gnocchi display-name=%{GROUP}
        WSGIProcessGroup gnocchi
        WSGIScriptAlias / "/var/lib/kolla/venv/lib/python2.7/site-packages/gnocchi/rest/app.wsgi"
        WSGIApplicationGroup %{GLOBAL}

        ErrorLog /dev/stderr
        SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
        CustomLog /dev/stdout combined env=!forwarded
        CustomLog /dev/stdout proxy env=forwarded

        <Directory "/var/lib/kolla/venv/lib/python2.7/site-packages/gnocchi/rest">
              Require all granted
        </Directory>
    </VirtualHost>
  ceph:
    monitors: []
    admin_keyring: null
    override:
    append:
  enable_paste: True
  # -- api-paste.ini, mirroring the file gnocchi 4.7 ships in gnocchi/rest/api-paste.ini.
  ## This had to change for the API to start at all, and the probes in
  ## templates/deployment-api.yaml depend on it. gnocchi/rest/app.py load_app() asks paste for
  ## the composite named "gnocchi+" + conf.api.auth_mode, and conf.api.auth_mode is keystone
  ## here, so it looks up `gnocchi+keystone`. The previous values named the composites
  ## `gnocchi+auth` / `gnocchi+noauth`, which no version of gnocchi has ever asked for, and
  ## pointed the two apps at gnocchi.rest.VersionsController and gnocchi.rest.V1Controller,
  ## which moved to gnocchi.rest.api years ago -- gnocchi/rest/__init__.py is now empty.
  ##
  ## Measured in the image this chart installs, not inferred: running
  ## `uwsgi --http 0.0.0.0:8041 --module gnocchi.rest.wsgi --need-app` in
  ## quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble with the previously rendered
  ## api-paste.ini ends in
  ##   LookupError: No section 'gnocchi+keystone' (prefixed by 'app' or ...) found in config
  ##   /etc/gnocchi/api-paste.ini
  ##   unable to load app 0 (mountpoint='') (callable not found or import error)
  ##   *** no app loaded. GAME OVER ***
  ## so gnocchi-api could not have served a single request. It never did: the images it used
  ## before #117 were Docker Registry v1 manifests that no current docker can pull.
  ##
  ## /healthcheck is oslo.middleware's healthcheck app and is part of upstream gnocchi's file.
  ## It sits in the urlmap beside the pecan applications, so it answers without building the
  ## indexer, the storage or the coordinator -- which is what makes it the right liveness
  ## target and the wrong readiness target.
  paste:
    composite:gnocchi+basic:
      use: egg:Paste#urlmap
      /: gnocchiversions_pipeline
      /v1: gnocchiv1+noauth
      /healthcheck: healthcheck
    composite:gnocchi+keystone:
      use: egg:Paste#urlmap
      /: gnocchiversions_pipeline
      /v1: gnocchiv1+keystone
      /healthcheck: healthcheck
    composite:gnocchi+remoteuser:
      use: egg:Paste#urlmap
      /: gnocchiversions_pipeline
      /v1: gnocchiv1+noauth
      /healthcheck: healthcheck
    pipeline:gnocchiv1+noauth:
      pipeline: gnocchiv1
    pipeline:gnocchiv1+keystone:
      pipeline: keystone_authtoken gnocchiv1
    pipeline:gnocchiversions_pipeline:
      pipeline: gnocchiversions
    app:gnocchiversions:
      paste.app_factory: gnocchi.rest.app:app_factory
      root: gnocchi.rest.api.VersionsController
    app:gnocchiv1:
      paste.app_factory: gnocchi.rest.app:app_factory
      root: gnocchi.rest.api.V1Controller
    filter:keystone_authtoken:
      use: egg:keystonemiddleware#auth_token
      oslo_config_project: gnocchi
    app:healthcheck:
      use: egg:oslo.middleware#healthcheck
      oslo_config_project: gnocchi
  policy:
    admin_or_creator: 'role:admin or project_id:%(created_by_project_id)s'
    resource_owner: 'project_id:%(project_id)s'
    metric_owner: 'project_id:%(resource.project_id)s'
    get status: 'role:admin'
    create resource: ''
    get resource: 'rule:admin_or_creator or rule:resource_owner'
    update resource: 'rule:admin_or_creator'
    delete resource: 'rule:admin_or_creator'
    delete resources: 'rule:admin_or_creator'
    list resource: 'rule:admin_or_creator or rule:resource_owner'
    search resource: 'rule:admin_or_creator or rule:resource_owner'
    create resource type: 'role:admin'
    delete resource type: 'role:admin'
    update resource type: 'role:admin'
    list resource type: ''
    get resource type: ''
    get archive policy: ''
    list archive policy: ''
    create archive policy: 'role:admin'
    update archive policy: 'role:admin'
    delete archive policy: 'role:admin'
    create archive policy rule: 'role:admin'
    get archive policy rule: ''
    list archive policy rule: ''
    delete archive policy rule: 'role:admin'
    create metric: ''
    delete metric: 'rule:admin_or_creator'
    get metric: 'rule:admin_or_creator or rule:metric_owner'
    search metric: 'rule:admin_or_creator or rule:metric_owner'
    list metric: ''
    list all metric: 'role:admin'
    get measures: 'rule:admin_or_creator or rule:metric_owner'
    post measures: 'rule:admin_or_creator'
  gnocchi:
    DEFAULT:
      debug: false
    token:
      provider: uuid
    api:
      auth_mode: keystone
      # NOTE(portdirect): the bind port should not be defined, and is manipulated
      # via the endpoints section.
      port: null
    statsd:
      # NOTE(portdirect): the bind port should not be defined, and is manipulated
      # via the endpoints section.
      port: null
      # Pinned (not empty) - empty defaults are filled with uuidv4 at render time,
      # which re-randomises every reconcile and rolls the etc configmap/pods. Fixed here.
      resource_id: 00000000-0000-4000-8000-000000000c01
      user_id: 00000000-0000-4000-8000-000000000c02
      project_id: 00000000-0000-4000-8000-000000000c03
    metricd:
      workers: 1
    database:
      max_retries: -1
      # -- Database connection URI. When empty the URI is auto-generated
      ## from endpoints.oslo_db. Set to null to disable auto-generation,
      ## e.g. when using an operator such as mariadb-operator that supplies
      ## the connection string via a mounted configuration snippet.
      connection: ""
    storage:
      # swift, not ceph. There is no ceph component in this blueprint -- no
      # blueprints/ceph directory, no CompositionDefinition, nothing in the catalogue --
      # so `driver: ceph` pointed the API, 4x metricd and 4x statsd at a backend that
      # cannot exist here, and gnocchi-storage-init looped on `ceph -s` forever (#115).
      # swift IS a component, so gnocchi now depends only on things this blueprint ships.
      #
      # `file` was the other candidate and is worse: metricd and statsd are DaemonSets, so
      # a file store has to be one ReadWriteMany volume shared by the API and every node's
      # metricd and statsd, and RWX is exactly what a stock GKE/kind cluster does not have.
      # swift needs no shared filesystem.
      driver: swift
      # swift_authurl/user/key/project_name/*_domain_name are auto-generated from
      # endpoints.identity by configmap-etc.yaml when left empty, the same way
      # keystone_authtoken is -- gnocchi authenticates to keystone as its own service
      # user and then finds the object-store endpoint in the catalogue.
      swift_auth_version: "3"
      swift_authurl: ""
      swift_user: ""
      swift_key: ""
      swift_project_name: ""
      swift_user_domain_name: ""
      swift_project_domain_name: ""
      # internalURL, not gnocchi's publicURL default. The public object-store endpoint is
      # http://swift/ -- the ingress Service, which only exists when an ingress controller
      # is installed. The internal one is swift-proxy:8080, a plain ClusterIP Service that
      # swift always renders. keystoneclient's ServiceCatalogV3 normalises the trailing
      # "URL" away, verified against a v3 catalogue in the image.
      swift_endpoint_type: internalURL
      swift_service_type: object-store
      swift_container_prefix: gnocchi
      # The ceph options below are inert under any other driver -- gnocchi registers them in
      # the [storage] group whatever the driver is, and the swift driver never reads them.
      # They are kept so that a ceph-backed install stays a values change rather than a
      # re-vendor, and because hack/revendor.py would re-add them from upstream anyway.
      # Every ceph *Kubernetes object* (the gnocchi-storage-init and gnocchi-clean Jobs, the
      # ceph-keyring-placement init containers, the /etc/ceph mounts) is gated on
      # `driver: ceph` in the templates. NOTE: the dependency waits are not gated -- turning
      # ceph back on also means restoring `gnocchi-storage-init` to the
      # dependencies.static.*.jobs lists below, which nothing else will tell you.
      ceph_pool: gnocchi.metrics
      ceph_username: gnocchi
      ceph_keyring: /etc/ceph/ceph.client.gnocchi.keyring
      ceph_conffile: /etc/ceph/ceph.conf
      file_basepath: /var/lib/gnocchi
      provided_keyring: null
    indexer:
      # mysql, against the mariadb this chart already provisions: gnocchi-db-init creates
      # the `gnocchi` database on mariadb and completes, and the previous
      # `driver: postgresql` then ignored it and waited on a postgresql Service that no
      # component in this blueprint serves.
      #
      # The generated URL carries endpoints.oslo_db.scheme, i.e. `mysql+pymysql://`, and
      # that is correct for gnocchi -- unlike skyline (#116), gnocchi needs no per-endpoint
      # scheme split. Verified inside quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble:
      # `gnocchi.indexer` registers mysql, mysql+pymysql, postgresql and postgresql+psycopg2
      # as stevedore entry points, so the driver-qualified scheme resolves the driver;
      # SQLAlchemyIndexer.dress_url leaves an explicit driver alone; and the resulting
      # engine's DBAPI module is pymysql 1.4.6, which is installed, while MySQLdb is not.
      driver: mysql
      # -- Indexer connection URI. When empty the URI is auto-generated
      ## from endpoints.oslo_db (or oslo_db_postgresql). Set to null to
      ## disable auto-generation.
      url: ""
    keystone_authtoken:
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
    oslo_concurrency:
      lock_path: /var/lock

ceph_client:
  configmap: ceph-etc
  user_secret_name: pvc-ceph-client-key

secrets:
  identity:
    admin: gnocchi-keystone-admin
    gnocchi: gnocchi-keystone-user
  oslo_db:
    admin: gnocchi-db-admin
    gnocchi: gnocchi-db-user
  oslo_db_indexer:
    admin: gnocchi-db-indexer-admin
    gnocchi: gnocchi-db-indexer-user
  rbd: gnocchi-rbd-keyring
  tls:
    metric:
      api:
        public: gnocchi-tls-public

bootstrap:
  enabled: false
  ks_user: gnocchi
  script: |
    openstack token issue

# typically overridden by environmental
identity:
  openrc:
    exclude_vars: []
    extra_vars: []

# values, but should include all endpoints
# required by this chart
endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  identity:
    name: keystone
    auth:
      admin:
        username: "admin"
        user_domain_name: "default"
        password: "password"
        project_name: "admin"
        project_domain_name: "default"
        region_name: "RegionOne"
        os_auth_type: "password"
        os_tenant_name: "admin"
      gnocchi:
        username: "gnocchi"
        role: "admin"
        password: "password"
        project_name: "service"
        region_name: "RegionOne"
        os_auth_type: "password"
        os_tenant_name: "service"
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: 'http'
    port:
      api:
        default: 80
        internal: 5000
  metric:
    name: gnocchi
    hosts:
      default: gnocchi-api
      public: gnocchi
    host_fqdn_override:
      default: null
      # NOTE: this chart supports TLS for fqdn over-ridden public
      # endpoints using the following format:
      # public:
      #   host: null
      #   tls:
      #     crt: null
      #     key: null
    path:
      default: null
      # -- oslo.middleware's healthcheck app, mounted by conf.paste outside the pecan
      ## application. It proves a uwsgi worker answered and touches no backend, which is what
      ## the API's liveness probe wants and is exactly why it is not enough for readiness.
      healthcheck: /healthcheck
    scheme:
      default: 'http'
    port:
      api:
        default: 8041
        public: 80
  metric_statsd:
    name: gnocchi-statsd
    hosts:
      default: gnocchi-statsd
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: null
    port:
      statsd:
        default: 8125
  # The object store gnocchi's metric storage lives in. Mirrors endpoints.object_store in
  # blueprints/swift/chart/values.yaml, because the two have to agree: the hosts/port here
  # are what kubernetes-entrypoint waits on (swift-proxy:8080) and what swift's own
  # ks-endpoints job registers in the catalogue. gnocchi reaches the store through the
  # catalogue rather than this entry, so only the wait depends on it.
  object_store:
    name: swift
    hosts:
      default: swift-proxy
      public: swift
    host_fqdn_override:
      default: null
    path:
      default: /v1/AUTH_%(tenant_id)s
    scheme:
      default: http
    port:
      api:
        default: 8080
        public: 80
  # Only the postgresql-indexer path reads this, and that path is off: see
  # conf.gnocchi.indexer.driver. Kept so the path stays renderable.
  oslo_db_postgresql:
    auth:
      admin:
        username: postgres
        password: password
      gnocchi:
        username: gnocchi
        password: password
    hosts:
      default: postgresql
    host_fqdn_override:
      default: null
    path: /gnocchi
    scheme: postgresql
    port:
      postgresql:
        default: 5432
  oslo_db:
    auth:
      admin:
        username: root
        password: password
      gnocchi:
        username: gnocchi
        password: password
    hosts:
      default: mariadb
    host_fqdn_override:
      default: null
    path: /gnocchi
    scheme: mysql+pymysql
    port:
      mysql:
        default: 3306
  oslo_cache:
    auth:
      # NOTE(portdirect): this is used to define the value for keystone
      # authtoken cache encryption key, if not set it will be populated
      # automatically with a random value, but to take advantage of
      # this feature all services should be set to use the same key,
      # and memcache service.
      memcache_secret_key: gnocchiXXmemcacheXXsecretXXkeyXX00000000000000000000000000000000
    hosts:
      default: memcached
    host_fqdn_override:
      default: null
    port:
      memcache:
        default: 11211

manifests:
  configmap_bin: true
  configmap_etc: true
  cron_job_resources_cleaner: true
  daemonset_metricd: true
  daemonset_statsd: true
  deployment_api: true
  ingress_api: false
  job_bootstrap: true
  job_clean: true
  job_db_drop: false
  job_db_init_indexer: true
  job_db_init: true
  job_image_repo_sync: false
  secret_db_indexer: true
  job_db_sync: true
  job_ks_endpoints: true
  job_ks_service: true
  job_ks_user: true
  job_storage_init: true
  pdb_api: true
  pod_gnocchi_test: true
  secret_db: true
  secret_keystone: true
  secret_ingress_tls: false
  service_api: true
  service_ingress_api: false
  service_statsd: true

