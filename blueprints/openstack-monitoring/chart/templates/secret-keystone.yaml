{{- /* The Keystone openrc Secrets (helm-toolkit keystone_user_secret): with endpoints.identity.auth.<user>.passwordFrom
       an ExternalSecret reading the umbrella's root, without it the Secret from values.
         - admin: read by the ks-user Job alone, which creates the openstack-exporter user.
         - openstack_exporter: also carries openstack-exporter's clouds.yaml, rendered by one helper in both modes (the
           ESO template action in the ExternalSecret, the password from values in the Secret), so the projection holds
           exactly what the values-mode Secret holds. The openstack-exporter Deployment mounts that one key; with values
           the ks-user Job reads the openrc keys too (with the root it reads the root directly). Nothing else reads it. */ -}}
{{- if .Values.manifests.secret_keystone }}
---
{{ tuple "admin" .Values.secrets.identity.admin . | include "helm-toolkit.manifests.keystone_user_secret" }}
{{- $password := ternary "{{ .password }}" (toString .Values.endpoints.identity.auth.openstack_exporter.password) (eq (include "osm.passwordFrom" (list . "identity" "openstack_exporter")) "true") }}
---
{{ tuple "openstack_exporter" .Values.secrets.identity.openstack_exporter . (dict "clouds.yaml" (include "osm.cloudsYaml" (list . $password))) | include "helm-toolkit.manifests.keystone_user_secret" }}
{{- end }}
