{{- /* The Keystone admin openrc, read by the ks-user Job alone. The openstack-exporter user's own openrc is rendered
       only when its password comes from values, for that Job; with the umbrella's root the Job reads the root
       directly, and the exporter reads its clouds.yaml (secret-openstack-exporter-clouds.yaml). */ -}}
{{- if .Values.manifests.secret_keystone }}
---
{{ tuple "admin" .Values.secrets.identity.admin . | include "helm-toolkit.manifests.keystone_user_secret" }}
{{- if not (include "osm.passwordFrom" (list . "identity" "openstack_exporter")) }}
---
{{ tuple "openstack_exporter" .Values.secrets.identity.openstack_exporter . | include "helm-toolkit.manifests.keystone_user_secret" }}
{{- end }}
{{- end }}
