{{- /* mysqld-exporter's .my.cnf: MariaDB's exporter user's password, read by the mysqld-exporter Deployment alone. With
       endpoints.oslo_db.auth.exporter.passwordFrom (the umbrella's root oslo-db-exporter, the same root the mariadb
       chart creates the user from) an ExternalSecret; without, the Secret from values. */ -}}
{{- if .Values.manifests.deployment_mysqld_exporter }}
{{- $data := dict "my.cnf" (include "osm.mysqldCnf" (list . "{{ .password }}")) }}
{{- $values := dict "my.cnf" (include "osm.mysqldCnf" (list . (toString .Values.endpoints.oslo_db.auth.exporter.password))) }}
---
{{ list . .Values.secrets.mysqld_exporter_cnf "oslo_db" "exporter" $data $values | include "osm.credentialSecret" }}
{{- end }}
