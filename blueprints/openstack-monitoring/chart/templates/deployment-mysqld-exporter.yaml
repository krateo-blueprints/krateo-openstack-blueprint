{{- /* mysqld-exporter v0.21.0, standalone: it connects to the mariadb Service as the exporter user from its own pod, so
       nothing about the database's pod (its spec, its readiness) depends on it. It waits for the mariadb chart's
       mariadb-exporter-user Job, which creates that user for any host. It reads its .my.cnf and nothing else. */ -}}
{{- if .Values.manifests.deployment_mysqld_exporter }}
{{- $envAll := . }}
{{- $serviceAccountName := "openstack-monitoring-mysqld-exporter" }}
{{ tuple $envAll "mysqld_exporter" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstack-mysqld-exporter
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "openstack-monitoring" "mysqld-exporter" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ tuple $envAll "openstack-monitoring" "mysqld-exporter" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "openstack-monitoring" "mysqld-exporter" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        secret-cnf-hash: {{ tuple "secret-mysqld-exporter.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
{{ dict "envAll" $envAll "application" "mysqld_exporter" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
      nodeSelector:
        {{ .Values.labels.exporter.node_selector_key }}: {{ .Values.labels.exporter.node_selector_value }}
{{- if (index .Values.pod.tolerations "openstack-monitoring").enabled }}
{{ tuple $envAll "openstack-monitoring" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      initContainers:
{{ tuple $envAll "mysqld_exporter" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: mysqld-exporter
{{ tuple $envAll "mysqld_exporter" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.mysqld_exporter | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "mysqld_exporter" "container" "mysqld_exporter" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          args:
            - --config.my-cnf=/etc/mysqld-exporter/my.cnf
            - --web.listen-address=:{{ .Values.mysqld_exporter.port }}
            - --exporter.max_open_connections=1
          ports:
            - name: metrics
              containerPort: {{ .Values.mysqld_exporter.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mysqld_exporter.port }}
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mysqld_exporter.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: cnf
              mountPath: /etc/mysqld-exporter
              readOnly: true
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: cnf
          secret:
            secretName: {{ .Values.secrets.mysqld_exporter_cnf }}
            defaultMode: 0440
{{- end }}
