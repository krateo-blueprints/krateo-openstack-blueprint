{{- /* openstack-exporter's clouds.yaml: the openstack-exporter user's password, read by the openstack-exporter
       Deployment alone. With endpoints.identity.auth.openstack_exporter.passwordFrom (the umbrella's root
       identity-user-openstack-exporter) an ExternalSecret; without, the Secret from values. One helper renders the file
       in both modes. */ -}}
{{- if .Values.manifests.deployment_openstack_exporter }}
{{- $data := dict "clouds.yaml" (include "osm.cloudsYaml" (list . "{{ .password }}")) }}
{{- $values := dict "clouds.yaml" (include "osm.cloudsYaml" (list . (toString .Values.endpoints.identity.auth.openstack_exporter.password))) }}
---
{{ list . .Values.secrets.openstack_exporter_clouds "identity" "openstack_exporter" $data $values | include "osm.credentialSecret" }}
{{- end }}
