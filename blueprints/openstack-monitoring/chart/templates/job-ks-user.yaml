{{- /* Creates the openstack-exporter Keystone user (endpoints.identity.auth.openstack_exporter), with its role, through
       helm-toolkit's job_ks_user: with the umbrella's root it is a post-install,pre-upgrade hook that sets the password
       last (#228). */ -}}
{{- if .Values.manifests.job_ks_user }}
{{- $ksUserJob := dict "envAll" . "serviceName" "openstack-monitoring" "serviceUser" "openstack_exporter" -}}
{{- if (index .Values.pod.tolerations "openstack-monitoring").enabled -}}
{{- $_ := set $ksUserJob "tolerationsEnabled" true -}}
{{- end -}}
{{ $ksUserJob | include "helm-toolkit.manifests.job_ks_user" }}
{{- end }}
