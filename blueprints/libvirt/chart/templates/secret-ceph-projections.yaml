{{/*
Krateo blueprint addition (#308): with a ceph storage.backend, libvirt defines its secret for client.<conf.ceph.cinder.user>
from a projection of the umbrella's copy of the key Ceph minted (libvirt-ceph-cinder-keyring), with ceph.conf from
libvirt-ceph-etc. Renders nothing without krateo.ceph references (helm-toolkit/templates/manifests/_ceph_client.tpl).
*/}}
{{- if eq (include "helm-toolkit.utils.ceph_managed" .) "true" }}
{{- if not .Values.conf.ceph.enabled }}
{{- fail "\n\nkrateo.ceph references are set and conf.ceph.enabled is false: libvirt would never define the secret attached volumes name (#308). The umbrella sets both with a ceph storage.backend.\n" }}
{{- end }}
{{- include "helm-toolkit.utils.ceph_refuse_literals" (tuple . (list "conf.ceph.admin_keyring" "conf.ceph.cinder.keyring" "conf.ceph.cinder.external_ceph.enabled")) }}
{{- end }}
{{- dict "envAll" . "keyring" "libvirt-ceph-cinder-keyring" "etc" "libvirt-ceph-etc" | include "helm-toolkit.manifests.ceph_projections" }}
