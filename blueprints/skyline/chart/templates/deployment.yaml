{{- if .Values.manifests.deployment }}
{{- $envAll := . }}

{{- $mounts_skyline := .Values.pod.mounts.skyline.skyline }}
{{- $mounts_skyline_init := .Values.pod.mounts.skyline.init_container }}

{{- $serviceAccountName := "skyline" }}
{{ tuple $envAll "skyline" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyline
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "skyline" "skyline" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.skyline }}
  selector:
    matchLabels:
{{ tuple $envAll "skyline" "skyline" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "skyline" "skyline" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "skyline" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "skyline" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      nodeSelector:
        {{ .Values.labels.skyline.node_selector_key }}: {{ .Values.labels.skyline.node_selector_value }}
      initContainers:
{{ tuple $envAll "skyline" $mounts_skyline_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        - name: api-init
{{ tuple $envAll "skyline" | include "helm-toolkit.snippets.image" | indent 10 }}
          command:
            - /bin/sh
            - -c
            - /tmp/skyline-apiserver-init.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: skyline-bin
              mountPath: /tmp/skyline-apiserver-init.sh
              subPath: skyline-apiserver-init.sh
              readOnly: true
            - name: skyline-etc
              mountPath: /etc/skyline/skyline.yaml
              subPath: skyline.yaml
              readOnly: true
            - name: skyline-etc
              mountPath: /etc/skyline/gunicorn.py
              subPath: gunicorn.py
              readOnly: true
            - name: nginx-etc
              mountPath: /etc/nginx
{{ if $mounts_skyline_init.volumeMounts }}{{ toYaml $mounts_skyline_init.volumeMounts | indent 12 }}{{ end }}
      containers:
        - name: nginx
          command:
            - /bin/sh
            - -c
            - cp /etc/nginx/.skyline/nginx.conf /etc/nginx/nginx.conf && nginx -g 'daemon off;'
{{ tuple $envAll "skyline_nginx" | include "helm-toolkit.snippets.image" | indent 10 }}
          ports:
            - name: api
              containerPort: {{ tuple "skyline" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
          # nginx is the only listener on the Service port, so every request to Skyline --
          # console and API alike -- arrives here. With no probe at all the kubelet counts the
          # container ready the instant nginx is exec'd, so a pod whose nginx answers 500 to the
          # console and 502 to the API still reports 1/1 Ready, and so do the Deployment, the
          # Composition and the umbrella that this repo's orchestrator gates dependents on. The
          # same shape as issues #99 and #110, one container along.
          #
          # Both of nginx's jobs are checked, because they break independently:
          #
          #   GET / is nginx alone. skyline-nginx-generator serves the console from a `root` it
          #   resolves inside the image -- from skyline_console.static_path, or, when that
          #   import fails, from a list of guessed python3.10 dist-packages directories. A guess
          #   that lands on a directory which is not there answers 500 to every console request
          #   from an nginx that is otherwise perfectly healthy: try_files falls through to
          #   /index.html, which is absent too, and nginx reports that redirection cycle as 500.
          #   Measured in the image, with the proxy answering 200 throughout.
          #
          #   GET /api/v1/openapi.json traverses the proxy. The generated config routes
          #   /api/v1/ to an `upstream skyline` whose single server is the unix socket
          #   /var/lib/skyline/skyline.sock, so one request exercises the listener, the copied
          #   config, the location, the shared skyline-var-lib volume and the upstream's answer.
          #   A tcpSocket would prove only that nginx accepted a connection, which it does just
          #   as readily while returning 502 to everything.
          #
          # This makes nginx's readiness depend on the sibling skyline container, deliberately.
          # Pod readiness is already the conjunction of the two, so a broken API server makes
          # the pod unready through its own probe whether nginx looks at the upstream or not --
          # nothing new becomes unready. What the check adds is the converse, which nothing else
          # catches: a healthy API server behind an nginx whose proxy is wrong. The dependency
          # is one-directional, since the skyline container's probe speaks to the socket and
          # never to nginx, so neither container can wait on the other.
          #
          # Readiness only, as on the skyline container. A livenessProbe would restart nginx
          # every time the API server behind it is briefly down, which repairs nothing nginx
          # owns; a startupProbe would be worse, since it suppresses liveness AND readiness
          # until it passes and so hands back the always-ready container this fixes. What is
          # being fixed is what the cluster REPORTS.
          #
          # python3 rather than curl -- the nginx container runs the skyline image, which has
          # both -- because it names which of the two requests failed in the message the kubelet
          # records. The port comes from the endpoint, which is also what the Service and the
          # containerPort above resolve to; the generator's own default listen address is
          # 0.0.0.0:9999 and it is passed no --listen-address, so a port moved in values breaks
          # the Service too and this probe correctly reports it. Plain http:// and not the
          # endpoint scheme: the generator emits `ssl` on the listen directive only when given
          # --ssl-certfile and --ssl-keyfile, and skyline-apiserver-init.sh gives neither. Each
          # urlopen timeout stays under timeoutSeconds, so a hung request fails the probe with a
          # recorded reason rather than being killed mid-call.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import sys, urllib.request
                  base = "http://localhost:{{ tuple "skyline" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}"
                  for path, what in (
                      ("/", "the console's static root"),
                      ("/api/v1/openapi.json", "the API server through nginx's proxy"),
                  ):
                      try:
                          urllib.request.urlopen(base + path, timeout=4).read()
                      except Exception as e:
                          sys.exit("nginx cannot serve %s (%s): %s" % (path, what, e))
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: nginx-etc
              mountPath: /etc/nginx/.skyline
            - name: skyline-var-lib
              mountPath: /var/lib/skyline
        - name: skyline
{{ tuple $envAll "skyline" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "skyline" "container" "skyline" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /tmp/skyline-apiserver.sh
          # An exec probe, not httpGet, because gunicorn binds a unix socket rather than a
          # port: `bind = "unix:/var/lib/skyline/skyline.sock"` in the image's gunicorn.py.
          # There is no TCP listener on this container to probe.
          #
          # Without any probe the kubelet counts the container ready the instant it starts,
          # so a crash-looping API server still drives readyReplicas to 1 in each window
          # between crashes. That is not cosmetic: a composition's Ready condition is
          # computed from `readyReplicas >= desired && unavailableReplicas == 0`, so the
          # component reports Available while serving nothing, and this repo's orchestrator
          # gates dependents on exactly that condition. Observed on a real install, where
          # the Ready condition flapped in step with the crash loop.
          #
          # /api/v1/openapi.json is served by the app itself and only once it is serving at
          # all: skyline_apiserver's on_startup raises before the worker accepts connections
          # when it cannot reach the database, so a failed startup answers nothing rather
          # than answering unhealthily.
          #
          # Readiness only. A livenessProbe here would add restart pressure to a container
          # that already restarts on its own faults, and the problem being fixed is what the
          # cluster REPORTS, not whether it restarts.
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "5"
                - --unix-socket
                - /var/lib/skyline/skyline.sock
                - http://localhost/api/v1/openapi.json
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: skyline-var-lib
              mountPath: /var/lib/skyline
            - name: skyline-etc
              mountPath: /etc/skyline/skyline.yaml
              subPath: skyline.yaml
              readOnly: true
            - name: skyline-etc
              mountPath: /etc/skyline/gunicorn.py
              subPath: gunicorn.py
              readOnly: true
            - name: skyline-bin
              mountPath: /tmp/skyline-apiserver.sh
              subPath: skyline-apiserver.sh
              readOnly: true
{{ if $mounts_skyline.volumeMounts }}{{ toYaml $mounts_skyline.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: nginx-etc
          emptyDir: {}
        - name: skyline-var-lib
          emptyDir: {}
        - name: skyline-bin
          configMap:
            name: skyline-bin
            defaultMode: 0555
        - name: skyline-etc
          secret:
            secretName: skyline-etc
            defaultMode: 0444
{{ if $mounts_skyline.volumes}}{{ toYaml $mounts_skyline.volumes | indent 8 }}{{ end }}
{{- end }}
