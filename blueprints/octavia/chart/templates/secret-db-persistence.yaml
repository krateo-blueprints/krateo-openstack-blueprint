{{- if .Values.manifests.secret_db_persistence }}
{{- $envAll := . }}
{{- /* Krateo blueprint change (#281's gate, 20b): the admin class is not rendered. No template reads <svc>-persistence-db-admin
     (every db-init authenticates with secrets.oslo_db.admin, the generated MariaDB root since 0.3.56), and rendering it
     wrote the published root password into a Secret nothing used. */}}
{{- /* Krateo (#228): through helm-toolkit's db_connection_secret, so with the octavia user's passwordFrom this is an
     ExternalSecret reading the user's root (the same root as [database]: one MariaDB account). */}}
{{- range $key1, $userClass := tuple "octavia" }}
{{- $secretName := index $envAll.Values.secrets.oslo_db_persistence $userClass }}
---
{{ tuple $userClass $secretName $envAll (dict "endpoint" "oslo_db_persistence" "tls" false "annotations" false) | include "helm-toolkit.manifests.db_connection_secret" }}
{{- end }}
{{- end }}
