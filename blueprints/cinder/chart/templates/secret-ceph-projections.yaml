{{/*
Krateo blueprint addition (#308): with a ceph storage.backend, cinder-volume's keyring (secrets.rbd.volume) and its
ceph.conf (cinder-ceph-etc) are projections of the umbrella's copies of the keys Ceph mints. Renders nothing without
krateo.ceph references (helm-toolkit/templates/manifests/_ceph_client.tpl).
*/}}
{{- dict "envAll" . "keyring" .Values.secrets.rbd.volume "etc" "cinder-ceph-etc" | include "helm-toolkit.manifests.ceph_projections" }}
