{{- if .Values.manifests.job_storage_init }}
{{- $envAll := . }}

{{- $internal_ceph_backend := .Values.ceph_client.internal_ceph_backend }}
{{- /* Krateo (#308): ceph-managed, this Job creates nothing. The pool and client.<rbd_user> are made on Ceph's side
       (a Rook CephBlockPool and CephClient, or the Ceph admin); the Job checks, with that user's own key and no
       client.admin, that the pool exists and the user can use it, so a missing pool or cap fails here, named, rather than
       in cinder-volume. No Role on Secrets: it writes none. */ -}}
{{- $managed := eq (include "helm-toolkit.utils.ceph_managed" $envAll) "true" }}

{{- $serviceAccountName := "cinder-storage-init" }}
{{ tuple $envAll "storage_init" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
{{- if not $managed }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $serviceAccountName }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $serviceAccountName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ $envAll.Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cinder-storage-init
  labels:
{{ tuple $envAll "cinder" "storage-init" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
  annotations:
{{ tuple "storage-init" $envAll | include "helm-toolkit.snippets.job_upgrade_hook" | indent 4 }}
spec:
{{ tuple $envAll nil | include "helm-toolkit.snippets.job_hook_deadline" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "cinder" "storage-init" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "cinder" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      restartPolicy: OnFailure
{{ if $envAll.Values.pod.tolerations.cinder.enabled }}
{{ tuple $envAll "cinder" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      nodeSelector:
        {{ .Values.labels.job.node_selector_key }}: {{ .Values.labels.job.node_selector_value }}
      initContainers:
{{ tuple $envAll "storage_init" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        {{- if and $managed (eq "true" (include "cinder.utils.has_ceph_backend" $envAll)) }}
        - name: ceph-keyring-placement
{{ tuple $envAll "cinder_storage_init" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
          command:
            - /tmp/ceph-keyring.sh
          env:
            - name: RBD_USER
              value: {{ (index .Values.conf.backends $internal_ceph_backend).rbd_user | quote }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: etcceph
              mountPath: /etc/ceph
            - name: cinder-bin
              mountPath: /tmp/ceph-keyring.sh
              subPath: ceph-keyring.sh
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
        {{- else if eq "true" (include "cinder.utils.has_ceph_backend" $envAll) }}
        - name: ceph-keyring-placement
{{ tuple $envAll "cinder_storage_init" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
          command:
            - /tmp/ceph-admin-keyring.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: etcceph
              mountPath: /etc/ceph
            - name: cinder-bin
              mountPath: /tmp/ceph-admin-keyring.sh
              subPath: ceph-admin-keyring.sh
              readOnly: true
            {{- if empty .Values.conf.ceph.admin_keyring }}
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
            {{ end }}
        {{ end }}
      containers:
        {{- range $name, $backend := .Values.conf.backends }}
          {{- if (eq "true" ( dict "backend" $backend | include "cinder.utils.is_ceph_backend" )) }}
            {{- if eq $internal_ceph_backend $name }}
        - name: cinder-storage-init-{{ $name | lower }}
{{ tuple $envAll "cinder_storage_init" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.storage_init | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STORAGE_BACKEND
              value: {{ $backend.volume_driver | quote }}
            - name: RBD_POOL_NAME
              value: {{ $backend.rbd_pool | quote }}
            {{- if $managed }}
            - name: RBD_POOL_USER
              value: {{ $backend.rbd_user | quote }}
            {{- else }}
            - name: RBD_POOL_APP_NAME
              value: {{ (index $envAll.Values.conf.ceph.pools $backend.rbd_pool).app_name | quote }}
            - name: RBD_POOL_USER
              value: {{ $backend.rbd_user | quote }}
            - name: RBD_POOL_CRUSH_RULE
              value: {{ (index $envAll.Values.conf.ceph.pools $backend.rbd_pool).crush_rule | quote }}
            - name: RBD_POOL_REPLICATION
              value: {{ (index $envAll.Values.conf.ceph.pools $backend.rbd_pool).replication | quote }}
            - name: RBD_POOL_CHUNK_SIZE
              value: {{ (index $envAll.Values.conf.ceph.pools $backend.rbd_pool).chunk_size | quote }}
            - name: RBD_POOL_SECRET
              value: {{ $envAll.Values.secrets.rbd.volume | quote }}
            {{- end }}
          command:
            - /tmp/storage-init.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: cinder-bin
              mountPath: /tmp/storage-init.sh
              subPath: storage-init.sh
              readOnly: true
            - name: etcceph
              mountPath: /etc/ceph
            - name: ceph-etc
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            {{- if and (not $managed) (empty $envAll.Values.conf.ceph.admin_keyring) }}
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: key
              readOnly: true
            {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: cinder-bin
          configMap:
            name: cinder-bin
            defaultMode: 0555
        {{- if eq "true" (include "cinder.utils.has_ceph_backend" $envAll) }}
        - name: etcceph
          emptyDir: {}
        {{- if $managed }}
        - name: ceph-etc
          secret:
            secretName: cinder-ceph-etc
            defaultMode: 0444
        - name: ceph-keyring
          secret:
            secretName: {{ .Values.secrets.rbd.volume | quote }}
        {{- else }}
        - name: ceph-etc
          configMap:
            name: {{ .Values.ceph_client.configmap }}
            defaultMode: 0444
        {{- if empty .Values.conf.ceph.admin_keyring }}
        - name: ceph-keyring
          secret:
            secretName: {{ .Values.ceph_client.user_secret_name }}
        {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
