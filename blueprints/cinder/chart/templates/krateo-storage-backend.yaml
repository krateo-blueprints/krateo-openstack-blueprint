{{/*
Krateo blueprint addition (#196, #308): cinder refuses to render without a volume backend.

cinder's only shipped backend is Ceph RBD (rbd1). With no Ceph, cinder-volume and cinder-storage-init mount the
ConfigMap ceph-etc and the keyring Secrets, which nothing creates, so they wait in Init forever and cinder-api and
cinder-scheduler wait behind them. Measured on #179 and on a cold 0.3.42 install (#204). Init is the state a pod census
can only count, so a refusal that names the value to set replaces it: a render error is on the Composition's own status.

The umbrella passes its storage.backend here as krateo.storageBackend, `none` by default. `unmanaged` is this chart's
own default, the chart as OpenStack-Helm ships it for a standalone install whose operator provides those objects; the
umbrella never passes it. hack/validate-storage-backend.py renders every value.
*/}}
{{- $backend := .Values.krateo.storageBackend | default "unmanaged" -}}
{{- if eq $backend "none" -}}
{{- fail "\n\ncinder needs a volume backend, and storage.backend is none (#196).\n\ncinder's only shipped backend is Ceph RBD, and with no backend cinder-volume waits in Init forever on Ceph objects nothing creates (the ConfigMap ceph-etc and the keyring Secrets). On the Openstack Composition, leave cinder out -- profile full-strict selects it only when storage.backend is not none -- or set storage.backend once a backend is available (#308). On a standalone Cinder Composition this value is krateo.storageBackend.\n" -}}
{{- else if has $backend (list "ceph-rook" "ceph-external") -}}
{{- fail (printf "\n\nstorage.backend %s is not implemented in this release (#308).\n\nThe backend is designed (#308: Ceph mints the client keys, which reach cinder as projections and never through client.admin) but this chart cannot render it yet, so cinder cannot be installed with it. Until it ships, leave cinder out: set storage.backend back to none and use profile full-strict.\n" $backend) -}}
{{- else if ne $backend "unmanaged" -}}
{{- fail (printf "\n\nkrateo.storageBackend %q is not a backend this chart knows: unmanaged, none, ceph-rook or ceph-external.\n" $backend) -}}
{{- end -}}
