# Orchestrator configuration.
# ociRepo: where the per-component blueprint charts are published.
ociRepo: oci://ghcr.io/krateo-blueprints/charts
# There is no chartVersion value. The component charts are pulled at this chart's own version
# (.Chart.Version, stamped from the tag). Up to 0.3.37 it was a value whose schema default the
# API server froze into every Composition at create time, so upgrades left every component at
# the version the install was born at (#179). A Composition created by those releases still
# carries `chartVersion` in its spec; it is accepted and ignored.
# installDefinitions: also register the component CompositionDefinitions.
installDefinitions: true
# profile: "identity" (mariadb,memcached,keystone,glance,horizon) or "full" (adds compute).
profile: identity

# enabled: explicit component selection (overrides profile). Each name is expanded to
# its transitive dependency closure, so selecting just `heat` also pulls in keystone,
# rabbitmq, mariadb and memcached. Leave empty (null) to use `profile`.
enabled:

# componentValues: per-component spec passed through to that component's Composition, keyed by
# component name. Each value is exactly that component's own spec (its curated schema),
# so you can configure any component through the umbrella instead of dropping to a
# standalone Composition. Components without an entry get spec: {} (chart defaults).
# Strictly typed against each component's values.schema.json (regenerated by
# hack/gen-componentvalues-schema.py). e.g.
#   componentValues:
#     neutron:
#       network:
#         interface:
#           tunnel: eth1
componentValues:


# Per-install credentials (#228). The umbrella generates each one ONCE with External Secrets
# Operator (templates/credentials.yaml) and hands the components listing it under
# `components[].credentials` a REFERENCE at `path`, never a value. Not part of the Openstack
# schema: an install cannot drop a credential back to OpenStack-Helm's published default.
# NEVER rename or remove an item: its root Secret holds the live password, and a new name
# generates a new one (hack/validate-credentials.py refuses both).
# `pathFor` overrides `path` for the named components, where a chart holds the same credential
# under another key (the rabbitmq server's administrator is endpoints.oslo_messaging.auth.user,
# the user every other component's rabbit-init authenticates as through auth.admin).
credentials:
  store: openstack-credentials
  generator: openstack-credentials
  items:
    - id: identity-admin
      secret: openstack-credential-identity-admin
      key: password
      path: endpoints.identity.auth.admin.passwordFrom
    - id: oslo-db-admin
      secret: openstack-credential-oslo-db-admin
      key: password
      path: endpoints.oslo_db.auth.admin.passwordFrom
    - id: oslo-messaging-admin
      secret: openstack-credential-oslo-messaging-admin
      key: password
      path: endpoints.oslo_messaging.auth.admin.passwordFrom
      pathFor:
        rabbitmq: endpoints.oslo_messaging.auth.user.passwordFrom
    # Retired in 0.3.58: the rabbitmq chart no longer creates a guest user at all. Kept, never removed:
    # installs that ran 0.3.57 hold this root. No component may list a retired item.
    - id: oslo-messaging-guest
      secret: openstack-credential-oslo-messaging-guest
      key: password
      path: endpoints.oslo_messaging.auth.guest.passwordFrom
      retired: true
    - id: oslo-messaging-erlang-cookie
      secret: openstack-credential-oslo-messaging-erlang-cookie
      key: password
      path: endpoints.oslo_messaging.auth.erlang_cookie_from
    - id: oslo-db-sst
      secret: openstack-credential-oslo-db-sst
      key: password
      path: endpoints.oslo_db.auth.sst.passwordFrom
    - id: oslo-db-audit
      secret: openstack-credential-oslo-db-audit
      key: password
      path: endpoints.oslo_db.auth.audit.passwordFrom
    - id: oslo-db-exporter
      secret: openstack-credential-oslo-db-exporter
      key: password
      path: endpoints.oslo_db.auth.exporter.passwordFrom
# The component DAG. `deps` are component names whose Compositions must be Ready
# before this one's Composition is emitted. `tier`: identity or compute. (CRD existence is matched by Kind, so no plural needed.)
components:
  - name: mariadb
    kind: Mariadb
    credentials:
      - oslo-db-admin
      - oslo-db-sst
      - oslo-db-audit
      - oslo-db-exporter
    deps: []
    tier: identity
  - name: memcached
    kind: Memcached
    deps: []
    tier: identity
  - name: keystone
    kind: Keystone
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - mariadb
      - memcached
    tier: identity
  - name: glance
    kind: Glance
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
    tier: identity
  - name: horizon
    kind: Horizon
    credentials:
      - identity-admin
      - oslo-db-admin
    deps:
      - keystone
    tier: identity
  - name: rabbitmq
    kind: Rabbitmq
    credentials:
      - oslo-messaging-admin
      - oslo-messaging-erlang-cookie
    deps: []
    tier: compute
  - name: openvswitch
    kind: Openvswitch
    deps: []
    tier: compute
  - name: placement
    kind: Placement
    credentials:
      - identity-admin
      - oslo-db-admin
    deps:
      - keystone
    tier: compute
  - name: libvirt
    kind: Libvirt
    deps:
      - openvswitch
    tier: compute
  - name: neutron
    kind: Neutron
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - openvswitch
    tier: compute
  - name: nova
    kind: Nova
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - placement
      - rabbitmq
      - glance
      - neutron
      - libvirt
    tier: compute
  - name: ironic
    kind: Ironic
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - mariadb
      - rabbitmq
      - glance
      - neutron
    tier: compute
    ## Not selected by `profile: full`. ironic-conductor binds its PXE and TFTP services to an
    ## interface NAMED ironic-pxe -- `ip addr | awk '/inet / && /ironic-pxe/'` -- which is the
    ## bare-metal provisioning NIC. A cloud node has none and cannot grow one, so the init
    ## container exits 1 with "Could not find IP for pxe to bind to" and the pod sits in Init
    ## forever. Measured on a 4-node GKE install: 14 restarts, and the three init containers
    ## behind it never ran. See hack/provisioning-preconditions.yaml and issue #163.
    requiresProvisioning: true
  - name: cinder
    kind: Cinder
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
    ## Not selected by `profile: full-strict` from 0.3.43. Its only shipped volume backend is
    ## Ceph RBD (rbd1), and neither this repo nor any cluster as it comes provides a Ceph
    ## cluster: cinder-volume and cinder-storage-init mount the ConfigMap ceph-etc and the
    ## keyring Secrets, which nothing creates. Measured on #179 and on a cold 0.3.42 install
    ## (#204): cinder never became Ready on any default install, and since every Job became a
    ## Helm hook, storage-init held cinder's release in pending-install. Issue #196, and
    ## hack/provisioning-preconditions.yaml.
    requiresProvisioning: true
  - name: heat
    kind: Heat
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: barbican
    kind: Barbican
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: powerdns
    kind: Powerdns
    credentials:
      - oslo-db-admin
    deps:
      - mariadb
    tier: compute
  - name: designate
    kind: Designate
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
      - powerdns
    tier: compute
  - name: octavia
    kind: Octavia
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
      - neutron
    tier: compute    ## Not selected by `profile: full`. Each octavia worker and health-manager waits for a
    ## Neutron port named after its own node on the load-balancer management network --
    ## `openstack port show octavia-worker-port-<hostname>` -- and nothing in this blueprint
    ## creates lb-mgmt-net or those per-host ports. Measured on a 4-node GKE install: four pods
    ## at 14 restarts in Init, logging "No Port found for octavia-worker-port-...".
    ## See hack/provisioning-preconditions.yaml and issue #163.
    requiresProvisioning: true

  - name: magnum
    kind: Magnum
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
      # magnum-api and magnum-conductor both wait on the heat-api and barbican-api Services
      # in their own rendered entrypoints -- magnum drives cluster creation through heat and
      # stores certificates in barbican. Found by
      # hack/validate-component-config-closure.py.
      - heat
      - barbican
    tier: compute
  - name: manila
    kind: Manila
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: mistral
    kind: Mistral
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: ceilometer
    kind: Ceilometer
    credentials:
      - identity-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      # ceilometer publishes its samples to gnocchi: its own rendered entrypoints wait on
      # the gnocchi-api Service in all four of its pods, and endpoints.metric.hosts.default
      # is gnocchi-api. The dep was missing, so the orchestrator emitted ceilometer before
      # gnocchi and every ceilometer pod sat in Init waiting for it. Found by
      # hack/validate-component-config-closure.py.
      - gnocchi
    tier: compute
  - name: aodh
    kind: Aodh
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: cloudkitty
    kind: Cloudkitty
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: masakari
    kind: Masakari
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: trove
    kind: Trove
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: watcher
    kind: Watcher
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: tacker
    kind: Tacker
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
      # tacker-server and tacker-conductor both wait on the barbican-api Service in their
      # own rendered entrypoints. Found by
      # hack/validate-component-config-closure.py.
      - barbican
    tier: compute
  - name: cyborg
    kind: Cyborg
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
      # cyborg-agent waits for placement-api, and for nova-compute on its own node, which creates
      # the node's placement resource provider it registers accelerators against (#236).
      - placement
      - nova
    tier: compute
  - name: blazar
    kind: Blazar
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: redis
    kind: Redis
    deps: []
    tier: compute
  - name: zaqar
    kind: Zaqar
    credentials:
      - identity-admin
      - oslo-db-admin
    deps:
      - keystone
      - mariadb
      # redis IS zaqar's message store: the chart ships `[drivers] message_store = redis`
      # with `[drivers:message_store:redis] uri = redis://redis:6379`, and this blueprint had
      # no redis component at all, so that host did not resolve -- the same defect as
      # gnocchi's postgresql indexer in #115. #131 added the component rather than moving the
      # store to a backend that already exists, so this list says so and zaqar-api now waits
      # on the redis Service in its own rendered entrypoint. Found by
      # hack/validate-component-config-closure.py, which carried it as a declared gap until
      # the component existed.
      - redis
    tier: compute
  - name: freezer
    kind: Freezer
    credentials:
      - identity-admin
      - oslo-db-admin
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: skyline
    kind: Skyline
    credentials:
      - identity-admin
      - oslo-db-admin
    deps:
      - keystone
    tier: compute
  - name: gnocchi
    kind: Gnocchi
    credentials:
      - identity-admin
      - oslo-db-admin
    deps:
      - keystone
      - mariadb
      # redis holds gnocchi's metric storage, both the aggregated timeseries
      # (conf.gnocchi.storage.driver) and the incoming measure queue, which follows it.
      # Before #115 gnocchi declared keystone and mariadb while its rendered config named
      # postgresql and ceph, neither of which is a component here, so it waited forever on
      # backends that could not exist. #129 moved the store to swift, which IS a component
      # -- but swift cannot become Ready on a stock cluster: its swift-shared-storage PVC
      # asks ReadWriteMany of a `nfs-provisioner` StorageClass that GKE does not have, four
      # swift-storage pods stay Pending, and because this edge gates on READINESS gnocchi
      # then got no Composition at all and ceilometer sat blocked behind gnocchi. redis
      # needs no volume, so it is a dependency that can actually report Ready.
      # redis's own deps add nothing new -- it has none -- so this list is strictly smaller
      # than with swift: swift also pulled in keystone, which gnocchi already has.
      - redis
    tier: compute
  - name: swift
    kind: Swift
    credentials:
      - identity-admin
    deps:
      - keystone
    tier: compute
    ## Not selected by `profile: full`. swift-shared-storage asks for ReadWriteMany, which GKE
    ## does not provide; upstream satisfies it with an nfs-provisioner default this repo does
    ## not ship. Measured: swift-ring-builder and three swift-storage pods Pending, swift-proxy
    ## in Init, on six nodes and then on two -- unchanged by node count because it is the
    ## StorageClass that is missing. Issue #141, and hack/provisioning-preconditions.yaml.
    requiresProvisioning: true

# dependencyRelaxations: the dependency edges whose creation gate is EXISTENCE instead of
# READINESS. Every other edge waits for the dependency to report Ready=True, which is what
# sequences a dependent behind a dependency that actually works; see the header of
# templates/compositions.yaml.
#
# An edge belongs here only when readiness is UNREACHABLE on it -- when the dependency cannot
# become Ready until something that this umbrella will not create until the dependency is Ready
# becomes ready, so each condition holds the other open. That is a cycle in the runtime wait
# graph, not in this file's DAG, which stays acyclic.
#
# Not a free-form knob, and not guessable: hack/validate-readiness-deadlock.py builds that graph
# from the rendered charts and checks BOTH directions. An entry that is no longer inside a cycle
# fails, so the set cannot accrete; a cycle with no entry fails, so a new chart that introduces
# one cannot pass CI by being overlooked. Deleting an entry is therefore safe to try: CI says
# whether it was still load-bearing.
#
# This is not part of the Openstack spec (it is absent from values.schema.json, like
# `components` above) because it is an invariant of these charts, not a deployment choice.
dependencyRelaxations:
  - component: nova
    dependency: neutron
    issue: 110
    cycle: >-
      neutron's Composition is Ready only when every managed child is, and its dhcp, l3 and
      metadata agents wait for Service nova-api to have endpoints before they will start
      (upstream openstack-helm's own dependencies.static.{dhcp,l3,metadata}.services,
      byte-identical in upstream master). Service nova-api is backed by nova's own
      nova-api-osapi Deployment, which cannot run before nova's Composition is created. Gating
      that creation on neutron being Ready closes the loop: measured on a 4-node GKE install of
      profile=full, neutron sat at "3 of 73 managed children are not ready" and no nova workload
      existed at all. nova still waits for neutron's Composition to EXIST, so creation stays
      ordered, and nova's own nova-compute agents still wait for Service neutron-server at
      startup, so nothing about the compute/network ordering is lost -- only the creation block
      is.

# nodeLabelPreconditions: the node labels the SELECTED components' pods schedule on. The
# orchestrator refuses to render when it can see the cluster's nodes and none of them carries a
# label some selected component needs; templates/compositions.yaml holds the mechanism and the
# three-state argument behind it.
#
# Why this exists as a mechanism rather than a sentence in the README. It WAS a sentence in the
# README -- `kubectl label --overwrite nodes --all openstack-control-plane=enabled`, in both
# install sequences, naming the scheduler message verbatim -- and a fresh GKE install still
# stalled with 5 pods Pending because the scheduler's message names neither the label nor the
# chart that wants it. The operator found it by diffing a working cluster's node labels against
# the broken one's. A precondition that can only be noticed by someone reading prose will
# eventually not be noticed.
#
# DERIVED FROM THE RENDERED PODS, NOT FROM THE CHARTS' VALUES KEYS, and the difference is the
# whole correctness of this list:
#
#   labels.<group>.node_selector_key across the 35 charts' values.yaml   6 distinct labels
#   nodeSelector on a pod spec the charts actually render                4 distinct labels
#
# `sriov=enabled` and `openstack-node=enabled` are in the values and in no rendered pod: they
# belong to manifests disabled by default (neutron's sriov agent, ceilometer's ipmi DaemonSet).
# Requiring them would refuse an install over a label nothing asks for, which is a worse defect
# than the one this replaces -- it would block clusters that are perfectly fine. A chart
# MENTIONING a label and a pod SELECTING on it are different facts, and only the second one can
# strand a workload.
#
# The counts cut the other way too: a values-key scan that stops at labels.<group> misses
# labels.agent.<name>, one level deeper, which is exactly where nova's and libvirt's
# openstack-compute-node selectors live. So the shallow scan both over-counts (two labels no pod
# wants) and under-attributes (the two components that most need one).
#
# This list is not hand-maintained: hack/validate-node-label-preconditions.py renders all 35
# charts, collects every nodeSelector on every Deployment, DaemonSet, StatefulSet, Job, CronJob
# and Pod, and fails if this block is not exactly that set, per component. So a re-vendor that
# enables the sriov agent, or a chart that adds a node-pinned DaemonSet, cannot leave the check
# measuring a stale set.
#
# NOT part of the Openstack spec (absent from values.schema.json, like `components` and
# `dependencyRelaxations` above) because it is a property of these charts, not a deployment
# choice.
nodeLabelPreconditions:
  # 34 of the 36 components. Only libvirt and openvswitch never select on it -- their sole
  # workload is a compute-node or openvswitch DaemonSet -- so the README's claim that every
  # chart schedules with openstack-control-plane, "all 35 of them", was wrong in both
  # directions. The gate derives the true set from the rendered pod specs and fails on any
  # disagreement, which is how powerdns's absence from this list was caught rather than
  # shipped.
  - key: openstack-control-plane
    value: enabled
    components:
      - aodh
      - barbican
      - blazar
      - ceilometer
      - cinder
      - cloudkitty
      - cyborg
      - designate
      - freezer
      - glance
      - gnocchi
      - heat
      - horizon
      - ironic
      - keystone
      - magnum
      - manila
      - mariadb
      - masakari
      - memcached
      - mistral
      - neutron
      - nova
      - octavia
      - placement
      - powerdns
      - rabbitmq
      - redis
      - skyline
      - swift
      - tacker
      - trove
      - watcher
      - zaqar
  # The compute plane proper: nova-compute and libvirt are the hypervisor. A profile=full
  # install whose nodes carry only openstack-control-plane has NO nova-compute and NO libvirt
  # pod at all and cannot boot an instance -- measured on a 4-node GKE install, where both
  # DaemonSets reported desiredNumberScheduled=0.
  - key: openstack-compute-node
    value: enabled
    components:
      - ceilometer
      - cyborg
      - libvirt
      - nova
  # The OVS datapath. neutron's ovs agent and the openvswitch DaemonSet; without them neutron
  # has no data plane whatever its control plane reports.
  - key: openvswitch
    value: enabled
    components:
      - neutron
      - openvswitch
  - key: openstack-network-node
    value: enabled
    components:
      - octavia

# ---------------------------------------------------------------------------
# Service integration descriptor (serviceContract).
# Uniform, machine-readable declaration of how a management platform wires
# this service: identity federation, role mapping, capabilities, SSO
# deep-linking, usage/health emission, tagging and ticketing. Typed in
# values.schema.json; rendered by templates/capability-*.yaml and
# templates/service-descriptor.yaml. URLs below are per-deployment defaults —
# override them in the Composition/platform config for a real installation.
# ---------------------------------------------------------------------------
serviceContract:
  version: v1

  service:
    name: openstack
    displayName: OpenStack
    description: OpenStack IaaS installed and orchestrated on Kubernetes via Krateo blueprints (OpenStack-Helm charts).
    owner: platform-team

  identity:
    keycloak:
      client:
        clientId: keystone
        realmRef: org-realm
        protocol: openid-connect
      groupsMapper:
        claim: groups
        fullPath: false

  # These names must be CMP roles, not names invented here. The previous defaults
  # (openstack-viewer / openstack-operator / openstack-admin) matched neither the six
  # predefined roles nor any capability below, so they resolved to nothing -- a mapping
  # keyed on roles that do not exist maps nothing, however plausible it reads.
  #
  # The deployer's descriptor is merged over this at install time and is the operative
  # mapping; the CMP reads the merged values, never this copy alone. These defaults exist
  # so a standalone `helm install` of the chart is valid and so the shape is self-documenting,
  # not to be authoritative. Keep them in step with capabilities[].aggregateTo below.
  #
  # The contract describes this section as "reconciled by the service adapter into the native
  # system". Nothing in this chart performs that reconciliation yet, so today the mapping is a
  # declaration rather than an enforced binding.
  roleMapping:
    - cmpRole: read-only
      nativeRole: reader
      scope: project
      description: Read-only access to project resources (Keystone default reader role).
    - cmpRole: tenant-reader
      nativeRole: reader
      scope: project
      description: Read-only access within the tenant's projects.
    - cmpRole: auditor
      nativeRole: reader
      scope: project
      description: Read-only access for audit and compliance review.
    - cmpRole: operator
      nativeRole: member
      scope: project
      description: Manage project workloads (Keystone default member role).
    - cmpRole: tenant-admin
      nativeRole: admin
      scope: project
      description: Full administration of the tenant's projects.
    - cmpRole: org-admin
      nativeRole: admin
      scope: project
      description: Full project administration across the organization.

  capabilities:
    - name: view
      title: View OpenStack installations
      description: List and inspect OpenStack compositions and their components.
      enforcement: rbac
      # Every predefined role can look. `resources` is openstacks, not "*": a role
      # titled "View OpenStack installations" that grants read on every composition
      # kind in the cluster is a different permission from the one its title claims.
      aggregateTo:
        - read-only
        - tenant-reader
        - auditor
        - operator
        - tenant-admin
        - org-admin
      rules:
        - apiGroups:
            - composition.krateo.io
          resources:
            - openstacks
          verbs:
            - get
            - list
            - watch
    - name: provision
      title: Provision and reconfigure OpenStack
      enforcement: rbac
      aggregateTo:
        - operator
        - tenant-admin
        - org-admin
      rules:
        - apiGroups:
            - composition.krateo.io
          resources:
            - openstacks
          verbs:
            - create
            - update
            - patch
    - name: decommission
      title: Delete an OpenStack installation
      description: Destructive operation; requires a step-up authenticated session.
      enforcement: acr
      requiresAcr: "urn:krateo:loa:2"
      aggregateTo:
        - operator
        - tenant-admin
        - org-admin
      rules:
        - apiGroups:
            - composition.krateo.io
          resources:
            - openstacks
          verbs:
            - delete
    - name: compute-tier-guard
      title: Provision the compute tier only with approval
      description: The full profile (compute tier) must carry an explicit approval annotation.
      enforcement: abac
      aggregateTo:
        - operator
        - tenant-admin
        - org-admin
      rules:
        - apiGroups:
            - composition.krateo.io
          resources:
            - openstacks
          verbs:
            - create
            - update
      abac:
        match:
          kinds:
            - "Openstack"
        # has() before `in`: an object with no annotations at all has no
        # metadata.annotations key, and `in` on a missing key is an evaluation error. With
        # failurePolicy Fail that still denies, but with "no such key: annotations" instead
        # of the message below, which is what a portal shows the user (measured on kind).
        celExpression: >-
          !has(object.spec.profile) || object.spec.profile != 'full' ||
          (has(object.metadata.annotations) &&
          'openstack.krateo.io/compute-approved' in object.metadata.annotations)
        message: "Provisioning the compute tier (profile=full) requires the openstack.krateo.io/compute-approved annotation."

  sso:
    deepLink:
      urlTemplate: "https://skyline.openstack.example.com/{project}"
      preRedirect:
        type: token-rescope
        endpoint: "https://keystone.openstack.example.com/v3/auth/tokens"
    logout:
      mode: oidc-backchannel
      backchannelLogoutUrl: "https://skyline.openstack.example.com/oidc/backchannel-logout"
      sessionMaxTtl: 8h

  usage:
    interval: 5m
    metrics:
      - name: instances.count
        unit: count
        kind: gauge
        description: Running Nova instances.
        dimensions:
          - flavor
      - name: vcpu.used
        unit: cores
        kind: gauge
      - name: vcpu.capacity
        unit: cores
        kind: capacity
      - name: ram.used
        unit: MiB
        kind: gauge
      - name: ram.capacity
        unit: MiB
        kind: capacity
      - name: storage.used
        unit: GiB
        kind: gauge
        dimensions:
          - volume_type
      - name: storage.capacity
        unit: GiB
        kind: capacity
      - name: floating_ips.count
        unit: count
        kind: gauge

  health:
    interval: 1m
    source:
      type: adapter

  tagging:
    native: true
    remediation: true

  ticketing:
    category: openstack
    subcategory: provisioning

# ---------------------------------------------------------------------------
# Contract emitter: the runtime side of serviceContract.usage/health.
# Two CronJobs (templates/contract-emitter.yaml) poll the OpenStack APIs on
# the declared intervals and write normalized UsageRecord / health rows to
# ClickHouse over its HTTP interface (files/contract-emitter.py, stdlib-only).
# Disabled by default so the chart stays installable without a ClickHouse
# data plane; the management platform enables it and points it at its own.
# ---------------------------------------------------------------------------
contractEmitter:
  enabled: false
  image: python:3.12-alpine
  imagePullPolicy: IfNotPresent
  # org stamped on every emitted record (platform-injected per installation).
  org: default
  openstack:
    # OpenStack-Helm admin openrc secret (OS_AUTH_URL, OS_USERNAME, OS_PASSWORD,
    # OS_PROJECT_NAME, OS_USER_DOMAIN_NAME, OS_PROJECT_DOMAIN_NAME, ...),
    # created by the keystone component (secrets.identity.admin).
    existingSecret: keystone-keystone-admin
    # authUrl overrides the secret's OS_AUTH_URL when set (leave empty to use it).
    authUrl: ""
    # region filters catalog endpoints when set (defaults to the secret's).
    region: ""
    # interface: which catalog endpoints to use and probe (internal|public|admin).
    interface: internal
    tlsVerify: true
  clickhouse:
    # The address the platform actually ships, measured on a real install -- the previous
    # default (clickhouse.krateo-system.svc.cluster.local) resolves to nothing, so usage and
    # health rows went nowhere and said so only in the CronJob's log.
    #
    # This is a HEADLESS Service: it has no cluster IP and its DNS returns the pod A records.
    # urllib resolves through getaddrinfo and connects to one of them, so no cluster IP is
    # needed. With more than one ClickHouse pod, consecutive requests may land on different
    # pods; that is safe here because record_id is deterministic and the target table is a
    # ReplacingMergeTree, so a row written twice replaces rather than duplicates.
    url: http://krateo-clickstack-clickhouse-clickhouse-headless.krateo-system.svc:8123
    # showback owns the usage_records schema and documents `showback` as the canonical
    # database. This emitter already reproduces showback's deterministicID byte-for-byte, so
    # pointing anywhere else was inconsistent with the row ids it writes. `krateo` did not
    # exist on a real install; the platform's ClickHouse ships `default`.
    database: showback
    # Health rows live in their own database, and not by accident. showback owns the usage
    # schema and migrates it; this emitter owns the health table and creates it. Pointing
    # both at showback's database would make bootstrap issue CREATE TABLE inside a database
    # that does not exist until showback has run -- breaking the half this emitter owns in
    # order to fix the half it does not. `default` ships with the platform's ClickHouse.
    healthDatabase: default
    # usage_records is owned by the platform's rating engine DDL (UsageRecord shape).
    usageTable: usage_records
    healthTable: health_records
    # create the health table if missing (idempotent CREATE TABLE IF NOT EXISTS).
    bootstrapHealthTable: true
    # optional secret with keys: username, password.
    existingSecret: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
