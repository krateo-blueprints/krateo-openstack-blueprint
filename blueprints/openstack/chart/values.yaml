    # secret_key, and the chart published SOMELONGSECRETKEY there, so anyone could sign a URL of their own for any
    # queue without a token. Server-side only: zaqar both signs and verifies, nothing else holds it.
    - id: zaqar-signed-url-secret-key
      secret: openstack-credential-zaqar-signed-url-secret-key
      key: password
      path: endpoints.messaging.auth.signed_url_secret_keyFrom
    # manila's service-instance SSH key (0.3.67, #228), replacing [generic] service_instance_password (published:
    # manila). A key pair, not a password: the stock manila-service-image has user manila with password manila
    # built in, so a generated password would lock manila out of its own share servers, while a key reaches a
    # new service VM through the Nova keypair manila creates from the public half (templates/credentials.yaml).
    - id: manila-service-instance-ssh-key
      generator: SSHKey
      secret: openstack-credential-manila-service-instance-ssh-key
      key: privateKey
      publicKey: publicKey
      path: endpoints.sharev2.auth.service_instance_ssh_keyFrom
# The component DAG. `deps` are component names whose Compositions must be Ready
# before this one's Composition is emitted. `tier`: identity or compute. (CRD existence is matched by Kind, so no plural needed.)
components:
  - name: mariadb
    kind: Mariadb
    credentials:
      - oslo-db-admin
      - oslo-db-sst
      - oslo-db-audit
      - oslo-db-exporter
    deps: []
    tier: identity
  - name: memcached
    kind: Memcached
    deps: []
    tier: identity
  - name: keystone
    kind: Keystone
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - identity-user-keystone-test
    deps:
      - mariadb
      - memcached
    tier: identity
  - name: glance
    kind: Glance
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-glance
      - identity-user-glance-test
      - identity-user-glance
    deps:
      - keystone
    tier: identity
  - name: horizon
    kind: Horizon
    credentials:
      - identity-admin
      - oslo-db-admin
      - horizon-secret-key
    deps:
      - keystone
    tier: identity
  - name: rabbitmq
    kind: Rabbitmq
    credentials:
      - oslo-messaging-admin
      - oslo-messaging-erlang-cookie
    deps: []
    tier: compute
  - name: openvswitch
    kind: Openvswitch
    deps: []
    tier: compute
  - name: placement
    kind: Placement
    credentials:
      - identity-admin
      - oslo-db-admin
      - memcache-placement
      - identity-user-placement
    deps:
      - keystone
    tier: compute
  - name: libvirt
    kind: Libvirt
    deps:
      - openvswitch
    tier: compute
  - name: neutron
    kind: Neutron
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-neutron
      - metadata-proxy-shared-secret
      - identity-user-neutron
      - identity-user-neutron-designate
      - identity-user-neutron-ironic
      - identity-user-neutron-nova
      - identity-user-neutron-placement
      - identity-user-neutron-test
    deps:
      - keystone
      - rabbitmq
      - openvswitch
    tier: compute
  - name: nova
    kind: Nova
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-nova
      - metadata-proxy-shared-secret
      - identity-user-nova
      - identity-user-nova-cinder
      - identity-user-nova-ironic
      - identity-user-nova-neutron
      - identity-user-nova-placement
      - identity-user-nova-service-user
      - identity-user-nova-test
    deps:
      - keystone
      - placement
      - rabbitmq
      - glance
      - neutron
      - libvirt
    tier: compute
  - name: ironic
    kind: Ironic
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-ironic
      - identity-user-glance
      - identity-user-ironic
    deps:
      - keystone
      - mariadb
      - rabbitmq
      - glance
      - neutron
    tier: compute
    ## Not selected by `profile: full`. ironic-conductor binds its PXE and TFTP services to an
    ## interface NAMED ironic-pxe -- `ip addr | awk '/inet / && /ironic-pxe/'` -- which is the
    ## bare-metal provisioning NIC. A cloud node has none and cannot grow one, so the init
    ## container exits 1 with "Could not find IP for pxe to bind to" and the pod sits in Init
    ## forever. Measured on a 4-node GKE install: 14 restarts, and the three init containers
    ## behind it never ran. See hack/provisioning-preconditions.yaml and issue #163.
    requiresProvisioning: true
  - name: cinder
    kind: Cinder
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-cinder
      - identity-user-cinder
      - identity-user-cinder-nova
      - identity-user-cinder-service-user
      - identity-user-cinder-test
      - identity-user-cinder-swift
      - identity-user-glance
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
    ## Not selected by `profile: full-strict` from 0.3.43. Its only shipped volume backend is
    ## Ceph RBD (rbd1), and neither this repo nor any cluster as it comes provides a Ceph
    ## cluster: cinder-volume and cinder-storage-init mount the ConfigMap ceph-etc and the
    ## keyring Secrets, which nothing creates. Measured on #179 and on a cold 0.3.42 install
    ## (#204): cinder never became Ready on any default install, and since every Job became a
    ## Helm hook, storage-init held cinder's release in pending-install. Issue #196, and
    ## hack/provisioning-preconditions.yaml.
    requiresProvisioning: true
  - name: heat
    kind: Heat
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-heat
      - identity-user-heat-test
      - identity-user-heat
      - identity-user-heat-domain
      - identity-user-heat-trust
    deps:
