# Orchestrator configuration.
# ociRepo: where the per-component blueprint charts are published.
ociRepo: oci://ghcr.io/krateo-blueprints/charts
# There is no chartVersion value. The component charts are pulled at this chart's own version
# (.Chart.Version, stamped from the tag). Up to 0.3.37 it was a value whose schema default the
# API server froze into every Composition at create time, so upgrades left every component at
# the version the install was born at (#179). A Composition created by those releases still
# carries `chartVersion` in its spec; it is accepted and ignored.
# installDefinitions: also register the component CompositionDefinitions.
installDefinitions: true
# profile: "identity" (mariadb,memcached,keystone,glance,horizon), "full" (adds compute, every component) or
# "full-strict" (full minus each component whose components[].requires the install does not provide).
profile: identity

# enabled: explicit component selection (overrides profile). Each name is expanded to
# its transitive dependency closure, so selecting just `heat` also pulls in keystone,
# rabbitmq, mariadb and memcached. Leave empty (null) to use `profile`.
enabled:

# storage (#196, #308): the backend that provides block storage, the `block-storage` capability a component lists
# under components[].requires (cinder). `none`, the default, provides nothing: profile full-strict then leaves cinder
# out, and a cinder selected anyway (profile full, or `enabled:`) refuses to render, naming this value, instead of
# waiting in Init forever on Ceph objects nothing creates. Passed to each component that requires block-storage as its
# krateo.storageBackend; a componentValues.<component>.krateo.storageBackend is refused, so this is the one place that
# says which backend the install has.
#   none           no backend (the default).
#   ceph-rook      Ceph run by Rook, whose CephClients mint the client keys (#308); storage.ceph says where.
#   ceph-external  an existing Ceph whose admin creates the users and places their keys (#308); storage.ceph.keys
#                  names each Secret.
# Typed by values.schema.json, which hack/gen-componentvalues-schema.py generates.
storage:
  backend: none
  # ceph (#308): how the install consumes a Ceph cluster when storage.backend is ceph-rook or ceph-external. One consumer
  # path for both: each client key and the monitor addresses are COPIED by External Secrets Operator from where Ceph
  # keeps them into this namespace's roots (credentials.items with `source: provided`), and the charts project the roots.
  # No client.admin key is read or rendered anywhere. Nothing here names a cloud provider.
  ceph:
    # sourceNamespace: where the Secrets holding the client keys and mon_host live. Empty: this release's namespace.
    # For ceph-rook, the namespace of Rook's CephCluster. Read through the SecretStore <credentials.store>-ceph, whose
    # Role is rendered here only when that is this namespace; another namespace's owner grants it.
    sourceNamespace: ""
    # clients: the Ceph user each consumer authenticates as (client.<name>). For ceph-rook, the CephClient name. The
    # caps are set where the user is created (a Rook CephClient, or the Ceph admin), never here.
    clients:
      cinder: cinder
      glance: glance
    # rook: where Rook keeps them (ceph-rook). A CephClient's key is in Secret rook-ceph-client-<name>, under userKey,
    # and the monitors in Secret rook-ceph-config, under mon_host (Rook's pkg/operator/ceph/client/controller.go and
    # config/store.go, read 2026-11-17).
    rook:
      clientSecretPrefix: rook-ceph-client-
      clientKey: userKey
      monHostSecret: rook-ceph-config
      monHostKey: mon_host
    # keys: the operator-named Secrets (ceph-external). Every secret must be set with ceph-external, or the umbrella
    # refuses, naming the empty one.
    keys:
      cinder:
        secret: ""
        key: key
      glance:
        secret: ""
        key: key
      monHost:
        secret: ""
        key: mon_host
    # pools: the RBD pools, created where the users are (a Rook CephBlockPool, or the Ceph admin).
    pools:
      volumes: cinder.volumes
      images: glance.images
    # libvirtSecretUUID: the libvirt secret every hypervisor defines for client.<clients.cinder>, named by cinder's
    # connection info for each attached volume. One value, passed to cinder, libvirt and nova.
    libvirtSecretUUID: 457eb676-33da-42ec-9a8c-9293d545c337
    # glanceStore: pvc keeps images on glance's volume; rbd stores them in the images pool (#308 P1: opt-in).
    glanceStore: pvc
    # glanceImagesMigrated: with glanceStore rbd on an install whose images are on the glance-images claim, glance
    # refuses to render until this is true: copy each image to the rbd store first (README), or confirm there is none
    # to keep. Ignored with glanceStore pvc.
    glanceImagesMigrated: false

# tolerations: one list of Kubernetes tolerations applied to EVERY pod the blueprint renders, in every component
# (Deployments, StatefulSets, DaemonSets, Jobs and CronJobs, helm-toolkit's Jobs included). Passed to each component
# as OpenStack-Helm's pod.tolerations.<component> {enabled: true, tolerations: <this list>}, merged UNDER that
# component's componentValues, so an explicit componentValues entry wins. Empty (the default) changes nothing.
# Needed on tainted nodes: a trusted-tenant vcluster copies the pool taint (krateo.io/trusted-tenant=<ns>:NoSchedule)
# onto its nodes, and without a matching toleration every DaemonSet desires 0 pods. e.g.
#   tolerations:
#     - key: krateo.io/trusted-tenant
#       operator: Equal
#       value: my-namespace
#       effect: NoSchedule
tolerations:

# rerunHooks (#297): a token per component name, e.g.
#   rerunHooks:
#     cyborg: "2026-11-18T10:00:00Z"
# Setting or changing rerunHooks.<component> passes the token to that component alone, as its krateo.rerunHooksToken
# (declared in every component's schema, rendered nowhere). Its values change, so core-provider runs a real helm
# upgrade, and every hook runs again: each install hook is also an upgrade hook (hack/validate-rerun-hooks.py). The way
# to recover a component reading Ready=False/HooksMayNotHaveRun (README). Use the current time; an unknown name is
# rejected. Merged UNDER componentValues: an explicit componentValues.<component>.krateo.rerunHooksToken wins.
rerunHooks:

# rotate (#309 C): rotate a RabbitMQ service user, with messaging.backend operator. Set
# rotate.oslo-messaging-<service> to a new token (the current time): the umbrella mints a new root, adds a second
# RabbitMQ user from it, switches the service to that user once it is Ready, and deletes the old user once every reader
# has rolled. Keep the token set to its last value afterwards: removing it is refused, and a token already used is
# refused. Only these ids rotate (the schema rejects others); README "Rotating a RabbitMQ service user".
rotate:

# credentialDrift (#309 C): every generated root's data is latched (sha256) in ConfigMap openstack-credential-generations.
# One that changes was edited or regenerated by hand (External Secrets Operator regenerates a generated root the moment
# its Secret is edited) and is reported on status.credentialDrift, with ConfigMap openstack-credential-drift-<Secret>
# showing the current sha256. No live credential follows it (projections refresh OnChange). acknowledge.<Secret>: that
# sha256 re-baselines it, only if it is still the root's current data. README "Editing or deleting a root Secret".
credentialDrift:

# publicEndpoints (#311): the OpenStack APIs, Horizon and the noVNC console reachable from outside the cluster over HTTPS,
# through ONE Gateway API Gateway this release renders (templates/public-endpoints.yaml). Off by default; off renders
# exactly what it rendered before this block existed (hack/validate-public-endpoints.py, part 1).
#
# When enabled, for every selected component that serves a public endpoint (the table publicEndpointRoutes below):
#   - an HTTPRoute <host>.<baseDomain> -> that component's ClusterIP Service, on the Gateway's HTTPS listener, with
#     Strict-Transport-Security added to every response and X-Forwarded-Proto: https set on every request (overwriting
#     whatever the client sent, so the services' proxy-header parsing cannot be lied to);
#   - the component's public catalog endpoint becomes https://<host>.<baseDomain>/... (endpoints.<type>.host_fqdn_override,
#     scheme and port; the ks-endpoints hook re-registers it on the next upgrade), and its oslo.middleware
#     enable_proxy_headers_parsing is set, so version-discovery links say https;
#   - the charts' own Ingress objects (inert: no controller serves their class) are switched off;
#   - Horizon's Service becomes ClusterIP (no NodePort 31000) and its cookies Secure, behind the Gateway.
# Plus: one HTTP listener that only redirects to HTTPS, one cert-manager Certificate for every route hostname, issued
# by issuerRef, and the NetworkPolicy set below.
#
# Never routed, whatever is selected: nova-metadata, RabbitMQ (and its management UI), MariaDB, memcached.
#
# PREREQUISITES, checked: a Gateway API implementation (Gateway API CRDs + a controller for gatewayClassName) and
# cert-manager. Krateo's installer brings all of them with features.ingress (agentgateway + cert-manager); any other
# implementation works by its GatewayClass name. On a live cluster the render is REFUSED, with the reason on the
# Composition's status, while the Gateway API or cert-manager CRDs are absent.
#
# Clients reach the APIs at https://keystone.<baseDomain>/v3 with the CA of issuerRef (OS_CACERT for a private CA).
# Create DNS records for the hostnames (or a wildcard *.<baseDomain>) pointing at the Gateway's address; with Krateo's
# features.externalDns they follow the HTTPRoutes automatically.
#
# e.g.
#   publicEndpoints:
#     enabled: true
#     baseDomain: cloud.example.com
#     tls:
#       issuerRef:
#         name: krateo-selfsigned-ca
#     networkPolicy:
#       nodeCIDRs:
#         - 192.168.10.0/24
publicEndpoints:
  enabled: false
  # Every public hostname is <service>.<baseDomain>, e.g. keystone.cloud.example.com. Required when enabled.
  baseDomain: ""
  # The GatewayClass of the Gateway API implementation that serves the Gateway. agentgateway is what Krateo's
  # features.ingress installs.
  gatewayClassName: agentgateway
  gateway:
    name: openstack-gateway
    # A reserved address for the Gateway (e.g. a static IP), so a rebuild does not move every DNS record.
    # Empty: the implementation assigns one.
    addresses:
  tls:
    # The cert-manager issuer that signs the Gateway's certificate. Required when enabled. A private CA (e.g. Krateo's
    # krateo-selfsigned-ca ClusterIssuer) needs clients to trust that CA; an ACME issuer must be able to validate every
    # hostname (DNS-01; an HTTP-01 solver attached to a different Gateway cannot).
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: ""
  hsts:
    # Strict-Transport-Security max-age, in seconds, on every HTTPS response. No includeSubDomains and no preload: the
    # base domain may be shared, and preload is a decision for the domain's owner.
    maxAge: 31536000
  networkPolicy:
    # Ingress NetworkPolicy for the install namespace: deny by default, then allow (1) every pod of this namespace,
    # (2) the cluster's nodes, (3) the Gateway's proxy pods to the routed backends, (4) the internet to the Gateway's
    # proxy pods, and (5) the namespaces listed in allowNamespaces. Nothing else crosses into the namespace.
    # Only enforced on a cluster whose network plugin enforces NetworkPolicy; the live check must prove it does.
    # The policies select every pod WITHOUT the label krateo.io/networkpolicy-exempt; a pod given that label is
    # selected by none of them, so it is left unrestricted (an explicit opt-out).
    enabled: true
    # REQUIRED when enabled: the CIDRs the nodes' own addresses come from. neutron's agents, nova-compute, libvirt and
    # openvswitch run on the host network, so their traffic to RabbitMQ, placement and the APIs arrives from node
    # addresses, which no pod selector matches; without this the compute plane loses its message bus.
    nodeCIDRs:
    # Namespaces whose pods may reach this namespace's pods, e.g. the one running the OpenStack KOG operators (they
    # call the internal endpoints). Empty: none.
    allowNamespaces:
  # Where the Gateway implementation runs the Gateway's proxy pods. Empty: the install namespace (agentgateway; verify
  # for yours). The proxy pods are selected by gateway.networking.k8s.io/gateway-name=<gateway.name>, the label the
  # Gateway API asks in-cluster implementations to set.
  proxyNamespace: ""

# compute.virtType (#303): qemu (software emulation; works on any node, slowly) or kvm (hardware virtualization).
# kvm sets nova [libvirt] virt_type=kvm and cpu_mode=host-model, and libvirt's virt_type, and libvirt then refuses to
# start on a node without /dev/kvm (on GKE: a node pool created with --enable-nested-virtualization; README "Running
# guests on KVM"). qemu changes nothing: every chart renders as it always has. Merged UNDER componentValues.
compute:
  virtType: qemu

# network.underlayMTU (#433): the MTU of the node NICs that carry neutron's VXLAN tunnels (the underlay). neutron gets it
# as global_physnet_mtu and ML2 path_mtu, so a VXLAN network advertises underlayMTU - 50 to its guests (1450 at the
# default). When the nodes' MTU is below 1500, set it to that MTU, or full-size guest frames are dropped: on a 1460
# underlay (the GKE nodes dp303 ran on) neutron used to advertise 1450 while only 1410 fit (dp303 run 4). The OVS agent's
# init refuses to start on a node whose tunnel NIC's MTU is below this value, naming what to set. Always passed to
# neutron, 1500 included; an explicit componentValues.neutron conf entry wins. README "neutron's underlay MTU".
network:
  underlayMTU: 1500

# kogCredentials (#303): opt-in credentials for Krateo KOG operators, from the install's own generated admin root
# (nothing copied by hand, #228). enabled renders, through keystone and in the release's namespace (the KOGs are
# installed there; cross-namespace is not supported yet): openstack-kog-clouds (a clouds.yaml for the auth proxies of
# keystone-, neutron- and glance-kog), openstack-kog-token (an admin token for nova-kog, minted when keystone installs
# or upgrades and re-minted every 6 h) and openstack-kog-endpoints (nova's and keystone's internal URLs and the region;
# no secret; nova's own hook writes nova_url once nova registered its endpoint). A failed mint fails that chart's
# release. README "Driving this OpenStack with Krateo KOG operators".
kogCredentials:
  enabled: false

# ha (#309): opt-in high availability for the stateful core, phase by phase. Off (the default) changes nothing: every
# chart renders as it always has. On:
#   - memcached runs 3 replicas behind a headless discovery Service, as the StatefulSet memcached-ha, and every
#     component in haTopology.cache lists each replica in its memcache server list, so every client hashes a key to
#     the same replica (one ClusterIP with ClientIP affinity pinned each client to one cache, so caches disagreed);
#   - the render is refused while fewer than 3 nodes carry openstack-control-plane=enabled, when the orchestrator can
#     read the nodes (README "High availability"): 3 replicas with required anti-affinity need 3 nodes.
# RabbitMQ and MariaDB move to their operators in later phases (#309). The RabbitMQ host count does not depend on this
# switch: see haTopology.messaging. Merged UNDER componentValues, except where a refusal says otherwise.
ha:
  enabled: false

# messaging.backend (#309 H2b): chart (this repo's rabbitmq chart, a StatefulSet; the default) or operator (a
# RabbitmqCluster named haTopology.messagingOperator.name, run by the RabbitMQ cluster-operator from
# krateo-blueprints/rabbitmq-operator-blueprint). operator is for fresh installs: the rabbitmq chart refuses it while
# its chart-mode StatefulSet exists (the migration is H2c), and refuses it on a cluster that does not serve
# rabbitmqclusters.rabbitmq.com. With operator, every component that lists RabbitMQ hosts lists the cluster's pods
# (<name>-server-N.<name>-nodes), and every component that builds a transport URL gets quorum queues
# (haTopology.messagingQuorumConf): RabbitMQ 4.x refuses the transient non-exclusive queues oslo.messaging otherwise
# declares, and the policies its rabbit-init imports lose their ha-* keys, which 4.x refuses. Merged UNDER
# componentValues, except where a refusal says otherwise.
messaging:
  backend: chart

# monitoring (issue #312): the openstack-monitoring component, metrics and alerts for the Krateo observability stack
# (README "Monitoring"). An OpenTelemetry collector scrapes openstack-exporter, a standalone mysqld-exporter and RabbitMQ's
# /metrics/detailed, and forwards OTLP to `otlpEndpoint`; the alerts are alert-provider Alert CRs in the release
# namespace.
#   enabled: explicit opt-in (Diego, 2026-11-18). true turns it on; unset (null, the default) and false are off. With
#            true on a cluster that does not serve alert-provider's Alert and Metric CRDs the render is refused, naming
#            alert-provider (templates/monitoring-precondition.yaml).
# Off, the render is byte-identical to a release without this value: no component, no CompositionDefinition, no
# credential root, and mariadb's spec unchanged. On, it adds the openstack-monitoring component (after keystone and
# mariadb), its credential root identity-user-openstack-exporter, and krateo.exporterUser on mariadb, which creates the
# exporter's MariaDB user without restarting the database. Listing openstack-monitoring in `enabled:` is refused: this
# value is the one switch. hack/validate-openstack-monitoring.py asserts all of it.
monitoring:
  enabled:
  # OTLP/HTTP endpoint the collector exports to. The default is the Krateo node agent's node-local Service (the
  # installer's own default for core-provider), which drops traffic from a node with no agent on it.
  otlpEndpoint: http://otel-collector-daemonset-local.krateo-system.svc:4318

# componentValues: per-component spec passed through to that component's Composition, keyed by
# component name. Each value is exactly that component's own spec (its curated schema),
# so you can configure any component through the umbrella instead of dropping to a
# standalone Composition. Components without an entry get spec: {} (chart defaults).
# Strictly typed against each component's values.schema.json (regenerated by
# hack/gen-componentvalues-schema.py). e.g.
#   componentValues:
#     neutron:
#       network:
#         interface:
#           tunnel: eth1
componentValues:


# Per-install credentials (#228). The umbrella generates each one ONCE with External Secrets
# Operator (templates/credentials.yaml) and hands the components listing it under
# `components[].credentials` a REFERENCE at `path`, never a value. Not part of the Openstack
# schema: an install cannot drop a credential back to OpenStack-Helm's published default.
# NEVER rename or remove an item: its root Secret holds the live password, and a new name
# generates a new one (hack/validate-credentials.py refuses both).
# `pathFor` overrides `path` for the named components, where a chart holds the same credential
# under another key (the rabbitmq server's administrator is endpoints.oslo_messaging.auth.user,
# the user every other component's rabbit-init authenticates as through auth.admin).
credentials:
  store: openstack-credentials
  generator: openstack-credentials
  items:
    - id: identity-admin
      secret: openstack-credential-identity-admin
      key: password
      path: endpoints.identity.auth.admin.passwordFrom
    - id: oslo-db-admin
      secret: openstack-credential-oslo-db-admin
      key: password
      path: endpoints.oslo_db.auth.admin.passwordFrom
    - id: oslo-messaging-admin
      secret: openstack-credential-oslo-messaging-admin
      key: password
      path: endpoints.oslo_messaging.auth.admin.passwordFrom
      pathFor:
        rabbitmq: endpoints.oslo_messaging.auth.user.passwordFrom
    # Retired in 0.3.58: the rabbitmq chart no longer creates a guest user at all. Kept, never removed:
    # installs that ran 0.3.57 hold this root. No component may list a retired item.
    - id: oslo-messaging-guest
      secret: openstack-credential-oslo-messaging-guest
      key: password
      path: endpoints.oslo_messaging.auth.guest.passwordFrom
      retired: true
    - id: oslo-messaging-erlang-cookie
      secret: openstack-credential-oslo-messaging-erlang-cookie
      key: password
      path: endpoints.oslo_messaging.auth.erlang_cookie_from
    - id: oslo-db-sst
      secret: openstack-credential-oslo-db-sst
      key: password
      path: endpoints.oslo_db.auth.sst.passwordFrom
    - id: oslo-db-audit
      secret: openstack-credential-oslo-db-audit
      key: password
      path: endpoints.oslo_db.auth.audit.passwordFrom
    - id: oslo-db-exporter
      secret: openstack-credential-oslo-db-exporter
      key: password
      path: endpoints.oslo_db.auth.exporter.passwordFrom
    # keystonemiddleware's memcache secret key, one per service (#228): with memcache_security_strategy
    # ENCRYPT it protects the token-validation cache in memcached, which any pod can reach.
    - id: memcache-aodh
      secret: openstack-credential-memcache-aodh
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-barbican
      secret: openstack-credential-memcache-barbican
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-blazar
      secret: openstack-credential-memcache-blazar
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-cinder
      secret: openstack-credential-memcache-cinder
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-cloudkitty
      secret: openstack-credential-memcache-cloudkitty
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-cyborg
      secret: openstack-credential-memcache-cyborg
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-designate
      secret: openstack-credential-memcache-designate
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-glance
      secret: openstack-credential-memcache-glance
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-gnocchi
      secret: openstack-credential-memcache-gnocchi
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-heat
      secret: openstack-credential-memcache-heat
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-ironic
      secret: openstack-credential-memcache-ironic
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-magnum
      secret: openstack-credential-memcache-magnum
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-manila
      secret: openstack-credential-memcache-manila
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-masakari
      secret: openstack-credential-memcache-masakari
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-mistral
      secret: openstack-credential-memcache-mistral
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-neutron
      secret: openstack-credential-memcache-neutron
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-nova
      secret: openstack-credential-memcache-nova
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-octavia
      secret: openstack-credential-memcache-octavia
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-placement
      secret: openstack-credential-memcache-placement
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-swift
      secret: openstack-credential-memcache-swift
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-tacker
      secret: openstack-credential-memcache-tacker
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-trove
      secret: openstack-credential-memcache-trove
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-watcher
      secret: openstack-credential-memcache-watcher
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    - id: memcache-zaqar
      secret: openstack-credential-memcache-zaqar
      key: password
      path: endpoints.oslo_cache.auth.memcache_secret_keyFrom
    # The metadata proxy shared secret: neutron's metadata agents sign each instance request with it and
    # nova-api-metadata trusts what verifies, so one value shared by both charts (#228).
    - id: metadata-proxy-shared-secret
      secret: openstack-credential-metadata-proxy-shared-secret
      key: password
      path: endpoints.compute_metadata.auth.metadata_proxy_shared_secretFrom
    # Horizon's Django SECRET_KEY: it signs session cookies and CSRF tokens (#228).
    - id: horizon-secret-key
      secret: openstack-credential-horizon-secret-key
      key: password
      path: endpoints.dashboard.auth.secret_keyFrom
    # Service Keystone users (#228 tier 2): one item per Keystone USERNAME (each consumer has its own user,
    # created by its chart's ks-user Job; the few shared usernames list every chart that reads them).
    - id: identity-user-blazar
      secret: openstack-credential-identity-user-blazar
      key: password
      path: endpoints.identity.auth.blazar.passwordFrom
    - id: identity-user-blazar-test
      secret: openstack-credential-identity-user-blazar-test
      key: password
      path: endpoints.identity.auth.test.passwordFrom
    - id: identity-user-blazar-service-user
      secret: openstack-credential-identity-user-blazar-service-user
      key: password
      path: endpoints.identity.auth.service.passwordFrom
    - id: identity-user-ceilometer-test
      secret: openstack-credential-identity-user-ceilometer-test
      key: password
      path: endpoints.identity.auth.test.passwordFrom
    - id: identity-user-cinder
      secret: openstack-credential-identity-user-cinder
      key: password
      path: endpoints.identity.auth.cinder.passwordFrom
    - id: identity-user-cinder-test
      secret: openstack-credential-identity-user-cinder-test
      key: password
      path: endpoints.identity.auth.test.passwordFrom
    - id: identity-user-cinder-nova
      secret: openstack-credential-identity-user-cinder-nova
      key: password
      path: endpoints.identity.auth.nova.passwordFrom
    - id: identity-user-cinder-service-user
      secret: openstack-credential-identity-user-cinder-service-user
      key: password
      path: endpoints.identity.auth.service.passwordFrom
