    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-cloudkitty
      - identity-user-test
      - identity-user-cloudkitty
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: masakari
    kind: Masakari
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-masakari
      - identity-user-neutron-test
      - identity-user-masakari
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: trove
    kind: Trove
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-trove
      - identity-user-trove
