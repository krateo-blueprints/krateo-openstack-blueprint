    deps:
      - keystone
      - rabbitmq
      - mariadb
      # magnum-api and magnum-conductor both wait on the heat-api and barbican-api Services
      # in their own rendered entrypoints -- magnum drives cluster creation through heat and
      # stores certificates in barbican. Found by
      # hack/validate-component-config-closure.py.
      - heat
      - barbican
    tier: compute
  - name: manila
    kind: Manila
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-manila
      - identity-user-manila
      - manila-service-instance-ssh-key
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: mistral
    kind: Mistral
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-mistral
      - identity-user-mistral-test
      - identity-user-mistral
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: ceilometer
    kind: Ceilometer
    credentials:
      - identity-admin
      - oslo-messaging-admin
      - identity-user-ceilometer-test
      - identity-user-ceilometer
    deps:
      - keystone
      - rabbitmq
      # ceilometer publishes its samples to gnocchi: its own rendered entrypoints wait on
      # the gnocchi-api Service in all four of its pods, and endpoints.metric.hosts.default
      # is gnocchi-api. The dep was missing, so the orchestrator emitted ceilometer before
      # gnocchi and every ceilometer pod sat in Init waiting for it. Found by
      # hack/validate-component-config-closure.py.
      - gnocchi
    tier: compute
  - name: aodh
    kind: Aodh
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-aodh
      - identity-user-aodh
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: cloudkitty
