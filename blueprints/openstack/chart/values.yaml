      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-barbican
      - identity-user-barbican
    deps:
      - keystone
      - rabbitmq
      - mariadb
    tier: compute
  - name: powerdns
    kind: Powerdns
    credentials:
      - oslo-db-admin
    deps:
      - mariadb
    tier: compute
  - name: designate
    kind: Designate
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-designate
      - identity-user-designate-test
      - identity-user-designate
    deps:
      - keystone
      - rabbitmq
      - mariadb
      - powerdns
    tier: compute
  - name: octavia
    kind: Octavia
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-octavia
      - identity-user-test
      - identity-user-octavia
    deps:
      - keystone
      - rabbitmq
      - mariadb
      - neutron
    tier: compute    ## Not selected by `profile: full`. Each octavia worker and health-manager waits for a
    ## Neutron port named after its own node on the load-balancer management network --
    ## `openstack port show octavia-worker-port-<hostname>` -- and nothing in this blueprint
    ## creates lb-mgmt-net or those per-host ports. Measured on a 4-node GKE install: four pods
    ## at 14 restarts in Init, logging "No Port found for octavia-worker-port-...".
    ## See hack/provisioning-preconditions.yaml and issue #163.
