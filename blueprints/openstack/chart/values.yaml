# haTopology (#309): who reads the stateful services' host lists, so one value reaches every reader, and what ha needs
# of the cluster. Not part of the Openstack schema: properties of these charts, measured from them by
# hack/validate-ha-propagation.py, which fails when a list misses a chart that builds the URL or names one that does not.
#   minNodes, nodeLabel: with ha.enabled the render is refused while fewer than minNodes nodes carry nodeLabel (when the
#     orchestrator can read nodes; templates/node-preconditions-state.yaml records whether it could).
#   messaging: the components whose charts hold endpoints.oslo_messaging.statefulset, from which their transport URLs
#     list one RabbitMQ host per server replica (helm-toolkit authenticated_transport_endpoint_uri_lookup),
#     and the replica count has ONE source: componentValues.rabbitmq.pod.replicas.server (the server's own value,
#     default 1). Above 1 the umbrella passes {name: messagingStatefulset, replicas: N} to each of these; at 1 it passes
#     nothing, because every chart's own default already lists the one host. A component whose componentValues set a
#     different count is refused: a transport URL that lists fewer hosts than the cluster has leaves the missing nodes'
#     loss unrecoverable for that client.
#   messagingByService: the components whose charts build a transport URL from the Service name instead (watcher, through
#     helm-toolkit authenticated_endpoint_uri_lookup). The rabbitmq Service is headless, so its DNS name answers every
#     ready node; these need nothing passed.
#   messagingStatefulset: the rabbitmq chart's StatefulSet name (global.subchart_release_name, so not the release name).
#   cache: the components whose charts build a memcache server list (helm-toolkit host_and_port_endpoint_uri_lookup of
#     oslo_cache). With ha.enabled each gets endpoints.oslo_cache {hosts.default: cacheDiscovery, statefulset: {name:
#     cacheStatefulset, replicas: N}}, so the list names every memcached pod through the headless Service.
haTopology:
  minNodes: 3
  nodeLabel:
    key: openstack-control-plane
    value: enabled
  messagingStatefulset: rabbitmq-rabbitmq
  # messagingOperator.name: the RabbitmqCluster with messaging.backend operator. Its pods are <name>-server-N behind the
  # headless Service <name>-nodes; the rabbitmq chart's operator.name defaults to the same and the umbrella passes it.
  messagingOperator:
    name: openstack-mq
  # messagingQuorum: the components whose charts build a transport URL (from endpoints.oslo_messaging.statefulset or
  # from the Service name); with messaging.backend operator each gets endpoints.oslo_messaging.quorum_queues (its
  # rabbit-init drops ha-* policy keys) and conf.<component>.oslo_messaging_rabbit = messagingQuorumConf. Measured from
  # the charts by hack/validate-messaging-operator.py.
  messagingQuorum:
    - aodh
    - barbican
    - blazar
    - ceilometer
    - cinder
    - cloudkitty
    - cyborg
    - designate
    - glance
    - heat
    - ironic
    - keystone
    - magnum
    - manila
    - masakari
    - mistral
    - neutron
    - nova
    - octavia
    - tacker
    - trove
    - watcher
  # messagingQuorumConf: oslo.messaging's quorum settings (oslo.messaging 17.3.2, the 2026.1 upper constraint, has
  # them all). rabbit_ha_queues false: oslo.messaging raises RuntimeError when it is true together with
  # rabbit_quorum_queue. use_queue_manager and rabbit_stream_fanout keep the quorum-queue count bounded: stable reply
  # queue names, and one stream per fanout instead of a queue per consumer (which needs a prefetch count).
  messagingQuorumConf:
    rabbit_ha_queues: false
    amqp_durable_queues: true
    rabbit_quorum_queue: true
    rabbit_transient_quorum_queue: true
    use_queue_manager: true
    rabbit_qos_prefetch_count: 1
    rabbit_stream_fanout: true
  messaging:
    - aodh
    - barbican
    - blazar
    - ceilometer
    - cinder
    - cloudkitty
    - cyborg
    - designate
    - glance
    - heat
    - ironic
    - keystone
    - magnum
    - manila
    - masakari
    - mistral
    - neutron
    - nova
    - octavia
    - placement
    - tacker
    - trove
  messagingByService:
    - watcher
  cacheStatefulset: memcached-ha
  cacheDiscovery: memcached-discovery
  cacheReplicas: 3
  cache:
    - aodh
    - barbican
    - blazar
    - ceilometer
    - cinder
    - cloudkitty
    - cyborg
    - designate
    - glance
    - gnocchi
    - heat
    - horizon
    - ironic
    - keystone
    - magnum
    - manila
    - masakari
    - mistral
    - neutron
    - nova
    - octavia
    - placement
    - swift
    - tacker
    - trove
    - watcher
    - zaqar

# notificationVhosts (#285): the RabbitMQ vhosts `component`'s notification agent consumes, in the order of that chart's
# conf.notification_vhosts default (upstream ceilometer's list; check 26 fails if the two differ). The umbrella passes the
# component, as conf.notification_vhosts, only the vhosts a SELECTED component creates: each entry names a component's
# default vhost (components[].rabbitmqVhost), kept when that component's rabbit-init runs (rabbitmqInit and
# rabbitmqSecret, or its componentValues manifests.job_rabbit_init and manifests.secret_rabbitmq) and passed under the
# name it creates (its componentValues
# endpoints.oslo_messaging.path, when set). oslo.messaging retries a missing vhost forever and never reaches the ones
# after it, so a fixed list consumed nothing on a full-strict install (cinder is not selected, glance and keystone create
# no vhost; measured live on GKE, 2026-11-16: 442 NOT_ALLOWED in 26 minutes, every one `vhost cinder not found`). Merged
# UNDER componentValues: an explicit componentValues.<component>.conf.notification_vhosts wins. Not part of the
# Openstack schema: a property of these charts.
notificationVhosts:
  component: ceilometer
  vhosts:
    - ceilometer
    - cinder
    - glance
    - nova
    - keystone
    - neutron
    - heat

