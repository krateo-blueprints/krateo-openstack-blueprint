# publicEndpointComponents (#311): what else publicEndpoints changes in each component. Not part of the Openstack schema;
# checked against the charts by hack/validate-public-endpoints.py.
#   ingressManifests: every manifests.* switch of the chart that renders an Ingress, its Service or its TLS Secret. All
#     of them are switched off: no controller serves their class, and the Gateway replaces them. The gate requires
#     this to be EVERY such switch the chart has, so a re-vendor that adds one fails CI.
#   proxyHeaders: the conf.<key> whose [oslo_middleware] enable_proxy_headers_parsing is set to true, so the service
#     builds its links from X-Forwarded-Proto. Absent for a component that is not oslo.middleware-based.
#   referencedEndpoints: endpoints.<key> of ANOTHER component's public endpoint that this chart renders into its own
#     config (glance's CORS origin is Horizon's; ironic's swift temp URLs are swift's), moved the same way when that
#     component is selected.
#   dashboard: Horizon's Service becomes ClusterIP and its Django settings Secure.
publicEndpointComponents:
  aodh:
    ingressManifests:
      - ingress_api
      - secret_ingress_tls
      - service_ingress_api
    proxyHeaders: aodh
  barbican:
