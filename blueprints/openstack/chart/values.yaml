    # queue without a token. Server-side only: zaqar both signs and verifies, nothing else holds it.
    - id: zaqar-signed-url-secret-key
      secret: openstack-credential-zaqar-signed-url-secret-key
      key: password
      path: endpoints.messaging.auth.signed_url_secret_keyFrom
    # manila's service-instance SSH key (0.3.67, #228), replacing [generic] service_instance_password (published:
    # manila). A key pair, not a password: the stock manila-service-image has user manila with password manila
    # built in, so a generated password would lock manila out of its own share servers, while a key reaches a
    # new service VM through the Nova keypair manila creates from the public half (templates/credentials.yaml).
    - id: manila-service-instance-ssh-key
      generator: SSHKey
      secret: openstack-credential-manila-service-instance-ssh-key
      key: privateKey
      publicKey: publicKey
      path: endpoints.sharev2.auth.service_instance_ssh_keyFrom
