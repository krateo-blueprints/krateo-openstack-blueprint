# The component DAG. `deps` are component names whose Compositions must be Ready
# before this one's Composition is emitted. `tier`: identity or compute. (CRD existence is matched by Kind, so no plural needed.)
# `rabbitmqVhost`: the RabbitMQ vhost this component's chart's rabbit-init Job declares (its endpoints.oslo_messaging.path
# at the chart's defaults); `rabbitmqInit: false` when the chart ships that Job switched off (manifests.job_rabbit_init:
# glance and keystone), so at defaults no vhost exists for it; `rabbitmqSecret: false` when it ships the Secret that Job
# reads switched off (manifests.secret_rabbitmq: keystone), so the Job alone never starts. Absent for a chart with no
# RabbitMQ user. Measured from the rendered charts, not declared by hand: hack/validate-credentials.py check 26 fails on
# any disagreement.
# notificationVhosts below reads both, overridden by the component's own componentValues (#285).
