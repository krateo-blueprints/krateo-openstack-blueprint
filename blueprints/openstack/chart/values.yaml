    # its root is rendered only while monitoring is on, so an install without monitoring renders byte-identical; once
    # rendered it is kept (helm.sh/resource-policy: keep) like every root, and turning monitoring off and on again
    # finds the same password.
    - id: identity-user-openstack-exporter
      secret: openstack-credential-identity-user-openstack-exporter
      key: password
      path: endpoints.identity.auth.openstack_exporter.passwordFrom
      monitoring: true
# The component DAG. `deps` are component names whose Compositions must be Ready
# before this one's Composition is emitted. `tier`: identity, compute or monitoring. `monitoring: true`: selected only by the
# `monitoring` value, never by a profile or `enabled:` (#312). (CRD existence is matched by Kind, so no plural needed.)
# `rabbitmqVhost`: the RabbitMQ vhost this component's chart's rabbit-init Job declares (its endpoints.oslo_messaging.path
# at the chart's defaults); `rabbitmqInit: false` when the chart ships that Job switched off (manifests.job_rabbit_init:
# glance and keystone), so at defaults no vhost exists for it; `rabbitmqSecret: false` when it ships the Secret that Job
# reads switched off (manifests.secret_rabbitmq: keystone), so the Job alone never starts. Absent for a chart with no
# RabbitMQ user. Measured from the rendered charts, not declared by hand: hack/validate-credentials.py check 26 fails on
# any disagreement.
# notificationVhosts below reads both, overridden by the component's own componentValues (#285).
components:
  - name: mariadb
    kind: Mariadb
    credentials:
      - oslo-db-admin
      - oslo-db-sst
      - oslo-db-audit
      - oslo-db-exporter
    deps: []
    tier: identity
  - name: memcached
    kind: Memcached
    deps: []
    tier: identity
  - name: keystone
    kind: Keystone
    rabbitmqVhost: keystone
    rabbitmqInit: false
    rabbitmqSecret: false
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - identity-user-keystone-test
      - oslo-db-keystone
      - oslo-messaging-keystone
    deps:
      - mariadb
      - memcached
    tier: identity
  - name: glance
    kind: Glance
    rabbitmqVhost: glance
    rabbitmqInit: false
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-glance
      - identity-user-glance-test
      - identity-user-glance
      - oslo-db-glance
      - oslo-messaging-glance
      - ceph-client-glance
      - ceph-mon-host
    ## ceph (#308): with a ceph storage.backend this component consumes Ceph (the rbd image store, when storage.ceph.glanceStore is rbd); the umbrella passes it the
    ## provided items it lists and the storage values for its role (osh.storageValues).
    ceph: images
    deps:
      - keystone
    tier: identity
  - name: horizon
    kind: Horizon
    credentials:
      - identity-admin
      - oslo-db-admin
      - horizon-secret-key
      - oslo-db-horizon
    deps:
      - keystone
    tier: identity
  - name: rabbitmq
    kind: Rabbitmq
    credentials:
      - oslo-messaging-admin
      - oslo-messaging-erlang-cookie
    deps: []
    tier: compute
  - name: openvswitch
    kind: Openvswitch
    deps: []
    tier: compute
  - name: placement
    kind: Placement
    credentials:
      - identity-admin
      - oslo-db-admin
      - memcache-placement
      - identity-user-placement
      - oslo-db-placement
    deps:
      - keystone
    tier: compute
  - name: libvirt
    kind: Libvirt
    credentials:
      - ceph-client-cinder
      - ceph-mon-host
    ## ceph (#308): with a ceph storage.backend this component consumes Ceph (libvirt's secret for attached volumes); the umbrella passes it the
    ## provided items it lists and the storage values for its role (osh.storageValues).
    ceph: volumes
    deps:
      - openvswitch
    tier: compute
  - name: neutron
    kind: Neutron
    rabbitmqVhost: neutron
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-neutron
      - metadata-proxy-shared-secret
      - identity-user-neutron
      - identity-user-neutron-designate
      - identity-user-neutron-ironic
      - identity-user-neutron-nova
      - identity-user-neutron-placement
      - identity-user-neutron-test
      - oslo-db-neutron
      - oslo-messaging-neutron
    deps:
      - keystone
      - rabbitmq
      - openvswitch
    tier: compute
  - name: nova
    kind: Nova
    rabbitmqVhost: nova
    credentials:
      - identity-admin
      - oslo-db-admin
      - oslo-messaging-admin
      - memcache-nova
