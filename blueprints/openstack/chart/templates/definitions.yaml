{{- /* Step 1: register each selected component's CompositionDefinition. */ -}}
{{- $sel := splitList " " (include "osh.selected" (list $)) }}
{{- if .Values.installDefinitions }}
{{- range $c := .Values.components }}
{{- if has $c.name $sel }}
---
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: {{ $c.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  chart:
    url: {{ $.Values.ociRepo }}/{{ $c.name }}
    # The umbrella's own version, never a value: a value can be frozen into the stored
    # Composition by its CRD default, and then no upgrade moves the components (#179).
    version: {{ $.Chart.Version | quote }}
{{- end }}
{{- end }}
{{- end }}
