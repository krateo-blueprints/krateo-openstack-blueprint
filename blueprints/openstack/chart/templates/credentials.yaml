{{- /* Per-install credentials (issue #228). Every install used to get OpenStack-Helm's published default
       passwords. The umbrella now owns generation: one External Secrets Operator Password generator,
       one ROOT ExternalSecret per credential (generated once: refreshPolicy CreatedOnce), and a
       namespaced SecretStore through which the component charts PROJECT a root into the Secrets and
       config drop-ins they already consume (helm-toolkit keystone_user_secret,
       keystone_password_conf_snippet). Components receive a reference, never a value: see
       osh.credentialRefs and compositions.yaml.

       An item is a password unless it names another generator. `generator: SSHKey` (0.3.67, manila's
       service-instance key) generates a key pair with ESO's SSHKey generator instead, and its root holds
       two keys: `key` the private key and `publicKey` the public one, both named by the item, and both
       passed in the reference. A password cannot replace a login the image ships: manila's stock service
       image has user manila with password manila built in, so a generated password would have locked
       manila out of its own share servers. A key reaches the VM through Nova, which needs no image change.
       The two generator kinds exist side by side, so no password root is touched by adding the second.

       The roots must never be deleted or renamed while the install exists. Measured on ESO 2.15.0
       (#228): deleting a root ExternalSecret garbage-collects its Secret (deletionPolicy does not
       cover it), and recreating one generates a NEW value -- every consumer would then hold a password
       the backend no longer accepts. Hence helm.sh/resource-policy: keep, stable names derived from
       .Values.credentials.items, and hack/validate-credentials.py refusing a removed or renamed root.

       ESO is a hard prerequisite. On a cluster that lacks its CRDs the render is REFUSED with the
       reason, on the Composition's status, like the node-label precondition: rendering without them
       would hand every component a reference to a Secret nothing will ever create. The check is a
       named GET per CRD. Where core-provider's own CRD is not found either, the render is offline
       (helm template, the gates): nothing can be checked there, and the objects are rendered so the
       gates see them. A live cluster running this umbrella always has core-provider's CRD. */ -}}
{{- $creds := .Values.credentials | default dict }}
{{- $items := $creds.items | default list }}
{{- $sshItems := list }}
{{- range $i := $items }}
{{- if $i.source }}
{{- if ne $i.source "provided" }}
{{- fail (printf "credential %s names source %q; an item is generated (no source) or `source: provided`" $i.id $i.source) }}
{{- end }}
{{- if or $i.generator (not (has $i.ceph (list "cinder" "glance" "monHost"))) }}
{{- fail (printf "credential %s is `source: provided`: it names no generator, and `ceph` is cinder, glance or monHost (got %q)" $i.id ($i.ceph | default "")) }}
{{- end }}
{{- end }}
{{- if and $i.generator (ne $i.generator "SSHKey") }}
{{- fail (printf "credential %s names generator %q; an item is a Password (no generator) or an SSHKey" $i.id $i.generator) }}
{{- end }}
{{- if eq ($i.generator | default "") "SSHKey" }}
{{- if not $i.publicKey }}
{{- fail (printf "credential %s is an SSHKey item without publicKey: the root's key that holds the public half must be named" $i.id) }}
{{- end }}
{{- $sshItems = append $sshItems $i }}
{{- end }}
{{- end }}
{{- if $items }}
{{- /* Named GETs only: the full CRD list is fetched once per render, in compositions.yaml, for the
       cost recorded on osh.crdExists. core-provider's own CRD is the witness of a live cluster. */ -}}
{{- if lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "compositiondefinitions.core.krateo.io" }}
{{- $needed := list "externalsecrets.external-secrets.io" "secretstores.external-secrets.io" "passwords.generators.external-secrets.io" }}
{{- if $sshItems }}{{- $needed = append $needed "sshkeys.generators.external-secrets.io" }}{{- end }}
{{- $absent := list }}
{{- range $n := $needed }}{{- if not (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $n) }}{{- $absent = append $absent $n }}{{- end }}{{- end }}
{{- if $absent }}
{{- fail (printf "\n\nExternal Secrets Operator is required: this cluster does not serve %s.\n\nThe umbrella generates every install's credentials (Keystone admin and the other OpenStack passwords) with ESO Password generators, so they are unique to the install instead of OpenStack-Helm's published defaults (#228). Install ESO (chart external-secrets, 2.14 or later, with its CRDs) and the next reconcile renders. See the README's prerequisites.\n" (join ", " $absent)) }}
{{- end }}
{{- end }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $creds.generator }}
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- if $sshItems }}
---
# One key pair per SSHKey item: like the Password generator, each root that references it generates its own.
# RSA, because paramiko (manila's SSH client) and every cloud image's sshd accept it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: {{ $creds.generator }}-ssh-key
  namespace: {{ .Release.Namespace }}
spec:
  keyType: rsa
  keySize: 4096
{{- end }}
{{- /* An item marked `monitoring: true` (#312: identity-user-openstack-exporter) is rendered only while osh.monitoringOn,
       so an install without monitoring renders exactly as before it existed. Once rendered, helm.sh/resource-policy:
       keep holds it when monitoring is switched off, and switching it on again renders the same root, which ESO does not
       regenerate (refreshPolicy: CreatedOnce). */ -}}
{{- $monitoring := include "osh.monitoringOn" (list $) }}
{{- range $i := $items }}
{{- if and (not $i.source) (or (not $i.monitoring) $monitoring) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $i.secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/credential: {{ $i.id }}
  annotations:
    # Never deleted by an upgrade that stops rendering it: deleting a root loses or rotates the credential.
    helm.sh/resource-policy: keep
    # And not finalized ahead of an uninstall by composition-dynamic-controller, which would delete it
    # despite the keep above and take the root Secret with it (#254).
    krateo.io/teardown: with-release
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $i.secret }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
{{- if eq ($i.generator | default "") "SSHKey" }}
        {{- /* The generator's output keys are mapped to the item's names here, and only here: a consumer
               reads the names its reference carries, never the generator's. */}}
        {{ $i.key }}: {{ "{{ .privateKey }}" | quote }}
        {{ $i.publicKey }}: {{ "{{ .publicKey }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: {{ $creds.generator }}-ssh-key
{{- else }}
        {{ $i.key }}: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $creds.generator }}
{{- end }}
{{- end }}
{{- end }}
{{- /* PROVIDED ROOTS (#308). Ceph mints its client keys -- a Rook CephClient, or the Ceph admin -- so a `source: provided`
       item's root is a COPY of the Secret Ceph's side keeps, made by ESO through the SecretStore <store>-ceph, never a
       value generated here. Rendered only while storage.backend is a ceph backend; with none they do not exist, and
       osh.credentialRefs passes no component a reference to them.

       Unlike the generated roots: refreshPolicy Periodic, so a key the Ceph admin (or Rook's cephx rotation) changes
       flows through; and no helm.sh/resource-policy: keep, because deleting a copy loses nothing -- the next sync
       recreates it from the source. They keep krateo.io/teardown: with-release (#254), and their names are permanent
       like every root's, since readers name them. hack/validate-ceph-consumer.py (check 27) renders each backend. */ -}}
{{- if eq (include "osh.cephActive" (list $)) "true" }}
{{- $srcNs := include "osh.cephSourceNamespace" (list $) }}
{{- $srcSecrets := list }}
{{- range $i := $items }}
{{- if eq ($i.source | default "") "provided" }}
{{- $src := include "osh.cephSource" (list $ $i) | fromJson }}
{{- $srcSecrets = append $srcSecrets $src.secret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $i.secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/credential: {{ $i.id }}
  annotations:
    krateo.io/teardown: with-release
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: {{ printf "%s-ceph" $creds.store }}
  target:
    name: {{ $i.secret }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        {{ $i.key }}: {{ "{{ .value }}" | quote }}
  data:
    - secretKey: value
      remoteRef:
        key: {{ $src.secret | quote }}
        property: {{ $src.key | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-ceph-reader" $creds.store }}
  namespace: {{ .Release.Namespace }}
{{- if eq $srcNs .Release.Namespace }}
---
# The Ceph sources are in this namespace: the copy store may read exactly those Secrets. In another namespace
# (Rook's), that namespace's owner grants it -- this release cannot create a Role there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-ceph-reader" $creds.store }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
{{- range $n := ($srcSecrets | uniq) }}
      - {{ $n }}
{{- end }}
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-ceph-reader" $creds.store }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-ceph-reader" $creds.store }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-ceph-reader" $creds.store }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "%s-ceph" $creds.store }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $srcNs }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ printf "%s-ceph-reader" $creds.store }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $creds.store }}-reader
  namespace: {{ .Release.Namespace }}
---
# The store's identity may read the root Secrets and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $creds.store }}-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
{{- range $i := $items }}
{{- if and (or (not $i.source) (eq (include "osh.cephActive" (list $)) "true")) (or (not $i.monitoring) $monitoring) }}
      - {{ $i.secret }}
{{- end }}
{{- end }}
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $creds.store }}-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $creds.store }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ $creds.store }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $creds.store }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $creds.store }}-reader
{{- end }}
