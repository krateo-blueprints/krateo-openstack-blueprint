{{- /* Per-install credentials (issue #228). Every install used to get OpenStack-Helm's published default
       passwords. The umbrella now owns generation: one External Secrets Operator Password generator,
       one ROOT ExternalSecret per credential (generated once: refreshPolicy CreatedOnce), and a
       namespaced SecretStore through which the component charts PROJECT a root into the Secrets and
       config drop-ins they already consume (helm-toolkit keystone_user_secret,
       keystone_password_conf_snippet). Components receive a reference, never a value: see
       osh.credentialRefs and compositions.yaml.

       The roots must never be deleted or renamed while the install exists. Measured on ESO 2.15.0
       (#228): deleting a root ExternalSecret garbage-collects its Secret (deletionPolicy does not
       cover it), and recreating one generates a NEW value -- every consumer would then hold a password
       the backend no longer accepts. Hence helm.sh/resource-policy: keep, stable names derived from
       .Values.credentials.items, and hack/validate-credentials.py refusing a removed or renamed root.

       ESO is a hard prerequisite. On a cluster that lacks its CRDs the render is REFUSED with the
       reason, on the Composition's status, like the node-label precondition: rendering without them
       would hand every component a reference to a Secret nothing will ever create. The check is a
       named GET per CRD. Where core-provider's own CRD is not found either, the render is offline
       (helm template, the gates): nothing can be checked there, and the objects are rendered so the
       gates see them. A live cluster running this umbrella always has core-provider's CRD. */ -}}
{{- $creds := .Values.credentials | default dict }}
{{- $items := $creds.items | default list }}
{{- if $items }}
{{- /* Named GETs only: the full CRD list is fetched once per render, in compositions.yaml, for the
       cost recorded on osh.crdExists. core-provider's own CRD is the witness of a live cluster. */ -}}
{{- if lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "compositiondefinitions.core.krateo.io" }}
{{- $needed := list "externalsecrets.external-secrets.io" "secretstores.external-secrets.io" "passwords.generators.external-secrets.io" }}
{{- $absent := list }}
{{- range $n := $needed }}{{- if not (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $n) }}{{- $absent = append $absent $n }}{{- end }}{{- end }}
{{- if $absent }}
{{- fail (printf "\n\nExternal Secrets Operator is required: this cluster does not serve %s.\n\nThe umbrella generates every install's credentials (Keystone admin and the other OpenStack passwords) with ESO Password generators, so they are unique to the install instead of OpenStack-Helm's published defaults (#228). Install ESO (chart external-secrets, 2.14 or later, with its CRDs) and the next reconcile renders. See the README's prerequisites.\n" (join ", " $absent)) }}
{{- end }}
{{- end }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $creds.generator }}
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- range $i := $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $i.secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/credential: {{ $i.id }}
  annotations:
    # Never deleted by an upgrade that stops rendering it: deleting a root loses or rotates the credential.
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $i.secret }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        {{ $i.key }}: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $creds.generator }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $creds.store }}-reader
  namespace: {{ .Release.Namespace }}
---
# The store's identity may read the root Secrets and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $creds.store }}-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
{{- range $i := $items }}
      - {{ $i.secret }}
{{- end }}
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $creds.store }}-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $creds.store }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ $creds.store }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $creds.store }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $creds.store }}-reader
{{- end }}
