{{- /* Step 2: emit each Composition once its CRD exists and its dependencies are satisfied.
       On the first pass only zero-dependency components render; later passes unlock the rest
       in order.

       The gate is PER EDGE, and readiness is the default. A dependency must report Ready=True
       before its dependents are created -- that is what sequences a dependent behind a
       dependency that actually works, and it holds for 85 of the 86 declared dependency edges.
       An edge listed in .Values.dependencyRelaxations is gated on EXISTENCE instead, and only
       those.

       Why any edge needs relaxing (#110). openstack-helm's charts order their own startup with
       kubernetes-entrypoint, and those waits do not follow this DAG: neutron's dhcp, l3 and
       metadata agents wait for Service nova-api before they will start, which is upstream's own
       `dependencies.static.{dhcp,l3,metadata}.services` and is byte-identical in upstream
       master. Upstream does not deadlock on it because it installs every chart at once and the
       agents simply sit in Init until nova appears. Gating nova's creation on neutron's
       READINESS turned that soft startup wait into a hard block: neutron cannot become Ready
       until nova-api exists, nova was not created until neutron was Ready, and so nova-api
       never existed. Measured on a 4-node GKE install of profile=full -- neutron stuck at
       "3 of 73 managed children are not ready", no nova workload at all, and ironic and octavia
       blocked behind the same pair.

       Why only that edge. Readiness is unreachable on an edge whose two endpoints are inside a
       cycle of the runtime wait graph, and it is perfectly reachable everywhere else: placement
       does not wait on nova, rabbitmq does not wait on freezer. Relaxing the whole DAG would
       discard ordering for 75 edges that never had the problem and replace it with "the
       dependent retries", which is strictly worse than the ordering it had. The lookup was
       never the bug; applying readiness to an edge where readiness is unreachable was.

       The relax-set is COMPUTED, not guessed. hack/validate-readiness-deadlock.py builds the
       whole runtime wait graph from the rendered charts -- Composition readiness, managed
       children, every kubernetes-entrypoint Service/pod/job wait, and these creation edges --
       and asserts both directions: every declared relaxation is genuinely inside a cycle (so
       the set cannot accrete) and every cycle is broken by a declared relaxation (so a new
       chart that introduces one fails CI instead of silently needing another). The declared DAG
       itself stays closed and acyclic under hack/validate-component-dag.py; this cycle was only
       ever in the runtime readiness dimension, which is why neither gate alone could see it.

       `or $exists` makes the dependency check a precondition for creation, not a condition
       for staying alive. The lookup is re-evaluated every reconcile, so without it a
       dependency going briefly unready stops the dependent rendering -- and a release that
       stops rendering is uninstalled. See #68: a MariaDB readiness blip deleted a running
       Keystone. Deselection still removes a component, because `has $c.name $sel` below is
       checked first and independently. */ -}}
{{- $sel := splitList " " (include "osh.selected" (list $)) }}
{{- /* The cluster's CRD list, fetched ONCE for the whole render and threaded into every helper
       that needs it. It must not be fetched inside osh.crdExists, which is called 154 times in
       a profile=full pass: with the fetch in there, a 0.3.28 upgrade against a cluster of 257
       CRDs -- several with megabyte-scale OpenAPI schemas -- spent 13 minutes rendering, and
       composition-dynamic-controller renders under a timeout, so that wedges the umbrella rather
       than just delaying it. osh.crdExists carries the full measurement and the precedent.

       Threaded as an explicit argument rather than cached on .Values with `set`. Caching would
       avoid changing six signatures, but it hides the dependency inside the helpers and mutates
       the values the release is rendered from; an argument keeps the cost visible at each call
       site, for the same reason the dependency partition below lives here and not in a
       helper. */ -}}
{{- $crds := (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "").items }}
{{- /* The cluster's node list, fetched ONCE for the whole render in the same place and for the
       same reason as $crds above, and threaded into osh.requireNodeLabels as an argument. It is
       read here, before any component is emitted, because what it gates is the whole install
       and not one component: every component chart pins its pods to a node label that nothing
       in the charts creates, and a component created while no node carries its label does not
       fail -- it goes missing. No per-component fetch exists and none may be added; one node
       fetch inside the range below would cost 34 full node-list reads per pass, which is the
       mistake osh.crdExists carries the 13-minute measurement for.

       Guarded by osh.nodeReadGranted, which is NOT belt-and-braces: the render identity cannot
       list nodes unless an administrator has applied the node-read grant
       (blueprints/openstack/node-reader-rbac.yaml, published as a release asset), and a refused
       `lookup` is a template error, not an empty result -- it would fail this render, every
       reconcile, and a release that stops rendering gets uninstalled (#68). The guard is what
       makes an install without that asset skip the check rather than abort. Measured; see
       osh.nodeReadGranted. */ -}}
{{- $nodes := list }}
{{- if eq (include "osh.nodeReadGranted" (list $)) "true" }}
{{- $nodes = ((lookup "v1" "Node" "" "").items | default list) }}
{{- end }}
{{- include "osh.requireNodeLabels" (list $ $sel $nodes) -}}
{{- include "osh.requireStorageNotOverridden" (list $) -}}
{{- include "osh.requireCephReadGrant" (list $) -}}
{{- /* ha.enabled needs haTopology.minNodes nodes carrying the control-plane label (#309), refused here for the same
       reasons and with the same unmeasured case as the labels above. */ -}}
{{- include "osh.requireHaNodes" (list $ $nodes) -}}
{{- /* Selected components this render does NOT emit (their dependencies are not Ready yet, or their CRD
       is not served yet). While any remain, the ConfigMap openstack-install-pending below is emitted,
       and the CompositionDefinition's statusDataTemplate projects health Ready=False/Creating from its
       presence in .status.managed: the umbrella must not report Ready while a selected component does
       not exist yet (#257 -- measured: Ready=True at 21:47:26 with cyborg, the last tier, emitted only
       at 21:48:21). The selection and emission decisions stay here, in one place; the projection only
       reads whether the chart said "pending". */ -}}
{{- /* #309 C2: the credential generations latch (osh.credentialDrift's ConfigMap), read ONCE per render and only with
       the operator broker (the only mode that rotates): it tells which components were ever rotated ($rotMark below).
       ABSENT (lost, or an install from before it existed) the rotation state is unknown, so every existing component
       with an umbrella RabbitMQ projection is read live on that render: a removed token is still refused, and
       templates/credential-drift.yaml re-creates the ConfigMap in the same render, so the next one reads nothing again.
       credential-drift.yaml reads it too; helm renders each template with its own values, so the read cannot be shared
       across the two files. */ -}}
{{- $gens := dict }}
{{- $gensKnown := true }}
{{- if eq (include "osh.messagingBackend" $) "operator" }}
{{- $gensCM := include "osh.lookupConfigMap" (list $ "openstack-credential-generations") | fromJson }}
{{- $gensKnown = not (empty $gensCM) }}
{{- $gens = $gensCM.data | default dict }}
{{- end }}
{{- $pending := list }}
{{- range $c := .Values.components }}
{{- if has $c.name $sel }}
{{- /* The version this component will be EMITTED at, resolved before anything is decided
       about it: see osh.resolveVersion. The document below is emitted at this same $emitVer, so
       the gate and the emitted apiVersion cannot disagree: there is one resolution, not two.

       This used to be `osh.crdExists $c.kind (osh.version $)` -- the CHART's current version.
       At the first render after a version bump no component CRD serves that version yet,
       because the CompositionDefinitions rendered in this same pass are what create it. So
       $crd was "" for every component, and $crd is the OUTER conjunct of the gate below: the
       $exists escape was never reached, all 34 documents vanished from the manifest, and helm
       pruned 34 live CRs. On a0-openstack-d4 that left 6 CRs for 37 releases, 27 of them
       running with nothing reconciling them. See issue #166.

       The order of decision, written down because an unstated one is how osh.version became
       load-bearing here without anyone choosing it: the origin annotation decides, through
       osh.pinVersion, while it is served. Otherwise a live object is emitted at
       osh.servedVersion's answer, the current version if served and else the newest served one.
       $exists is asked here, once, because the resolution needs it and the gate below uses the
       same answer. The component's CompositionDefinition is read here once for the same reason:
       its upgrade policy decides the version (osh.emitVersion) and its status decides whether the
       new values are written (osh.holdValues, below), and the two must see one snapshot of it. */ -}}
{{- $exists := include "osh.exists" (list $ $c.kind $c.name $crds) }}
{{- $cd := include "osh.definition" (list $ $c.name) | fromJson }}
{{- $approved := include "osh.migrationApprovedFor" (list $ $cd) }}
{{- $emitVer := include "osh.emitVersion" (list $ $c.kind $c.name $crds $exists $approved) }}
{{- $crd := include "osh.crdExists" (list $c.kind $emitVer $crds) }}
{{- /* Whether this component's values are HELD (TWO PHASES, below, where the decision is consumed; osh.holdValues). A pure
       function of the reads above, decided here because it is one of the reasons to read the live object. */ -}}
{{- $hold := include "osh.holdValues" (list (include "osh.version" (list $)) $emitVer $approved $exists (include "osh.definitionApiVersion" (list $cd)) (include "osh.definitionReady" (list $cd))) }}
{{- /* #309 C2: whether this component was ever rotated, from what the umbrella already holds: a generation root of its
       RabbitMQ credential latched in openstack-credential-generations (osh.credentialDrift latches every generation root
       a token names). With its token removed after a switch, this is what still reaches the live read below, so the
       removal is refused (osh.messagingRotation) instead of switching the service back uncoordinated. */ -}}
{{- $mp := include "osh.messagingProjection" (list $ $c) | fromJson }}
{{- $rotMark := "" }}
{{- if $mp.secret }}
{{- if not $gensKnown }}{{- $rotMark = "true" }}{{- end }}
{{- range $k, $_ := $gens }}{{- if hasPrefix (printf "%s-g" $mp.root) $k }}{{- $rotMark = "true" }}{{- end }}{{- end }}
{{- end }}
{{- /* THE LIVE READ: the component's live Composition (osh.liveState: spec, composition-version label, status.managed),
       read ONCE, here, and only when something needs it: the hold re-emits its spec, and a RabbitMQ user rotation (#309 C)
       derives the active generation and its readers from it. A rotation is in progress or has happened while its
       rotate.<id> token is set, or (token removed) while a generation root of it is latched or the latch is absent
       ($rotMark). So a render that
       holds nothing and rotates nothing reads nothing (hack/validate-two-phase-values.py counts these reads). */ -}}
{{- $rotTok := toString (index ($.Values.rotate | default dict) (printf "oslo-messaging-%s" $c.name) | default "") }}
{{- $live := "" }}
{{- if or (eq $hold "true") (and (or $rotTok $rotMark) (eq $exists "true")) }}
{{- $live = include "osh.liveState" (list $ $c.kind $c.name $emitVer $crds) }}
{{- end }}
{{- /* #309 C: a component's RabbitMQ user rotation (osh.messagingRotation), derived from the live Composition (its spec
       and status.managed) and the generation roots' stamps. A token that cannot be honoured refuses the render, naming
       why, on the umbrella's status. C2: the umbrella projection of every generation still in use, and while a rotation
       is not steady a ConfigMap openstack-credential-rotation-<id> saying what it waits on (status.credentialRotation). */ -}}
{{- $rot := dict }}
{{- if $mp.secret }}
{{- $rotLive := dict }}{{- $rotStatus := dict }}
{{- if $live }}{{- $rotStatus = fromJson $live }}{{- $rotLive = $rotStatus.spec | default dict }}{{- end }}
{{- $rot = include "osh.messagingRotation" (list $ $c $rotLive $rotStatus) | fromJson }}
{{- if $rot.refuse }}{{- fail (printf "\n\n%s\n" $rot.refuse) }}{{- end }}
{{- if ne $rot.target $rot.base }}
{{- include "osh.generationRoot" (list $ $rot) }}
{{- end }}
{{- range $root := ($rot.roots | default list) }}
{{- include "osh.messagingProjectionES" (list $ $c $mp (include "osh.generationSuffix" (list $rot.base $root)) $root) }}
{{- end }}
{{- if ne (toString $rot.phase) "steady" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "openstack-credential-rotation-%s" $rot.id }}
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/credential-rotation: {{ $rot.id }}
data:
  credential: {{ $rot.id | quote }}
  phase: {{ $rot.phase | quote }}
  active: {{ $rot.activeRoot | quote }}
  target: {{ $rot.target | quote }}
  blockers: {{ join "\n" $rot.blockers | quote }}
{{- end }}
{{- end }}
{{- /* Partition this component's dependencies by the gate each edge is in, so that which
       semantics applies to which dependency is visible here and not buried in a helper. */ -}}
{{- $relaxed := splitList " " (include "osh.depsRelaxed" (list $ $c.name $c.deps)) | compact }}
{{- $strict := list }}
{{- range $d := ($c.deps | default list) }}
{{- if not (has $d $relaxed) }}{{- $strict = append $strict $d }}{{- end }}
{{- end }}
{{- /* ONE RENDER EMITS ONE TIER. If you are reading this because the install looks stuck at a
       handful of components, that is this gate working and not a stall -- and what you do about
       it depends entirely on how you installed the umbrella.

       The gate below emits a component only once its dependencies are READY. A component in
       tier N+1 therefore cannot appear in the same render that first created tier N: its
       dependencies did not exist yet, let alone report Ready. Convergence needs one render per
       tier, and the tiers are not evenly sized -- a measured 35-component install took EIGHT
       passes to reach 30 releases, with 8 -> 30 happening on pass five alone.

         * As a Composition (the documented path): krateo's composition-dynamic-controller
           re-reconciles on its own interval, so the repeated renders happen for free and you
           do nothing. Seeing few components for the first minutes is expected.

         * Installed directly with `helm install`: NOTHING re-renders it. You must drive the
           passes yourself with repeated `helm upgrade` until the release count stops rising.
           That is the mechanism for a hand-installed umbrella, not a workaround -- but it does
           mean the release count is something you drove, so do not read it as something the
           chart reached on its own.

       This note is duplicated from the README deliberately. It was already documented there, in
       detail, and a peer installing by hand still spent twelve minutes deriving it from scratch
       -- because they opened THIS file, the one that appeared to be failing to progress, and
       never opened the README. Their diagnosis of why: "I only read documentation when I do not
       know what I am doing. I thought I knew." A paragraph that corrects a wrong mental model
       has to live where the wrong model gets exercised.

       Closed WITHOUT a right-trim, for the reason in #152 and for one more: the
       readiness-deadlock gate extracts the text between `$relaxed :=` and
       `$strictReady :=` to render its own partition probe, so a trim here swallows the
       newline before that probe's output line and the gate reads zero partitions. It
       failed exactly that way when this note was first added. */}}
{{- $strictReady := include "osh.depsReady" (list $ $strict $.Values.components $crds) }}
{{- $relaxedExist := include "osh.depsExist" (list $ $relaxed $.Values.components $crds) }}
{{- /* #308: a Ceph consumer is created only once the copies of the keys it reads report Ready (osh.cephRootsReady). */ -}}
{{- $cephReady := include "osh.cephRootsReady" (list $ $c) }}
{{- /* #309 H2: with messaging.backend operator, a component whose rabbit-init runs is created only once the umbrella's
       projection of its RabbitMQ user exists, labelled (osh.messagingProjectionReady), so its User is admitted at once. */ -}}
{{- $mqReady := include "osh.messagingProjectionReady" (list $ $c) }}
{{- if and (eq $crd "true") (or (and (eq $strictReady "true") (eq $relaxedExist "true") (eq $cephReady "true") (eq $mqReady "true")) (eq $exists "true")) }}
{{- $ov := (index ($.Values.componentValues | default dict) $c.name) | default dict }}
{{- /* Credential references (#228): merged UNDER the component's own values, so an explicit
       componentValues entry wins. osh.credentialRefs says what is passed and why. */ -}}
{{- $refs := include "osh.credentialRefs" (list $ $c) | fromYaml }}
{{- if $refs }}{{- $ov = mergeOverwrite $refs (deepCopy $ov) }}{{- end }}
{{- /* Tolerations: the umbrella's one list, as OpenStack-Helm's pod.tolerations.<component>, which every workload
       of every component applies (hack/validate-tolerations.py). Merged UNDER componentValues: an explicit entry wins. */ -}}
{{- with $.Values.tolerations }}
{{- $tol := dict "pod" (dict "tolerations" (dict $c.name (dict "enabled" true "tolerations" .))) }}
{{- $ov = mergeOverwrite $tol (deepCopy $ov) }}
{{- end }}
{{- /* Notification vhosts (#285): the consumer named by .Values.notificationVhosts (ceilometer) gets, as
       conf.notification_vhosts, only the vhosts a SELECTED component creates (osh.notificationVhosts), and, as
       conf.notification_vhost_jobs, the rabbit-init Jobs that create them, which it waits for (#298). Merged UNDER
       componentValues: an explicit entry wins. hack/validate-credentials.py check 26 renders this span for each profile. */ -}}
{{- if eq $c.name ($.Values.notificationVhosts | default dict).component }}
{{- $nv := dict "conf" (dict "notification_vhosts" (include "osh.notificationVhosts" (list $ $sel) | fromJsonArray) "notification_vhost_jobs" (include "osh.notificationVhostJobs" (list $ $sel) | fromJsonArray)) }}
{{- $ov = mergeOverwrite $nv (deepCopy $ov) }}
{{- end }}
{{- /* Public endpoints (#311): with publicEndpoints on, the component's public endpoint moves to its Gateway hostname
       over HTTPS, its inert Ingress switches go off, and Horizon becomes ClusterIP with Secure cookies
       (osh.publicEndpointValues). Off it returns nothing and nothing is merged, so the spec is unchanged. Merged UNDER
       componentValues: an explicit entry wins. hack/validate-public-endpoints.py renders this for every component. */ -}}
{{- with include "osh.publicEndpointValues" (list $ $c.name $sel) }}
{{- $ov = mergeOverwrite (fromJson .) (deepCopy $ov) }}
{{- end }}
{{- /* Re-run hooks (#297): rerunHooks.<component> reaches that component alone, as krateo.rerunHooksToken. Its values
       change, so core-provider runs a helm upgrade and every hook runs again. Merged UNDER componentValues: an explicit
       entry wins. hack/validate-rerun-hooks.py renders this span with and without a token. */ -}}
{{- with index ($.Values.rerunHooks | default dict) $c.name }}
{{- $ov = mergeOverwrite (dict "krateo" (dict "rerunHooksToken" (toString .))) (deepCopy $ov) }}
{{- end }}
{{- /* compute.virtType kvm (#303): nova's virt_type and cpu_mode, and libvirt's virt_type, which makes libvirt refuse a
       node without /dev/kvm. qemu passes nothing: the charts' own defaults are qemu. Merged UNDER componentValues.
       hack/validate-virt-type.py renders this span. */ -}}
{{- if eq (toString (($.Values.compute | default dict).virtType | default "qemu")) "kvm" }}
{{- if eq $c.name "nova" }}
{{- $ov = mergeOverwrite (dict "conf" (dict "nova" (dict "libvirt" (dict "virt_type" "kvm" "cpu_mode" "host-model")))) (deepCopy $ov) }}
{{- else if eq $c.name "libvirt" }}
{{- $ov = mergeOverwrite (dict "conf" (dict "libvirt" (dict "virt_type" "kvm"))) (deepCopy $ov) }}
{{- end }}
{{- end }}
{{- /* kogCredentials (#303): keystone renders the KOG credentials from the admin root it already receives, and nova's
       hook writes nova_url into keystone's openstack-kog-endpoints. Off: nothing is passed. Merged UNDER
       componentValues. hack/validate-kog-credentials.py renders this span. */ -}}
{{- if and (has $c.name (list "keystone" "nova")) ($.Values.kogCredentials | default dict).enabled }}
{{- $ov = mergeOverwrite (dict "kog_credentials" (dict "enabled" true)) (deepCopy $ov) }}
{{- end }}
{{- /* High availability (#309): the RabbitMQ host count to every component that builds a transport URL, and with
       ha.enabled memcached's replicas and their list to every component that builds a memcache server list
       (osh.haValues says what, and what it refuses). Off, with one RabbitMQ replica: nothing is passed. Merged UNDER
       componentValues. hack/validate-ha-propagation.py renders this span. */ -}}
{{- with include "osh.haValues" (list $ $c) | fromYaml }}
{{- $ov = mergeOverwrite . (deepCopy $ov) }}
{{- end }}
{{- /* RabbitMQ cluster-operator (#309 H2b): with messaging.backend operator, the RabbitmqCluster to the rabbitmq chart,
       its pods to every component that lists RabbitMQ hosts, and quorum queues to every component that builds a
       transport URL (osh.messagingOperatorValues says what, and what it refuses). Chart mode: nothing. Merged UNDER
       componentValues. hack/validate-messaging-operator.py renders this span. */ -}}
{{- with include "osh.messagingOperatorValues" (list $ $c) | fromYaml }}
{{- $ov = mergeOverwrite . (deepCopy $ov) }}
{{- end }}
{{- /* Storage backend (#196, #308): a component that requires block-storage receives storage.backend as its
       krateo.storageBackend, always, `none` included: with none, cinder refuses to render and names the value, rather
       than waiting in Init on Ceph objects nothing creates. Not overridable (osh.requireStorageNotOverridden refuses a
       componentValues entry), so the backend full-strict selects by is the one the component renders.
       hack/validate-storage-backend.py renders this span for each backend. */ -}}
{{- if has "block-storage" ($c.requires | default list) }}
{{- $ov = mergeOverwrite (deepCopy $ov) (dict "krateo" (dict "storageBackend" (include "osh.storageBackend" (list $)))) }}
{{- end }}
{{- /* Ceph values (#308): the pools, users and libvirt secret UUID the charts must agree on, from storage.ceph alone
       (osh.storageValues), merged over componentValues, which may not set them. hack/validate-ceph-consumer.py (check 29)
       renders this span through hack/umbrella_spec.py and the four charts it reaches. */ -}}
{{- with include "osh.storageValues" (list $ $c) }}
{{- $ov = mergeOverwrite (deepCopy $ov) (fromYaml .) }}
{{- end }}
{{- /* Monitoring (#312), only while osh.monitoringOn: mariadb gets krateo.exporterUser (its Job creates the exporter's
       MariaDB user; the StatefulSet does not change), and the `monitoring: true` component gets the selection (its alerts
       and scrapes follow it) and the OTLP endpoint. Its Alert and Metric CRs go to the release namespace, and only on a
       cluster that serves them (monitoring-precondition.yaml refuses otherwise). Merged UNDER componentValues: an
       explicit entry wins. Off, no spec changes.
       hack/validate-openstack-monitoring.py renders this span on and off. */ -}}
{{- if include "osh.monitoringOn" (list $) }}
{{- if eq $c.name "mariadb" }}
{{- $ov = mergeOverwrite (dict "krateo" (dict "exporterUser" true)) (deepCopy $ov) }}
{{- end }}
{{- if $c.monitoring }}
{{- $mv := dict "openstack" (dict "components" $sel) "collector" (dict "otlpEndpoint" $.Values.monitoring.otlpEndpoint) }}
{{- $ov = mergeOverwrite $mv (deepCopy $ov) }}
{{- end }}
{{- end }}
{{- /* end of the monitoring span (#312): hack/validate-openstack-monitoring.py renders from `$ov :=` to here. */ -}}
{{- /* RabbitMQ user rotation (#309 C2, osh.messagingRotation): once a component has been rotated, the generation it
       connects as (username and root), the users its release renders (the active one, and the previous or next one
       while a switch drains or prepares) and the active suffix its waits and pod annotation name. Merged OVER
       componentValues, which may not set this passwordFrom while a token is set (refused). Nothing before a first
       rotation; while the component's values are held (TWO PHASES, below) its live spec replaces all of this. Offline
       nothing is live, so $rot is empty (hack/umbrella_spec.py's probe defines it so). hack/validate-messaging-rotation.py
       renders this span with the lookups stood in. */ -}}
{{- if $rot.pass }}
{{- $rotAuth := dict $c.name (dict "username" $rot.username "passwordFrom" (dict "secret" $rot.activeRoot)) }}
{{- $ov = mergeOverwrite (deepCopy $ov) (dict "endpoints" (dict "oslo_messaging" (dict "auth" $rotAuth "operator" (dict "users" $rot.users "activeSuffix" $rot.activeSuffix)))) }}
{{- end }}
{{- /* end of the rotation span */ -}}
{{- /* TWO PHASES: a live component's NEW values are written only at the new apiVersion, and only
       once its CompositionDefinition serves it (status.apiVersion at the current version, Ready
       status True). Until then the object is not changed at all: its live spec is re-emitted at the
       version it was last written at (its krateo.io/composition-version label, osh.holdVersion), so
       neither its spec nor its label moves. If that label is absent or names a version no longer
       served, it falls back to $emitVer, which the gate above already passed. $emitVer is
       reassigned here and only here, to a version osh.holdVersion guarantees is served.

       Measured on GKE 2026-11-15 (0.3.64 → 0.3.65, core-provider 2.13.102; #228): the render that
       moved each definition to the new chart also wrote the new values, at the OLD apiVersion,
       because the new one was not served yet. The object kept the old krateo.io/composition-version
       label, the old version's controller kept it, and ran the OLD chart with the NEW values -- 3 of
       33 components, whose old pre-upgrade Job rotated passwords early. osh.holdValues carries the mechanism, the agreed
       signal and why it reads Ready's status and never its reason or ControllerActive.

       Not held, so unchanged: a component that does not exist yet, and one whose migration is not
       approved (pinned at its origin, #233). Offline nothing exists, so nothing is held and the
       render is byte-identical to the chart without this; hack/validate-two-phase-values.py proves
       that differentially and drives this block end to end with the cluster reads stubbed.

       If the object is gone by the time its spec is read (deleted between osh.exists and here),
       there is no live spec to keep and the computed values are emitted, as before this block. */ -}}
{{- if eq $hold "true" }}
{{- if $live }}
{{- $state := $live | fromJson }}
{{- $ov = $state.spec | default dict }}
{{- $emitVer = include "osh.holdVersion" (list ($state.version | default "") $emitVer $c.kind $crds) }}
{{- end }}
{{- end }}
{{- /* The apiVersion is PINNED to the version this object was born at, when it has one.

       A new component renders at the current version. One that already exists renders at its
       krateo.io/composition-origin-version stamp while that is served, otherwise as
       osh.resolveVersion decides. This does not protect the UID: helm matches on
       kind and group, so a version-only move patches in place. The new UID and second release
       measured on a0-openstack-d3 came from the prune in #166. See the comment on
       osh.pinVersion.

       TWO COSTS, both documented in osh.pinVersion and in the README's "Upgrading an existing
       install", and neither of them is a footnote:

         1. A pinned component is read and written through its origin version's schema, and a
            NARROWER SCHEMA PRUNES -- reads included, which core-provider's fieldloss package
            verified against kind v1.36.4 and which was reproduced for this change on kind
            v1.36.1: a property written through the wide endpoint reads back MISSING through
            the narrow one while still being present in storage and through the wide one. Any
            `values` property this chart adds after a component's origin version is SILENTLY
            DROPPED for that component. Not an error: the setting just does nothing. Recreating
            the component's Composition re-stamps the origin and restores the full surface.

         2. So the pin applies ONLY while the component's migration is not approved (Paused, or
            Manual without krateo.io/upgrade-to-version naming the current version). When it is
            approved -- Automatic or unset, the default -- the engine migrates the instances and
            osh.emitVersion drops the origin, so the umbrella never writes the child at the old
            version against the engine (#233).

       The added reads are osh.originVersion's named GET of the one object and
       osh.migrationApprovedFor's named GET of the component's CompositionDefinition, the same
       cheap shape osh.exists uses; the CRD list stays the one fetched above.

       This comment is closed WITHOUT a right-trim marker, and that is load-bearing. A
       right trim swallows the newline that follows, so the document separator below is
       appended to whatever the previous loop iteration printed last -- the previous
       component's empty spec, giving a line that reads `spec: {}` immediately followed
       by three dashes -- and the file stops being multi-document YAML. helm then fails
       the whole render with "error converting YAML to JSON: yaml: line 5: did not find
       expected key", so the umbrella emits at most ONE component and never a second,
       while the Composition still reports Ready. See issue #152.

       Do not quote the trim marker itself anywhere in this comment: the literal closing
       sequence ends a Go template comment wherever it appears, including inside one, and
       the remaining prose then renders into the manifest as text. */}}
---
apiVersion: {{ include "osh.apiVersionAt" (list $emitVer) }}
kind: {{ $c.kind }}
metadata:
  name: {{ $c.name }}
  namespace: {{ $.Release.Namespace }}
{{- if gt (len $ov) 0 }}
spec:
{{ toYaml $ov | indent 2 }}
{{- else }}
spec: {}
{{- end }}
{{- else }}
{{- $pending = append $pending $c.name }}
{{- end }}
{{- end }}
{{- end }}
{{- if $pending }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-install-pending
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/install-pending: "true"
data:
  pending: {{ join " " $pending | quote }}
  count: {{ len $pending | quote }}
{{- end }}
