{{- /* Step 2: emit each Composition once its CRD exists and its dependencies are satisfied.
       On the first pass only zero-dependency components render; later passes unlock the rest
       in order.

       The gate is PER EDGE, and readiness is the default. A dependency must report Ready=True
       before its dependents are created -- that is what sequences a dependent behind a
       dependency that actually works, and it holds for 85 of the 86 declared dependency edges.
       An edge listed in .Values.dependencyRelaxations is gated on EXISTENCE instead, and only
       those.

       Why any edge needs relaxing (#110). openstack-helm's charts order their own startup with
       kubernetes-entrypoint, and those waits do not follow this DAG: neutron's dhcp, l3 and
       metadata agents wait for Service nova-api before they will start, which is upstream's own
       `dependencies.static.{dhcp,l3,metadata}.services` and is byte-identical in upstream
       master. Upstream does not deadlock on it because it installs every chart at once and the
       agents simply sit in Init until nova appears. Gating nova's creation on neutron's
       READINESS turned that soft startup wait into a hard block: neutron cannot become Ready
       until nova-api exists, nova was not created until neutron was Ready, and so nova-api
       never existed. Measured on a 4-node GKE install of profile=full -- neutron stuck at
       "3 of 73 managed children are not ready", no nova workload at all, and ironic and octavia
       blocked behind the same pair.

       Why only that edge. Readiness is unreachable on an edge whose two endpoints are inside a
       cycle of the runtime wait graph, and it is perfectly reachable everywhere else: placement
       does not wait on nova, rabbitmq does not wait on freezer. Relaxing the whole DAG would
       discard ordering for 75 edges that never had the problem and replace it with "the
       dependent retries", which is strictly worse than the ordering it had. The lookup was
       never the bug; applying readiness to an edge where readiness is unreachable was.

       The relax-set is COMPUTED, not guessed. hack/validate-readiness-deadlock.py builds the
       whole runtime wait graph from the rendered charts -- Composition readiness, managed
       children, every kubernetes-entrypoint Service/pod/job wait, and these creation edges --
       and asserts both directions: every declared relaxation is genuinely inside a cycle (so
       the set cannot accrete) and every cycle is broken by a declared relaxation (so a new
       chart that introduces one fails CI instead of silently needing another). The declared DAG
       itself stays closed and acyclic under hack/validate-component-dag.py; this cycle was only
       ever in the runtime readiness dimension, which is why neither gate alone could see it.

       `or $exists` makes the dependency check a precondition for creation, not a condition
       for staying alive. The lookup is re-evaluated every reconcile, so without it a
       dependency going briefly unready stops the dependent rendering -- and a release that
       stops rendering is uninstalled. See #68: a MariaDB readiness blip deleted a running
       Keystone. Deselection still removes a component, because `has $c.name $sel` below is
       checked first and independently. */ -}}
{{- $sel := splitList " " (include "osh.selected" (list $)) }}
{{- /* The cluster's CRD list, fetched ONCE for the whole render and threaded into every helper
       that needs it. It must not be fetched inside osh.crdExists, which is called 154 times in
       a profile=full pass: with the fetch in there, a 0.3.28 upgrade against a cluster of 257
       CRDs -- several with megabyte-scale OpenAPI schemas -- spent 13 minutes rendering, and
       composition-dynamic-controller renders under a timeout, so that wedges the umbrella rather
       than just delaying it. osh.crdExists carries the full measurement and the precedent.

       Threaded as an explicit argument rather than cached on .Values with `set`. Caching would
       avoid changing six signatures, but it hides the dependency inside the helpers and mutates
       the values the release is rendered from; an argument keeps the cost visible at each call
       site, for the same reason the dependency partition below lives here and not in a
       helper. */ -}}
{{- $crds := (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "").items }}
{{- /* The cluster's node list, fetched ONCE for the whole render in the same place and for the
       same reason as $crds above, and threaded into osh.requireNodeLabels as an argument. It is
       read here, before any component is emitted, because what it gates is the whole install
       and not one component: every component chart pins its pods to a node label that nothing
       in the charts creates, and a component created while no node carries its label does not
       fail -- it goes missing. No per-component fetch exists and none may be added; one node
       fetch inside the range below would cost 34 full node-list reads per pass, which is the
       mistake osh.crdExists carries the 13-minute measurement for.

       Guarded by osh.nodeReadGranted, which is NOT belt-and-braces: the render identity cannot
       list nodes unless an administrator has applied the node-read grant
       (blueprints/openstack/node-reader-rbac.yaml, published as a release asset), and a refused
       `lookup` is a template error, not an empty result -- it would fail this render, every
       reconcile, and a release that stops rendering gets uninstalled (#68). The guard is what
       makes an install without that asset skip the check rather than abort. Measured; see
       osh.nodeReadGranted. */ -}}
{{- $nodes := list }}
{{- if eq (include "osh.nodeReadGranted" (list $)) "true" }}
{{- $nodes = ((lookup "v1" "Node" "" "").items | default list) }}
{{- end }}
{{- include "osh.requireNodeLabels" (list $ $sel $nodes) -}}
{{- range $c := .Values.components }}
{{- if has $c.name $sel }}
{{- $crd := include "osh.crdExists" (list $c.kind (include "osh.version" (list $)) $crds) }}
{{- /* Partition this component's dependencies by the gate each edge is in, so that which
       semantics applies to which dependency is visible here and not buried in a helper. */ -}}
{{- $relaxed := splitList " " (include "osh.depsRelaxed" (list $ $c.name $c.deps)) | compact }}
{{- $strict := list }}
{{- range $d := ($c.deps | default list) }}
{{- if not (has $d $relaxed) }}{{- $strict = append $strict $d }}{{- end }}
{{- end }}
{{- $strictReady := include "osh.depsReady" (list $ $strict $.Values.components $crds) }}
{{- $relaxedExist := include "osh.depsExist" (list $ $relaxed $.Values.components $crds) }}
{{- $exists := include "osh.exists" (list $ $c.kind $c.name $crds) }}
{{- if and (eq $crd "true") (or (and (eq $strictReady "true") (eq $relaxedExist "true")) (eq $exists "true")) }}
{{- $ov := (index ($.Values.componentValues | default dict) $c.name) | default dict }}
---
apiVersion: {{ include "osh.apiVersion" (list $) }}
kind: {{ $c.kind }}
metadata:
  name: {{ $c.name }}
  namespace: {{ $.Release.Namespace }}
{{- if gt (len $ov) 0 }}
spec:
{{ toYaml $ov | indent 2 }}
{{- else }}
spec: {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
