{{- /* Step 2: emit each Composition once its CRD exists and its dependencies are satisfied.
       On the first pass only zero-dependency components render; later passes unlock the rest
       in order.

       The gate is PER EDGE, and readiness is the default. A dependency must report Ready=True
       before its dependents are created -- that is what sequences a dependent behind a
       dependency that actually works, and it holds for 85 of the 86 declared dependency edges.
       An edge listed in .Values.dependencyRelaxations is gated on EXISTENCE instead, and only
       those.

       Why any edge needs relaxing (#110). openstack-helm's charts order their own startup with
       kubernetes-entrypoint, and those waits do not follow this DAG: neutron's dhcp, l3 and
       metadata agents wait for Service nova-api before they will start, which is upstream's own
       `dependencies.static.{dhcp,l3,metadata}.services` and is byte-identical in upstream
       master. Upstream does not deadlock on it because it installs every chart at once and the
       agents simply sit in Init until nova appears. Gating nova's creation on neutron's
       READINESS turned that soft startup wait into a hard block: neutron cannot become Ready
       until nova-api exists, nova was not created until neutron was Ready, and so nova-api
       never existed. Measured on a 4-node GKE install of profile=full -- neutron stuck at
       "3 of 73 managed children are not ready", no nova workload at all, and ironic and octavia
       blocked behind the same pair.

       Why only that edge. Readiness is unreachable on an edge whose two endpoints are inside a
       cycle of the runtime wait graph, and it is perfectly reachable everywhere else: placement
       does not wait on nova, rabbitmq does not wait on freezer. Relaxing the whole DAG would
       discard ordering for 75 edges that never had the problem and replace it with "the
       dependent retries", which is strictly worse than the ordering it had. The lookup was
       never the bug; applying readiness to an edge where readiness is unreachable was.

       The relax-set is COMPUTED, not guessed. hack/validate-readiness-deadlock.py builds the
       whole runtime wait graph from the rendered charts -- Composition readiness, managed
       children, every kubernetes-entrypoint Service/pod/job wait, and these creation edges --
       and asserts both directions: every declared relaxation is genuinely inside a cycle (so
       the set cannot accrete) and every cycle is broken by a declared relaxation (so a new
       chart that introduces one fails CI instead of silently needing another). The declared DAG
       itself stays closed and acyclic under hack/validate-component-dag.py; this cycle was only
       ever in the runtime readiness dimension, which is why neither gate alone could see it.

       `or $exists` makes the dependency check a precondition for creation, not a condition
       for staying alive. The lookup is re-evaluated every reconcile, so without it a
       dependency going briefly unready stops the dependent rendering -- and a release that
       stops rendering is uninstalled. See #68: a MariaDB readiness blip deleted a running
       Keystone. Deselection still removes a component, because `has $c.name $sel` below is
       checked first and independently. */ -}}
{{- $sel := splitList " " (include "osh.selected" (list $)) }}
{{- /* The cluster's CRD list, fetched ONCE for the whole render and threaded into every helper
       that needs it. It must not be fetched inside osh.crdExists, which is called 154 times in
       a profile=full pass: with the fetch in there, a 0.3.28 upgrade against a cluster of 257
       CRDs -- several with megabyte-scale OpenAPI schemas -- spent 13 minutes rendering, and
       composition-dynamic-controller renders under a timeout, so that wedges the umbrella rather
       than just delaying it. osh.crdExists carries the full measurement and the precedent.

       Threaded as an explicit argument rather than cached on .Values with `set`. Caching would
       avoid changing six signatures, but it hides the dependency inside the helpers and mutates
       the values the release is rendered from; an argument keeps the cost visible at each call
       site, for the same reason the dependency partition below lives here and not in a
       helper. */ -}}
{{- $crds := (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "").items }}
{{- /* The cluster's node list, fetched ONCE for the whole render in the same place and for the
       same reason as $crds above, and threaded into osh.requireNodeLabels as an argument. It is
       read here, before any component is emitted, because what it gates is the whole install
       and not one component: every component chart pins its pods to a node label that nothing
       in the charts creates, and a component created while no node carries its label does not
       fail -- it goes missing. No per-component fetch exists and none may be added; one node
       fetch inside the range below would cost 34 full node-list reads per pass, which is the
       mistake osh.crdExists carries the 13-minute measurement for.

       Guarded by osh.nodeReadGranted, which is NOT belt-and-braces: the render identity cannot
       list nodes unless an administrator has applied the node-read grant
       (blueprints/openstack/node-reader-rbac.yaml, published as a release asset), and a refused
       `lookup` is a template error, not an empty result -- it would fail this render, every
       reconcile, and a release that stops rendering gets uninstalled (#68). The guard is what
       makes an install without that asset skip the check rather than abort. Measured; see
       osh.nodeReadGranted. */ -}}
{{- $nodes := list }}
{{- if eq (include "osh.nodeReadGranted" (list $)) "true" }}
{{- $nodes = ((lookup "v1" "Node" "" "").items | default list) }}
{{- end }}
{{- include "osh.requireNodeLabels" (list $ $sel $nodes) -}}
{{- range $c := .Values.components }}
{{- if has $c.name $sel }}
{{- /* The version this component will be EMITTED at, resolved before anything is decided
       about it: see osh.resolveVersion. The document below is emitted at this same $emitVer, so
       the gate and the emitted apiVersion cannot disagree: there is one resolution, not two.

       This used to be `osh.crdExists $c.kind (osh.version $)` -- the CHART's current version.
       At the first render after a version bump no component CRD serves that version yet,
       because the CompositionDefinitions rendered in this same pass are what create it. So
       $crd was "" for every component, and $crd is the OUTER conjunct of the gate below: the
       $exists escape was never reached, all 34 documents vanished from the manifest, and helm
       pruned 34 live CRs. On a0-openstack-d4 that left 6 CRs for 37 releases, 27 of them
       running with nothing reconciling them. See issue #166.

       The order of decision, written down because an unstated one is how osh.version became
       load-bearing here without anyone choosing it: the origin annotation decides, through
       osh.pinVersion, while it is served. Otherwise a live object is emitted at
       osh.servedVersion's answer, the current version if served and else the newest served one.
       $exists is asked here, once, because the resolution needs it and the gate below uses the
       same answer. */ -}}
{{- $exists := include "osh.exists" (list $ $c.kind $c.name $crds) }}
{{- $emitVer := include "osh.emitVersion" (list $ $c.kind $c.name $crds $exists) }}
{{- $crd := include "osh.crdExists" (list $c.kind $emitVer $crds) }}
{{- /* Partition this component's dependencies by the gate each edge is in, so that which
       semantics applies to which dependency is visible here and not buried in a helper. */ -}}
{{- $relaxed := splitList " " (include "osh.depsRelaxed" (list $ $c.name $c.deps)) | compact }}
{{- $strict := list }}
{{- range $d := ($c.deps | default list) }}
{{- if not (has $d $relaxed) }}{{- $strict = append $strict $d }}{{- end }}
{{- end }}
{{- /* ONE RENDER EMITS ONE TIER. If you are reading this because the install looks stuck at a
       handful of components, that is this gate working and not a stall -- and what you do about
       it depends entirely on how you installed the umbrella.

       The gate below emits a component only once its dependencies are READY. A component in
       tier N+1 therefore cannot appear in the same render that first created tier N: its
       dependencies did not exist yet, let alone report Ready. Convergence needs one render per
       tier, and the tiers are not evenly sized -- a measured 35-component install took EIGHT
       passes to reach 30 releases, with 8 -> 30 happening on pass five alone.

         * As a Composition (the documented path): krateo's composition-dynamic-controller
           re-reconciles on its own interval, so the repeated renders happen for free and you
           do nothing. Seeing few components for the first minutes is expected.

         * Installed directly with `helm install`: NOTHING re-renders it. You must drive the
           passes yourself with repeated `helm upgrade` until the release count stops rising.
           That is the mechanism for a hand-installed umbrella, not a workaround -- but it does
           mean the release count is something you drove, so do not read it as something the
           chart reached on its own.

       This note is duplicated from the README deliberately. It was already documented there, in
       detail, and a peer installing by hand still spent twelve minutes deriving it from scratch
       -- because they opened THIS file, the one that appeared to be failing to progress, and
       never opened the README. Their diagnosis of why: "I only read documentation when I do not
       know what I am doing. I thought I knew." A paragraph that corrects a wrong mental model
       has to live where the wrong model gets exercised.

       Closed WITHOUT a right-trim, for the reason in #152 and for one more: the
       readiness-deadlock gate extracts the text between `$relaxed :=` and
       `$strictReady :=` to render its own partition probe, so a trim here swallows the
       newline before that probe's output line and the gate reads zero partitions. It
       failed exactly that way when this note was first added. */}}
{{- $strictReady := include "osh.depsReady" (list $ $strict $.Values.components $crds) }}
{{- $relaxedExist := include "osh.depsExist" (list $ $relaxed $.Values.components $crds) }}
{{- if and (eq $crd "true") (or (and (eq $strictReady "true") (eq $relaxedExist "true")) (eq $exists "true")) }}
{{- $ov := (index ($.Values.componentValues | default dict) $c.name) | default dict }}
{{- /* Credential references (#228): merged UNDER the component's own values, so an explicit
       componentValues entry wins. osh.credentialRefs says what is passed and why. */ -}}
{{- $refs := include "osh.credentialRefs" (list $ $c) | fromYaml }}
{{- if $refs }}{{- $ov = mergeOverwrite $refs (deepCopy $ov) }}{{- end }}
{{- /* The apiVersion is PINNED to the version this object was born at, when it has one.

       A new component renders at the current version. One that already exists renders at its
       krateo.io/composition-origin-version stamp while that is served, otherwise as
       osh.resolveVersion decides. This does not protect the UID: helm matches on
       kind and group, so a version-only move patches in place. The new UID and second release
       measured on a0-openstack-d3 came from the prune in #166. See the comment on
       osh.pinVersion.

       TWO COSTS, both documented in osh.pinVersion and in the README's "Upgrading an existing
       install", and neither of them is a footnote:

         1. A pinned component is read and written through its origin version's schema, and a
            NARROWER SCHEMA PRUNES -- reads included, which core-provider's fieldloss package
            verified against kind v1.36.4 and which was reproduced for this change on kind
            v1.36.1: a property written through the wide endpoint reads back MISSING through
            the narrow one while still being present in storage and through the wide one. Any
            `values` property this chart adds after a component's origin version is SILENTLY
            DROPPED for that component. Not an error: the setting just does nothing. Recreating
            the component's Composition re-stamps the origin and restores the full surface.

         2. So the pin applies ONLY while the component's migration is not approved (Paused, or
            Manual without krateo.io/upgrade-to-version naming the current version). When it is
            approved -- Automatic or unset, the default -- the engine migrates the instances and
            osh.emitVersion drops the origin, so the umbrella never writes the child at the old
            version against the engine (#233).

       The added reads are osh.originVersion's named GET of the one object and
       osh.migrationApprovedFor's named GET of the component's CompositionDefinition, the same
       cheap shape osh.exists uses; the CRD list stays the one fetched above.

       This comment is closed WITHOUT a right-trim marker, and that is load-bearing. A
       right trim swallows the newline that follows, so the document separator below is
       appended to whatever the previous loop iteration printed last -- the previous
       component's empty spec, giving a line that reads `spec: {}` immediately followed
       by three dashes -- and the file stops being multi-document YAML. helm then fails
       the whole render with "error converting YAML to JSON: yaml: line 5: did not find
       expected key", so the umbrella emits at most ONE component and never a second,
       while the Composition still reports Ready. See issue #152.

       Do not quote the trim marker itself anywhere in this comment: the literal closing
       sequence ends a Go template comment wherever it appears, including inside one, and
       the remaining prose then renders into the manifest as text. */}}
---
apiVersion: {{ include "osh.apiVersionAt" (list $emitVer) }}
kind: {{ $c.kind }}
metadata:
  name: {{ $c.name }}
  namespace: {{ $.Release.Namespace }}
{{- if gt (len $ov) 0 }}
spec:
{{ toYaml $ov | indent 2 }}
{{- else }}
spec: {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
