{{- /*
Runtime side of the serviceContract usage/health declaration: two CronJobs
(one per signal) running the stdlib-only emitter in files/contract-emitter.py
on the interval declared in serviceContract.usage/health. Usage rows land in
the platform's usage_records table (normalized UsageRecord shape, consumed
uniformly by dashboards and rating); health rows are the normalized
OK/Warning/Critical/Unknown signal. Off by default so the chart stays
installable without a ClickHouse data plane.
*/ -}}
{{- if .Values.contractEmitter.enabled }}
{{- $ce := .Values.contractEmitter }}
{{- $svc := .Values.serviceContract.service.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  # Whether the two CronJobs below this ConfigMap were rendered, and if not, why.
  #
  # The CronJobs are gated on the keystone credentials Secret existing, because they cannot
  # authenticate without it. That gate is correct -- and it is also invisible: a conditional
  # render is not a failure, so nothing logs it, and a cluster where the emitter has never run
  # looks exactly like one where it runs fine. A peer found this chart in that state on a real
  # cluster with contractEmitter.enabled true, with only this ConfigMap present, and observed
  # that the consumer of those CronJobs was going to discover it by finding no rows.
  #
  # So the gate now states its own verdict here. This key is the difference between "the emitter
  # is not running" and "the emitter is not running BECAUSE the Secret it needs is absent".
{{- if lookup "v1" "Secret" $.Release.Namespace $ce.openstack.existingSecret }}
  emitter-state: |
    cronjobs: rendered
    reason: Secret {{ $ce.openstack.existingSecret }} found in namespace {{ $.Release.Namespace }}
{{- else }}
  emitter-state: |
    cronjobs: WITHHELD
    reason: Secret {{ $ce.openstack.existingSecret }} not found in namespace {{ $.Release.Namespace }}
    effect: no usage or health records are being emitted, and nothing else will report this
    remedy: the Secret is created by keystone's release; this resolves by itself once keystone
      has deployed, and the CronJobs appear on the next reconcile with nothing to re-run
{{- end }}
  name: {{ $svc }}-contract-emitter
  labels:
    app.kubernetes.io/name: {{ $svc }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    krateo.io/contract-emitter: "true"
data:
  contract-emitter.py: |
    {{- .Files.Get "files/contract-emitter.py" | nindent 4 }}
{{- /*
The CronJobs wait for the openrc Secret, the components do not wait for the CronJobs.

envFrom.secretRef is not optional -- the emitter cannot authenticate to Keystone without
those credentials -- so the kubelet cannot create the container until that Secret exists. On
a fresh install the CronJobs otherwise fire while Keystone is still being built and their
pods sit in CreateContainerConfigError until it appears. Self-correcting, but it spends the
one signal this emitter has: a failed Job is supposed to mean connectivity or auth, and
"Keystone is not up yet" is neither. A reader checking `kubectl get jobs` during an install
would be reading noise as a fault.

Gated on the Secret rather than on Keystone being Ready because the Secret is the actual
dependency, and its name is configurable -- Keystone could be Ready under a chart that names
its openrc Secret something else.

Not latched, unlike the component gate in compositions.yaml (#68). That latch exists because
ceasing to render a Composition UNINSTALLS a release and destroys a running service. Ceasing
to render a CronJob removes a schedule and nothing else: no data, no state, and it cannot do
its job without those credentials anyway.
*/ -}}
{{- if lookup "v1" "Secret" $.Release.Namespace $ce.openstack.existingSecret }}
{{- range $mode := tuple "usage" "health" }}
{{- $decl := index $.Values.serviceContract $mode }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $svc }}-emit-{{ $mode }}
  labels:
    app.kubernetes.io/name: {{ $svc }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    krateo.io/contract-emitter: "true"
spec:
  schedule: {{ include "osh.cronFromInterval" $decl.interval | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $svc }}
            krateo.io/contract-emitter: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: emit-{{ $mode }}
              image: {{ $ce.image }}
              imagePullPolicy: {{ $ce.imagePullPolicy }}
              command: ["python3", "/opt/emitter/contract-emitter.py"]
              envFrom:
                # OpenStack-Helm admin openrc secret (OS_AUTH_URL, OS_USERNAME,
                # OS_PASSWORD, OS_PROJECT_NAME, OS_*_DOMAIN_NAME, OS_REGION_NAME).
                - secretRef:
                    name: {{ $ce.openstack.existingSecret }}
              env:
                - name: MODE
                  value: {{ $mode | quote }}
                - name: ORG
                  value: {{ $ce.org | quote }}
                - name: SERVICE_NAME
                  value: {{ $svc | quote }}
                - name: INTERVAL
                  value: {{ $decl.interval | quote }}
                - name: OS_INTERFACE
                  value: {{ $ce.openstack.interface | quote }}
                - name: TLS_VERIFY
                  value: {{ $ce.openstack.tlsVerify | quote }}
                {{- with $ce.openstack.authUrl }}
                - name: OS_AUTH_URL   # overrides the secret's value when set
                  value: {{ . | quote }}
                {{- end }}
                {{- with $ce.openstack.region }}
                - name: OS_REGION_NAME
                  value: {{ . | quote }}
                {{- end }}
                - name: CH_URL
                  value: {{ $ce.clickhouse.url | quote }}
                - name: CH_DATABASE
                  value: {{ $ce.clickhouse.database | quote }}
                - name: CH_USAGE_TABLE
                  value: {{ $ce.clickhouse.usageTable | quote }}
                - name: CH_HEALTH_DATABASE
                  value: {{ $ce.clickhouse.healthDatabase | default $ce.clickhouse.database | quote }}
                - name: CH_HEALTH_TABLE
                  value: {{ $ce.clickhouse.healthTable | quote }}
                - name: CH_BOOTSTRAP_HEALTH_TABLE
                  value: {{ $ce.clickhouse.bootstrapHealthTable | quote }}
                {{- if $ce.clickhouse.existingSecret }}
                - name: CH_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ce.clickhouse.existingSecret }}
                      key: username
                      optional: true
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ce.clickhouse.existingSecret }}
                      key: password
                      optional: true
                {{- end }}
              volumeMounts:
                - name: emitter
                  mountPath: /opt/emitter
                  readOnly: true
              {{- with $ce.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: emitter
              configMap:
                name: {{ $svc }}-contract-emitter
{{- end }}
{{- end }}
{{- end }}
