{{- /*
#309 C: the generated roots' drift latch (osh.credentialDrift). openstack-credential-generations holds, per generated
credential, "<rotate token> <sha256 of the root's data>"; it is read back on the next render. A root whose data changed
while its token did not gets a ConfigMap openstack-credential-drift-<root Secret>, and the CompositionDefinition's
statusDataTemplate lists those Secrets on status.credentialDrift (hack/validate-credential-drift.py executes it). A new
rotate.<id> token acknowledges the root's current value. Holds hashes and tokens only, never secret material.
*/ -}}
{{- $d := include "osh.credentialDrift" (list $) | fromJson }}
{{- if $d.state }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-credential-generations
  namespace: {{ .Release.Namespace }}
data:
{{- range $id, $v := $d.state }}
  {{ $id }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- range $x := $d.drift }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "openstack-credential-drift-%s" $x.secret | trunc 253 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/credential-drift: {{ $x.id }}
data:
  secret: {{ $x.secret | quote }}
  credential: {{ $x.id | quote }}
  reason: "the root's data changed while rotate.{{ $x.id }} did not: it was edited or regenerated by hand (External Secrets Operator regenerates a generated root when its Secret is edited). No live credential follows it until a rotation; set rotate.{{ $x.id }} to acknowledge or rotate."
{{- end }}
