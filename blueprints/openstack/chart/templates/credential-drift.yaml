{{- /*
#309 C: the generated roots' drift latch (osh.credentialDrift). openstack-credential-generations holds, per generated
credential, the sha256 of the root's data; it is read back on the next render. A root whose data changed
while its token did not gets a ConfigMap openstack-credential-drift-<root Secret>, and the CompositionDefinition's
statusDataTemplate lists those Secrets on status.credentialDrift (hack/validate-credential-drift.py executes it).
credentialDrift.acknowledge.<Secret>, set to the sha256 shown, accepts it. Holds hashes only, never secret material.
*/ -}}
{{- /* rotate.<id> rotates a RabbitMQ user only with messaging.backend operator (dual users, #309 C): refused otherwise,
       so a token is never a silent no-op. */ -}}
{{- if and (.Values.rotate | default dict) (ne (include "osh.messagingBackend" $) "operator") }}
{{- fail (printf "\n\nrotate is set (%s), but rotating a RabbitMQ service user needs messaging.backend operator: with the chart-mode broker nothing would rotate. Remove rotate, or switch messaging.backend to operator (#309).\n" (keys .Values.rotate | sortAlpha | join ", ")) }}
{{- end }}
{{- $d := include "osh.credentialDrift" (list $) | fromJson }}
{{- if $d.state }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-credential-generations
  namespace: {{ .Release.Namespace }}
data:
{{- range $id, $v := $d.state }}
  {{ $id }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- range $x := $d.drift }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "openstack-credential-drift-%s" $x.secret | trunc 253 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    krateo.io/credential-drift: {{ $x.id }}
data:
  secret: {{ $x.secret | quote }}
  credential: {{ $x.id | quote }}
  sha256: {{ $x.sha | quote }}
  reason: "the root's data changed: it was edited or regenerated by hand (External Secrets Operator regenerates a generated root when its Secret is edited). No live credential follows it. To accept its current value, set credentialDrift.acknowledge.{{ $x.secret }} to the sha256 above."
{{- end }}
