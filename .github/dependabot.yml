# The organisation's publishing standard (krateo-blueprints/charts PUBLISHING.md rule 9): the index
# publisher is pinned by full commit SHA, because it receives an org-wide write token, and a new
# publisher release reaches this repository as a reviewed pull request from here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request per source (PUBLISHING.md rule 9): one at a time, pins to the same repository drift apart, and
    # validate-prerelease-channel.py refuses a publisher and a preflight at two versions.
    groups:
      krateo-charts:
        patterns:
          - "krateo-blueprints/charts*"
      krateo-platformops:
        patterns:
          - "krateo-platformops/.github*"
