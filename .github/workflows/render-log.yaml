# Renders docs/log.md from docs/log.d after each merge to main and lands it through a bot pull request.
#
# Pull requests never touch docs/log.md (hack/validate-log-untouched.py fails one that does); they add a docs/log.d
# entry, so branches in flight stop conflicting on it. main's org ruleset requires a pull request and has no bypass
# actor, so this cannot push to main: hack/render-log-pr.sh commits the render on bot/render-log-<sha7> as the
# render-log App's bot account, opens a pull request and squash-merges it, or updates the one already open (Diego,
# 2026-11-18). It commits nothing when the render is unchanged.
#
# It acts with a GitHub App token, not GITHUB_TOKEN (Diego, 2026-11-18): GitHub starts no workflow for a GITHUB_TOKEN
# event, so the first bot render commit on main (d1cb62b) got no lint run, while prerelease and release-tag require a
# green lint on the exact commit. App-token events start workflows, so the bot's pull request and merge commit are
# linted like any other. The App is created as docs/release.md says; this refuses to run without its secrets.
#
# It cannot loop: the bot's commit changes docs/log.md alone, and this runs only when docs/log.d or the renderer
# changes (hack/validate-render-log-pr.py asserts both). No skip marker is used: GitHub honours one anywhere in a
# commit message, and #347's squash message quoting it skipped every push workflow on main, lint included.
name: render-log

on:
  push:
    branches:
      - main
    paths:
      - docs/log.d/**
      - hack/render-log.py
      - hack/render-log-pr.sh
      - hack/render-log-app.yaml
  workflow_dispatch:

# GITHUB_TOKEN writes nothing: the push, the pull request and the merge use the App's token.
permissions:
  contents: read

# One run at a time, the newest waiting rather than cancelling: two merges close together must not both open a pull
# request, and the second run renders main as it is after the first.
concurrency:
  group: render-log
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without the render-log App's secrets
        env:
          CLIENT_ID: ${{ secrets.RENDER_LOG_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RENDER_LOG_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::RENDER_LOG_APP_CLIENT_ID and RENDER_LOG_APP_PRIVATE_KEY must be set (docs/release.md):" \
              "without the App's token docs/log.md is not rendered, and a GITHUB_TOKEN merge would go unlinted."
            exit 1
          fi

      - name: Mint the render-log App's token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RENDER_LOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENDER_LOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Full history. When a bot pull request is already open, render-log-pr.sh merges main into its branch, and from
      # the default depth-1 checkout main's one commit has no parents, so it shares no commit with that branch and git
      # refuses ("refusing to merge unrelated histories", run 44281145388). hack/validate-render-log-pr.py clones at the
      # depth this step sets and runs that path.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Render docs/log.md and land it through a bot pull request if it changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: bash hack/render-log-pr.sh .
