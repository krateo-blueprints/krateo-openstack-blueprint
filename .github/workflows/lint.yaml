name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
#
# The two checks differ in authority, deliberately. Rendering a real chart can fail for reasons
# that are nobody's bug (values it cannot guess, private dependencies), so the render job only
# warns. Validating a chart's defaults against its own schema needs neither, so values-schema
# gates: issue #53 was a schema violation that the render job had already surfaced, as one more
# warning among the dependency noise, and it reached main anyway.
on:
  pull_request:
    paths:
      - "**"
  # Also on main. Every gate here ran on its own pull request and none had ever run on main:
  # the last lint run on main was 2026-08-11, while seven pull requests merged after it. Each
  # was gated against the base it branched from, never against the result of combining them, so
  # two changes that each pass can merge into a main that does not and nothing says so.
  #
  # It matters more because release-tag.yaml fires on a tag push: a release publishes 36 charts
  # from whatever main happens to contain, and until now that tree had not been linted. 0.3.26
  # was cut that way. It passes -- checked every gate against it by hand -- but passing by luck
  # and passing by construction are different properties, and only one of them holds next time.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  values-schema:
    # Gating. A chart whose own defaults violate its own schema cannot be installed at all:
    # Helm validates values before it renders, so `helm install` of the blueprint fails and
    # chart-inspector answers 500. See hack/validate-values-schema.py for why it renders a
    # throwaway chart rather than the real one.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every chart's defaults must satisfy its own schema
        run: python3 hack/validate-values-schema.py .

  capability-roles:
    # Gating. A capability aggregates into a predefined role via a
    # `rbac.krateo.io/aggregate-to-<role>=true` label, and nothing validates the <role>.
    # A label naming a role that does not exist is valid YAML, renders without complaint,
    # and produces a ClusterRole that is created, listed in the catalog, and joined to
    # NOTHING -- so the capability looks present and grants no access. This repo shipped
    # exactly that in all four capabilities for as long as they existed.
    #
    # Renders the chart rather than reading values, because a template that stops emitting
    # the label produces the same silent outcome and a values-level check would pass it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Without this, four of the gates below have never run. actions/setup-python ships no
      # PyYAML, and validate-keystone-readiness, validate-rolemapping, validate-shipped-python
      # and validate-component-dag each catch the ImportError, print "SKIP: PyYAML unavailable"
      # and exit 0 -- so the job goes green having checked nothing. Confirmed in the lint run on
      # main at 2026-11-01T15:39:07Z, where three of the four print SKIP on consecutive lines.
      #
      # The gate that protects the keystone fernet readiness check (#100) was among them, which
      # means the most serious defect this repo has shipped had a guard that could not fire.
      - name: Install the gates' Python dependencies
        run: pip install PyYAML

      - name: Every capability must aggregate to a predefined role
        run: python3 hack/validate-capability-roles.py .

      # Offline and fast. pidof identifies a process by its executable, which under an
      # emulating runtime is the emulator -- so a pidof-based probe fails forever while the
      # program runs normally, the kubelet kills a healthy process, and the pod never becomes
      # Ready. That reads as a slow environment rather than a broken probe, which is why it
      # needs a gate and not just a fix. See issue #96.
      - name: No probe may identify a process with pidof
        run: python3 hack/validate-no-pidof.py .

      # Renders the chart and inspects the probes the kubelet would receive. A readiness probe
      # that does not depend on the fernet keys lets an identity plane which cannot issue a
      # single token report Ready at every layer, including the umbrella's own condition --
      # and a revert of the fix is as invisible as the bug was. See issue #99.
      - name: Keystone readiness must require the fernet keys
        run: python3 hack/validate-keystone-readiness.py .

      # The schema types cmpRole as a free string and only describes it as a CMP role or
      # capability name, so an invented name validates cleanly and binds nothing. That is
      # how the defaults came to read openstack-viewer / openstack-operator /
      # openstack-admin, which match neither the six predefined roles nor any capability.
      # The same failure shape as keystone's, one service along. Glance answers /healthcheck
      # with 200 whenever its API process is up, but its image store is a PVC written as uid
      # 42424 with no fsGroup -- writable only because an init container chowns it. If the
      # volume does not honour that chown, every upload 500s while the pod sits 1/1 Ready.
      # See issue #110.
      - name: Glance readiness must require a writable image store
        run: python3 hack/validate-glance-readiness.py .

      # Not the same shape: the one place upstream gets a probe actively wrong rather than
      # merely shallow. Upstream points horizon's liveness at /, and horizon's own
      # SimultaneousSessionsMiddleware touches the default cache on EVERY request, so with
      # memcached away every Django path answers 500 -- measured in the real image, where
      # /static/dashboard/img/favicon.ico still answered 200. Upstream's probe therefore
      # restarts every replica for the duration of a memcached outage, repairs nothing, and
      # pays for a collectstatic of ~4000 files per restart. Liveness stays on the static
      # handler; the keystone readiness check that shipped beside it was an improvement with
      # no upstream defect behind it and has been reverted. See issue #110.
      - name: No probe that restarts horizon may enter Django
        run: python3 hack/validate-horizon-liveness.py .

      # The quietest version of the same failure. gnocchi-metricd and gnocchi-statsd had no
      # probe at all, and both swallow every backend error and loop forever
      # (MetricProcessBase.run and Stats.flush in gnocchi 4.7.0), so a metricd that cannot
      # reach its indexer, its measure store or its coordinator reports Ready and aggregates
      # nothing while measures are still accepted -- with no user-facing error at any point.
      # gnocchi-api had a bare tcpSocket on 8041, which `uwsgi --http` answers in its HTTP
      # router rather than in a worker: measured, a TCP connect succeeds with both workers
      # SIGSTOPped. Also asserts api-paste.ini still names the composite gnocchi asks for,
      # without which the API loads no app at all. See issues #110 and #117.
      - name: Gnocchi probes must check its backends
        run: python3 hack/validate-gnocchi-readiness.py .

      # The same shape, on the component added in #131, and the one case where this repo's own
      # precedent points the wrong way. memcached's `tcpSocket 11211` was classified MEANINGFUL
      # because no realistic state was found in which memcached accepts TCP and cannot serve
      # get/set; upstream's redis chart ships the analogous `tcpSocket 6379`, and redis has four
      # such states -- measured in docker.io/library/redis:7.2.17, the image this chart pins:
      # loading an RDB from disk, a failed BGSAVE with writes stopped, a replica whose master
      # link is down, and maxmemory reached with noeviction. A tcpSocket passes in all four, and
      # so does `redis-cli ping` read by exit status, because redis-cli EXITS 0 ON AN ERROR
      # REPLY. zaqar's message store is this redis and posting a message is a write, so
      # readiness does SET then GET and reads the reply text. The gate RUNS the rendered probe
      # scripts against a stub redis-cli reproducing each state, and asserts the converse too:
      # liveness must stay false only for wedged and gone, the two states a restart repairs.
      - name: Redis readiness must prove it can serve, and its liveness must not CrashLoop it
        run: python3 hack/validate-redis-readiness.py .

      # Renders every chart and reads the ports its probes actually reach. uwsgi's stats socket
      # is served by the MASTER process, which never imports the application and never handles a
      # request, so with stats-http it answers 200 with every worker wedged -- a liveness probe
      # on it can never be false, which makes liveness strictly weaker than the readiness probe
      # beside it and leaves a hung API running forever with zero restarts. Four containers
      # shipped that (placement-api, neutron-server, heat-api, heat-cfn). The forbidden ports are
      # derived from the rendered uwsgi ini files rather than hardcoded, and the check covers
      # every chart and container, so a new chart cannot reintroduce it. See issue #110.
      - name: No probe may target a uwsgi stats port
        run: python3 hack/validate-probe-not-uwsgi-stats.py .

      # protocol on a ServicePort and on a ContainerPort defaults to TCP, so a port entry written
      # without one in front of a UDP-only daemon produces a Service kube-proxy programs for TCP
      # over a socket that has no TCP listener -- every datagram dropped before it reaches a pod,
      # with no error at either end, because UDP sends no reply and gnocchi's Stats.flush() logs
      # each failed measure and carries on. gnocchi-statsd shipped exactly that, in both layers
      # at once, verified against gnocchi/statsd.py's create_datagram_endpoint in the Kolla image
      # it installs. The same check found the statsd Service selecting component=statsd while its
      # DaemonSet labelled pods component=metricd, so it had no endpoints either. Renders every
      # chart: half of the gate needs no configuration and asserts that every Service port and
      # the container port it resolves to agree on protocol, which is what catches a half-revert.
      # See issue #127.
      - name: A Service in front of a UDP-only listener must declare UDP
        run: python3 hack/validate-udp-services.py .

      # revendor.py three-way merges values.yaml, so a values override survives a re-vendor by
      # itself. It never writes templates, so a template divergence has no protection at all --
      # and reverting one half of a fix while the other half stays is worse than reverting both.
      # gnocchi is the live case: Kolla images with upstream's apache start script would exec a
      # binary that is not in the image. See issue #115.
      - name: Deliberate upstream divergences must still hold
        run: python3 hack/validate-upstream-divergences.py .

      - name: roleMapping must name real CMP roles
        run: python3 hack/validate-rolemapping.py .

      # Compiles the RENDERED scripts, not the templates: the templates contain Go directives
      # and no textual substitution parses them in every context. A SyntaxWarning today is an
      # error in a later Python, and these run inside containers at install time where nobody
      # reads warnings -- the keystone fernet init container was emitting one.
      - name: Shipped python must compile without warnings
        run: python3 hack/validate-shipped-python.py .

      # A dep naming a component that does not exist is never Ready, so the dependent is never
      # emitted and nothing reports an error -- and an install stopped partway looks identical
      # to a healthy install in its first minutes. Same for a cycle, and for a kind that
      # core-provider does not serve. Also renders all 35 charts; 30 are compute-tier and have
      # never been installed anywhere, since libvirt needs /dev/kvm and ovs needs kernel modules.
      - name: Component DAG must be closed, acyclic and renderable
        run: python3 hack/validate-component-dag.py .

      # The gate above proves the DECLARED graph is acyclic, and that is not enough: the compute
      # tier of a 4-node GKE install of profile=full deadlocked while it was (#110). neutron's
      # agents will not start until Service nova-api has endpoints -- upstream openstack-helm's
      # own kubernetes-entrypoint wait, unchanged here -- so with nova's creation gated on
      # neutron's READINESS, neutron could not become Ready until nova existed and nova was not
      # created until neutron was Ready. The cycle ran through two dimensions at once and neither
      # gate that looks at one of them could see it. Nothing reported an error: 3 of neutron's 73
      # managed children were simply never ready.
      #
      # Readiness is still the default creation gate, because it is what sequences a dependent
      # behind a dependency that works; the edges relaxed to existence are declared in the
      # umbrella's values. This renders all 35 charts, builds the graph of every wait in them,
      # and checks the relax-set in BOTH directions: every cycle must be broken by a declared
      # relaxation (a new chart that introduces one fails here instead of deadlocking an
      # install), and every declared relaxation must still be inside a cycle (so the set cannot
      # accrete, and a blanket switch to existence fails as ~85 unnecessary relaxations). The fix
      # and its guard are the same change.
      - name: The creation gate's relax-set must be exactly the cycles that need it
        run: python3 hack/validate-readiness-deadlock.py .

      # The two gates above judge the graph: that it is well formed, and that its runtime wait
      # consequences are not deadlocked. Neither looks at what a component's rendered config
      # points at, which is how gnocchi shipped declaring `deps: [keystone,
      # mariadb]` while its config said `indexer.driver: postgresql` and `storage.driver:
      # ceph` -- two backends with no component in this blueprint. On a 4-node GKE install of
      # the full profile its pods sat in Init reporting `Service postgresql ... has no ready
      # endpoints`, with every gate green. This checks the rendered kubernetes-entrypoint
      # waits and the rendered backend identities against each component's declared
      # transitive closure. See issue #115.
      - name: Rendered config may only reference declared dependencies
        run: python3 hack/validate-component-config-closure.py .

      # The gates above judge what the components point at. None of them asks whether any node
      # can run the pods at all, and that is how a fresh GKE install came to stall with 5 pods
      # Pending on a label the README documents in both of its install sequences: the scheduler
      # says "4 node(s) didn't match Pod's node affinity/selector" and names neither the label
      # nor the chart, so it was found by diffing a working cluster's node labels against the
      # broken one's. A precondition that can only be noticed by reading prose eventually is
      # not noticed.
      #
      # It is also not one label. The umbrella now refuses to render when the cluster's nodes
      # carry none of the labels the SELECTED components need, and this asserts that mechanism:
      # that the required set is exactly what the 35 charts' rendered pods select on (4 labels,
      # not the 6 a values-key scan finds -- sriov and openstack-node belong to manifests that
      # are off by default and requiring them would refuse installs that are fine), that the
      # node list is looked up once and above the component loop, that the lookup stays guarded
      # (the controller's generated role cannot list nodes, and a refused `lookup` is a template
      # error that would fail every reconcile), and that the decision itself fires -- exercised
      # with synthetic node lists, once per required label, since a check narrowed to the
      # dominant label would otherwise look green.
      - name: The node labels the selected components need must be checked, not documented
        run: python3 hack/validate-node-label-preconditions.py .

      # The gates above all judge WHAT is installed. This one judges the API version it is
      # emitted at, which is the only thing that decides whether an upgrade lands on the
      # release that is already running. The composition apiVersion is derived from the chart
      # version, so until #303 every bump changed every object's GVK, helm deleted and recreated
      # each Composition, the new UID produced a new release name, and each component ended up
      # with two helm releases -- one running its workloads and one that can never succeed,
      # because its Deployments would have to change a spec.selector Kubernetes will not let
      # them change. Measured: mariadb-92wd4czz at revisions 4,5,6 all FAILED beside
      # mariadb-9c847c79 rev 2 DEPLOYED and serving the database.
      #
      # So an existing Composition is emitted at its krateo.io/composition-origin-version stamp
      # and only a new one at the current version, and this asserts the whole mechanism: that
      # the call site uses it, that the annotation key is core-provider's and written once, that
      # every branch of the decision is right (including the dangerous one -- a stamped version
      # the CRD no longer serves must fall back, because emitting it 500s the render and a
      # release that stops rendering gets uninstalled), that no cluster-wide lookup was added,
      # and -- differentially, against a counterfactual chart with the pin removed -- that the
      # offline render is byte-identical. It also asserts the pin's two silent costs are
      # documented: a narrower origin schema DROPS values properties added after it, and
      # approving instance migration defeats the pin.
      - name: An existing Composition must be emitted at the version it was created at
        run: python3 hack/validate-origin-version-pin.py .

  image-tags:
    # Gating, and offline. A rebuildable tag -- `latest`, or any variant containing it --
    # resolves forever and may resolve to different bytes each time, so `preflight-refs`
    # reporting "all references resolve" says nothing about whether the chart version still
    # identifies what it installs. 49 such tags were live across 34 of 35 charts while every
    # check we had passed (#69).
    #
    # This runs the immutability half only, which needs no registry calls and takes ~3s, so it
    # can gate every PR. The full resolution run stays on its weekly schedule because it makes
    # ~450 network requests. Without this gate the next re-vendor (#56) silently reintroduces
    # all of them: upstream's values carry `latest` and a three-way merge takes them back.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every image tag must be immutable
        run: python3 hack/preflight-refs.py . --mutable-only

  examples-apiversion:
    # Gating. core-provider derives the served group version from the chart version, so a literal
    # `composition.krateo.io/vX-Y-Z` in an example is correct for exactly one release and wrong
    # for every other. They had drifted to v0-2-0, a chart version no longer published under this
    # org, which made the quickstart's final `kubectl apply` impossible on a fresh cluster -- and
    # nothing objected, because an example is not rendered, linted or installed by CI.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Examples must not pin a literal composition apiVersion
        run: |
          set -uo pipefail
          bad=$(grep -rnE 'composition\.krateo\.io/v[0-9]+-[0-9]+-[0-9]+' examples/ || true)
          if [ -n "$bad" ]; then
            echo "$bad" | sed 's/^/  /'
            echo
            echo "Examples must carry composition.krateo.io/COMPOSITION_API_VERSION, which the"
            echo "release stamps from the tag and publishes as a release asset. A literal version"
            echo "here is wrong for every release but one."
            exit 1
          fi
          # Counted rather than using grep -L: GNU grep honours the LAST of -L/-l while BSD grep
          # does not, so a -Ll combination passes on macOS and fails on a runner. Counts mean the
          # same thing everywhere.
          total=$(find examples -maxdepth 1 -name '*.yaml' | wc -l | tr -d ' ')
          withph=$(grep -l COMPOSITION_API_VERSION examples/*.yaml 2>/dev/null | wc -l | tr -d ' ')
          if [ "$total" = "0" ] || [ "$total" != "$withph" ]; then
            echo "$withph of $total examples/*.yaml carry COMPOSITION_API_VERSION; all must."
            grep -L COMPOSITION_API_VERSION examples/*.yaml 2>/dev/null | sed 's/^/  missing: /' || true
            exit 1
          fi
          echo "all $total example(s) defer their apiVersion to the release stamp"

  chart-deps:
    # Gating. Every chart declares helm-toolkit at a file:// path; before charts/helm-toolkit was
    # shared, that path did not exist on a clean clone and resolution had never once succeeded --
    # rendering worked only because 34 byte-identical copies were committed under charts/, and the
    # release swallowed the failure with `|| true`. Nothing would have noticed the copies going away
    # until every template failed at install.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        # Resolution validates chart metadata, and the literal placeholder is not valid semver.
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: Every chart's declared dependencies must resolve
        run: |
          set -euo pipefail
          # --skip-refresh: the only dependency is a local path, so no remote index is involved.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" --skip-refresh
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" --skip-refresh
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)
