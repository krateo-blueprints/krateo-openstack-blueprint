name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
#
# The two checks differ in authority, deliberately. Rendering a real chart can fail for reasons
# that are nobody's bug (values it cannot guess, private dependencies), so the render job only
# warns. Validating a chart's defaults against its own schema needs neither, so values-schema
# gates: issue #53 was a schema violation that the render job had already surfaced, as one more
# warning among the dependency noise, and it reached main anyway.
on:
  pull_request:
    paths:
      - "**"
  # Also on main. Every gate here ran on its own pull request and none had ever run on main:
  # the last lint run on main was 2026-08-11, while seven pull requests merged after it. Each
  # was gated against the base it branched from, never against the result of combining them, so
  # two changes that each pass can merge into a main that does not and nothing says so.
  #
  # It matters more because release-tag.yaml fires on a tag push: a release publishes 36 charts
  # from whatever main happens to contain, and until now that tree had not been linted. 0.3.26
  # was cut that way. It passes -- checked every gate against it by hand -- but passing by luck
  # and passing by construction are different properties, and only one of them holds next time.
  push:
    branches:
      - main
  # The merge queue (docs/release.md, "How a pull request merges"): each merge group is tested as it will exist on
  # main before it lands, and these jobs are its required checks (hack/merge-queue-ruleset.json). paths filters do not
  # apply here; every job runs, as on pull_request.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

jobs:
  # krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by
  # commit SHA with the tag it carries in a comment, `# X.Y.Z` (krateo-platformops/.github is tagged from 1.0.0;
  # resolve a tag with `^{}` when pinning and when reviewing). The shared check refuses any that is not.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@f0bbd3da219685bafb130e77922c192558972a43 # 1.4.4

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

  values-schema:
    # Gating. A chart whose own defaults violate its own schema cannot be installed at all:
    # Helm validates values before it renders, so `helm install` of the blueprint fails and
    # chart-inspector answers 500. See hack/validate-values-schema.py for why it renders a
    # throwaway chart rather than the real one.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Checks: hack/gates.d/*.yaml with `job: values-schema`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job values-schema)
        run: python3 hack/run-gates.py --job values-schema .

  umbrella-crd-size:
    # Gating. The umbrella's generated Openstack CRD is stored once per version it still serves,
    # and pinned components keep several served at once. #209's first fix embedded every
    # component schema in componentValues and made this CRD four times larger. This job generates
    # it with the same crdgen core-provider uses (plumbing v1.28.1, pinned in the module) and
    # enforces two bounds, explained in the program:
    #   1. one served version <= 128 KiB, the design bound, which the embedded design fails;
    #   2. one version x 4 served versions <= 1 MiB, the etcd-level bound (4 is an assumption).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: hack/umbrella-crd-size/go.mod
          cache-dependency-path: hack/umbrella-crd-size/go.sum

      # Checks: hack/gates.d/*.yaml with `job: umbrella-crd-size`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job umbrella-crd-size)
        run: python3 hack/run-gates.py --job umbrella-crd-size .

  powerdns-runs:
    # Gating, and the only job here that starts a server. The powerdns chart merged with 28 offline
    # gates green and could not start: settings removed from 4.9, a privileged port, and
    # credentials the server never read. This runs the pods the chart renders against a real
    # MariaDB. See hack/smoke-powerdns.py for what it does not cover.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # Checks: hack/gates.d/*.yaml with `job: powerdns-runs`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job powerdns-runs)
        run: python3 hack/run-gates.py --job powerdns-runs .

  migrate-to-pvc:
    # Gating. Up to 0.3.35 mariadb and rabbitmq kept their state on a hostPath, and 0.3.36 moves
    # it onto a claim. Kubernetes refuses that change on an existing StatefulSet, so an existing
    # install needs hack/migrate-to-pvc.py BEFORE upgrading (#177). This runs the script against
    # each RELEASED 0.3.35 chart with real state in it, upgrades to this tree, and requires the
    # state to be readable afterwards, plus a refusal on an emptied node path. On amd64,
    # because rabbitmq cannot run on Apple Silicon (#114).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - mariadb
          - rabbitmq
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Helm 3, pinned to the library composition-dynamic-controller builds on (plumbing's
      # go.mod: helm.sh/helm/v3 v3.20.2). The default here became Helm 4, which upgrades with
      # server-side apply. mariadb-controller owns the mariadb Service's .spec.selector, because
      # it points it at the leader pod, so Helm 4 refused the upgrade with a field conflict. It
      # did that only when the controller had already written the selector: it passed on the PR
      # and failed on main. Helm 3's three-way merge leaves a field the chart does not change
      # alone, and that is what an install through Krateo does.
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Checks: hack/gates.d/*.yaml with `job: migrate-to-pvc`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job migrate-to-pvc)
        env:
          MATRIX_COMPONENT: ${{ matrix.component }}
        run: python3 hack/run-gates.py --job migrate-to-pvc .

  job-hooks:
    # Gating. A Job's pod template is immutable and Krateo patches a plain Job in place, so any
    # release that changed one -- an image bump is enough -- failed that component's upgrade while
    # the Composition still said Synced=True (#179: powerdns on 0.3.40; core-provider#403). Every
    # Job must be a post-install,post-upgrade hook (before-hook-creation, never hook-succeeded)
    # or a pre-delete teardown hook, and the hooks must run in an order their kubernetes-entrypoint
    # dependencies allow, because Helm runs them one at a time in weight order.
    #
    # Full history so it can also render the base commit and list every Job whose pod template
    # changed, which is exactly the set a plain Job would fail to upgrade.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the gate's Python dependencies
        run: pip install PyYAML

      # Checks: hack/gates.d/*.yaml with `job: job-hooks`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job job-hooks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 hack/run-gates.py --job job-hooks .

  operator-admission:
    # Gating. The offline gates render the operator-mode objects and check this repository's predicates; only an API
    # server can say whether the operators' CRDs admit them. H2 (2026-11-18) met a RabbitmqCluster that every offline
    # gate passed and GKE refused (its override PodSpec had no `containers`). This starts a kind cluster with the CRDs
    # rabbitmq-operator-blueprint ships (hack/operator-crds.yaml) and dry-runs every rendered rabbitmq.com object; then
    # (#405) installs cert-manager and both operators whole and dry-runs them again with the operators' webhooks active.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Checks: hack/gates.d/*.yaml with `job: operator-admission`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job operator-admission)
        run: python3 hack/run-gates.py --job operator-admission .

  capability-roles:
    # Gating. A capability aggregates into a predefined role via a
    # `rbac.krateo.io/aggregate-to-<role>=true` label, and nothing validates the <role>.
    # A label naming a role that does not exist is valid YAML, renders without complaint,
    # and produces a ClusterRole that is created, listed in the catalog, and joined to
    # NOTHING -- so the capability looks present and grants no access. This repo shipped
    # exactly that in all four capabilities for as long as they existed.
    #
    # Renders the chart rather than reading values, because a template that stops emitting
    # the label produces the same silent outcome and a values-level check would pass it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Without this, four of the gates below have never run. actions/setup-python ships no
      # PyYAML, and validate-keystone-readiness, validate-rolemapping, validate-shipped-python
      # and validate-component-dag each catch the ImportError, print "SKIP: PyYAML unavailable"
      # and exit 0 -- so the job goes green having checked nothing. Confirmed in the lint run on
      # main at 2026-11-01T15:39:07Z, where three of the four print SKIP on consecutive lines.
      #
      # The gate that protects the keystone fernet readiness check (#100) was among them, which
      # means the most serious defect this repo has shipped had a guard that could not fire.
      - name: Install the gates' Python dependencies
        run: pip install PyYAML

      # Checks: hack/gates.d/*.yaml with `job: capability-roles`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job capability-roles)
        run: python3 hack/run-gates.py --job capability-roles .

  capabilities-first-release:
    # Gating. The per-cluster chart `openstack-capabilities` was written for 0.3.47, slipped to
    # 0.3.48, and every doc it added still named 0.3.47 as its first release: a README reader there was
    # told to install a chart version that was never published (#230). The chart's
    # krateo.io/first-release annotation is the one source; this checks it against the release
    # tags and every "from"/"up to" claim against it. It needs the tags, hence fetch-depth 0, and
    # it fails, rather than passing, when it cannot see any.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout, with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Checks: hack/gates.d/*.yaml with `job: capabilities-first-release`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job capabilities-first-release)
        run: python3 hack/run-gates.py --job capabilities-first-release .

  image-tags:
    # Gating, and offline. A rebuildable tag -- `latest`, or any variant containing it --
    # resolves forever and may resolve to different bytes each time, so `preflight-refs`
    # reporting "all references resolve" says nothing about whether the chart version still
    # identifies what it installs. 49 such tags were live across 34 of 35 charts while every
    # check we had passed (#69).
    #
    # This runs the immutability half only, which needs no registry calls and takes ~3s, so it
    # can gate every PR. The full resolution run stays on its weekly schedule because it makes
    # ~450 network requests. Without this gate the next re-vendor (#56) silently reintroduces
    # all of them: upstream's values carry `latest` and a three-way merge takes them back.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Checks: hack/gates.d/*.yaml with `job: image-tags`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job image-tags)
        run: python3 hack/run-gates.py --job image-tags .

  examples-apiversion:
    # Gating. core-provider derives the served group version from the chart version, so a literal
    # `composition.krateo.io/vX-Y-Z` in an example is correct for exactly one release and wrong
    # for every other. They had drifted to v0-2-0, a chart version no longer published under this
    # org, which made the quickstart's final `kubectl apply` impossible on a fresh cluster -- and
    # nothing objected, because an example is not rendered, linted or installed by CI.
    #
    # Also the docs-rendering screen (hack/gates.d/check-doc-rendering.yaml), which asks GitHub's own
    # /markdown renderer whether each admonition renders as an alert box. It reads only, through
    # the job's token.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Checks: hack/gates.d/*.yaml with `job: examples-apiversion`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job examples-apiversion)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 hack/run-gates.py --job examples-apiversion .

  chart-deps:
    # Gating. Every chart declares helm-toolkit at a file:// path; before charts/helm-toolkit was
    # shared, that path did not exist on a clean clone and resolution had never once succeeded --
    # rendering worked only because 34 byte-identical copies were committed under charts/, and the
    # release swallowed the failure with `|| true`. Nothing would have noticed the copies going away
    # until every template failed at install.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Stamp the CHART_VERSION placeholder for CI
        # Resolution validates chart metadata, and the literal placeholder is not valid semver.
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      # Checks: hack/gates.d/*.yaml with `job: chart-deps`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job chart-deps)
        run: python3 hack/run-gates.py --job chart-deps .

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      # Checks: hack/gates.d/*.yaml with `job: lint`. Add a file there, never a step here.
      - name: Gates (hack/gates.d, job lint)
        run: python3 hack/run-gates.py --job lint .
