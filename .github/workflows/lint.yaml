name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
#
# The two checks differ in authority, deliberately. Rendering a real chart can fail for reasons
# that are nobody's bug (values it cannot guess, private dependencies), so the render job only
# warns. Validating a chart's defaults against its own schema needs neither, so values-schema
# gates: issue #53 was a schema violation that the render job had already surfaced, as one more
# warning among the dependency noise, and it reached main anyway.
on:
  pull_request:
    paths:
      - "**"
  # Also on main. Every gate here ran on its own pull request and none had ever run on main:
  # the last lint run on main was 2026-08-11, while seven pull requests merged after it. Each
  # was gated against the base it branched from, never against the result of combining them, so
  # two changes that each pass can merge into a main that does not and nothing says so.
  #
  # It matters more because release-tag.yaml fires on a tag push: a release publishes 35 charts
  # from whatever main happens to contain, and until now that tree had not been linted. 0.3.26
  # was cut that way. It passes -- checked every gate against it by hand -- but passing by luck
  # and passing by construction are different properties, and only one of them holds next time.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  values-schema:
    # Gating. A chart whose own defaults violate its own schema cannot be installed at all:
    # Helm validates values before it renders, so `helm install` of the blueprint fails and
    # chart-inspector answers 500. See hack/validate-values-schema.py for why it renders a
    # throwaway chart rather than the real one.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every chart's defaults must satisfy its own schema
        run: python3 hack/validate-values-schema.py .

  capability-roles:
    # Gating. A capability aggregates into a predefined role via a
    # `rbac.krateo.io/aggregate-to-<role>=true` label, and nothing validates the <role>.
    # A label naming a role that does not exist is valid YAML, renders without complaint,
    # and produces a ClusterRole that is created, listed in the catalog, and joined to
    # NOTHING -- so the capability looks present and grants no access. This repo shipped
    # exactly that in all four capabilities for as long as they existed.
    #
    # Renders the chart rather than reading values, because a template that stops emitting
    # the label produces the same silent outcome and a values-level check would pass it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every capability must aggregate to a predefined role
        run: python3 hack/validate-capability-roles.py .

      # Offline and fast. pidof identifies a process by its executable, which under an
      # emulating runtime is the emulator -- so a pidof-based probe fails forever while the
      # program runs normally, the kubelet kills a healthy process, and the pod never becomes
      # Ready. That reads as a slow environment rather than a broken probe, which is why it
      # needs a gate and not just a fix. See issue #96.
      - name: No probe may identify a process with pidof
        run: python3 hack/validate-no-pidof.py .

      # Renders the chart and inspects the probes the kubelet would receive. A readiness probe
      # that does not depend on the fernet keys lets an identity plane which cannot issue a
      # single token report Ready at every layer, including the umbrella's own condition --
      # and a revert of the fix is as invisible as the bug was. See issue #99.
      - name: Keystone readiness must require the fernet keys
        run: python3 hack/validate-keystone-readiness.py .

      # The schema types cmpRole as a free string and only describes it as a CMP role or
      # capability name, so an invented name validates cleanly and binds nothing. That is
      # how the defaults came to read openstack-viewer / openstack-operator /
      # openstack-admin, which match neither the six predefined roles nor any capability.
      - name: roleMapping must name real CMP roles
        run: python3 hack/validate-rolemapping.py .

      # Compiles the RENDERED scripts, not the templates: the templates contain Go directives
      # and no textual substitution parses them in every context. A SyntaxWarning today is an
      # error in a later Python, and these run inside containers at install time where nobody
      # reads warnings -- the keystone fernet init container was emitting one.
      - name: Shipped python must compile without warnings
        run: python3 hack/validate-shipped-python.py .

      # A dep naming a component that does not exist is never Ready, so the dependent is never
      # emitted and nothing reports an error -- and an install stopped partway looks identical
      # to a healthy install in its first minutes. Same for a cycle, and for a kind that
      # core-provider does not serve. Also renders all 34 charts; 29 are compute-tier and have
      # never been installed anywhere, since libvirt needs /dev/kvm and ovs needs kernel modules.
      - name: Component DAG must be closed, acyclic and renderable
        run: python3 hack/validate-component-dag.py .

  image-tags:
    # Gating, and offline. A rebuildable tag -- `latest`, or any variant containing it --
    # resolves forever and may resolve to different bytes each time, so `preflight-refs`
    # reporting "all references resolve" says nothing about whether the chart version still
    # identifies what it installs. 49 such tags were live across 34 of 35 charts while every
    # check we had passed (#69).
    #
    # This runs the immutability half only, which needs no registry calls and takes ~3s, so it
    # can gate every PR. The full resolution run stays on its weekly schedule because it makes
    # ~450 network requests. Without this gate the next re-vendor (#56) silently reintroduces
    # all of them: upstream's values carry `latest` and a three-way merge takes them back.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every image tag must be immutable
        run: python3 hack/preflight-refs.py . --mutable-only

  examples-apiversion:
    # Gating. core-provider derives the served group version from the chart version, so a literal
    # `composition.krateo.io/vX-Y-Z` in an example is correct for exactly one release and wrong
    # for every other. They had drifted to v0-2-0, a chart version no longer published under this
    # org, which made the quickstart's final `kubectl apply` impossible on a fresh cluster -- and
    # nothing objected, because an example is not rendered, linted or installed by CI.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Examples must not pin a literal composition apiVersion
        run: |
          set -uo pipefail
          bad=$(grep -rnE 'composition\.krateo\.io/v[0-9]+-[0-9]+-[0-9]+' examples/ || true)
          if [ -n "$bad" ]; then
            echo "$bad" | sed 's/^/  /'
            echo
            echo "Examples must carry composition.krateo.io/COMPOSITION_API_VERSION, which the"
            echo "release stamps from the tag and publishes as a release asset. A literal version"
            echo "here is wrong for every release but one."
            exit 1
          fi
          # Counted rather than using grep -L: GNU grep honours the LAST of -L/-l while BSD grep
          # does not, so a -Ll combination passes on macOS and fails on a runner. Counts mean the
          # same thing everywhere.
          total=$(find examples -maxdepth 1 -name '*.yaml' | wc -l | tr -d ' ')
          withph=$(grep -l COMPOSITION_API_VERSION examples/*.yaml 2>/dev/null | wc -l | tr -d ' ')
          if [ "$total" = "0" ] || [ "$total" != "$withph" ]; then
            echo "$withph of $total examples/*.yaml carry COMPOSITION_API_VERSION; all must."
            grep -L COMPOSITION_API_VERSION examples/*.yaml 2>/dev/null | sed 's/^/  missing: /' || true
            exit 1
          fi
          echo "all $total example(s) defer their apiVersion to the release stamp"

  chart-deps:
    # Gating. Every chart declares helm-toolkit at a file:// path; before charts/helm-toolkit was
    # shared, that path did not exist on a clean clone and resolution had never once succeeded --
    # rendering worked only because 34 byte-identical copies were committed under charts/, and the
    # release swallowed the failure with `|| true`. Nothing would have noticed the copies going away
    # until every template failed at install.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        # Resolution validates chart metadata, and the literal placeholder is not valid semver.
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: Every chart's declared dependencies must resolve
        run: |
          set -euo pipefail
          # --skip-refresh: the only dependency is a local path, so no remote index is involved.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" --skip-refresh
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" --skip-refresh
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)
