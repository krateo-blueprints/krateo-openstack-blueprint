# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
name: release-tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # the CompositionDefinition release assets
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Refuse to release a commit no gate ever ran against.
      #
      # On 2026-11-02 a pull request sat with ZERO check runs. Not pending -- never created. The
      # branch existed at the right sha, CI was running normally on sibling branches minutes
      # earlier, and closing and reopening the PR did not trigger it either; the run had to be
      # dispatched by hand. Nothing distinguished that state from "the checks have not finished",
      # which is the whole problem: a quiet check list reads as success.
      #
      # That is the same defect class as the four gates which printed "SKIP: PyYAML unavailable"
      # and exited 0 for weeks (#120) -- a check that cannot fail, reported as a check that
      # passed. The remedy is the same: make the empty case loud. A release is the last point at
      # which it can be made loud before the charts are published.
      #
      # This asserts only what it can actually see: that THIS commit has a concluded, successful
      # run of the lint workflow. It does not try to prove every merged pull request had one --
      # a squash merge creates a new commit whose history does not record what ran against the
      # branch, so that claim is not available here and is not made.
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/lint.yaml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | length')
          ok=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/lint.yaml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          echo "lint runs on ${sha}: ${runs} completed, ${ok} successful"
          if [ "${runs}" -eq 0 ]; then
            echo "::error::No lint run exists for ${sha}. This is the never-triggered case, not"
            echo "::error::a pending one -- a release built here would ship charts no gate saw."
            echo "::error::Dispatch lint.yaml on this commit, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "${ok}" -eq 0 ]; then
            echo "::error::lint ran on ${sha} but never succeeded. Refusing to publish."
            exit 1
          fi

      # The Marketplace installs what the helm index at krateo-blueprints/charts lists, not what
      # GHCR holds. Nothing published there from 0.2.0 (2026-10-09) to 0.3.36, so for weeks the
      # Marketplace installed 0.2.0, which predates every fix since, while every release here
      # succeeded. The publish-index job below needs this secret. Refuse here, before anything is
      # pushed, so a missing token fails the release instead of leaving GHCR and the index at
      # different versions.
      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release could not reach the"
            echo "::error::Marketplace index and the Marketplace would keep installing an old version."
            exit 1
          fi
          # Shape as well as presence: a token with a trailing newline passes the API and then breaks
          # git, after this release has already pushed to GHCR (krateo-blueprints/charts#10). The value
          # is never printed.
          case "${CHARTS_PUBLISH_TOKEN}" in
            *[[:space:]]*|*[[:cntrl:]]*)
              echo "::error::secret CHARTS_PUBLISH_TOKEN contains whitespace or a control character, usually a"
              echo "::error::trailing newline. Re-save it by pasting at the prompt of 'gh secret set ... --org krateo-blueprints'."
              exit 1 ;;
          esac

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push every chart
        run: |
          set -euo pipefail
          # Stamp every standalone CompositionDefinition too. These sit at
          # blueprints/<component>/compositiondefinition.yaml (one level ABOVE the chart dir),
          # so the per-chart loop below never touches them — which is how all 32 drifted to a
          # hardcoded 0.2.0 while the charts published 0.3.x. Left by hand they register a
          # version that was never published; core-provider accepts it silently.
          cdcount=0
          while IFS= read -r -d '' cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; cdcount=$((cdcount+1))
          done < <(find blueprints -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "stamped ${cdcount} CompositionDefinition(s) -> ${VERSION}"

          # Ship each stamped CompositionDefinition inside its own chart, at the chart root where
          # helm packages it but never renders it. The Marketplace index refuses a chart whose
          # archive has no compositiondefinition.yaml, and an index entry is what the Marketplace
          # installs from. The copy is the stamped file, so the chart and the release asset agree.
          for dir in blueprints/*/chart; do
            cp "$(dirname "$dir")/compositiondefinition.yaml" "$dir/compositiondefinition.yaml"
          done

          find . -type f -name Chart.yaml -not -path '*/charts/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"
            # Also stamp values.yaml and values.schema.json. The openstack umbrella references its
            # OWN version there to pull its component charts, and the schema default becomes the
            # generated CRD's default — so a literal left unstamped makes every component 404 while
            # the composition still reports Ready=True. Harmless where the placeholder is absent.
            # `if` rather than `[ -f ] && ...`: under `set -e` a false test would abort the
            # whole release for any chart that simply has no values.schema.json.
            for extra in "$dir/values.yaml" "$dir/values.schema.json"; do
              if [ -f "$extra" ]; then
                sed -i "s/CHART_VERSION/${VERSION}/g" "$extra"
              fi
            done
            # No `|| true`: the only dependency is the vendored charts/helm-toolkit, so a
            # failure here means the chart is about to be packaged WITHOUT its toolkit and
            # every template would fail at install. --skip-refresh because no remote repo
            # is involved and refreshing them is pure latency.
            # `update`, not `build`: build requires a committed Chart.lock, and a lock over a
            # single file:// path carries no information worth maintaining in 35 copies.
            helm dependency update "$dir" --skip-refresh
            helm package "$dir" --version "${VERSION}" --destination .
            # Assert the archive, not the copy above. helm package exits 0 whether or not the
            # CompositionDefinition is in the chart directory, so a copy that stopped working would
            # give a green release here and a refusal at the Marketplace index after GHCR already
            # held this version. Blueprint charts only; helm-toolkit and the PoC carry none.
            case "$dir" in
              ./blueprints/*/chart)
                members=$(tar tzf "${name}-${VERSION}.tgz")
                for want in "${name}/compositiondefinition.yaml" "${name}/values.schema.json"; do
                  if ! grep -qxF "$want" <<< "$members"; then
                    echo "::error::${name}-${VERSION}.tgz lacks ${want}; refusing to push"
                    exit 1
                  fi
                done
                ;;
            esac
            # Retry: this push fails transiently. The 0.3.13 release died on
            #   failed to perform "Tag" on destination: sha256:405b...: not found
            # for one chart after others had pushed fine, and an unchanged re-run succeeded.
            # Without a retry, one registry hiccup leaves the registry holding this version for
            # some components and not others (#76).
            pushed=""
            for attempt in 1 2 3; do
              if helm push "${name}-${VERSION}.tgz" "${OCI_REPO}"; then pushed=yes; break; fi
              echo "::warning::helm push ${name}:${VERSION} failed (attempt ${attempt}/3); retrying"
              sleep $(( attempt * 10 ))
            done
            if [ -z "$pushed" ]; then
              echo "::error::helm push ${name}:${VERSION} failed after 3 attempts"
              exit 1
            fi
            echo "Published ${OCI_REPO}/${name}:${VERSION}"
            echo "::endgroup::"
          done

          # Every chart must resolve at this version before anything is published that claims
          # it does. A partial push is the dangerous state: a CompositionDefinition stamped
          # ${VERSION} referencing a chart that never pushed installs nothing while reporting a
          # version that looks valid -- the same shape as #50, a reference that resolves in form
          # but not in fact.
          #
          # `helm show chart` rather than curling the registry API, deliberately. An OCI Helm
          # chart's manifest is returned only for
          # `Accept: application/vnd.oci.image.manifest.v1+json`; ask ghcr without it and every
          # chart answers 404. A check written the obvious way would fail every release while
          # reporting that nothing had been published -- a guard worse than no guard. helm
          # speaks the right protocol by construction.
          echo "::group::verify every chart resolves at ${VERSION}"
          missing=""
          for dir in ./blueprints/*/chart; do
            name=$(basename "$(dirname "$dir")")
            if ! helm show chart "${OCI_REPO}/${name}" --version "${VERSION}" >/dev/null 2>&1; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::published incompletely at ${VERSION}; missing:${missing}"
            exit 1
          fi
          echo "all charts resolve at ${VERSION}"
          echo "::endgroup::"

          # The same bytes that went to GHCR, for the index. Blueprint charts only: helm-toolkit
          # and the proof-of-concept chart are not blueprints and the index gate would refuse them.
          mkdir -p charts-dist
          for dir in ./blueprints/*/chart; do
            name=$(awk '/^name:/{print $2; exit}' "$dir/Chart.yaml")
            mv "${name}-${VERSION}.tgz" charts-dist/
          done
          echo "kept $(find charts-dist -name '*.tgz' | wc -l | tr -d ' ') blueprint tarball(s) for the index"

      - name: Hand the blueprint tarballs to the index job
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: charts-dist/*.tgz
          if-no-files-found: error

      - name: Publish the stamped CompositionDefinitions and example Compositions as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The CompositionDefinitions committed to the repo carry the CHART_VERSION placeholder by
          # design -- #50 moved them off hardcoded versions that had drifted to a release never
          # published. But the docs tell a reader to `kubectl apply` them, and a placeholder is not
          # a version, so the documented path could not work from a clean checkout. The stamped
          # copies are the installable artifact, so publish them where the docs can point at them:
          # /releases/latest/download/ never goes stale and keeps the version out of the docs.
          mkdir -p dist
          while IFS= read -r -d '' cd; do
            comp=$(basename "$(dirname "$cd")")
            cp "$cd" "dist/compositiondefinition-${comp}.yaml"
          done < <(find blueprints -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "prepared $(ls dist | wc -l | tr -d ' ') CompositionDefinition asset(s)"

          # The node-read grant, published beside the CompositionDefinition it serves. The
          # orchestrator refuses to install components whose pods no node can run, which means
          # listing nodes, which the controller's generated role does not permit -- so without
          # this applied the check skips itself. It is a separate, administrator-applied asset
          # rather than something the chart creates for itself: the chart is able to
          # (`escalate`/`bind` are in that role) and a chart widening its own permissions should
          # be a person's decision. Carries no placeholder, so it is copied, not stamped.
          cp blueprints/openstack/node-reader-rbac.yaml dist/node-reader-rbac.yaml

          # The portal-visibility grant: without it the portal's Blueprints page, which filters
          # CompositionDefinitions by `list` permission in their namespace, shows these to nobody
          # but cluster administrators. No placeholder, so copied, not stamped.
          cp blueprints/openstack/portal-visibility-rbac.yaml dist/portal-visibility-rbac.yaml

          # The example Compositions carry COMPOSITION_API_VERSION for the same reason the CDs
          # carry CHART_VERSION: core-provider derives the served group version from the chart
          # version (0.3.8 -> v0-3-8, full major.minor.patch), so any literal in the tree is wrong
          # for every release but one. These were pinned to v0-2-0 -- a version dead under the
          # current org -- so `kubectl apply -f examples/openstack.yaml` could not work at all.
          API_VERSION="v${VERSION//./-}"
          echo "stamping examples with composition.krateo.io/${API_VERSION}"
          for ex in examples/*.yaml; do
            [ -f "$ex" ] || continue
            sed "s/COMPOSITION_API_VERSION/${API_VERSION}/g" "$ex" > "dist/example-$(basename "$ex")"
          done
          if grep -rl COMPOSITION_API_VERSION dist/ >/dev/null 2>&1; then
            echo "placeholder survived stamping in: $(grep -rl COMPOSITION_API_VERSION dist/)" >&2
            exit 1
          fi
          echo "prepared $(ls dist/example-* 2>/dev/null | wc -l | tr -d ' ') example asset(s)"

          # release-notes creates the GitHub release for this same tag, so it may not exist yet.
          # Create it idempotently rather than ordering two tag-triggered workflows against each
          # other: whichever gets there first wins and the other falls through to the upload.
          for _ in 1 2 3 4 5 6; do
            gh release view "${VERSION}" >/dev/null 2>&1 && break
            gh release create "${VERSION}" --title "${VERSION}" --notes "" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "${VERSION}" >/dev/null   # no release by now is a real failure
          gh release upload "${VERSION}" dist/*.yaml --clobber

  # The Marketplace reads https://krateo-blueprints.github.io/charts/blueprints/index.yaml and installs
  # the version its entry names. How every chart in the organisation gets there is decided once, in
  # krateo-blueprints/charts PUBLISHING.md, and enforced by its publisher.
  publish-index:
    needs: package-and-push
    # The organisation's one publisher, pinned by full commit SHA because it receives an org-wide
    # write token (krateo-blueprints/charts PUBLISHING.md rule 9); Dependabot proposes upgrades. It also
    # reads the served index and installs every chart anonymously before it succeeds.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@ae5e19976a126abf5fb99c14c78180885ef3c97b # 1.0.3
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
