# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
#
# A tag is the LAST step: the commit it lands on has already been installed on GKE from a
# pre-release (prerelease.yaml, same scripts, GHCR only, never the Marketplace index). The flow is
# in docs/release.md.
name: release-tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # the CompositionDefinition release assets
  packages: write

jobs:
  # This repository's own last word before anything is published (krateo-blueprints/charts
  # PUBLISHING.md rule 12). It runs hack/release-preflight with the tag as $1, at the tag's commit,
  # with no secrets. The hook refuses a tag whose commit has no pre-release X.Y.Z-main.g<sha7> in
  # GHCR, which happens when the commit skipped the pre-release channel or is not on main
  # (docs/release.md). Pinned like the publisher, to the same release (rule 9).
  preflight:
    uses: krateo-blueprints/charts/.github/workflows/release-preflight.yaml@788f1a6c106707ada89792f499afdcf3bc0b5d13 # 1.1.0
    with:
      version: ${{ github.ref_name }}

  package-and-push:
    # Every later step depends on this: publish-index needs package-and-push, which needs preflight.
    # A refusal therefore stamps, pushes, indexes and releases nothing.
    needs:
      - preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release is plain X.Y.Z, and nothing else. The trigger's glob already matches only that
      # shape; this is the same rule, stated by the one script that defines both shapes, so a
      # loosened trigger still cannot stamp a pre-release version (X.Y.Z-main.g<sha>, which only
      # prerelease.yaml publishes, and never to the Marketplace index). publish-charts.sh and
      # stage-release-assets.sh repeat this check, because they are where the stamping happens.
      - name: The tag is a plain X.Y.Z release version
        run: hack/release-version.sh check release "${GITHUB_REF_NAME}"

      # Refuse to release a commit no gate ever ran against (the history is in the script).
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/require-lint-passed.sh "${{ github.repository }}" "${{ github.sha }}"

      # The Marketplace installs what the helm index at krateo-blueprints/charts lists, not what
      # GHCR holds. Nothing published there from 0.2.0 (2026-10-09) to 0.3.36, so for weeks the
      # Marketplace installed 0.2.0, which predates every fix since, while every release here
      # succeeded. The publish-index job below needs this secret. Refuse here, before anything is
      # pushed, so a missing token fails the release instead of leaving GHCR and the index at
      # different versions.
      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release could not reach the"
            echo "::error::Marketplace index and the Marketplace would keep installing an old version."
            exit 1
          fi
          # Shape as well as presence: a token with a trailing newline passes the API and then breaks
          # git, after this release has already pushed to GHCR (krateo-blueprints/charts#10). The value
          # is never printed.
          case "${CHARTS_PUBLISH_TOKEN}" in
            *[[:space:]]*|*[[:cntrl:]]*)
              echo "::error::secret CHARTS_PUBLISH_TOKEN contains whitespace or a control character, usually a"
              echo "::error::trailing newline. Re-save it by pasting at the prompt of 'gh secret set ... --org krateo-blueprints'."
              exit 1 ;;
          esac

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      # Before the first push: a published index entry is never rewritten, so a dead icon would
      # stay on that version's Marketplace tile forever. A network error fails here on purpose;
      # see the script's header.
      - name: Every chart's icon resolves to an image
        run: hack/check-icons-live.sh .

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Stamp, package, assert and push every chart, then keep the blueprint tarballs for the index.
      # The logic and the history behind each of its checks live in the script, the one copy that
      # prerelease.yaml runs too, so a pre-release is built the way this release will be.
      - name: Package and push every chart
        run: hack/publish-charts.sh release "${VERSION}" "${OCI_REPO}" charts-dist

      - name: Hand the blueprint tarballs to the index job
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: charts-dist/*.tgz
          if-no-files-found: error

      - name: Publish the stamped CompositionDefinitions and example Compositions as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The stamped CompositionDefinitions, the two RBAC grants and the stamped example
          # Compositions: the files the README applies from /releases/download/<version>/. One copy
          # of that logic, shared with prerelease.yaml, which uploads the same files as an artifact.
          hack/stage-release-assets.sh release "${VERSION}" dist

          # release-notes creates the GitHub release for this same tag, so it may not exist yet.
          # Create it idempotently rather than ordering two tag-triggered workflows against each
          # other: whichever gets there first wins and the other falls through to the upload.
          for _ in 1 2 3 4 5 6; do
            gh release view "${VERSION}" >/dev/null 2>&1 && break
            gh release create "${VERSION}" --title "${VERSION}" --notes "" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "${VERSION}" >/dev/null   # no release by now is a real failure
          gh release upload "${VERSION}" dist/*.yaml --clobber

  # The Marketplace reads https://krateo-blueprints.github.io/charts/blueprints/index.yaml and installs
  # the version its entry names. How every chart in the organisation gets there is decided once, in
  # krateo-blueprints/charts PUBLISHING.md, and enforced by its publisher.
  publish-index:
    needs: package-and-push
    # The organisation's one publisher, pinned by full commit SHA because it receives an org-wide
    # write token (krateo-blueprints/charts PUBLISHING.md rule 9); Dependabot proposes upgrades. It also
    # reads the served index and installs every chart anonymously before it succeeds.
    # 1.1.0 adds rule 13: the publisher itself refuses a version that is not plain X.Y.Z.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@788f1a6c106707ada89792f499afdcf3bc0b5d13 # 1.1.0
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
