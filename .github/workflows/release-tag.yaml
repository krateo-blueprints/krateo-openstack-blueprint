# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # the CompositionDefinition release assets
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push every chart
        run: |
          set -euo pipefail
          # Stamp every standalone CompositionDefinition too. These sit at
          # blueprints/<component>/compositiondefinition.yaml (one level ABOVE the chart dir),
          # so the per-chart loop below never touches them — which is how all 32 drifted to a
          # hardcoded 0.2.0 while the charts published 0.3.x. Left by hand they register a
          # version that was never published; core-provider accepts it silently.
          cdcount=0
          while IFS= read -r -d '' cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; cdcount=$((cdcount+1))
          done < <(find blueprints -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "stamped ${cdcount} CompositionDefinition(s) -> ${VERSION}"

          find . -type f -name Chart.yaml -not -path '*/charts/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"
            # Also stamp values.yaml and values.schema.json. The openstack umbrella references its
            # OWN version there to pull its component charts, and the schema default becomes the
            # generated CRD's default — so a literal left unstamped makes every component 404 while
            # the composition still reports Ready=True. Harmless where the placeholder is absent.
            # `if` rather than `[ -f ] && ...`: under `set -e` a false test would abort the
            # whole release for any chart that simply has no values.schema.json.
            for extra in "$dir/values.yaml" "$dir/values.schema.json"; do
              if [ -f "$extra" ]; then
                sed -i "s/CHART_VERSION/${VERSION}/g" "$extra"
              fi
            done
            # No `|| true`: the only dependency is the vendored charts/helm-toolkit, so a
            # failure here means the chart is about to be packaged WITHOUT its toolkit and
            # every template would fail at install. --skip-refresh because no remote repo
            # is involved and refreshing them is pure latency.
            # `update`, not `build`: build requires a committed Chart.lock, and a lock over a
            # single file:// path carries no information worth maintaining in 34 copies.
            helm dependency update "$dir" --skip-refresh
            helm package "$dir" --version "${VERSION}" --destination .
            # Retry: this push fails transiently. The 0.3.13 release died on
            #   failed to perform "Tag" on destination: sha256:405b...: not found
            # for one chart after others had pushed fine, and an unchanged re-run succeeded.
            # Without a retry, one registry hiccup leaves the registry holding this version for
            # some components and not others (#76).
            pushed=""
            for attempt in 1 2 3; do
              if helm push "${name}-${VERSION}.tgz" "${OCI_REPO}"; then pushed=yes; break; fi
              echo "::warning::helm push ${name}:${VERSION} failed (attempt ${attempt}/3); retrying"
              sleep $(( attempt * 10 ))
            done
            if [ -z "$pushed" ]; then
              echo "::error::helm push ${name}:${VERSION} failed after 3 attempts"
              exit 1
            fi
            echo "Published ${OCI_REPO}/${name}:${VERSION}"
            echo "::endgroup::"
          done

          # Every chart must resolve at this version before anything is published that claims
          # it does. A partial push is the dangerous state: a CompositionDefinition stamped
          # ${VERSION} referencing a chart that never pushed installs nothing while reporting a
          # version that looks valid -- the same shape as #50, a reference that resolves in form
          # but not in fact.
          #
          # `helm show chart` rather than curling the registry API, deliberately. An OCI Helm
          # chart's manifest is returned only for
          # `Accept: application/vnd.oci.image.manifest.v1+json`; ask ghcr without it and every
          # chart answers 404. A check written the obvious way would fail every release while
          # reporting that nothing had been published -- a guard worse than no guard. helm
          # speaks the right protocol by construction.
          echo "::group::verify every chart resolves at ${VERSION}"
          missing=""
          for dir in ./blueprints/*/chart; do
            name=$(basename "$(dirname "$dir")")
            if ! helm show chart "${OCI_REPO}/${name}" --version "${VERSION}" >/dev/null 2>&1; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::published incompletely at ${VERSION}; missing:${missing}"
            exit 1
          fi
          echo "all charts resolve at ${VERSION}"
          echo "::endgroup::"

      - name: Publish the stamped CompositionDefinitions and example Compositions as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The CompositionDefinitions committed to the repo carry the CHART_VERSION placeholder by
          # design -- #50 moved them off hardcoded versions that had drifted to a release never
          # published. But the docs tell a reader to `kubectl apply` them, and a placeholder is not
          # a version, so the documented path could not work from a clean checkout. The stamped
          # copies are the installable artifact, so publish them where the docs can point at them:
          # /releases/latest/download/ never goes stale and keeps the version out of the docs.
          mkdir -p dist
          while IFS= read -r -d '' cd; do
            comp=$(basename "$(dirname "$cd")")
            cp "$cd" "dist/compositiondefinition-${comp}.yaml"
          done < <(find blueprints -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "prepared $(ls dist | wc -l | tr -d ' ') CompositionDefinition asset(s)"

          # The example Compositions carry COMPOSITION_API_VERSION for the same reason the CDs
          # carry CHART_VERSION: core-provider derives the served group version from the chart
          # version (0.3.8 -> v0-3-8, full major.minor.patch), so any literal in the tree is wrong
          # for every release but one. These were pinned to v0-2-0 -- a version dead under the
          # current org -- so `kubectl apply -f examples/openstack.yaml` could not work at all.
          API_VERSION="v${VERSION//./-}"
          echo "stamping examples with composition.krateo.io/${API_VERSION}"
          for ex in examples/*.yaml; do
            [ -f "$ex" ] || continue
            sed "s/COMPOSITION_API_VERSION/${API_VERSION}/g" "$ex" > "dist/example-$(basename "$ex")"
          done
          if grep -rl COMPOSITION_API_VERSION dist/ >/dev/null 2>&1; then
            echo "placeholder survived stamping in: $(grep -rl COMPOSITION_API_VERSION dist/)" >&2
            exit 1
          fi
          echo "prepared $(ls dist/example-* 2>/dev/null | wc -l | tr -d ' ') example asset(s)"

          # release-notes creates the GitHub release for this same tag, so it may not exist yet.
          # Create it idempotently rather than ordering two tag-triggered workflows against each
          # other: whichever gets there first wins and the other falls through to the upload.
          for _ in 1 2 3 4 5 6; do
            gh release view "${VERSION}" >/dev/null 2>&1 && break
            gh release create "${VERSION}" --title "${VERSION}" --notes "" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "${VERSION}" >/dev/null   # no release by now is a real failure
          gh release upload "${VERSION}" dist/*.yaml --clobber
