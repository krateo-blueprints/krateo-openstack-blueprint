# Scans every image the charts run for CRITICAL vulnerabilities, and re-asks each registry whether it still serves
# the image anonymously (#316).
#
# What is scanned is hack/images.yaml, the generated inventory that lint.yaml's offline gate keeps equal to what the
# charts render. A CRITICAL finding fails unless hack/image-cve-allowlist.yaml has an entry for that CVE, image and
# package whose expiry has not passed (hack/check-image-cves.py says why the key is all three).
#
# WHEN, and why not on every pull request. Not for speed: the first full run (44188443677) scanned all 58 images in
# 2.6 minutes of wall time, 18 runner-minutes in total. But the result changes only when an image changes or a CVE is
# published, never when a template does, and gating every pull request on a CVE published upstream would turn unrelated
# changes red on news. So it runs:
#   * on a push that changes the inventory or the allowlist, on any branch, so a pull request that changes an image
#     is scanned on that pull request (lint.yaml fails that pull request until hack/images.yaml is regenerated, and
#     the regenerated file is what triggers this);
#   * weekly, because a new CVE lands in an unchanged image;
#   * on every release tag, so each release has a scan of exactly what it ships;
#   * by hand.
# Not on pull_request as well: a pull request from this repository is already a push, and the duplicate run would
# download the same images again.
name: image-scan

on:
  push:
    branches:
      - "**"
    paths:
      - hack/images.yaml
      - hack/image-cve-allowlist.yaml
      - hack/check-image-cves.py
      - hack/gen-image-inventory.py
      - hack/image-pin-waivers.yaml
      - .github/workflows/image-scan.yaml
    # paths are not evaluated for tags: every release tag runs.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Trivy is downloaded, not run through aquasecurity/trivy-action, and checked against a digest written HERE rather
  # than against the release's own checksums file: a release whose assets and checksums were replaced together passes
  # that check, and a git tag an action is pinned to can be moved to other code. A scanner is the last component a
  # supply-chain check should take on trust. Bump both lines together.
  #
  # Anonymously, with curl, not with the org's release-download action: that action authenticates with the job's
  # token, and aquasecurity's IP allow list refuses an authenticated request from a runner ("your IP address is not
  # permitted to access this resource"), measured on this workflow's first run. A public asset needs no token.
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  inventory:
    # The registry half of the inventory, which no pull request re-measures: each image is still served anonymously,
    # in a format containerd pulls, for linux/amd64, and still serves the digest recorded for it: a pinned tag that
    # moved was re-pushed upstream and fails here (only a waived series tag may move; docs/supply-chain.md).
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: The inventory matches the charts, and every registry still answers as recorded
        run: python3 hack/gen-image-inventory.py . --resolve

      - name: The images to scan
        id: matrix
        run: |
          set -euo pipefail
          images="$(python3 hack/check-image-cves.py . --matrix)"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "$images" | python3 -c 'import json,sys; l=json.load(sys.stdin); print(len(l), "images to scan"); print("\n".join(l))'

  scan:
    # Each job downloads Trivy's vulnerability database itself, compressed, from its mirror registry. Measured on this
    # workflow's second run: downloading both databases took 25 s in one job, and uploading them unpacked as an
    # artifact took 82 s, after which every scan job would have downloaded the unpacked copy. Fetching per job costs
    # about the same and needs no artifact. (That run was cancelled on a misreading: the wait that was watching it had
    # never started. An earlier commit message says the upload stalled for 11 minutes; it did not.) The Java database
    # is not fetched up front; Trivy downloads it only for an image that contains a JAR.
    needs:
      - inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        image: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - name: Install Trivy, checked against the digest pinned in this workflow
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          "$RUNNER_TEMP/trivy-bin/trivy" --version

      - name: Scan ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          # Straight from the registry (no docker daemon), as linux/amd64, the platform every cluster here runs.
          # HIGH is reported for the record; only CRITICAL is judged (hack/check-image-cves.py).
          #
          # Up to three attempts, because a layer download can be cut short. Run 44202269356 lost
          # gnocchi-metricd that way: "failed to analyze layer ... unable to read the file: unexpected EOF".
          # The digest was the recorded one, and the same digest scanned clean before and after, but the gate
          # rightly failed on the missing report. A retry can't hide a real finding: findings are judged from
          # the report, and an image that fails all three attempts still has none, which the gate fails by
          # name. Between attempts only the layer-analysis cache is dropped; the vulnerability DB is kept.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/trivy-bin/trivy" image "$IMAGE" \
                --cache-dir "$RUNNER_TEMP/trivy-cache" \
                --image-src remote --platform linux/amd64 --scanners vuln \
                --severity CRITICAL,HIGH --timeout 30m \
                --format json --output "$RUNNER_TEMP/report/trivy.json" --exit-code 0; then
              break
            fi
            rm -f "$RUNNER_TEMP/report/trivy.json"
            if [ "$attempt" = 3 ]; then
              echo "::error::trivy could not scan $IMAGE in 3 attempts"
              exit 1
            fi
            echo "::warning::trivy attempt $attempt for $IMAGE failed; retrying"
            rm -rf "$RUNNER_TEMP/trivy-cache/fanal"
            sleep $((attempt * 15))
          done
          python3 - "$RUNNER_TEMP/report/trivy.json" <<'EOF'
          import json, sys, collections
          rep = json.load(open(sys.argv[1]))
          c = collections.Counter(v["Severity"] for r in rep.get("Results") or [] for v in r.get("Vulnerabilities") or [])
          print("%s: CRITICAL %d, HIGH %d" % (rep.get("ArtifactName"), c["CRITICAL"], c["HIGH"]))
          EOF

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report/trivy.json
          retention-days: 30

  gate:
    # Judges every report against the allowlist. Runs when a scan job failed too: the image it was scanning then has
    # no report, which this fails on by name, rather than the run reading as one red job among green ones.
    needs:
      - inventory
      - scan
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Download every report
        uses: actions/download-artifact@v8
        with:
          pattern: trivy-report-*
          path: reports

      - name: No CRITICAL vulnerability without an exception in date
        run: python3 hack/check-image-cves.py . reports
