# Per-service RabbitMQ users (#228, 0.3.69): which charts RENDER each RabbitMQ username, under which
# endpoints.oslo_messaging.auth key. Generated by rendering every chart with a sentinel per key; the credentials gate
# re-renders and fails if this map is incomplete or stale (check 15c). One username is one RabbitMQ account, so it
# has one root (item oslo-messaging-<user>) passed to EVERY chart listed under it, and no other: a username rendered
# by two charts (a cross-chart reader) would be listed under both, with one root (the identity-users.yaml rule).
# Measured 2026-11-16: every username is rendered by its own chart only; the notification consumers read other
# services' vhosts as the RabbitMQ administrator (ceilometer's [notification] messaging_urls, #281), not as their
# users. The administrator (auth.admin, rabbitmq's auth.user) is tier 1 (oslo-messaging-admin).
users:
  aodh:
    aodh: aodh
  barbican:
    barbican: barbican
  blazar:
    blazar: blazar
  ceilometer:
