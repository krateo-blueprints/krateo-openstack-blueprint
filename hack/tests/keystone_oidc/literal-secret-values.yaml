# The defect, as hack/validate-keystone-oidc-secret.py must see it refused: a client secret written
# straight into conf.wsgi_keystone, so it lands in plaintext in the Composition CR. The value below
# is a placeholder and not a credential. The keystone chart must refuse to render this.
conf:
  wsgi_keystone: |
    {{- $portInt := tuple "identity" "service" "api" $ | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
    Listen 0.0.0.0:{{ $portInt }}
    <VirtualHost *:{{ $portInt }}>
        WSGIScriptAlias / /var/www/cgi-bin/keystone/wsgi.py
        OIDCClientID "keystone"
        OIDCClientSecret "placeholder-not-a-credential"
    </VirtualHost>
