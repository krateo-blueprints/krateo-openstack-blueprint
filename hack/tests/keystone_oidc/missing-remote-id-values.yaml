# OIDC with both secrets from Secrets but no conf.keystone.openid.remote_id_attribute. Keystone's
# validate_idp (keystone 2026.1, keystone/federation/utils.py) then returns before comparing the
# token's issuer with the identity provider's remote_ids, so remote_ids constrain nothing, and
# keystone-api runs without a warning. The keystone chart must refuse it at render time instead.
oidc:
  clientSecretRef:
    name: keystone-oidc-client
    key: client-secret
  cryptoPassphraseRef:
    name: keystone-oidc-crypto
    key: passphrase
conf:
  wsgi_keystone: |
    {{- $portInt := tuple "identity" "service" "api" $ | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
    Listen 0.0.0.0:{{ $portInt }}
    <VirtualHost *:{{ $portInt }}>
        WSGIScriptAlias / /var/www/cgi-bin/keystone/wsgi.py
        OIDCClientID "keystone"
        <Location "/v3/auth/OS-FEDERATION/identity_providers/keycloak/protocols/openid/websso">
            AuthType "openid-connect"
            Require valid-user
        </Location>
    </VirtualHost>
