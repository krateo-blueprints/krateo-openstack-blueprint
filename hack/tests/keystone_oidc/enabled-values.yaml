# Keystone with OIDC federation and its client secret from a Secret, as
# hack/validate-keystone-oidc-secret.py renders it. The VirtualHost carries a complete
# mod_auth_openidc client with NO OIDCClientSecret of its own: the chart renders that directive
# from oidc.clientSecretRef. The provider endpoints are static and point at 127.0.0.1:9999, a
# stand-in token endpoint (TLS, self-signed) that the image-level proof runs next to Apache. It is
# a fixture, not a deployable configuration.
#
# OIDCCryptoPassphrase is a secret too. This fixture reads it from an env var the same way, but the
# chart does not inject that one yet, so a real install has to.
oidc:
  clientSecretRef:
    name: keystone-oidc-client
    key: client-secret
conf:
  wsgi_keystone: |
    {{- $portInt := tuple "identity" "service" "api" $ | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
    Listen 0.0.0.0:{{ $portInt }}

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    ErrorLogFormat "%{cu}t %M"
    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined

    <VirtualHost *:{{ $portInt }}>
        WSGIDaemonProcess keystone-public processes=1 threads=1 user=keystone group=keystone display-name=%{GROUP}
        WSGIProcessGroup keystone-public
        WSGIScriptAlias / /var/www/cgi-bin/keystone/wsgi.py
        WSGIApplicationGroup %{GLOBAL}
        WSGIPassAuthorization On
        ErrorLogFormat "%{cu}t %M"
        ErrorLog /dev/stdout

        OIDCClaimPrefix "OIDC-"
        OIDCResponseType "code"
        OIDCScope "openid email profile"
        OIDCProviderIssuer "http://127.0.0.1:9999/realms/openstack"
        OIDCProviderAuthorizationEndpoint "https://127.0.0.1:9999/realms/openstack/protocol/openid-connect/auth"
        OIDCProviderTokenEndpoint "https://127.0.0.1:9999/realms/openstack/protocol/openid-connect/token"
        OIDCProviderTokenEndpointAuth client_secret_basic
        OIDCProviderJwksUri "https://127.0.0.1:9999/realms/openstack/protocol/openid-connect/certs"
        # The stand-in endpoint uses a throwaway self-signed certificate. Never in a real install.
        OIDCSSLValidateServer Off
        OIDCClientID "keystone"
        OIDCCryptoPassphrase ${OIDC_CRYPTO_PASSPHRASE}
        OIDCRedirectURI "http://127.0.0.1:{{ $portInt }}/v3/auth/OS-FEDERATION/identity_providers/keycloak/protocols/openid/websso/redirect"

        <Location "/v3/auth/OS-FEDERATION/identity_providers/keycloak/protocols/openid/websso">
            AuthType "openid-connect"
            Require valid-user
        </Location>
    </VirtualHost>
