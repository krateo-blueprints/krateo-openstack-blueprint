component: glance
issue: 308
reason: >-
  Moving the image store to rbd stops glance mounting the glance-images claim, which keep_pvc keeps, so every image
  recorded with a file location becomes unreadable. Refused while the claim exists, until the operator confirms the
  images were migrated; the claim is read by the same single lookup the size uses.
assertions:
  - file: templates/secret-ceph-projections.yaml
    present: (not .Values.krateo.imagesMigratedFromPvc)
    why: The refusal. hack/validate-glance-store.py renders it with a stand-in live claim.
  - file: templates/_images_volume_size.tpl
    present: define "glance.images_claim"
    why: The one read of the claim, shared by the size and the refusal.
