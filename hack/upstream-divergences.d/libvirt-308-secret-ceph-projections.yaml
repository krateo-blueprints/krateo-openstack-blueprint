component: libvirt
issue: 308
reason: >-
  Upstream places the client.admin keyring on every hypervisor to create or fetch the cinder user's key. With a ceph
  storage.backend, libvirt defines its secret from a projection of the key Ceph minted, and no admin key is placed.
assertions:
  - file: templates/secret-ceph-projections.yaml
    present: helm-toolkit.manifests.ceph_projections
    why: The keyring and ceph.conf projections.
  - file: templates/daemonset-libvirt.yaml
    present: "secretName: libvirt-ceph-cinder-keyring"
    why: The projected key, in place of ceph_client.user_secret_name (client.admin).
  - file: templates/bin/_ceph-keyring.sh.tpl
    present: helm-toolkit.utils.ceph_managed
    why: Writes the keyring from the projection instead of running `ceph auth get-or-create` with client.admin.
  - file: templates/daemonset-libvirt.yaml
    present: helm-toolkit.snippets.ceph_key_checksum
    why: libvirt defines its secret once at start, so it must restart when the live key changes (check 18c).
