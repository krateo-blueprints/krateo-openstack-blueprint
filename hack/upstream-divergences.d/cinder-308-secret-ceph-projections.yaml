component: cinder
issue: 308
reason: >-
  Upstream reaches Ceph through client.admin: storage-init mounts the admin keyring, creates the pool and the user,
  and writes the user's key into a Secret. With a ceph storage.backend, cinder consumes a projection of the key Ceph
  minted (a Rook CephClient, or the Ceph admin) and storage-init only checks the pool with that user's own key.
assertions:
  - file: templates/secret-ceph-projections.yaml
    present: helm-toolkit.manifests.ceph_projections
    why: The keyring and ceph.conf projections; without them cinder-volume mounts Secrets nothing creates.
  - file: templates/job-storage-init.yaml
    present: "{{- if not $managed }}"
    why: >-
      Ceph-managed, the Job writes no Secret and gets no Role on Secrets, and places the user's keyring rather than
      client.admin's. hack/validate-ceph-consumer.py (check 28) renders it.
  - file: templates/bin/_storage-init.sh.tpl
    present: rbd --id
    why: The ceph-managed check, with the user's own key, in place of `ceph auth` and `osd pool create`.
  - file: templates/deployment-volume.yaml
    present: helm-toolkit.snippets.ceph_key_checksum
    why: cinder-volume restarts when the live key changes (check 18c).
  - file: templates/statefulset-volume.yaml
    present: helm-toolkit.snippets.ceph_key_checksum
    why: As for the Deployment.
