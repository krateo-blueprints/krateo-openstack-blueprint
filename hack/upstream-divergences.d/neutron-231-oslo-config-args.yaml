component: neutron
issue: 231
reason: >-
  0.3.74 defect B. The 2026.1 images' oslo.service threading backend and cotyledon rewrite a worker's /proc
  cmdline into a title, so the worker readiness probe could neither find the program by argv nor read its
  --config-file arguments from it, and 14 titled workers never became Ready. Each probed program's
  configuration is now one list, neutron.config_args.bgp_dragent, neutron.config_args.ironic_agent, neutron.config_args.rpc_server in templates/_config-args.tpl, rendered by
  helm-toolkit.snippets.oslo_config_args into both its start script and its probe. Upstream's scripts carry
  the arguments literally, so a re-vendor would silently fork the list the probe reads from the one the program
  starts with (hack/validate-probe-config-args.py would still pass while the two literal copies agreed).
assertions:
  - file: templates/bin/_neutron-bgp-dragent.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "neutron.config_args.bgp_dragent"'
    why: >-
      The start script's exec line renders neutron.config_args.bgp_dragent; a literal argument list here forks the one definition the probe reads too.
  - file: templates/daemonset-bgp-dragent.yaml
    present: '"config" (include "neutron.config_args.bgp_dragent" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_neutron-ironic-agent.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "neutron.config_args.ironic_agent"'
    why: >-
      The start script's exec line renders neutron.config_args.ironic_agent; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-ironic-agent.yaml
    present: '"config" (include "neutron.config_args.ironic_agent" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_neutron-rpc-server.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "neutron.config_args.rpc_server"'
    why: >-
      The start script's exec line renders neutron.config_args.rpc_server; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-rpc_server.yaml
    present: '"config" (include "neutron.config_args.rpc_server" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
