component: cinder
issue: 231
reason: >-
  0.3.74 defect B. The 2026.1 images' oslo.service threading backend and cotyledon rewrite a worker's /proc
  cmdline into a title, so the worker readiness probe could neither find the program by argv nor read its
  --config-file arguments from it, and 14 titled workers never became Ready. Each probed program's
  configuration is now one list, cinder.config_args.backup, cinder.config_args.scheduler, cinder.config_args.volume in templates/_config-args.tpl, rendered by
  helm-toolkit.snippets.oslo_config_args into both its start script and its probe. Upstream's scripts carry
  the arguments literally, so a re-vendor would silently fork the list the probe reads from the one the program
  starts with (hack/validate-probe-config-args.py would still pass while the two literal copies agreed).
assertions:
  - file: templates/bin/_cinder-backup.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "cinder.config_args.backup"'
    why: >-
      The start script's exec line renders cinder.config_args.backup; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-backup.yaml
    present: '"config" (include "cinder.config_args.backup" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_cinder-scheduler.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "cinder.config_args.scheduler"'
    why: >-
      The start script's exec line renders cinder.config_args.scheduler; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-scheduler.yaml
    present: '"config" (include "cinder.config_args.scheduler" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_cinder-volume.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "cinder.config_args.volume"'
    why: >-
      The start script's exec line renders cinder.config_args.volume; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-volume.yaml
    present: '"config" (include "cinder.config_args.volume" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/statefulset-volume.yaml
    present: '"config" (include "cinder.config_args.volume" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
