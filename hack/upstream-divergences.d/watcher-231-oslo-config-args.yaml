component: watcher
issue: 231
reason: >-
  0.3.74 defect B. The 2026.1 images' oslo.service threading backend and cotyledon rewrite a worker's /proc
  cmdline into a title, so the worker readiness probe could neither find the program by argv nor read its
  --config-file arguments from it, and 14 titled workers never became Ready. Each probed program's
  configuration is now one list, watcher.config_args.applier, watcher.config_args.decision_engine in templates/_config-args.tpl, rendered by
  helm-toolkit.snippets.oslo_config_args into both its start script and its probe. Upstream's scripts carry
  the arguments literally, so a re-vendor would silently fork the list the probe reads from the one the program
  starts with (hack/validate-probe-config-args.py would still pass while the two literal copies agreed).
assertions:
  - file: templates/bin/_watcher-applier.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "watcher.config_args.applier"'
    why: >-
      The start script's exec line renders watcher.config_args.applier; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-applier.yaml
    present: '"config" (include "watcher.config_args.applier" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_watcher-decision-engine.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "watcher.config_args.decision_engine"'
    why: >-
      The start script's exec line renders watcher.config_args.decision_engine; a literal argument list here forks the one definition the probe reads too.
  - file: templates/statefulset-decision-engine.yaml
    present: '"config" (include "watcher.config_args.decision_engine" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
