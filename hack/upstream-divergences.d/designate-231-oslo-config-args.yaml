component: designate
issue: 231
reason: >-
  0.3.74 defect B. The 2026.1 images' oslo.service threading backend and cotyledon rewrite a worker's /proc
  cmdline into a title, so the worker readiness probe could neither find the program by argv nor read its
  --config-file arguments from it, and 14 titled workers never became Ready. Each probed program's
  configuration is now one list, designate.config_args.central, designate.config_args.producer, designate.config_args.worker in templates/_config-args.tpl, rendered by
  helm-toolkit.snippets.oslo_config_args into both its start script and its probe. Upstream's scripts carry
  the arguments literally, so a re-vendor would silently fork the list the probe reads from the one the program
  starts with (hack/validate-probe-config-args.py would still pass while the two literal copies agreed).
assertions:
  - file: templates/bin/_designate-central.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "designate.config_args.central"'
    why: >-
      The start script's exec line renders designate.config_args.central; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-central.yaml
    present: '"config" (include "designate.config_args.central" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_designate-producer.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "designate.config_args.producer"'
    why: >-
      The start script's exec line renders designate.config_args.producer; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-producer.yaml
    present: '"config" (include "designate.config_args.producer" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
  - file: templates/bin/_designate-worker.sh.tpl
    present: 'include "helm-toolkit.snippets.oslo_config_args" (dict "args" (include "designate.config_args.worker"'
    why: >-
      The start script's exec line renders designate.config_args.worker; a literal argument list here forks the one definition the probe reads too.
  - file: templates/deployment-worker.yaml
    present: '"config" (include "designate.config_args.worker" $envAll | fromYamlArray)'
    why: >-
      The worker readiness probe is given the program's configuration from the same definition its exec line renders.
