component: glance
issue: 308
reason: >-
  As for cinder: upstream's rbd store reaches Ceph through client.admin in storage-init. With a ceph storage.backend
  and storage.ceph.glanceStore rbd, glance consumes a projection of the key Ceph minted.
assertions:
  - file: templates/secret-ceph-projections.yaml
    present: helm-toolkit.manifests.ceph_projections
    why: The keyring and ceph.conf projections.
  - file: templates/job-storage-init.yaml
    present: "{{- if $managed }}"
    why: The ceph-managed keyring placement, with the user's key and no client.admin.
  - file: templates/bin/_storage-init.sh.tpl
    present: rbd --id
    why: The ceph-managed check in place of `ceph auth` and `osd pool create`.
  - file: templates/deployment-api.yaml
    present: helm-toolkit.snippets.ceph_key_checksum
    why: glance-api restarts when the live key changes (check 18c).
