# The containers that use RabbitMQ, per chart with a per-service RabbitMQ user (#228, 0.3.69). Read by
# hack/validate-credentials.py check 22m: a container that mounts a config which carried the user's transport URL receives
# the drop-in <chart>-transport exactly when it is listed here, and every other one must NOT, so the RabbitMQ password
# reaches no program that cannot use it. A listed container that no render shows reading the config fails (a list that
# keeps entries nothing checks stops meaning anything). Main containers only: an init container shares its pod's
# projected config volume, on the same node, and none of them starts an OpenStack program.
#
# The rule: a container is listed when its program sends or receives over RabbitMQ, or would once a setting an install
# can change is set (a notification driver, barbican's [queue] enable); a program that never creates an RPC client or
# server or a notifier that sends, whatever is set, is not, even when it parses the URL (oslo.messaging builds a
# transport lazily and connects on the first send or listen: transport.py:_get_transport, impl_rabbit's ConnectionPool).
# Measured 2026-11-16 from the programs' source at stable/2026.1 (each project's console_scripts entry point, followed
# into main() and the subcommand):
#   - one-shot programs that never connect (not listed): helm-toolkit's db-init.py and db-drop.py (MariaDB only), the
#     bootstrap Jobs (the openstack client), aodh-dbsync, aodh-expirer, barbican-db-manage, blazar-db-manage,
#     ceilometer-upgrade, cinder-manage db sync/purge, cloudkitty-dbsync, cloudkitty-storage-init, cyborg-dbsync,
#     designate-manage database sync and service clean, glance-manage db_sync and db_load_metadefs, heat-manage
#     db_sync/service clean/purge_deleted, ironic-dbsync, keystone-manage fernet/credential/domain_config_upload,
#     magnum-db-manage, manila-manage, masakari-manage, mistral-db-manage, neutron-db-manage, neutron-ovn-db-sync-util,
#     octavia-db-manage, tacker-db-manage, trove-manage, watcher-db-manage. (cyborg-dbsync, designate-manage service
#     clean, ironic-dbsync and watcher-db-manage build a transport through rpc.init and never send on it);
#   - one-shot programs that do: cinder-volume-usage-audit (rpc.init, sends volume.usage notifications), keystone-manage
#     bootstrap (in keystone-db-sync: audit notifications as it creates the domain and project, when a driver is set),
#     and every nova-manage (nova.config.parse_args runs rpc.init; and nova formats the cell mapping templates of
#     db-sync, cell-setup and archive-deleted-rows from [DEFAULT] transport_url, check 24b);
#   - long-running programs that never connect (not listed): neutron-netns-cleanup (no rpc.init), neutron-ovn-agent and
#     neutron-ovn-metadata-agent (rpc.init, then no RPC client, server or notifier: OVSDB only), octavia-health-manager,
#     octavia-housekeeping and octavia-driver-agent (rpc.init, then in-process failover and rotation flows, which send
#     no notification);
#   - every other long-running program is an RPC server or client (nova, neutron's server and RPC agents, cinder,
#     heat, ...), or sends notifications under a setting (glance-api and keystone with a driver other than noop,
#     aodh-api, barbican-api with [queue] enable). neutron's bgp-dragent, l2gw, ironic and ovn-vpn agents are RPC agents
#     of the ML2/OVS kind (state reports over RPC); they are listed as they were served before 0.3.69.
