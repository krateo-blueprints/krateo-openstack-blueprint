# Per-service MariaDB users (#228, 0.3.68): which charts RENDER each MariaDB username, under which
# endpoints.<family>.auth key (family: oslo_db, oslo_db_api, oslo_db_cell0, oslo_db_persistence). Generated by rendering
# every chart with a sentinel per key; the credentials gate re-renders and fails if this map is incomplete or stale.
# One username is one MariaDB account ('<user>'@'%'), so all its keys share one root (item oslo-db-<user>). MariaDB's
# own users (admin, sst, audit, exporter) are tier 1 and not here. A key a chart defines but never renders
# (placement's oslo_db nova_api) is not a reader and is not listed.
users:
  aodh:
    aodh:
      - oslo_db.aodh
  barbican:
    barbican:
      - oslo_db.barbican
  blazar:
    blazar:
      - oslo_db.blazar
  cinder:
    cinder:
      - oslo_db.cinder
  cloudkitty:
    cloudkitty:
      - oslo_db.cloudkitty
  cyborg:
    cyborg:
      - oslo_db.cyborg
  designate:
    designate:
      - oslo_db.designate
  freezer:
    freezer:
      - oslo_db.freezer
  glance:
    glance:
      - oslo_db.glance
  gnocchi:
    gnocchi:
      - oslo_db.gnocchi
  heat:
    heat:
      - oslo_db.heat
  horizon:
    horizon:
      - oslo_db.horizon
  ironic:
    ironic:
      - oslo_db.ironic
  keystone:
    keystone:
      - oslo_db.keystone
  magnum:
    magnum:
      - oslo_db.magnum
  manila:
    manila:
      - oslo_db.manila
  masakari:
    masakari:
