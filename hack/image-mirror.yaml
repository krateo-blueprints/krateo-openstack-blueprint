# Images copied into ghcr.io/krateo-blueprints, by digest, under an immutable tag (#316, #334).
#
# Only for an image that cannot be pinned where it is published: no immutable tag upstream (the Kolla gnocchi images),
# or a pinned tag whose recorded digest moved. Every other image is pinned in place (docs/supply-chain.md).
# .github/workflows/image-mirror.yaml applies this list on main; hack/image-mirror.py --check (lint.yaml) keeps it
# consistent with hack/images.yaml. Each entry:
#   source   the upstream reference, as the inventory recorded it
#   digest   the digest to copy: the one hack/images.yaml recorded for the source (or, once the chart points at the
#            mirror, for the target), which is the build image-scan measured
#   target   ghcr.io/krateo-blueprints/images/<name>:<tag>, where the tag is dated (...-YYYYMMDD) and never reused:
#            the workflow refuses to point an existing target tag at another digest
#   issue    why this image is mirrored
#
# The registry is only where the bytes live: a user can still point any image at their own registry through the
# component's componentValues (images.tags), and the digest recorded here tells them what to copy.
mirrors:
