# Deliberate divergences from upstream openstack-helm, and the assertions that keep them.
#
# hack/revendor.py three-way merges values.yaml, so a values override survives a re-vendor
# automatically: `ours != base, theirs == base` keeps ours. It never writes templates. A template
# divergence is therefore protected by nothing at all -- anyone who refreshes a chart's templates
# from upstream by hand silently reverts it, and the revert is invisible because the values half
# of the same fix stays in place. That combination is worse than either state alone.
#
# So every intentional divergence is declared here with the reason it exists, and
# hack/validate-upstream-divergences.py asserts it still holds. A gate, not a memory.
#
# Each entry:
#   component   the blueprint whose chart diverges
#   issue       where the reasoning lives, so a future reader can judge whether it still applies
#   reason      why upstream is wrong for this repo, in one sentence
#   assertions  checks against a file, relative to blueprints/<component>/chart/
#                 absent  - this string must NOT appear outside comments
#                 present - this string MUST appear outside comments
divergences:
  - component: gnocchi
    issue: 115
    reason: >-
      Upstream points gnocchi at quay.io/attcomdev/ubuntu-source-gnocchi-* images that are Docker
      Registry v1 manifests, unpullable by any current docker, and publishes no alternative. The
      only maintained family is the official OpenStack Kolla set, which carries no apache, so the
      API cannot be served the way upstream's chart serves it.
    assertions:
      - file: templates/bin/_gnocchi-api.sh.tpl
        absent: exec apache2
        why: >-
          Kolla images have no apache2 binary and no /etc/apache2. Restoring upstream's
          `exec apache2 -DFOREGROUND` makes the API container exec a binary that is not in the
          image, so it fails instantly while the values still name the Kolla images.
      - file: templates/bin/_gnocchi-api.sh.tpl
        present: exec uwsgi
        why: >-
          Kolla ships uwsgi at /var/lib/kolla/venv/bin/uwsgi with gnocchi's standard WSGI module,
          which is how the API is served here.
      - file: templates/deployment-api.yaml
        absent: /etc/apache2/conf-enabled
        why: >-
          The wsgi-gnocchi.conf mount has nowhere to land in an image with no apache, and its
          presence signals the apache serving model has been restored.
      - file: values.yaml
        absent: attcomdev
        why: >-
          The unpullable v1-manifest images. preflight-refs' media-type check would also catch
          these, but only on its weekly network run; this catches them on every push.
      - file: values.yaml
        present: openstack.kolla/gnocchi-api
        why: The maintained replacement.
      - file: values.yaml
        absent: "composite:gnocchi+auth"
        why: >-
          Upstream's conf.paste names its composites gnocchi+auth / gnocchi+noauth, which no
          version of gnocchi has ever asked for: gnocchi/rest/app.py load_app() looks up
          "gnocchi+" + conf.api.auth_mode, which is gnocchi+keystone here. Measured in
          quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble: with upstream's names,
          `uwsgi --need-app` ends in `LookupError: No section 'gnocchi+keystone'` and
          `*** no app loaded. GAME OVER ***`, so the API serves nothing.
      - file: values.yaml
        present: "composite:gnocchi+keystone"
        why: >-
          The composite gnocchi actually asks for. hack/validate-gnocchi-readiness.py also
          asserts it in the RENDERED api-paste.ini, which is the form the container reads.
      - file: values.yaml
        absent: gnocchi.rest.VersionsController
        why: >-
          Upstream points the paste apps at gnocchi.rest.VersionsController and
          gnocchi.rest.V1Controller. gnocchi/rest/__init__.py is empty in gnocchi 4.7; the
          controllers are in gnocchi.rest.api, and paste resolves the root at app load, so
          restoring upstream's names breaks the API even with the composites fixed.
  - component: mariadb
    issue: 110
    reason: >-
      Upstream ships mariadb-controller with no probe of any kind, so a reconcile loop wedged in
      a kubernetes API call keeps the process alive, the pod Ready and the database beside it
      healthy while the selector of the master service every OpenStack service resolves to stops
      being maintained. The loop reports each completed pass to a heartbeat file and readiness
      reads it; hack/validate-mariadb-readiness.py checks the probe itself in detail.
    assertions:
      - file: templates/bin/_mariadb_controller.py.tpl
        present: def write_heartbeat
        why: >-
          Without it the loop produces nothing a probe can read, and a re-vendor that restores
          upstream's script leaves the probe watching a file nothing writes -- which fails closed
          on the component at the bottom of every dependency graph in this repo.
      - file: templates/deployment-controller.yaml
        present: mariadbControllerReadinessProbe
        why: >-
          The probe itself. Upstream's container has none, and that is the defect: the one
          failure mode this component has is invisible from outside without it.
      - file: values.yaml
        present: MARIADB_CONTROLLER_HEARTBEAT_PATH
        why: >-
          The single place the heartbeat path is set. The script's default and the probe's
          fallback agree with it, so losing it from values is the only way the three can drift
          apart without one of them changing.
