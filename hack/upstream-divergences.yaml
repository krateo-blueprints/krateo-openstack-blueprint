# Deliberate divergences from upstream openstack-helm, and the assertions that keep them.
#
# hack/revendor.py three-way merges values.yaml, so a values override survives a re-vendor
# automatically: `ours != base, theirs == base` keeps ours. It never writes templates. A template
# divergence is therefore protected by nothing at all -- anyone who refreshes a chart's templates
# from upstream by hand silently reverts it, and the revert is invisible because the values half
# of the same fix stays in place. That combination is worse than either state alone.
#
# So every intentional divergence is declared here with the reason it exists, and
# hack/validate-upstream-divergences.py asserts it still holds. A gate, not a memory.
#
# Each entry:
#   component   the blueprint whose chart diverges
#   issue       where the reasoning lives, so a future reader can judge whether it still applies
#   reason      why upstream is wrong for this repo, in one sentence
#   assertions  checks against a file, relative to blueprints/<component>/chart/
#                 absent  - this string must NOT appear outside comments
#                 present - this string MUST appear outside comments
divergences:
  - component: gnocchi
    issue: 115
    reason: >-
      Upstream points gnocchi at quay.io/attcomdev/ubuntu-source-gnocchi-* images that are Docker
      Registry v1 manifests, unpullable by any current docker, and publishes no alternative. The
      only maintained family is the official OpenStack Kolla set, which carries no apache, so the
      API cannot be served the way upstream's chart serves it.
    assertions:
      - file: templates/bin/_gnocchi-api.sh.tpl
        absent: exec apache2
        why: >-
          Kolla images have no apache2 binary and no /etc/apache2. Restoring upstream's
          `exec apache2 -DFOREGROUND` makes the API container exec a binary that is not in the
          image, so it fails instantly while the values still name the Kolla images.
      - file: templates/bin/_gnocchi-api.sh.tpl
        present: exec uwsgi
        why: >-
          Kolla ships uwsgi at /var/lib/kolla/venv/bin/uwsgi with gnocchi's standard WSGI module,
          which is how the API is served here.
      - file: templates/deployment-api.yaml
        absent: /etc/apache2/conf-enabled
        why: >-
          The wsgi-gnocchi.conf mount has nowhere to land in an image with no apache, and its
          presence signals the apache serving model has been restored.
      - file: values.yaml
        absent: attcomdev
        why: >-
          The unpullable v1-manifest images. preflight-refs' media-type check would also catch
          these, but only on its weekly network run; this catches them on every push.
      - file: values.yaml
        present: openstack.kolla/gnocchi-api
        why: The maintained replacement.
      - file: values.yaml
        absent: "composite:gnocchi+auth"
        why: >-
          Upstream's conf.paste names its composites gnocchi+auth / gnocchi+noauth, which no
          version of gnocchi has ever asked for: gnocchi/rest/app.py load_app() looks up
          "gnocchi+" + conf.api.auth_mode, which is gnocchi+keystone here. Measured in
          quay.io/openstack.kolla/gnocchi-api:2026.1-ubuntu-noble: with upstream's names,
          `uwsgi --need-app` ends in `LookupError: No section 'gnocchi+keystone'` and
          `*** no app loaded. GAME OVER ***`, so the API serves nothing.
      - file: values.yaml
        present: "composite:gnocchi+keystone"
        why: >-
          The composite gnocchi actually asks for. hack/validate-gnocchi-readiness.py also
          asserts it in the RENDERED api-paste.ini, which is the form the container reads.
      - file: values.yaml
        absent: gnocchi.rest.VersionsController
        why: >-
          Upstream points the paste apps at gnocchi.rest.VersionsController and
          gnocchi.rest.V1Controller. gnocchi/rest/__init__.py is empty in gnocchi 4.7; the
          controllers are in gnocchi.rest.api, and paste resolves the root at app load, so
          restoring upstream's names breaks the API even with the composites fixed.

  # The uwsgi stats port as a liveness target, in the four charts that shipped it. The values
  # half of each fix is protected by revendor's three-way merge; the template half is not, and
  # the template half is the one that removes the knob entirely. hack/validate-probe-not-uwsgi-
  # stats.py asserts the rendered outcome on every push; these assertions name the divergence so
  # that a hand-refresh of the templates from upstream fails immediately, with the reason, rather
  # than waiting for a later re-vendor to bring 1717 back into values as well.
  - component: placement
    issue: 110
    reason: >-
      Upstream points placement-api's liveness probe at uwsgi's stats socket (1717, with
      stats-http) via pod.probes.placement.api.liveness.port. That socket is served by the uwsgi
      master, which never imports placement and never handles a request, so it answers 200 with
      every worker wedged -- making liveness strictly weaker than the readiness probe beside it
      and leaving a hung API running forever with zero restarts.
    assertions:
      - file: templates/deployment.yaml
        absent: liveness.port
        why: >-
          Restoring `{{- if .Values.pod.probes.placement.api.liveness.port }}` restores the only
          knob that ever selected the stats port. Liveness must reach the service's own endpoint
          port, where a uwsgi worker has to serve GET / for the probe to pass.
      - file: templates/deployment.yaml
        present: failureThreshold
        why: >-
          The deliberate slack on liveness. conf uwsgi sets processes = 1, so a worker saturated
          by a slow database is not a wedged one; upstream's 5s/10s with the default threshold
          would restart placement after 30 seconds of load. Losing it turns the fix into the
          restart storm it was written to avoid.
  - component: heat
    issue: 110
    reason: >-
      Upstream points both heat-api's and heat-cfn's liveness probes at uwsgi's stats socket
      (1717, with stats-http) via pod.probes.api.heat_api.liveness.port and
      pod.probes.cfn.heat_cfn.liveness.port, with the same consequence as placement's.
    assertions:
      - file: templates/deployment-api.yaml
        absent: liveness.port
        why: >-
          Restoring the knob restores the stats-port target. GET / on the orchestration endpoint
          port returns 300 with the version document from the versionnegotiation filter, which a
          worker must run.
      - file: templates/deployment-api.yaml
        present: failureThreshold
        why: >-
          The deliberate slack on liveness; see placement's entry. Upstream ships only
          initialDelaySeconds: 10 here.
      - file: templates/deployment-cfn.yaml
        absent: liveness.port
        why: The same knob for the cloudformation API.
      - file: templates/deployment-cfn.yaml
        present: failureThreshold
        why: The same slack for the cloudformation API.
  - component: neutron
    issue: 110
    reason: >-
      Upstream points neutron-server's liveness probe at uwsgi's stats socket (1717, with
      stats-http) via pod.probes.server.server.liveness.port. A hung neutron-server then presents
      as endpoints empty, pod Running, zero restarts -- readiness withdraws it from the Service
      while liveness reports healthy forever.
    assertions:
      - file: templates/deployment-server.yaml
        absent: liveness.port
        why: >-
          Restoring the knob in serverLivenessProbeTemplate restores the stats-port target. The
          api-paste `/` pipeline carries no authtoken, so GET / on the network endpoint port
          needs no token and no backend -- only a worker.
      - file: values.yaml
        present: failureThreshold
        why: >-
          neutron's probe params come from values, not from the template, so this is where its
          liveness slack lives. Without it the probe inherits the default threshold of 3 and
          restarts a merely busy single-worker API.

  - component: gnocchi
    issue: 115
    reason: >-
      Upstream's gnocchi chart is written for a deployment that also runs postgresql and ceph:
      it ships `indexer.driver: postgresql` and `storage.driver: ceph`, renders the ceph
      machinery unconditionally, and has no swift storage support at all. This blueprint has
      neither a postgres nor a ceph component, so upstream's defaults point gnocchi at two
      backends that cannot exist here -- which is precisely what was observed on a 4-node GKE
      install of the full profile, with db-init-indexer, db-sync, 4x metricd and 4x statsd stuck
      in Init on `Service postgresql ... has no ready endpoints` and behind a
      ceph-keyring-placement init container. gnocchi is now configured against the mariadb it
      already provisions and the swift this blueprint does ship, and every ceph object is gated
      on the storage driver.
    assertions:
      - file: values.yaml
        absent: 'driver: ceph'
        why: >-
          There is no ceph component in this blueprint. Restoring ceph storage brings back the
          gnocchi-storage-init Job that loops on `ceph -s` and the ceph-keyring-placement init
          container in front of the API, metricd, statsd and db-sync, which is the state the
          GKE install was found in.
      - file: values.yaml
        present: 'driver: swift'
        why: >-
          swift IS a component here, so this is the one object store gnocchi can reach. It also
          avoids the ReadWriteMany volume that `file` storage would need across the API and
          every node's metricd and statsd.
      - file: values.yaml
        absent: 'driver: postgresql'
        why: >-
          There is no postgres component. The mariadb database that gnocchi-db-init creates and
          Completes on was being ignored in favour of a postgresql Service nobody serves.
      - file: values.yaml
        present: 'driver: mysql'
        why: >-
          The indexer runs on the mariadb this chart already provisions. The generated URL
          carries endpoints.oslo_db.scheme, `mysql+pymysql://`, which gnocchi accepts directly:
          `gnocchi.indexer` registers mysql+pymysql as a stevedore entry point and the engine's
          DBAPI module is pymysql, which is present in the Kolla image while MySQLdb is not.
          Unlike skyline (#116) this needs no per-endpoint scheme split.
      - file: values.yaml
        absent: '- gnocchi-storage-init'
        why: >-
          A kubernetes-entrypoint job wait on a Job that no longer renders. kubernetes-entrypoint
          cannot distinguish "not complete yet" from "never created", so restoring this wait
          blocks the API, metricd, statsd, the resources cleaner and the tests forever, silently.
      - file: values.yaml
        absent: '- gnocchi-db-init-indexer'
        why: >-
          Same failure mode: the postgresql indexer db-init Job does not render under
          `indexer.driver: mysql`, so a wait on it never ends.
      - file: templates/job-storage-init.yaml
        present: eq .Values.conf.gnocchi.storage.driver "ceph"
        why: >-
          Upstream renders this Job unconditionally. Without the gate a swift-backed install
          still gets a Job whose container runs `ceph -s`, `ceph osd pool create` and
          `ceph auth get-or-create` against a cluster that does not exist.
      - file: templates/job-db-init-indexer.yaml
        present: eq .Values.conf.gnocchi.indexer.driver "postgresql"
        why: >-
          Upstream renders this Job unconditionally. Without the gate a mysql-indexer install
          still gets a Job that waits on endpoints.oslo_db_postgresql, which is the pod that
          reported `Service postgresql ... has no ready endpoints` on the GKE install.
      - file: templates/deployment-api.yaml
        present: eq .Values.conf.gnocchi.storage.driver "ceph"
        why: >-
          Gates the ceph-keyring-placement init container and the /etc/ceph mounts. Ungated,
          gnocchi-api cannot start under swift storage: the pod waits on a ceph keyring Secret
          that only gnocchi-storage-init creates.
      - file: templates/daemonset-metricd.yaml
        present: eq .Values.conf.gnocchi.storage.driver "ceph"
        why: Same gate, for the metricd DaemonSet -- one pod per control-plane node.
      - file: templates/daemonset-statsd.yaml
        present: eq .Values.conf.gnocchi.storage.driver "ceph"
        why: Same gate, for the statsd DaemonSet.
      - file: templates/job-db-sync.yaml
        present: eq .Values.conf.gnocchi.storage.driver "ceph"
        why: >-
          Same gate, for the Job that runs gnocchi-upgrade. db-sync creates the storage layout
          as well as the indexer schema, so it is the one pod that must reach the object store.
      - file: templates/configmap-etc.yaml
        present: swift_authurl
        why: >-
          Upstream has no swift storage support, so nothing fills gnocchi's swift credentials.
          Without this block `driver: swift` authenticates with gnocchi's own defaults -- user
          "admin:admin" against http://localhost:8080/auth/v1.0 -- instead of as gnocchi's
          keystone service user against this install's keystone.

  # Both halves of the statsd datagram path. This is a pure template divergence -- there is no
  # values key for either protocol or for the component label -- so revendor's three-way merge
  # protects nothing here and a hand-refresh of these two templates from upstream silently
  # restores a Service that cannot deliver a measure. hack/validate-udp-services.py asserts the
  # rendered outcome on every push; these assertions name the divergence so the revert fails
  # immediately, with the reason.
  - component: gnocchi
    issue: 127
    reason: >-
      Upstream's gnocchi chart declares the statsd ServicePort and containerPort with no
      `protocol:`, which Kubernetes defaults to TCP, in front of a daemon that speaks only UDP:
      gnocchi/statsd.py start() in gnocchi 4.7.0 calls asyncio create_datagram_endpoint with
      `# TODO(jd) Add TCP support` on the line above it, verified in
      quay.io/openstack.kolla/gnocchi-statsd:2026.1-ubuntu-noble. Upstream also labels the statsd
      DaemonSet, its selector and its pod template with component "metricd" -- byte for byte what
      daemonset-metricd.yaml emits -- while service-statsd.yaml selects component "statsd", so
      the Service matched no pod at all. Each defect alone makes the Service undeliverable, and
      neither reports anything: UDP sends no reply, and Stats.flush() catches and logs every
      individual measure that fails.
    assertions:
      - file: templates/service-statsd.yaml
        present: 'protocol: UDP'
        why: >-
          A ServicePort's protocol defaults to TCP. Without this line kube-proxy programs TCP
          rules for 8125 and every datagram sent to gnocchi-statsd:8125 is dropped before it
          reaches a pod, while the Service keeps its endpoints and the DaemonSet stays Ready.
          One declaration covers the node_port shape too: nodePort is a field of the same
          ServicePort entry, which carries exactly one protocol.
      - file: templates/daemonset-statsd.yaml
        present: 'protocol: UDP'
        why: >-
          A ContainerPort's protocol defaults to TCP in the same way, so this is the same defect
          one layer down. It is the key a named targetPort resolves by -- Kubernetes matches a
          named targetPort on name AND protocol -- and what kubectl and any NetworkPolicy read.
      - file: templates/daemonset-statsd.yaml
        present: tuple $envAll "gnocchi" "statsd"
        why: >-
          The pod labels the statsd Service selects. Upstream's `tuple $envAll "gnocchi"
          "metricd"` here, in all three places, left the Service with no endpoints and gave the
          chart's two DaemonSets identical matchLabels, which Kubernetes documents as undefined.
      - file: templates/daemonset-statsd.yaml
        absent: tuple $envAll "gnocchi" "metricd"
        why: >-
          The upstream spelling, named explicitly: restoring any one of the three occurrences
          reintroduces the label mismatch, and a Service with no endpoints looks identical to a
          healthy one from everywhere except `kubectl get endpoints`.
  - component: redis
    issue: 131
    reason: >-
      Upstream's redis chart pins Redis 4.0.1 (released 2017, unsupported), runs its helm test
      on docker.io/redislabs/redis-py -- a repository that publishes exactly one tag, `latest`
      -- and tags kubernetes-entrypoint `latest-ubuntu_noble`. Two of those three are tags this
      repo forbids by gate (#69); the third is an image nobody should be handed as the message
      store for a new component.
    assertions:
      - file: values.yaml
        absent: "redis:4.0.1"
        why: >-
          Redis 4.0.1 is a 2017 build with no upstream support. preflight-refs cannot catch a
          revert to it: `4.0.1` is a perfectly immutable tag and the manifest resolves, so only
          this assertion stands between a re-vendor and shipping it again.
      - file: values.yaml
        present: "redis:7.2.17"
        why: >-
          The newest patch of the last BSD-3-Clause Redis line, still rebuilt as a Docker
          Official Image (the amd64 manifest for this tag was rebuilt 2026-10-28) and served as
          an OCI image index. The probes in templates/deployment.yaml were measured against
          exactly this image.
      - file: values.yaml
        absent: redislabs/redis-py
        why: >-
          Published only as `latest`, so it can never satisfy preflight-refs --mutable-only.
          There is no other tag to pin, which is why the helm test was rewritten against
          redis-cli instead of being switched off.
      - file: templates/test/_redis_test.sh.tpl
        absent: python-tests.py
        why: >-
          The python test only runs in the redislabs/redis-py image above. Restoring it makes
          the helm test exec `python` in docker.io/library/redis, which has no python at all,
          so the test fails for a reason that has nothing to do with redis.
      - file: templates/test/_redis_test.sh.tpl
        present: redis-cli
        why: >-
          The replacement, which runs in the server image the chart already pulls and covers
          the same ground as upstream's python test (reachability, client list, SET/GET/DBSIZE/DEL).

  - component: zaqar
    issue: 131
    reason: >-
      Upstream hardcodes zaqar's message-store uri as `redis://redis:6379` in values and
      declares no endpoint and no dependency wait for it, so the host it names is written in
      exactly one place and in no place a kubernetes-entrypoint wait can read. Until #131 this
      blueprint shipped no redis component at all, so that host did not resolve -- the same
      defect as gnocchi's postgresql indexer in #115.
    assertions:
      - file: values.yaml
        absent: redis://redis:6379
        why: >-
          The hardcoded uri. endpoints.message_store is now the single value that both the
          rendered uri and the api pod's wait on the redis Service resolve from; restoring the
          literal makes them two values that can disagree, and the config-closure gate would
          still pass because the scheme it checks is unchanged.
      - file: values.yaml
        present: "service: message_store"
        why: >-
          The kubernetes-entrypoint wait that makes a STANDALONE Zaqar Composition order itself
          behind redis. The umbrella's creation gate covers the orchestrated case; nothing
          covers the standalone one but this.
      - file: templates/configmap-etc.yaml
        present: "drivers:message_store:redis"
        why: >-
          Derives the uri from endpoints.message_store, exactly as the block above it derives
          the management store's uri from endpoints.oslo_db. Without it the uri renders empty
          and zaqar's redis driver gets no host at all.
