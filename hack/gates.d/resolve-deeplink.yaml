# The README and docs/release.md said CI resolved the deep-link; the step was lost in the
# 2026-08-11 workflow rewrite and had not run since.
name: "The service-contract SSO deep-link resolves"
job: job-hooks
order: 160
run: |
  set -euo pipefail
  for ctx in "--project demo" "--org acme --tenant t1 --namespace ns1 --project demo"; do
    bash tools/resolve-deeplink.sh --from-chart $ctx
  done
