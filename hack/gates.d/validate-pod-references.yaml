# Gating. Measured on GKE (#179): powerdns's db-init Job mounted a ConfigMap and a Secret
# its chart never created, because the chart named them after the release and helm-toolkit
# used fixed names. The two agree only under a release called `powerdns`, which is what
# every render here used, and a Krateo release never is. This renders every component under
# a release name unlike its chart's and refuses a pod that names an object nobody renders.
name: "Every object a pod names must be one its chart renders"
job: capability-roles
order: 410
run: |
  python3 hack/validate-pod-references.py .
  # Planted case: ceilometer's delivered renders skipped must fail the gate, naming it (its completeness check).
  out=$(GATE_PLANT_DROP_DELIVERED=ceilometer python3 hack/validate-pod-references.py . ceilometer 2>&1) && rc=0 || rc=$?
  if [ "$rc" -eq 0 ] || ! printf '%s\n' "$out" | grep -F -- "as the umbrella delivers it for ['ceilometer']" >/dev/null; then
    printf '%s\n' "$out" | tail -5
    echo "FAIL: with ceilometer's delivered renders dropped the gate must fail naming ceilometer (rc=$rc)"
    exit 1
  fi
  echo "OK: the planted case fails as it must (ceilometer's delivered renders dropped)"
