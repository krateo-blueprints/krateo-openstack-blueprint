# are set, nothing rendered asks the machine, and gnocchi-api recycles its workers.
name: "Process counts do not come from the node"
job: capability-roles
order: 119
run: |
  python3 hack/validate-worker-counts.py --self-test
  python3 hack/validate-worker-counts.py .
