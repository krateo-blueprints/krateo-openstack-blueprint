# Behind that, every watcher client defaulted to the public catalog endpoint, the ingress-backed
# <svc>:80 with no backend without an ingress controller, so the decision engine's start-up
# catalog lookup was refused. Listed client options must be internal where pods read them.
name: "OpenStack clients call internal endpoints, never the ingress-backed public one"
job: job-hooks
order: 60
run: |
  python3 hack/validate-client-endpoint-interface.py .
