# Gating. Measured on GKE upgrading 0.3.34 to 0.3.36: the umbrella moved, and all 33
# components stayed at 0.3.34, because the version came from a value whose schema default
# the API server had frozen into the Composition at create time (#179). Every check above
# rendered a fresh chart, where the default always matches, so none could see it. This one
# renders with the stale spec an older install actually holds, and refuses any
# release-stamped schema default anywhere in the repo.
name: "An umbrella upgrade must move every component to the umbrella's version"
job: capability-roles
order: 400
run: |
  python3 hack/validate-component-version-follows-chart.py .
