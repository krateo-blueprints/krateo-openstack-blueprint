# Horizon's home page (#247): on a deployment without compute every login landed on 403,
# because the default home (Project > Overview) needs openstack.services.compute. Renders the
# chart, checks the package, its mounts, its install step and the EXECUTED settings snippet
# (Horizon only logs a snippet that raises), then runs the /auth/home/ view's tests.
name: "Horizon sends every user to a page they can open"
job: capability-roles
order: 170
run: |
  python3 hack/validate-horizon-home.py .
