# #309 C: External Secrets Operator regenerates a generated root the moment its Secret is edited (v2.14.0
# externalsecret_controller.go:370), so an edit silently rotates it. The umbrella latches a sha256 of each root per
# rotate.<id> token and reports a change under an unchanged token on status.credentialDrift, naming the Secret.
name: "A hand-edited generated root is detected and reported, naming its Secret"
job: capability-roles
order: 490
run: |
  python3 hack/validate-credential-drift.py .
