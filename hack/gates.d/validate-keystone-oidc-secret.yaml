# Values reach the Composition CR in plaintext, so Keystone's OIDC client secret must come
# from a Secret (oidc.clientSecretRef), and a secret written into conf.wsgi_keystone must be
# refused at render time.
name: "Keystone's OIDC client secret comes from a Secret, never from values"
job: job-hooks
order: 100
run: |
  python3 hack/validate-keystone-oidc-secret.py .
