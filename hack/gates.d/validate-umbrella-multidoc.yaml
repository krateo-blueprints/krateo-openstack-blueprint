# Gating, and the counterpart the pin gate could not be. `helm template` NEVER resolves
# `lookup` -- only `--dry-run=server` does -- so offline the umbrella's component gate is
# closed and zero component documents are emitted. Every offline check of that template,
# the pin gate included, has therefore been comparing empty output against empty output.
# Issue #152 lived in exactly that blind spot: a right-trim above the document separator
# glued it to the previous document's `spec: {}`, so any render emitting two or more
# components failed with "yaml: line 5: did not find expected key" and the umbrella could
# create at most ONE component -- while the Composition reported Ready=True.
#
# This gate manufactures the opportunity: it stubs the three lookup-driven gate helpers
# open, renders offline, and parses the result as multi-document YAML.
name: "The umbrella must emit well-formed YAML for every component at once"
job: capability-roles
order: 310
run: |
  python3 hack/validate-umbrella-multidoc.py .
