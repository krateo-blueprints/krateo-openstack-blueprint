# MariaDB and RabbitMQ restart when a credential's data changes (its ESO template, the key it reads, a rotation) and not when
# anything else in its manifest does (#449). The old whole-manifest hash is planted on every run and must be caught.
name: "The database and the broker restart for credential data only"
job: capability-roles
order: 116
run: |
  python3 hack/validate-credential-hash.py .
