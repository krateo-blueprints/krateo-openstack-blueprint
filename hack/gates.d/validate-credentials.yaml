# Per-install credentials (#228): the umbrella passes each component a REFERENCE to a
# credential ESO generated once, the charts project it, and the value from values reaches no
# rendered object (a per-chart sentinel, since the published default is a common word); the
# consumers listed by the umbrella are exactly the charts that render the credential; the
# roots are kept and never renamed against the latest release.
name: "Every install's credentials are its own"
job: capability-roles
order: 80
run: |
  python3 hack/validate-credentials.py .
