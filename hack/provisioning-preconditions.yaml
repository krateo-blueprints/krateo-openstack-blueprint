# Components that `profile: full-strict` omits because they wait on infrastructure that no
# Kubernetes cluster provides and this blueprint does not create. `profile: full` is unchanged
# and still selects all of them, and `enabled:` names any one of them explicitly -- they are
# fully supported, just not promised by the profile that promises only what starts unaided.
#
# Each entry states what must exist, the exact symptom when it does not, and a command an
# operator can run to check. The symptom matters as much as the requirement: every one of these
# fails as `Init:` forever -- neither Pending nor CrashLoopBackOff -- so a pod census reports a
# count and names nothing. See hack/validate-provisioning-preconditions.py and issue #163.
#
# An entry here is a statement about today, not a verdict. designate's is the first that has a
# named fix (#165, ship a powerdns blueprint); when that lands the flag comes off and the entry
# goes with it.
preconditions:
  - component: cinder
    requires: >-
      A Ceph cluster reachable from the nodes, plus, in the openstack namespace, the ConfigMap
      ceph-etc (ceph.conf) and the Secrets pvc-ceph-client-key and cinder-volume-rbd-keyring,
      for the default rbd1 backend. No other volume backend ships with this blueprint: LVM needs
      a prepared volume group and an iSCSI target on the host, and NFS needs an NFS server.
    symptom: >-
      cinder-storage-init and cinder-volume never start: FailedMount on "ceph-etc" and on the
      keyring Secret, and the pods stay in Init. cinder-api, cinder-scheduler and
      cinder-bootstrap wait on cinder-volume. Since every Job became a Helm hook (0.3.41),
      storage-init holds the release in pending-install until its activeDeadlineSeconds expires
      (0.3.43). Measured on #179 and on a cold 0.3.42 install (#204).
    check: kubectl -n openstack get configmap ceph-etc && kubectl -n openstack get secret pvc-ceph-client-key cinder-volume-rbd-keyring
    issue: 196
  - component: ironic
    requires: >-
      A network interface named `ironic-pxe` on every node that will run ironic-conductor, being
      the bare-metal provisioning NIC that PXE and TFTP bind to.
    symptom: >-
      ironic-conductor-0 sits in Init:CrashLoopBackOff. The ironic-conductor-init container exits
      1 with "Could not find IP for pxe to bind to", from
      `ip addr | awk '/inet / && /ironic-pxe/{print $2; exit}'` returning nothing. The three init
      containers behind it (ironic-conductor-http-init, ironic-retrive-cleaning-net) never run.
      Measured on a 4-node GKE install: 14 restarts.
    check: ip -o addr show ironic-pxe
    issue: 163
  - component: octavia
    requires: >-
      The load-balancer management network (lb-mgmt-net) and one Neutron port per node, named
      octavia-worker-port-<hostname> and octavia-health-manager-port-<hostname>.
    symptom: >-
      octavia-worker and octavia-health-manager pods sit in Init:CrashLoopBackOff. Their
      get-port init containers log "No Port found for octavia-worker-port-<hostname>" and leave
      the port id empty. Measured on a 4-node GKE install: four pods at 14 restarts.
    check: openstack port show octavia-worker-port-$(hostname -s) -c id -f value
    issue: 163
  - component: swift
    requires: >-
      A StorageClass that provides ReadWriteMany, for the swift-shared-storage PVC. Upstream
      satisfies this with an nfs-provisioner default that this repo does not ship, and GKE's
      standard class is ReadWriteOnce only.
    symptom: >-
      swift-ring-builder and the swift-storage pods stay Pending and swift-proxy stays in Init.
      Unchanged by node count -- measured identically on six nodes and on two -- because what is
      missing is the StorageClass and not capacity.
    check: kubectl get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner
    issue: 141
